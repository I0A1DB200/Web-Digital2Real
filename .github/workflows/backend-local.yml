name: Validate local platform API

on:
  pull_request:
    paths:
      - Backend/**
      - .github/workflows/backend-local.yml
  push:
    branches: [main]
    paths:
      - Backend/**
      - .github/workflows/backend-local.yml

permissions:
  contents: read

jobs:
  local-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r Backend/requirements-local.txt
      - run: python -m pip check
      - run: python -m unittest Backend.test_local_platform -v
