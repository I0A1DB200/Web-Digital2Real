name: Deploy Digital2Real to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tracked text for known credential signatures
        shell: bash
        run: |
          pattern='-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|(AKIA|ASIA)[A-Z0-9]{16}|(sk|rk)_live_[A-Za-z0-9]{16,}|sb_secret_[A-Za-z0-9_-]{20,}'
          result=0
          git grep -I -l -E -e "$pattern" -- . || result=$?
          if [[ "$result" != 1 ]]; then exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Generate browser publication artifacts
        run: |
          node scripts/package-notebook.mjs
          node scripts/package-experience-engine.mjs --mode=preview

      - name: Validate static application and content contracts
        run: |
          find scripts experience-engine Frontend -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0 | xargs -0 node --test

      - name: Prepare Pages publication root
        run: |
          rm -rf _site
          mkdir -p _site
          tar -C Frontend --exclude=tests -cf - . | tar -C _site -xf -
          test -z "$(find _site -name tests -print -quit)"
          test -z "$(find _site -type l -print -quit)"
          test -z "$(find _site -mindepth 1 -name '.*' -print -quit)"
          test -z "$(find _site -type f ! -name '*.html' ! -name '*.js' ! -name '*.css' \
            ! -name '*.json' ! -name '*.md' ! -name '*.png' ! -name '*.jpg' \
            ! -name '*.svg' ! -name '*.webp' ! -name '*.mp4' ! -name '*.ico' -print -quit)"
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/generated/experience-engine/catalog.json

      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
