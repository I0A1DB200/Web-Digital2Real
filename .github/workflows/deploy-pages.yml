name: Deploy Digital2Real to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate browser publication artifacts
        run: |
          node scripts/package-notebook.mjs
          node scripts/package-experience-engine.mjs --mode=preview

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Ensure Pages uses the workflow artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const { owner, repo } = context.repo;
              const current = await github.request('GET /repos/{owner}/{repo}/pages', {
                owner,
                repo
              });

              const buildType = current.data?.build_type;
              core.info(`Current GitHub Pages source: ${buildType || 'unknown'}`);

              if (buildType !== 'workflow') {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow',
                  source: {
                    branch: 'main',
                    path: '/'
                  }
                });
                core.info('GitHub Pages source changed to GitHub Actions workflow.');
              }
            } catch (error) {
              core.warning(`Could not verify or change the Pages source automatically: ${error.message}`);
            }

      - name: Prepare Pages publication root
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a Frontend/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/generated/experience-engine/catalog.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
