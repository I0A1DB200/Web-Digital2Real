name: Deploy Digital2Real to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate browser publication artifacts
        run: |
          node scripts/package-notebook.mjs
          node scripts/package-experience-engine.mjs --mode=preview

      - name: Validate static application and content contracts
        run: |
          find scripts experience-engine Frontend -type f \( -name '*.test.js' -o -name '*.test.mjs' \) -print0 | xargs -0 node --test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages publication root
        run: |
          rm -rf _site
          mkdir -p _site
          tar -C Frontend --exclude=tests -cf - . | tar -C _site -xf -
          test -z "$(find _site -name tests -print -quit)"
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/generated/experience-engine/catalog.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
