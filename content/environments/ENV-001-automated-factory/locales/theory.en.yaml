locale: "en"

media:
  - id: "TH-MEDIA-AUTOMATED-FACTORY"
    alt: "Overview of an automated installation used to analyse the signal path"

sections:
  - id: "TH-01-DIGITAL-SIGNAL-PATH"
    title: "From the sensor to the PLC program"
    body: |
      A 24 VDC digital signal travels through a physical and logical chain: sensor, wiring, terminal, input channel, process image and PLC program. Reliable diagnostics check each boundary in order and distinguish the electrical state from the value used by software.
    media_ids:
      - "TH-MEDIA-AUTOMATED-FACTORY"
  - id: "TH-02-PNP-REFERENCE"
    title: "PNP reference and switching"
    body: |
      In a PNP circuit, the sensor supplies positive potential to the input when it detects. The supply, 0 V reference and continuity to the channel must be verified before concluding that the program is faulty.
    media_ids: []
  - id: "TH-03-OBSERVATION-BOUNDARIES"
    title: "Separate observation from conclusion"
    body: |
      The sensor LED, module LED and a variable such as I0.3 represent different observation points. Comparing them locates where the signal stops propagating without replacing evidence with assumptions.
    media_ids: []
  - id: "TH-04-INTERMITTENT-FAULTS"
    title: "Intermittent faults"
    body: |
      A permanent fault provides a stable discrepancy. An intermittent fault requires reproducing the symptom, preserving successful and failed cycles and observing them under comparable conditions before intervention.
    media_ids: []
  - id: "TH-05-CORRELATION"
    title: "Correlate before replacing"
    body: |
      Compare what changes between success and failure: position, speed, vibration, product, load, temperature and timing. A repeated correlation guides inspection; one coincidence does not confirm a cause.
    media_ids: []
  - id: "TH-06-INTERMITTENT-BOUNDARY"
    title: "Sensor and PLC boundary"
    body: |
      If the sensor output is OFF and the PLC input is also OFF during a miss, there is no evidence to begin by changing PLC logic. If the output is ON and the input is OFF, the boundary moves toward wiring, signal transmission or the input channel.
    media_ids: []
  - id: "TH-07-REPEATED-VERIFICATION"
    title: "Verify under the fault condition"
    body: |
      An intermittent repair is not validated because the symptom disappears once. Repeat the test under the positions and conditions that produced the fault and limit the conclusion to the sample actually executed.
    media_ids: []
