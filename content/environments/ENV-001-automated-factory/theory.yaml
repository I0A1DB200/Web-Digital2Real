version: "1.0.0"
default_locale: "es"
supported_locales:
  - "es"
  - "en"

media:
  - id: "TH-MEDIA-AUTOMATED-FACTORY"
    type: "image"
    src: "media/ENV-001-automated-factory.png"
    alt: "Vista general de una instalación automatizada para analizar el recorrido de señales"

sections:
  - id: "TH-01-DIGITAL-SIGNAL-PATH"
    title: "Del sensor al programa PLC"
    body: |
      Una señal digital de 24 VDC recorre una cadena física y lógica: sensor, cableado, borne, canal de entrada, imagen de proceso y programa PLC. Un diagnóstico fiable comprueba cada frontera en orden y distingue el estado eléctrico del valor que utiliza el software.
    media_ids:
      - "TH-MEDIA-AUTOMATED-FACTORY"
  - id: "TH-02-PNP-REFERENCE"
    title: "Referencia y conmutación PNP"
    body: |
      En un circuito PNP, el sensor entrega potencial positivo hacia la entrada cuando detecta. La alimentación, la referencia de 0 V y la continuidad hasta el canal deben verificarse antes de concluir que existe un fallo de programa.
    media_ids: []
  - id: "TH-03-OBSERVATION-BOUNDARIES"
    title: "Separar observación y conclusión"
    body: |
      El LED del sensor, el LED del módulo y una variable como I0.3 representan puntos de observación distintos. Compararlos permite localizar en qué tramo deja de propagarse la señal sin sustituir evidencias por suposiciones.
    media_ids: []
  - id: "TH-04-INTERMITTENT-FAULTS"
    title: "Fallos intermitentes"
    body: |
      Un fallo permanente ofrece una discrepancia estable. Un fallo intermitente exige reproducir el síntoma, conservar ciclos correctos y fallidos y observarlos bajo condiciones comparables antes de intervenir.
    media_ids: []
  - id: "TH-05-CORRELATION"
    title: "Correlacionar antes de sustituir"
    body: |
      Compara qué cambia entre éxito y fallo: posición, velocidad, vibración, producto, carga, temperatura y timing. Una correlación repetida orienta la inspección; una coincidencia aislada no confirma una causa.
    media_ids: []
  - id: "TH-06-INTERMITTENT-BOUNDARY"
    title: "Frontera sensor y PLC"
    body: |
      Si durante una omisión la salida del sensor está OFF y la entrada PLC también está OFF, no existe evidencia para empezar modificando la lógica. Si la salida está ON y la entrada está OFF, la frontera se desplaza hacia cableado, transmisión de señal o canal de entrada.
    media_ids: []
  - id: "TH-07-REPEATED-VERIFICATION"
    title: "Verificar bajo la condición de fallo"
    body: |
      Una reparación intermitente no queda validada porque el síntoma desaparezca una vez. Repite la prueba bajo las posiciones y condiciones que producían el fallo y limita la conclusión a la muestra realmente ejecutada.
    media_ids: []
  - id: "TH-08-MOTOR-CONTROL-CHAIN"
    title: "Cadena funcional de motor y variador"
    body: |
      El movimiento depende de una cadena completa: PLC, comunicación o mando, variador, motor y carga mecánica. Cada capa puede estar disponible mientras otra impide la operación. Por eso un diagnóstico no salta directamente al motor: sigue la petición hasta la ejecución y vuelve por el feedback.
    media_ids: []
  - id: "TH-09-DRIVE-STATES"
    title: "READY, RUNNING y FAULT"
    body: |
      Un variador controla el motor, recibe mandos y consignas y comunica estados. READY indica disponibilidad bajo las condiciones configuradas; RUNNING indica que ejecuta la operación; FAULT comunica una condición de fallo. Estos estados no son intercambiables: READY no significa RUNNING.
    media_ids: []
  - id: "TH-10-COMMAND-FEEDBACK"
    title: "Mando y feedback"
    body: |
      Un mando expresa lo solicitado y un feedback describe el estado observado. RunCmd = TRUE con Running = FALSE es una discrepancia diagnóstica: demuestra que existe petición PLC, pero no que el variador la haya aceptado ni ejecutado.
    media_ids: []
  - id: "TH-11-COMMAND-AUTHORITY"
    title: "Autoridad de mando y HAND/AUTO"
    body: |
      Según el diseño, un variador puede recibir autoridad desde un panel local, terminales o PLC/fieldbus. La pregunta correcta es quién tiene autoridad ahora y quién debe tenerla para esta operación. HAND puede ser válido en mantenimiento o commissioning; AUTO corresponde al control automático configurado. El problema aparece cuando el estado real no coincide con la arquitectura requerida.
    media_ids: []
  - id: "TH-12-PROFINET-DIAGNOSIS"
    title: "Trazar el control PLC–PROFINET–VFD"
    body: |
      En una arquitectura S7-1500 → PROFINET → SINAMICS G120, comprueba en orden la petición del operador, condiciones y permisivos PLC, RunCmd, comunicación y autoridad, estado del variador, motor, carga y feedback. Esta secuencia evita sustituciones, forzados y cambios de programa sin evidencia.
    media_ids: []
