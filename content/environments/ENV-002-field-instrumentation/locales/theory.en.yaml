  - id: TH-02-INDUCTIVE-SENSING
    title: "Block 02 — Inductive proximity sensors"
    body: |-
      An inductive proximity sensor generates an alternating electromagnetic field at its active face. When a metallic target enters that field, induced currents change the sensor's oscillation and the device may switch state when its internal criterion is reached. Detection is contactless, but it depends on the interaction between the field and the target, not only on the part being visible.

      Target material, size, shape, orientation, alignment, gap and speed influence the response. Flush or non-flush mounting, nearby metal and the active-face geometry must also be compatible with the sensor design. A powered device confirms an electrical condition, not that the target is within the detection conditions.

      Sn is the nominal sensing distance declared as a reference; Sr describes the real sensing distance obtained under the conditions defined for the measurement. Su may express a useful distance and Sa an assured operating distance when those categories apply under the relevant technical definition. Their limits and relationships depend on the applicable standard or device documentation; no universal factor should be extrapolated. An observed switch confirms a state at that moment, while assured operation requires checking the documented conditions and mounting margin.
    media_ids: []

  - id: TH-03-DISTANCE-MEASUREMENT
    title: "Block 03 — Distance measurement and magnitudes"
    body: |-
      A distance instrument estimates the separation between a physical instrument reference and an object's surface. Depending on the applied principle, it may calculate that separation from the time of flight of a signal or from triangulation geometry, among other methods. The reading is sensor-to-object distance; it does not automatically become height, level, thickness or an acceptance criterion.

      When a known sensor-to-base reference exists and the geometry allows both distances to be projected on the same axis, a dimension can be calculated: Height = sensor-to-base reference distance − sensor-to-object distance. For example, with a 700 mm reference and a 260 mm measured distance, the calculated height is 440 mm.

      The relationship requires the same unit, a stable reference, correctly identified surfaces and a coherent orientation, normally perpendicular to the measurement axis. If the sensor or base moves, the surface is inclined or an offset is uncompensated, the applicable geometric model must be used. Interpretation also requires the operating range, resolution, repeatability, accuracy, uncertainty, alignment, temperature, obstructions and mounting conditions.
    media_ids: []

  - id: TH-04-SIGNALS-AND-DIAGNOSIS
    title: "Block 04 — Signals, decisions and diagnosis"
    body: |-
      Power, switching state and communication are different checks. A sensor can be energized and communicate data without its discrete output being active. PNP or NPN outputs depend on the wiring and configured input mode; IO-Link can carry measured values, states and parameters, but the meaning of each bit, word or state depends on the device, its profile and its configuration.

      A continuous measurement can be plausible while a discrete output remains inactive because the decision depends on a threshold, window, hysteresis, polarity or output mode. The measurement describes a value and the output communicates the result of a decision function. It is not universal that 0 means “not detected” or that 1 means “detected”.

      Traceability follows the path physical phenomenon → sensor → measurement → decision function → signal → control input → logic → actuator and HMI. Check limits, normal state, polarity, response time and application criterion; save and read back parameters using a compatible procedure and check their persistence after an authorized restart when required. Final validation uses representative conditions and an independent functional check; a final indicator or zero counter alone does not prove that the chain is validated.
    media_ids: []
