  - id: TH-01-INSTRUMENTATION-FOUNDATIONS
    title: "Block 01 — Measurement chain and evidence"
    body: |-
      Industrial instrumentation observes physical variables such as pressure, temperature, level, flow, position or vibration and converts them into information that a control system can use. The chain may include the process, a sensing element or transducer, a transmitter, a conditioner, terminals and wiring, a PLC input, decision logic, an actuator and an HMI representation. Each boundary provides different evidence: a physical quantity, an electrical signal, a process value, a logic state or a physical effect.

      Sensor, transducer, transmitter and conditioner are not synonyms. A sensor responds to a variable, a transducer converts that response, a transmitter delivers it as a usable signal, and a conditioner may filter, isolate or adapt it. A direct measurement comes from the observed phenomenon; a derived measurement is calculated from a reference and a model. The measured variable describes the process, while the setpoint defines the reference value used by logic to decide when to act.

      Signals may be analog, discrete, digital or communication based. A value shown by a downstream stage does not by itself prove that the upstream stages are healthy: an HMI may show an incorrect scale, an input may have a faulty reference, and an output may be in the wrong state even when the sensor is powered.

      Diagnosis starts with a known physical condition, a measurement boundary, an expected result and a comparison with an independent reference. The first verified discrepancy narrows the search; the final symptom does not identify the cause by itself. This method avoids jumping straight to component replacement and keeps observation, hypothesis, intervention and verification separate.
    media_ids: []

  - id: TH-02-INDUCTIVE-SENSING
    title: "Block 02 — Field interfaces and inductive detection"
    body: |-
      A field interface must be analyzed as a relationship between source, load, reference and operating limit. In a 4–20 mA loop, the source must retain enough voltage after the resistance of the transmitter, cables, terminals and input; if total burden reduces the available margin, current may stop representing the process correctly even when PLC scaling is correct. In 0–10 V systems, common reference, input impedance, return path, shielding and potential differences are part of the measurement.

      Electrical normalization is not the same as engineering units. Scaling maps a signal range to a process range and must be checked separately from the physical signal: a correct current can display an incorrect pressure when range, zero, span or alarms are configured incorrectly. Calibration compares the instrument with a known reference; verification checks that the installed chain produces the expected behavior. They must remain distinct.

      An inductive proximity sensor generates an alternating electromagnetic field at its active face. Target material, size, shape, orientation, alignment, gap, speed, flush or non-flush mounting and nearby metal influence the response. Detection depends on the interaction between the field and the target, not only on the part being visible. Nominal distances and assured operating distances must be read according to the applicable documentation; no universal factor should be extrapolated.

      In discrete signals, PNP, NPN and dry contact describe different ways of switching and referencing the load. In thermocouples, reversed polarity can produce an opposite trend even though the module is powered. IO-Link and other communications can carry values, states and parameters, but they do not replace checks of supply, wiring, configuration and the meaning of each data item. A powered or communicating device does not prove that the measurement is valid.
    media_ids: []

  - id: TH-03-DISTANCE-MEASUREMENT
    title: "Block 03 — Geometry, distance and measurement quality"
    body: |-
      Instrument behavior depends on both the physical principle and the installation. A stable installation requires a known reference, correctly identified surfaces, coherent orientation and no uncompensated offsets or displacement. Supply confirms an electrical condition, but does not by itself prove that the measured quantity is valid.

      A distance instrument estimates separation between a physical instrument reference and a surface. That reading does not automatically become height, level, thickness or an acceptance criterion. To obtain a derived quantity, use a stable reference, correctly identified surfaces, the same unit and a coherent geometric model; for example, height can be calculated as sensor-to-base distance minus sensor-to-object distance when both belong to the same axis.

      Measurement quality includes resolution, repeatability, accuracy, uncertainty, alignment, temperature, obstructions and mounting conditions. It also includes behavior over time: noise, filtering, hysteresis, saturation, intermittent resistance, response time and delay. A restriction in an impulse line can delay the response without immediately changing the actual pressure; a stable reading does not always mean that the chain responds fast enough.
    media_ids: []

  - id: TH-04-SIGNALS-AND-DIAGNOSIS
    title: "Block 04 — Decision, actuation and verification"
    body: |-
      A continuous measurement can be plausible while a discrete output remains inactive because the decision depends on a threshold, window, hysteresis, polarity or output mode. The measurement describes a value and the output communicates the result of a decision function. It is not universal that 0 means “not detected” or that 1 means “detected”; check the normal state, configured criterion and correspondence with the control input.

      The actuation chain adds another boundary: a PLC command does not prove that energy is available, that a valve or drive acted, or that the mechanism reached its position. Feedback confirms a different condition from the command. Therefore separate command, energy, physical effect and confirmation, especially for pneumatic actuators and position signals.

      Traceability follows the path physical phenomenon → sensor → measurement → decision function → signal → control input → logic → actuator → physical response and HMI. A sound diagnosis states a hypothesis, defines a safe measurement point, establishes the expected result, compares the actual result, isolates the discrepancy and only then intervenes. Recovery must then be verified under representative conditions, repeated cycles or an independent reference. Correcting a cause is not the same as proving recovery; parameters should also be read back and their persistence checked when required.
    media_ids: []
