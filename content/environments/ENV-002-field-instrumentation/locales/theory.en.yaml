sections:
  - id: TH-01-INSTRUMENTATION-FOUNDATIONS
    title: "Block 01 — Industrial instrumentation fundamentals"
    body: |-
      Industrial instrumentation observes physical variables such as pressure, temperature, level, flow, position or vibration and converts them into information that a control system can use. The measurement chain may include the process, a sensor or transducer, a transmitter, a conditioner, wiring, a PLC input, decision logic and an HMI representation. Each boundary provides different evidence: a physical quantity, an electrical signal, a process value or a logic state.

      A sensor responds to a variable; a transducer converts that response; a transmitter delivers it as a normalized signal; and a conditioner may filter, isolate or adapt it. Outputs may be analog, discrete, digital or communication based. In discrete signals, PNP, NPN and dry contact describe different ways of switching and referencing the load, so supply, polarity, common reference, isolation, load and input mode must be compatible with the PLC.

      0–10 V and 4–20 mA interfaces represent a continuous range that is then scaled into engineering units. In a 4–20 mA loop, 4 mA usually corresponds to the lower endpoint and 20 mA to the upper endpoint, but the effective scale and alarms depend on configuration. The measured variable describes the process; the setpoint defines the reference value used by logic to decide when to act. They are not the same quantity even when they use the same units.

      A fixed, saturated, noisy or unstable reading may originate in the power supply, wiring, connectors, ground, module, calibration, conditioning, sensor or process. The symptom does not identify the cause by itself: compare the signal with an independent reference and the known physical condition. Commissioning validates supply, polarity, range, scaling, loop response and the correspondence between process, PLC, logic and HMI; the first verified discrepancy indicates where to continue.
