sections:
  - id: TH-01-INSTRUMENTATION-FOUNDATIONS
    title: "Bloque 01 — Fundamentos de instrumentación industrial"
    body: |-
      La instrumentación industrial observa variables físicas como presión, temperatura, nivel, caudal, posición o vibración y las convierte en información utilizable por un sistema de control. La cadena de medida puede incluir el proceso, un sensor o transductor, un transmisor, un acondicionador, el cableado, una entrada de PLC, la lógica de decisión y la representación en HMI. Cada frontera aporta una evidencia distinta: magnitud física, señal eléctrica, dato de proceso o estado lógico.

      Un sensor responde a una magnitud; un transductor convierte esa respuesta; un transmisor la entrega en una señal normalizada; y un acondicionador puede filtrarla, aislarla o adaptarla. Las salidas pueden ser analógicas, discretas, digitales o de comunicación. En señales discretas, PNP, NPN y contacto seco describen formas distintas de conmutar y referenciar la carga, por lo que la alimentación, la polaridad, la referencia común, el aislamiento, la carga y el modo de entrada deben ser compatibles con el PLC.

      Las interfaces 0–10 V y 4–20 mA representan un rango continuo que después se escala a unidades de ingeniería. En un lazo 4–20 mA, 4 mA suele corresponder al extremo inferior y 20 mA al superior, pero la escala efectiva y las alarmas dependen de la configuración. La variable medida describe el proceso; la consigna define el valor de referencia con el que la lógica decide cuándo actuar. No son la misma magnitud aunque usen las mismas unidades.

      Una lectura fija, saturada, ruidosa o inestable puede originarse en alimentación, cableado, conectores, tierra, módulo, calibración, acondicionamiento, sensor o proceso. El síntoma no identifica por sí solo la causa: compara la señal con una referencia independiente y con la condición física conocida. La puesta en marcha valida alimentación, polaridad, rango, escala, respuesta del lazo y correspondencia entre proceso, PLC, lógica y HMI; la primera discrepancia verificable indica dónde continuar.
    media_ids: []

  - id: TH-02-INDUCTIVE-SENSING
    title: "Bloque 02 — Sensores de proximidad inductivos"
    body: |-
      Un sensor de proximidad inductivo genera un campo electromagnético alterno en su cara activa. Cuando un objetivo metálico entra en ese campo, las corrientes inducidas modifican la oscilación del sensor y el dispositivo puede cambiar de estado al alcanzar su criterio interno. La detección es sin contacto, pero depende de la interacción entre el campo y el objetivo, no solo de que la pieza sea visible.

      El material, tamaño, forma, orientación, alineación, separación y velocidad del objetivo influyen en la respuesta. El montaje enrasado o no enrasado, la presencia de metal próximo y la geometría de la cara activa también deben ser compatibles con el diseño del sensor. Que el dispositivo esté alimentado confirma una condición eléctrica, no que el objetivo esté dentro de las condiciones de detección.

      Sn es la distancia nominal declarada como referencia; Sr describe la distancia real obtenida bajo las condiciones definidas para la medición. Su puede expresar una distancia útil y Sa una distancia de funcionamiento asegurada cuando esas categorías son aplicables según la definición técnica pertinente. Sus límites y relaciones dependen de la norma o documentación del dispositivo: no debe extrapolarse un factor universal. Una conmutación observada confirma un estado en ese instante, mientras que el funcionamiento asegurado exige comprobar las condiciones documentadas y el margen de montaje.
    media_ids: []

  - id: TH-03-DISTANCE-MEASUREMENT
    title: "Bloque 03 — Medición de distancia y magnitudes"
    body: |-
      Un instrumento de distancia estima la separación entre una referencia física del instrumento y la superficie de un objeto. Según el principio aplicado, puede calcularla a partir del tiempo de vuelo de una señal o de la geometría de triangulación, entre otros métodos. La lectura es distancia sensor–objeto; no se convierte automáticamente en altura, nivel, espesor ni criterio de aceptación.

      Cuando existe una referencia sensor–base conocida y la geometría permite proyectar ambas distancias sobre el mismo eje, puede calcularse una dimensión: Altura = distancia de referencia sensor–base − distancia sensor–objeto. Por ejemplo, con una referencia de 700 mm y una distancia medida de 260 mm, la altura calculada es 440 mm.

      La relación requiere la misma unidad, una referencia estable, superficies correctamente identificadas y una orientación coherente, normalmente perpendicular al eje de medida. Si el sensor o la base se desplazan, la superficie está inclinada o hay un offset no compensado, debe utilizarse el modelo geométrico correspondiente. La interpretación también exige conocer rango, resolución, repetibilidad, exactitud, incertidumbre, alineación, temperatura, obstrucciones y condiciones de montaje.
    media_ids: []

  - id: TH-04-SIGNALS-AND-DIAGNOSIS
    title: "Bloque 04 — Señales, decisiones y diagnóstico"
    body: |-
      Alimentación, estado de conmutación y comunicación son comprobaciones diferentes. Un sensor puede estar energizado y comunicar datos sin que su salida discreta esté activa. Las salidas PNP o NPN dependen del cableado y del modo de entrada configurado; IO-Link puede transportar valores medidos, estados y parámetros, pero el significado de cada bit, palabra o estado depende del dispositivo, su perfil y su configuración.

      Una medida continua puede ser plausible mientras una salida discreta permanece inactiva porque la decisión depende de un umbral, una ventana, una histéresis, una polaridad o un modo de salida. La medición describe un valor y la salida comunica el resultado de una función de decisión. No es universal que 0 signifique “no detectado” ni que 1 signifique “detectado”.

      La trazabilidad sigue el recorrido fenómeno físico → sensor → medida → función de decisión → señal → entrada de control → lógica → actuador y HMI. Revisa límites, estado normal, polaridad, tiempo de respuesta y criterio de aplicación; guarda y lee de vuelta los parámetros con un procedimiento compatible y comprueba su persistencia tras un reinicio autorizado cuando corresponda. La validación final usa condiciones representativas y una comprobación funcional independiente; un indicador final o un contador a cero por sí solo no demuestra que la cadena esté validada.
    media_ids: []
