sections:
  - id: TH-01-FIELD-INSTRUMENTATION-CHAIN
    title: Cadena de instrumentación de campo
    body: |-
      La instrumentación de campo convierte una variable física en una señal útil para el control. Temperatura, presión, nivel, caudal, posición y vibración pueden alimentar sensores, transmisores y acondicionadores que convierten el fenómeno en un valor medible. La medición no termina en el sensor; debe seguir la cadena hasta la entrada del PLC, la visualización del HMI y el criterio de decisión del sistema.

      Un mismo proceso puede observarse desde varias fronteras: el fenómeno físico, la salida del sensor, la señal de proceso y la variable lógica que toma el control. Cada una de estas capas puede coincidir o divergir. El diagnóstico correcto compara la evidencia de cada etapa sin asumir que el valor observado en software refleja automáticamente la condición real del proceso.
    media_ids: []

  - id: TH-02-ANALOG-SIGNAL-LOOPS
    title: Bucles analógicos y 4–20 mA
    body: |-
      Las señales analógicas representan un valor continuo dentro de un rango definido. En instrumentación de campo, un lazo 4–20 mA es una interfaz muy habitual porque ofrece buena inmunidad al ruido, aceptación de longitudes de cable grandes y un nivel de diagnóstico útil mediante su tendencia y su margen de operación.

      En un lazo 4–20 mA, el valor 4 mA suele representar el mínimo medido o el cero de escala, mientras que 20 mA representa el máximo. Si la señal se encuentra fuera de este rango, o si se queda en 0 mA o en un valor de saturación, puede indicar un fallo de alimentación, un circuito abierto, un sensor defectuoso o una condición de proceso fuera del rango esperado.

      El diagnóstico de una señal analógica debe separarse del diagnóstico del sensor. Un transductor puede ser correcto y aún así la señal puede llegar alterada por cableado, tierra, módulo de entrada, configuración del rango o valor de referencia del sistema.
    media_ids: []

  - id: TH-03-SENSOR-OUTPUT-TYPES
    title: Tipos de salida y compatibilidad eléctrica
    body: |-
      Los sensores, transmisores y acondicionadores pueden entregar señales analógicas, digitales, discretas o de comunicación. Las salidas analógicas suelen ser 0–10 V, 1–5 V o 4–20 mA; las señales digitales pueden comportarse como un contacto seco, un estado discreto o un mensaje digital serializado.

      La compatibilidad eléctrica exige verificar tensión de alimentación, tipo de salida, polaridad, referencia, aislamiento y consumo del canal de entrada. Un sensor que se ve correcto por su LED puede aún producir un valor incompatible con el módulo del PLC o con la configuración de escala del sistema. La compatibilidad no se demuestra solo con el nombre del fabricante ni con la etiqueta del cable.
    media_ids: []

  - id: TH-04-TRANSMITTERS-AND-SETPOINTS
    title: Transmisores, acondicionadores y consignas
    body: |-
      Un transmisor convierte la variable física en un valor normalizado para control y registro. Un acondicionador puede preparar la señal para distancia, aislamiento o conversión de escala. El punto de medida, la referencia de calibración y la escala de ingeniería deben interpretarse junto con la definición del proceso y la consigna del sistema.

      La consigna o setpoint no es solo un valor numérico; es la referencia que decide cuándo el control debe actuar. Si la señal del sensor está dentro del rango, pero la lógica de control compara con un valor incorrecto o una escala equivocada, el comportamiento del sistema puede seguir siendo erróneo sin que el proceso físico esté fuera de límites.
    media_ids: []

  - id: TH-05-ANALOG-FAULTS
    title: Fallos frecuentes en lazo analógico
    body: |-
      Un fallo analógico puede ser de fuente de alimentación, cableado, conexión, tierra, módulo, referencia, calibración o sensibilidad del sensor. Una señal anclada a 0 mA puede indicar corte de corriente, circuito abierto o ausencia de energía. Un valor fijo en un extremo del rango puede sugerir una salida bloqueada, una condición de saturación o una configuración incorrecta de escala.

      El ruido, la deriva térmica, la vibración y la evaporación o contaminación del proceso también degradan la señal. Antes de reemplazar equipos, conviene comparar el valor del transmisor con la lectura del instrumento de referencia y con la condición física observada. La primera discrepancia verificable suele señalar el punto de ruptura.
    media_ids: []

  - id: TH-06-COMMISSIONING-AND-VALIDATION
    title: Puesta en marcha y validación de la medición
    body: |-
      La puesta en marcha de instrumentación exige validar la escala, la polaridad, la referencia, el rango de trabajo y el comportamiento del lazo en condiciones reales. No basta con confirmar que el transmisor enciende; debe verificarse que la señal que llega al PLC corresponde con el proceso real y con la lógica del control.

      Un diagnostico robusto sigue flujo de la variable física hacia el sensor, el transmisor, el cableado, la entrada del PLC, la variable de proceso y la lógica de control. La validación final debe recrear la condición del proceso real y confirmar que la actuación del sistema sigue el valor esperado. Esa secuencia reduce errores de sustitución y mantiene la confianza en la medición.
    media_ids: []

  - id: "TH-07-INDUCTIVE-SENSING-CONDITIONS"
    title: "Detección inductiva y condiciones físicas"
    body: "Un sensor de proximidad inductivo detecta un objetivo metálico sin contacto. La presencia visible de una pieza no demuestra que la cara activa, la separación, la geometría del objetivo y las condiciones de montaje permitan detectarla. La investigación debe comparar la aplicación con la documentación del dispositivo antes de sustituirlo o modificar parámetros. Un sensor alimentado puede funcionar correctamente sin conmutar si el objetivo queda fuera de sus condiciones de detección."
    media_ids: []
  - id: "TH-08-RATED-AND-SECURED-DISTANCE"
    title: "Distancia nominal y distancia asegurada"
    body: "Sn es la distancia nominal de conmutación, no un umbral digital exacto aplicable a cualquier montaje. La distancia de funcionamiento asegurada define la condición documentada que debe comprobarse para la instalación. En el Turck BI6U-MT12-IOL6X2-H1141, Sn = 6 mm y la referencia asegurada es ≤ 4.86 mm (0.81 × Sn). No generalices ese factor a otros dispositivos sin consultar su documentación. Una conmutación observada no demuestra por sí sola margen de funcionamiento asegurado. La aceptación exige comprobar geometría, montaje y condición documentada, además del resultado funcional."
    media_ids: []
  - id: "TH-09-POWER-SWITCHING-AND-PROCESS-DATA"
    title: "Alimentación, conmutación y datos de proceso"
    body: "Alimentación, conmutación y salud de comunicación son comprobaciones distintas. El LED Power indica alimentación, mientras que el LED Switching/Output representa el estado de conmutación según el dispositivo. Un enlace IO-Link operativo puede transmitir correctamente un estado de no detección. Interpreta los datos de proceso con la documentación: en la representación Active switchpoint utilizada, 0 significa objetivo no detectado y 1 objetivo detectado. Contrasta el estado físico con el sensor, el dato comunicado, el PLC y la HMI. Localiza la primera discrepancia y verifica de nuevo toda la cadena después de corregirla, sin forzar señales."
    media_ids: []
  - id: TH-10-DISTANCE-MEASUREMENT
    title: Medición de distancia por tiempo de vuelo
    body: "Un sensor de distancia láser estima la separación entre su referencia y el objeto a partir del principio de medición que documenta el fabricante, como el tiempo de vuelo. La lectura representa distancia sensor–objeto; no es automáticamente altura, nivel ni una orden de aceptación. Para un DT50-2 concreto deben comprobarse variante, rango, referencia y comportamiento de salida en su documentación."
    media_ids: []
  - id: TH-11-DISTANCE-VS-HEIGHT
    title: Distancia de referencia y altura del producto
    body: "La distancia sensor–caja y la altura de la caja son magnitudes distintas. Si existe una referencia sensor–cinta documentada, la altura puede calcularse como altura = distancia de referencia sensor–cinta menos distancia sensor–caja. Una lectura aislada de 214 mm no permite calcular una altura sin esa referencia y sin conocer la geometría de la aplicación."
    media_ids: []
  - id: TH-12-SWITCHING-WINDOW-OUTPUT
    title: Valor medido, ventana y salida de conmutación
    body: "Un valor medido puede ser plausible y aun así dejar la salida Q1 en OFF si queda fuera de la ventana configurada. El diagnóstico debe contrastar límites, modo de salida, polaridad y persistencia con los criterios de aplicación. Q1 no es otra medición de distancia: es el resultado de la función de conmutación configurada."
    media_ids: []
  - id: TH-13-MEASUREMENT-TRACE-AND-PERSISTENCE
    title: Trazabilidad de medida y persistencia de parámetros
    body: "Sigue la cadena completa: geometría física → distancia medida → ventana y función de salida → Q1 → entrada PLC → lógica de aceptación o rechazo → actuador → HMI. Guarda y lee de vuelta los parámetros con el procedimiento compatible, verifica el comportamiento tras un reinicio aprobado y usa muestras aceptadas y rechazadas. El primer estado anómalo verificable guía el diagnóstico; un contador a cero por sí solo no acredita recuperación."
    media_ids: []
