sections:
  - id: TH-01-INSTRUMENTATION-FOUNDATIONS
    title: "Bloque 01 — Cadena de medida y evidencia"
    body: |-
      La instrumentación industrial observa variables físicas como presión, temperatura, nivel, caudal, posición o vibración y las convierte en información utilizable por un sistema de control. La cadena puede incluir el proceso, el elemento sensible o transductor, un transmisor, un acondicionador, bornes y cableado, una entrada de PLC, la lógica de decisión, un actuador y la representación en HMI. Cada frontera aporta una evidencia distinta: magnitud física, señal eléctrica, valor de proceso, estado lógico o efecto físico.

      Sensor, transductor, transmisor y acondicionador no son sinónimos. Un sensor responde a una variable, un transductor convierte esa respuesta, un transmisor la entrega en una señal utilizable y un acondicionador puede filtrarla, aislarla o adaptarla. Una medida directa procede del fenómeno observado; una medida derivada se calcula a partir de una referencia y un modelo. La variable medida describe el proceso y la consigna define el valor de referencia con el que la lógica decide cuándo actuar.

      Las señales pueden ser analógicas, discretas, digitales o de comunicación. Que una etapa posterior muestre un valor no demuestra por sí solo que las etapas anteriores estén sanas: una HMI puede mostrar una escala incorrecta, una entrada puede tener una referencia defectuosa y una salida puede estar en el estado equivocado aunque el sensor esté alimentado.

      El diagnóstico empieza por una condición física conocida, una frontera de medida, un resultado esperado y una comparación con una referencia independiente. La primera discrepancia verificable acota la búsqueda; el síntoma final no identifica por sí solo la causa. Este método evita saltar directamente a sustituir el instrumento y mantiene separadas observación, hipótesis, intervención y verificación.
    media_ids: []

  - id: TH-02-INDUCTIVE-SENSING
    title: "Bloque 02 — Interfaces de campo y detección inductiva"
    body: |-
      Una interfaz de campo debe analizarse como una relación entre fuente, carga, referencia y límite de funcionamiento. En un lazo 4–20 mA, la fuente debe conservar tensión suficiente después de la resistencia del transmisor, los cables, los bornes y la entrada; si la carga total reduce el margen disponible, la corriente puede dejar de representar correctamente el proceso aunque el escalado del PLC sea correcto. En 0–10 V, la referencia común, la impedancia de entrada, el retorno, el apantallamiento y las diferencias de potencial forman parte de la medida.

      La normalización eléctrica no equivale a unidades de ingeniería. El escalado transforma un rango de señal en un rango de proceso y debe comprobarse por separado de la señal física: una corriente correcta puede mostrar una presión incorrecta si el rango, el cero, el span o las alarmas están mal configurados. La calibración compara el instrumento con una referencia conocida; la verificación comprueba que la cadena instalada produce el comportamiento esperado. Ambas deben quedar diferenciadas.

      Un sensor de proximidad inductivo genera un campo electromagnético alterno en su cara activa. El material, tamaño, forma, orientación, alineación, separación, velocidad, montaje enrasado o no enrasado y metal próximo influyen en la respuesta. La detección depende de la interacción entre el campo y el objetivo, no solo de que la pieza sea visible. Las distancias nominales y las distancias de funcionamiento asegurado deben leerse según la documentación aplicable; no existe un factor universal que pueda extrapolarse.

      En señales discretas, PNP, NPN y contacto seco describen formas distintas de conmutar y referenciar la carga. En termopares, una inversión de polaridad puede producir una tendencia opuesta aunque el módulo esté alimentado. IO-Link y otras comunicaciones pueden transportar valores, estados y parámetros, pero no sustituyen la comprobación de alimentación, cableado, configuración y significado de cada dato. Un dispositivo energizado o comunicando no demuestra que la medida sea válida.
    media_ids: []

  - id: TH-03-DISTANCE-MEASUREMENT
    title: "Bloque 03 — Geometría, distancia y calidad de la medida"
    body: |-
      El comportamiento de un instrumento depende tanto del principio físico como de su instalación. Una instalación estable exige una referencia conocida, superficies correctamente identificadas, orientación coherente y ausencia de offsets o desplazamientos no compensados. La alimentación confirma una condición eléctrica, pero no demuestra por sí sola que la magnitud medida sea válida.

      Un instrumento de distancia estima la separación entre una referencia física del instrumento y una superficie. Esa lectura no se convierte automáticamente en altura, nivel, espesor ni criterio de aceptación. Para obtener una magnitud derivada se necesita una referencia estable, superficies correctamente identificadas, la misma unidad y un modelo geométrico coherente; por ejemplo, una altura puede calcularse como distancia sensor–base menos distancia sensor–objeto cuando ambas pertenecen al mismo eje.

      La calidad de una medida incluye resolución, repetibilidad, exactitud, incertidumbre, alineación, temperatura, obstrucciones y condiciones de montaje. También incluye su comportamiento en el tiempo: ruido, filtrado, histéresis, saturación, resistencia intermitente, tiempo de respuesta y retardos. Una restricción en una línea de impulso puede retrasar la respuesta sin cambiar inmediatamente la presión real; una lectura estable no siempre significa que la cadena responda con la velocidad necesaria.
    media_ids: []

  - id: TH-04-SIGNALS-AND-DIAGNOSIS
    title: "Bloque 04 — Decisión, actuación y verificación"
    body: |-
      Una medida continua puede ser plausible mientras una salida discreta permanece inactiva porque la decisión depende de un umbral, una ventana, una histéresis, una polaridad o un modo de salida. La medición describe un valor y la salida comunica el resultado de una función de decisión. No es universal que 0 signifique “no detectado” o que 1 signifique “detectado”; hay que comprobar el estado normal, el criterio configurado y la correspondencia con la entrada de control.

      La cadena de actuación añade otra frontera: una orden de PLC no demuestra que exista energía disponible, que la válvula o el accionamiento haya actuado ni que el mecanismo haya alcanzado su posición. La realimentación confirma una condición distinta de la orden. Por eso conviene separar comando, energía, efecto físico y confirmación, especialmente en actuadores neumáticos y en señales de posición.

      La trazabilidad sigue el recorrido fenómeno físico → sensor → medida → función de decisión → señal → entrada de control → lógica → actuador → respuesta física y HMI. Un diagnóstico sólido formula una hipótesis, define el punto seguro donde medir, establece el resultado esperado, compara el resultado real, aísla la discrepancia y solo entonces interviene. Después debe verificar recuperación con condiciones representativas, repetición de ciclos o una referencia independiente. Corregir una causa no equivale a demostrar que el sistema se ha recuperado; los parámetros también deben leerse de vuelta y comprobar su persistencia cuando corresponda.
    media_ids: []
