    id: "TH-02-NOTEBOOK-READING-PATH"
    title: "Bloque 02 — Distribución eléctrica y protecciones"
    body: "Seguir la energía desde la alimentación hasta la carga y comprender qué protege cada dispositivo.\n\nItinerario Notebook: abre Engineering Notes y selecciona la categoría «Distribución eléctrica y protecciones». Conserva este orden de lectura; las comprobaciones y respuestas completas están en cada entrada. Preview: contenido y traducción pendientes de revisión técnica.\n\nNB-EL-06 → article-014: Alimentación monofásica y trifásica\nNB-EL-07 → article-015: Fuentes industriales de 24 VDC\nNB-EL-08 → article-016: Fusibles, magnetotérmicos y protección de sobreintensidad\nNB-EL-09 → article-017: Diferenciales, aislamiento y PE\nNB-EL-10 → article-018: Selectividad, separación y distribución"
    media_ids: []
