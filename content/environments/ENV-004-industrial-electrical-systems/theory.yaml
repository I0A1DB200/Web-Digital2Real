    id: "TH-01-NOTEBOOK-READING-PATH"
    title: "Bloque 01 — Fundamentos eléctricos y medición"
    body: "Interpretar magnitudes y seleccionar instrumentos con criterio.\n\nItinerario Notebook: abre Engineering Notes y selecciona la categoría «Fundamentos eléctricos y medición». Conserva este orden de lectura; las comprobaciones y respuestas completas están en cada entrada. Preview: contenido y traducción pendientes de revisión técnica.\n\nNB-EL-01 → article-009: Tensión, corriente, resistencia y circuito cerrado\nNB-EL-02 → article-010: AC, DC, frecuencia y valores eficaces\nNB-EL-03 → article-011: Potencia, energía y cargas industriales\nNB-EL-04 → article-012: Multímetro, pinza y lectura de medidas\nNB-EL-05 → article-013: Calidad de la medida y diagnóstico diferencial"
    media_ids: []
