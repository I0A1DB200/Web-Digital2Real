locale: "es"
translations:
  title: "Dispositivo IO-Link fuera de línea"
  summary: "Localiza un dispositivo IO-Link no disponible distinguiendo PLC, PROFINET, master, puerto, datos de proceso y conexión física."
  scenario:
    initial_context: "El dispositivo Turck BI6U-M12-IOL6X2-H1141 conectado al puerto C3 deja de proporcionar la información esperada."
    operational_state: "Quedan por comprobar el estado del S7-1500, la comunicación PROFINET, la disponibilidad del TBEN-L5-8IOL y los demás puertos. No forzar datos, suprimir diagnósticos ni modificar puertos vecinos o configuración PROFINET."
    initiating_event: "La máquina comunica una condición de diagnóstico asociada al dispositivo de campo de C3."
    learner_role: "Técnico de automatización responsable de delimitar el alcance de la anomalía mediante comprobaciones por capas."
    safety_context:
      safe_state: "Inspeccionar la conexión física únicamente conforme al procedimiento seguro de mantenimiento y con el movimiento peligroso controlado."
      intervention_constraints: ["No forzar valores PLC ni datos de proceso.", "No suprimir diagnósticos.", "No modificar puertos vecinos o configuración PROFINET.", "No sustituir equipos sin evidencia."]
  learning_objectives:
    OBJ-LAYERED-COMMUNICATION:
      description: "Distinguir estado PLC, PROFINET, master IO-Link, puerto, dispositivo, datos de proceso y función de máquina."
    OBJ-PORT-FAULT-BOUNDARY:
      description: "Localizar la primera condición anormal comparando C3 con los demás puertos."
    OBJ-CONNECTION-RECOVERY:
      description: "Justificar una intervención con evidencia y verificar comunicación, datos y función sin bypass."
  stages:
    STAGE-01-ESTABLISH-SCOPE:
      title: "Establecer el alcance"
      situation: "Un dispositivo de campo aparece fuera de línea. ¿Cuál es el mejor primer paso?"
    STAGE-02-VERIFY-UPSTREAM:
      title: "Verificar las capas superiores"
      situation: "El incidente puede pertenecer al PLC, a PROFINET, al master o a un dispositivo descendente. ¿Qué evidencia debe verificarse?"
    STAGE-03-LOCALIZE-PORT:
      title: "Localizar el puerto afectado"
      situation: "PLC, PROFINET y master están disponibles. ¿Cómo debe estrecharse el dominio de fallo?"
    STAGE-04-INTERPRET-BOUNDARY:
      title: "Interpretar la frontera de comunicación"
      situation: "La comparación confirma comunicación en C0–C2 y C4–C7; C3 no comunica con su dispositivo. ¿Qué conclusión guía el siguiente paso?"
    STAGE-05-INSPECT-PHYSICAL-PATH:
      title: "Inspeccionar la ruta física de C3"
      situation: "La investigación se centra en la ruta individual de C3. Conforme al procedimiento seguro de mantenimiento y con el movimiento peligroso controlado, ¿qué debe inspeccionarse?"
    STAGE-06-RESTORE-VERIFY:
      title: "Restaurar y verificar"
      situation: "La inspección identifica una conexión M12 parcialmente floja en C3; la recuperación sigue pendiente. Conforme al procedimiento seguro de mantenimiento y con el movimiento peligroso controlado antes de intervenir, ¿qué restauración y verificación corresponden?"
  evidence:
    EVID-01-INCIDENT:
      source: "Máquina"
      content: "El BI6U-M12-IOL6X2-H1141 conectado a C3 no aporta la información esperada."
    EVID-02-SCOPE:
      source: "Diagnóstico jerárquico"
      content: "Se organiza la comprobación por capas: PLC, PROFINET, master IO-Link y dispositivo descendente. Esta elección define el plan; todavía no confirma disponibilidad."
    EVID-03-UPSTREAM-HEALTHY:
      source: "Estado de sistema"
      content: "Las comprobaciones confirman el S7-1500 operativo y comunicación PROFINET hasta el TBEN-L5-8IOL accesible en el estado observado. No certifican la salud global del PLC ni de toda la red."
    EVID-04-C3-ABNORMAL:
      source: "Comparación de puertos"
      content: "La consulta diagnóstica muestra falta de comunicación con el dispositivo C3; la comparación confirma comunicación en C0, C1, C2 y C4–C7. El mensaje no demuestra una avería interna del dispositivo."
    EVID-05-BOUNDARY:
      source: "Master / dispositivo"
      content: "De la disponibilidad del master y la comparación de puertos se deduce que la investigación debe centrarse en la ruta individual C3, incluido el puerto, cable y dispositivo. Esta interpretación no añade una medición de datos ni identifica todavía el componente causal."
    EVID-06-M12-LOOSE:
      source: "Ruta física C3"
      content: "La inspección de la ruta C3 confirma el conector M12 parcialmente flojo y no correctamente asentado. La imagen ilustra el asiento observado; no establece continuidad eléctrica ni un par de apriete."
    EVID-07-RECOVERY:
      source: "Verificación posterior a la restauración"
      content: "La restauración conforme al procedimiento seguro deja el M12 correctamente asentado. La verificación confirma comunicación del dispositivo C3, datos de proceso esperados, disponibilidad PROFINET y de los puertos vecinos preservada y función de máquina estable en ciclos repetidos sin forcing. Estos resultados proceden de la prueba funcional, no de los indicadores de la imagen."
  decisions:
    DEC-01-REPLACE-DEVICE:
      action: "Sustituir inmediatamente el dispositivo de campo."
    DEC-01-RESTART-LINE:
      action: "Reiniciar toda la línea para intentar recuperar la información."
    DEC-01-CHANGE-IP:
      action: "Cambiar la configuración IP del PLC y del master."
    DEC-01-ESTABLISH-SCOPE:
      action: "Organizar las comprobaciones para determinar si la primera anomalía pertenece al PLC, PROFINET, master o dispositivo descendente."
    DEC-02-REPLACE-MASTER:
      action: "Sustituir el master IO-Link antes de comprobar su disponibilidad."
    DEC-02-VERIFY-PLC-PN-MASTER:
      action: "Verificar estado del PLC, comunicación PROFINET y disponibilidad del master."
    DEC-02-FORCE-DATA:
      action: "Forzar los datos de proceso esperados en el PLC."
    DEC-03-RESET-PLC:
      action: "Reiniciar el PLC aunque permanece operativo."
    DEC-03-RECONFIGURE-PN:
      action: "Reconfigurar PROFINET aunque el master está accesible."
    DEC-03-COMPARE-PORTS:
      action: "Consultar el diagnóstico de C3 y comparar su comunicación con los demás puertos para distinguir un fallo común de uno individual."
    DEC-04-DOWNSTREAM-C3:
      action: "Centrar la investigación en la ruta individual C3, incluido el puerto, cable y dispositivo."
    DEC-04-GENERAL-PROFINET:
      action: "Diagnosticar una caída general de PROFINET."
    DEC-04-MASTER-TOTAL-FAILURE:
      action: "Concluir que el master completo ha fallado."
    DEC-05-REPLACE-SENSOR:
      action: "Sustituir el dispositivo sin inspeccionar su conexión."
    DEC-05-CHANGE-PORT:
      action: "Mover el dispositivo a un puerto vecino saludable."
    DEC-05-SUPPRESS-DIAGNOSTIC:
      action: "Suprimir el diagnóstico para recuperar la producción."
    DEC-05-INSPECT-M12:
      action: "Conforme al procedimiento seguro de mantenimiento y con el movimiento peligroso controlado, inspeccionar C3, el cable y el asiento del conector M12."
    DEC-06-FORCE-PROCESS-DATA:
      action: "Forzar datos de proceso válidos y mantener la conexión sin cambios."
    DEC-06-RESTORE-COMPLETE-CHAIN:
      action: "Conforme al procedimiento seguro de mantenimiento y con el movimiento peligroso controlado antes de intervenir, asentar el M12 y verificar comunicación C3, datos, PROFINET, puertos vecinos y función en ciclos repetidos sin forcing."
    DEC-06-IGNORE-REPEATABILITY:
      action: "Asentar el conector y cerrar cuando aparezca un único dato válido."
  retry_feedback:
    DEC-01-REPLACE-DEVICE: "Fuera de línea no demuestra que el dispositivo esté averiado. Establece primero la capa anormal."
    DEC-01-RESTART-LINE: "Reiniciar no establece si el fallo pertenece a PLC, red, master o dispositivo."
    DEC-01-CHANGE-IP: "No existe evidencia que justifique cambiar la configuración de red."
    DEC-02-REPLACE-MASTER: "Comprueba la disponibilidad del master antes de sustituirlo."
    DEC-02-FORCE-DATA: "Forzar datos oculta el estado real y no recupera comunicación."
    DEC-03-RESET-PLC: "El PLC está operativo. Compara los puertos para localizar la rama afectada."
    DEC-03-RECONFIGURE-PN: "PROFINET y el master están disponibles. Localiza el puerto afectado."
    DEC-04-GENERAL-PROFINET: "El master sigue accesible y los demás puertos funcionan. La anomalía está aguas abajo."
    DEC-04-MASTER-TOTAL-FAILURE: "La disponibilidad del master y de los puertos vecinos contradice un fallo total."
    DEC-05-REPLACE-SENSOR: "La pérdida de comunicación no demuestra daño interno. Inspecciona cable y M12."
    DEC-05-CHANGE-PORT: "Mover el dispositivo evita inspeccionar la ruta C3 original."
    DEC-05-SUPPRESS-DIAGNOSTIC: "Suprimir el aviso no restaura comunicación ni datos."
    DEC-06-FORCE-PROCESS-DATA: "Forzar datos no repara el M12 y presenta un estado no confirmado."
    DEC-06-IGNORE-REPEATABILITY: "Una muestra válida no confirma estabilidad; verifica la cadena completa."
  visual:
    educational_purpose: "Distinguir las observaciones del PLC, PROFINET, master y dispositivo para localizar la primera condición anormal."
  assets:
    ART-001:
      alt: "Ilustración de portada EE-0008 con PLC, master y dispositivo IO-Link."
      caption: "Contexto ilustrativo del incidente; las indicaciones dibujadas no sustituyen las comprobaciones diagnósticas."
    ART-002:
      alt: "Contexto físico del dispositivo IO-Link afectado."
      caption: "El incidente se presenta en el dispositivo asociado a C3."
    ART-003:
      alt: "Ruta S7-1500, PROFINET y master IO-Link operativa."
      caption: "PLC, PROFINET y master permanecen disponibles."
    ART-004:
      alt: "Pantalla con diagnóstico de falta de comunicación del dispositivo C3."
      caption: "La pantalla ilustra el diagnóstico de C3; el estado de los vecinos procede de la comparación realizada, no de colores ni etiquetas de cables."
    ART-005:
      alt: "Primer plano del conector C3 con rosca expuesta y asiento incompleto."
      caption: "La inspección confirma el asiento incorrecto; la imagen no demuestra continuidad eléctrica."
    ART-006:
      alt: "Conector C3 asentado con indicadores visibles en el master."
      caption: "Ilustración posterior a la restauración; la comunicación, los datos y la repetibilidad se confirman mediante la prueba funcional."
  completion:
    title: "Debrief técnico"
    summary: "El PLC, PROFINET y el master estaban operativos; la primera anomalía aparecía en la ruta C3 por un conector M12 parcialmente flojo."
    process: ["Establecer el alcance.", "Verificar PLC, PROFINET y master.", "Comparar puertos.", "Localizar C3.", "Inspeccionar la ruta M12.", "Restaurar y verificar la cadena completa."]
    lesson: "Dispositivo fuera de línea no demuestra una avería general de red ni un dispositivo defectuoso: hay que localizar la primera capa anormal."
    avoided_errors: ["Sustituir el dispositivo sin evidencia.", "Reconfigurar PROFINET.", "Forzar datos de proceso.", "Suprimir el diagnóstico."]
    industrial_value: ["Localización jerárquica del fallo.", "Menos sustituciones injustificadas.", "Recuperación física verificable."]
