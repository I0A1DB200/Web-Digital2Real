  content_version: '1.0'
  class: practice
  access: free
  status: technical_review
  language: es
localization:
  default_locale: es
  supported_locales:
    - es
    - en
  locale_files:
    es: locales/es.yaml
    en: locales/en.yaml
classification:
  platform: Siemens S7-1500 / PROFINET remote I/O
  domain: PROFINET device identity and topology diagnostics
  industry: Manufacturing
  machine_type: Automated diagnostic cell
  difficulty: intermediate
capability_references:
  - capability_id: ICF-02
    competency_ids:
      - COMP-IIO-SIGNAL-TRACEABILITY
      - COMP-IIO-STATE-INTERPRETATION
      - COMP-IIO-CONTROLLED-RECOVERY
public:
  slug: profinet-device-name-mismatch
  title: Nombre de dispositivo PROFINET no coincide
  summary: Diagnostica una estación remota con enlace activo pero identidad PROFINET incorrecta y recupera la línea usando la configuración de hardware autorizada.
  estimated_duration: 20
  scenario:
    initial_context: Una estación remota de I/O sustituida tiene alimentación y enlace físico, pero el PLC no actualiza sus señales de proceso.
    operational_state: El PLC y las demás líneas PROFINET siguen operativos. La estación descubierta no coincide con el nombre que espera el proyecto.
    initiating_event: El diagnóstico online muestra un dispositivo accesible físicamente, pero fuera del intercambio cíclico por una discrepancia de identidad.
    learner_role: Técnico de automatización responsable de separar enlace, identidad, topología y configuración antes de aplicar la puesta en marcha autorizada.
    safety_context:
      safe_state: Realiza descubrimiento y descargas desde una condición segura. Cualquier cambio de identidad o cableado debe seguir el procedimiento autorizado de puesta en marcha.
      intervention_constraints:
        - No asignar nombres o IP improvisados.
        - No descargar hardware antes de confirmar la línea y el dispositivo.
        - No forzar I/O ni puentear el controlador.
        - Verificar identidad, comunicación cíclica, I/O y función después de la corrección.
  learning_objectives:
    - id: OBJ-IDENTITY-BOUNDARY
      description: Distinguir enlace físico activo, identidad descubierta, nombre esperado e IP configurada.
      capability_id: ICF-02
      competency_id: COMP-IIO-STATE-INTERPRETATION
    - id: OBJ-TOPOLOGY-COMMISSIONING
      description: Usar una vista de descubrimiento y la topología de TIA Portal para confirmar que el dispositivo pertenece a la línea correcta.
      capability_id: ICF-02
      competency_id: COMP-IIO-SIGNAL-TRACEABILITY
    - id: OBJ-VERIFIED-RECOVERY
      description: Aplicar la identidad esperada mediante procedimiento autorizado y verificar la recuperación completa de la línea.
      capability_id: ICF-02
      competency_id: COMP-IIO-CONTROLLED-RECOVERY
  stages:
    - id: STAGE-01-CONFIRM-SCOPE
      phase: incident
      title: Confirmar el alcance
      situation: Una estación remota sustituida tiene alimentación, pero el PLC no actualiza sus señales. ¿Qué acción establece primero el alcance sin alterar la instalación?
      evidence_ids:
        - EVID-01-INCIDENT
      decision_ids:
        - DEC-01-COMPARE-STATUS
        - DEC-01-RESTART-PLC
        - DEC-01-REPLACE-STATION
        - DEC-01-CHANGE-IP
    - id: STAGE-02-CHECK-IDENTITY
      phase: investigation
      title: Comparar la identidad del dispositivo
      situation: El resto de la red sigue operativo y la estación muestra alimentación y enlace. ¿Qué comparación aporta la siguiente evidencia?
      evidence_ids:
        - EVID-02-SCOPE
      decision_ids:
        - DEC-02-COMPARE-IDENTITY
        - DEC-02-RESEAT-CABLE
        - DEC-02-SWAP-STATION
        - DEC-02-CLEAR-DIAGNOSTIC
    - id: STAGE-03-VALIDATE-TOPOLOGY
      phase: investigation
      title: Validar la topología configurada
      situation: PRONETA descubre una estación con un nombre distinto al esperado. El enlace físico está activo. ¿Qué comprobación evita asignar una identidad a la línea equivocada?
      evidence_ids:
        - EVID-03-DEVICE-IDENTITY
      decision_ids:
        - DEC-03-CHANGE-IP-RANDOM
        - DEC-03-REPLACE-SWITCH
        - DEC-03-VERIFY-TOPOLOGY
        - DEC-03-FORCE-IO
    - id: STAGE-04-ASSIGN-IDENTITY
      phase: investigation
      title: Asignar la identidad autorizada
      situation: La topología y el dispositivo físico coinciden con el proyecto. ¿Qué intervención aplica la identidad esperada sin introducir otra variable?
      evidence_ids:
        - EVID-04-CONFIGURED-IDENTITY
      decision_ids:
        - DEC-04-ASSIGN-EXPECTED-ID
        - DEC-04-ASSIGN-ARBITRARY-NAME
        - DEC-04-CHANGE-IP-ONLY
        - DEC-04-BYPASS-CONTROLLER
    - id: STAGE-05-VERIFY-RECOVERY
      phase: solution
      title: Verificar la recuperación
      situation: La identidad esperada se ha aplicado y la configuración de hardware se ha descargado. ¿Qué comprobación demuestra que la línea vuelve a cumplir su función?
      evidence_ids: []
      decision_ids:
        - DEC-05-CHECK-LINK-ONLY
        - DEC-05-VERIFY-FULL-CHAIN
        - DEC-05-CLEAR-DIAGNOSTICS
  evidence:
    - id: EVID-01-INCIDENT
      type: initial_observation
      source: HMI y operador
      content: Una estación remota sustituida no actualiza sus señales mientras el PLC y las demás líneas siguen operativos.
      reliability: high
      revealed_by: []
    - id: EVID-02-SCOPE
      type: diagnostic
      source: Diagnóstico del controlador
      content: El PLC y las líneas de referencia están disponibles. La estación afectada tiene alimentación y enlace, pero no entra en intercambio cíclico válido.
      reliability: confirmed
      revealed_by:
        - DEC-01-COMPARE-STATUS
      media_ids:
        - ART-002
    - id: EVID-03-DEVICE-IDENTITY
      type: diagnostic
      source: PRONETA y estación remota
      content: La estación responde en la red y muestra una identidad descubierta distinta de la identidad esperada por el proyecto.
      reliability: confirmed
      revealed_by:
        - DEC-02-COMPARE-IDENTITY
      media_ids:
        - ART-003
    - id: EVID-04-CONFIGURED-IDENTITY
      type: diagnostic
      source: TIA Portal y topología PROFINET
      content: La posición, los vecinos y el puerto corresponden a la línea configurada; el proyecto contiene el nombre e IP que debe recibir la estación.
      reliability: confirmed
      revealed_by:
        - DEC-03-VERIFY-TOPOLOGY
      media_ids:
        - ART-004
        - ART-005
    - id: EVID-05-IDENTITY-APPLIED
      type: documentation
      source: Puesta en marcha autorizada
      content: La identidad esperada se asigna a la estación y la configuración de hardware se descarga desde TIA Portal sin cambiar la topología física.
      reliability: confirmed
      revealed_by:
        - DEC-04-ASSIGN-EXPECTED-ID
      media_ids:
        - ART-006
    - id: EVID-06-RECOVERY
      type: functional_test
      source: Diagnóstico online y prueba de proceso
      content: Las seis líneas aparecen disponibles, la estación entra en intercambio cíclico, las señales de I/O son coherentes y la tendencia de proceso permanece estable.
      reliability: confirmed
      revealed_by:
        - DEC-05-VERIFY-FULL-CHAIN
      media_ids:
        - ART-007
  decisions:
    - id: DEC-01-COMPARE-STATUS
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Comparar PLC, estación afectada y una referencia operativa.
    - id: DEC-01-RESTART-PLC
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Reiniciar el PLC para ver si desaparece el síntoma.
    - id: DEC-01-REPLACE-STATION
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Sustituir de inmediato la estación remota.
    - id: DEC-01-CHANGE-IP
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Cambiar la dirección IP antes de comparar el estado.
    - id: DEC-02-COMPARE-IDENTITY
      stage_id: STAGE-02-CHECK-IDENTITY
      action: Comparar nombre esperado, nombre descubierto y dirección IP.
    - id: DEC-02-RESEAT-CABLE
      stage_id: STAGE-02-CHECK-IDENTITY
      action: Desconectar y volver a conectar el cable para probar una hipótesis física.
    - id: DEC-02-SWAP-STATION
      stage_id: STAGE-02-CHECK-IDENTITY
      action: Cambiar la estación por otra sin conservar la evidencia.
    - id: DEC-02-CLEAR-DIAGNOSTIC
      stage_id: STAGE-02-CHECK-IDENTITY
      action: Borrar el diagnóstico para ver si la alarma reaparece.
    - id: DEC-03-CHANGE-IP-RANDOM
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      action: Asignar una IP libre al dispositivo sin validar la línea.
    - id: DEC-03-REPLACE-SWITCH
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      action: Sustituir el switch porque una estación tiene un nombre diferente.
    - id: DEC-03-VERIFY-TOPOLOGY
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      action: Verificar la topología configurada, los vecinos y el puerto de la línea.
    - id: DEC-03-FORCE-IO
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      action: Forzar I/O para comprobar si el dispositivo acepta la identidad.
    - id: DEC-04-ASSIGN-EXPECTED-ID
      stage_id: STAGE-04-ASSIGN-IDENTITY
      action: Asignar la identidad esperada y descargar HW desde TIA Portal.
    - id: DEC-04-ASSIGN-ARBITRARY-NAME
      stage_id: STAGE-04-ASSIGN-IDENTITY
      action: Asignar un nombre corto elegido en el momento.
    - id: DEC-04-CHANGE-IP-ONLY
      stage_id: STAGE-04-ASSIGN-IDENTITY
      action: Cambiar solo la IP y dejar el nombre sin comprobar.
    - id: DEC-04-BYPASS-CONTROLLER
      stage_id: STAGE-04-ASSIGN-IDENTITY
      action: Poner la estación en servicio fuera del proyecto para evitar el diagnóstico.
    - id: DEC-05-CHECK-LINK-ONLY
      stage_id: STAGE-05-VERIFY-RECOVERY
      action: Cerrar cuando los indicadores de enlace vuelvan a estar verdes.
    - id: DEC-05-VERIFY-FULL-CHAIN
      stage_id: STAGE-05-VERIFY-RECOVERY
      action: Verificar identidad, topología, comunicación cíclica, I/O y función.
    - id: DEC-05-CLEAR-DIAGNOSTICS
      stage_id: STAGE-05-VERIFY-RECOVERY
      action: Borrar el diagnóstico y cerrar sin probar el proceso.
  visual:
    educational_purpose: Revelar progresivamente el alcance, la identidad descubierta, la topología, la asignación autorizada y la recuperación funcional.
    representation: available
    cover_asset_id: ART-001
    assets:
      - id: ART-001
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/01-cover.png
        alt: Fotografía de un armario con PLC Siemens, switch SCALANCE y varias líneas de I/O PROFINET.
        caption: Armario y líneas PROFINET de la célula.
        purpose: catalog_cover
      - id: ART-002
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/02-topology-name-mismatch.png
        alt: Vista simulada de una topología PROFINET con una línea marcada por una discrepancia de identidad.
        caption: Una línea tiene identidad física y proyecto diferentes.
        purpose: evidence
      - id: ART-003
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/03-device-identity.png
        alt: Primer plano de una cabeza ET 200SP con alimentación y enlace activos y diagnóstico BF rojo.
        caption: El enlace está presente, pero la identidad no coincide.
        purpose: evidence
      - id: ART-004
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/04-online-name-check.png
        alt: Vista simulada de diagnóstico online que compara el nombre esperado con el nombre descubierto.
        caption: Comparación de identidad en línea.
        purpose: evidence
      - id: ART-005
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/05-proneta-commissioning.png
        alt: Vista simulada de puesta en marcha PRONETA para asignar identidad a una cabeza de línea PROFINET.
        caption: Puesta en marcha de la cabeza de línea.
        purpose: evidence
      - id: ART-006
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/06-hardware-download.png
        alt: Vista simulada de descarga de configuración de hardware desde TIA Portal a una red PROFINET.
        caption: Descarga autorizada de la configuración de hardware.
        purpose: evidence
      - id: ART-007
        type: image
        src: assets/EXP-PROFINET-DEVICE-022/07-recovery-verified.png
        alt: Vista simulada online con seis líneas PROFINET disponibles y una tendencia estable de proceso.
        caption: Recuperación verificada en toda la línea.
        purpose: completion
  completion:
    title: Debrief técnico
    summary: La estación tenía alimentación y enlace, pero su identidad PROFINET no coincidía con la del proyecto. La topología se confirmó antes de asignar el nombre esperado y descargar la configuración de hardware.
    process:
      - Confirmar el alcance.
      - Comparar identidad descubierta y esperada.
      - Validar vecinos y puerto de la línea.
      - Asignar la identidad autorizada.
      - Descargar la configuración de hardware.
      - Verificar comunicación, I/O y función.
    lesson: En una red PROFINET, un enlace verde no demuestra que el PLC haya aceptado la identidad del dispositivo. La topología y el proyecto deben coincidir antes de descargar la configuración.
    avoided_errors:
      - Cambiar la IP como primera reacción.
      - Asignar nombres improvisados.
      - Descargar hardware sin validar la línea.
      - Cerrar al ver solo los LEDs verdes.
    industrial_value:
      - Puesta en marcha trazable.
      - Menos sustituciones y cambios arbitrarios.
      - Diagnóstico repetible en líneas con muchos dispositivos.
    media_ids:
      - ART-007
private:
  fault_model:
    root_cause: La estación remota sustituida conserva un nombre PROFINET diferente del nombre esperado por el proyecto; el enlace físico está activo, pero el PLC no la incorpora al intercambio cíclico con la identidad configurada.
    recovery_conditions:
      - Topología física y posición de la estación confirmadas.
      - Nombre e IP esperados asignados mediante procedimiento autorizado.
      - Configuración de hardware descargada desde TIA Portal.
      - Comunicación cíclica, I/O y función de la línea verificadas.
  diagnostic_model:
    hypotheses:
      - id: HYP-LINK
        statement: La conexión física de la estación está ausente o es inestable.
        initial_status: possible
      - id: HYP-ID
        statement: El nombre o la identidad PROFINET no coincide con el proyecto.
        initial_status: likely
      - id: HYP-TOPOLOGY
        statement: La estación está conectada a una posición o puerto diferente del configurado.
        initial_status: possible
    confirmed_root_cause: HYP-ID
    critical_path:
      - DEC-01-COMPARE-STATUS
      - DEC-02-COMPARE-IDENTITY
      - DEC-03-VERIFY-TOPOLOGY
      - DEC-04-ASSIGN-EXPECTED-ID
      - DEC-05-VERIFY-FULL-CHAIN
  decision_logic:
    - decision_id: DEC-01-COMPARE-STATUS
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: true
      rationale: La comparación delimita una anomalía selectiva sin cambiar nombres, IP ni hardware.
      classification: strong
      consequence: Se confirma el alcance y se conserva el estado original para investigar la identidad.
      evidence_revealed:
        - EVID-02-SCOPE
      next_stage: STAGE-02-CHECK-IDENTITY
      score_effect: 10
      safety_effect: 1
    - decision_id: DEC-01-RESTART-PLC
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: false
      rationale: No hay evidencia de una caída global del controlador.
      classification: weak
      consequence: Se pierde contexto sin explicar por qué una sola estación queda fuera de servicio.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-IDENTITY
      score_effect: -4
      safety_effect: 0
      retry_feedback: El PLC y el resto de la red siguen operativos. Compara estados antes de reiniciar.
    - decision_id: DEC-01-REPLACE-STATION
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: false
      rationale: La estación aún no está separada entre enlace, identidad y configuración.
      classification: weak
      consequence: Se interviene sin demostrar que el equipo original sea la causa.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-IDENTITY
      score_effect: -5
      safety_effect: 0
      retry_feedback: Una estación no incorporada al PLC no está necesariamente averiada. Delimita primero las capas.
    - decision_id: DEC-01-CHANGE-IP
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: false
      rationale: La dirección es una hipótesis y el alcance todavía no está confirmado.
      classification: weak
      consequence: Se introduce una variable nueva y se dificulta la comparación.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-IDENTITY
      score_effect: -5
      safety_effect: 0
      retry_feedback: No cambies direccionamiento antes de saber qué dispositivo está afectado.
    - decision_id: DEC-02-COMPARE-IDENTITY
      stage_id: STAGE-02-CHECK-IDENTITY
      is_correct: true
      rationale: La estación tiene enlace, pero la identidad física debe coincidir con la identidad del proyecto antes de descargar nada.
      classification: strong
      consequence: Se revela una discrepancia de nombre con el enlace físico todavía disponible.
      evidence_revealed:
        - EVID-03-DEVICE-IDENTITY
      next_stage: STAGE-03-VALIDATE-TOPOLOGY
      score_effect: 10
      safety_effect: 1
    - decision_id: DEC-02-RESEAT-CABLE
      stage_id: STAGE-02-CHECK-IDENTITY
      is_correct: false
      rationale: Los indicadores de alimentación y enlace no apuntan primero a una pérdida física.
      classification: weak
      consequence: Se altera una conexión estable sin explicar la discrepancia de identidad.
      evidence_revealed: []
      next_stage: STAGE-03-VALIDATE-TOPOLOGY
      score_effect: -4
      safety_effect: 0
      retry_feedback: El enlace está presente. Compara la identidad descubierta con la esperada antes de tocar el cableado.
    - decision_id: DEC-02-SWAP-STATION
      stage_id: STAGE-02-CHECK-IDENTITY
      is_correct: false
      rationale: La sustitución no demuestra si el problema está en el equipo, el nombre o el proyecto.
      classification: weak
      consequence: Se pierde la evidencia del dispositivo que sí era accesible.
      evidence_revealed: []
      next_stage: STAGE-03-VALIDATE-TOPOLOGY
      score_effect: -6
      safety_effect: 0
      retry_feedback: Conserva el equipo y registra su identidad antes de sustituirlo.
    - decision_id: DEC-02-CLEAR-DIAGNOSTIC
      stage_id: STAGE-02-CHECK-IDENTITY
      is_correct: false
      rationale: Borrar el registro no compara la identidad ni aporta una frontera nueva.
      classification: weak
      consequence: Se elimina contexto útil antes de confirmar la causa.
      evidence_revealed: []
      next_stage: STAGE-03-VALIDATE-TOPOLOGY
      score_effect: -4
      safety_effect: 0
      retry_feedback: Conserva el diagnóstico hasta comparar nombres, IP y topología.
    - decision_id: DEC-03-CHANGE-IP-RANDOM
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      is_correct: false
      rationale: Una IP nueva no demuestra que el dispositivo pertenece a esa posición de la topología.
      classification: weak
      consequence: La línea puede quedar con una identidad válida en el lugar equivocado.
      evidence_revealed: []
      next_stage: STAGE-04-ASSIGN-IDENTITY
      score_effect: -6
      safety_effect: 0
      retry_feedback: Primero confirma la línea, los vecinos y el puerto configurado.
    - decision_id: DEC-03-REPLACE-SWITCH
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      is_correct: false
      rationale: El enlace y los vecinos siguen disponibles; no hay evidencia de una avería común del switch.
      classification: weak
      consequence: Se cambia infraestructura sin resolver la identidad de la estación.
      evidence_revealed: []
      next_stage: STAGE-04-ASSIGN-IDENTITY
      score_effect: -6
      safety_effect: 0
      retry_feedback: El switch está comunicando. Valida la relación entre dispositivo, puerto y proyecto.
    - decision_id: DEC-03-VERIFY-TOPOLOGY
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      is_correct: true
      rationale: La topología evita asignar el nombre correcto al dispositivo incorrecto y confirma que la estación pertenece a la línea.
      classification: strong
      consequence: La identidad física y la posición configurada quedan correlacionadas.
      evidence_revealed:
        - EVID-04-CONFIGURED-IDENTITY
      next_stage: STAGE-04-ASSIGN-IDENTITY
      score_effect: 10
      safety_effect: 1
    - decision_id: DEC-03-FORCE-IO
      stage_id: STAGE-03-VALIDATE-TOPOLOGY
      is_correct: false
      rationale: Forzar I/O no resuelve una discrepancia de identidad y puede alterar el proceso.
      classification: unsafe
      consequence: Se introduce una condición no representativa durante la puesta en marcha.
      evidence_revealed: []
      next_stage: STAGE-04-ASSIGN-IDENTITY
      score_effect: -10
      safety_effect: -5
      retry_feedback: No fuerces I/O para validar nombres. Usa diagnóstico y una condición segura.
    - decision_id: DEC-04-ASSIGN-EXPECTED-ID
      stage_id: STAGE-04-ASSIGN-IDENTITY
      is_correct: true
      rationale: La identidad se aplica según el proyecto y la topología ya verificados, sin inventar un nombre nuevo.
      classification: strong
      consequence: La estación puede incorporarse al intercambio cíclico con la configuración prevista.
      evidence_revealed:
        - EVID-05-IDENTITY-APPLIED
      next_stage: STAGE-05-VERIFY-RECOVERY
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-04-ASSIGN-ARBITRARY-NAME
      stage_id: STAGE-04-ASSIGN-IDENTITY
      is_correct: false
      rationale: El nombre debe proceder del proyecto y del procedimiento autorizado, no de una elección improvisada.
      classification: weak
      consequence: La estación puede quedar accesible con una identidad que el PLC no espera.
      evidence_revealed: []
      next_stage: STAGE-05-VERIFY-RECOVERY
      score_effect: -6
      safety_effect: 0
      retry_feedback: Usa la identidad esperada por el proyecto; no inventes nombres durante la intervención.
    - decision_id: DEC-04-CHANGE-IP-ONLY
      stage_id: STAGE-04-ASSIGN-IDENTITY
      is_correct: false
      rationale: El controlador identifica el dispositivo PROFINET por su nombre configurado antes de validar el intercambio.
      classification: weak
      consequence: La dirección puede parecer correcta mientras la estación sigue sin coincidir.
      evidence_revealed: []
      next_stage: STAGE-05-VERIFY-RECOVERY
      score_effect: -5
      safety_effect: 0
      retry_feedback: La IP no sustituye al nombre PROFINET esperado. Comprueba ambos datos.
    - decision_id: DEC-04-BYPASS-CONTROLLER
      stage_id: STAGE-04-ASSIGN-IDENTITY
      is_correct: false
      rationale: Saltar el controlador elimina la trazabilidad y puede dejar una configuración no gobernada.
      classification: unsafe
      consequence: La red queda operativa sin una identidad validada por el proyecto.
      evidence_revealed: []
      next_stage: STAGE-05-VERIFY-RECOVERY
      score_effect: -10
      safety_effect: -5
      retry_feedback: No evites el proyecto para ocultar un mismatch. Corrige la identidad mediante el procedimiento autorizado.
    - decision_id: DEC-05-CHECK-LINK-ONLY
      stage_id: STAGE-05-VERIFY-RECOVERY
      is_correct: false
      rationale: El enlace es necesario, pero no demuestra nombre aceptado, I/O cíclica ni función.
      classification: weak
      consequence: La intervención se cierra con evidencia parcial.
      evidence_revealed: []
      next_stage: COMPLETE
      score_effect: -4
      safety_effect: 0
      retry_feedback: Comprueba identidad aceptada, I/O cíclica y función, no solo LEDs.
