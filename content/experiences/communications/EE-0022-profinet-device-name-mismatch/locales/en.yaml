      caption: Link is present, identity is not accepted.
    ART-004:
      alt: Simulated online diagnostic view comparing expected and discovered device names.
      caption: Online identity comparison.
    ART-005:
      alt: Simulated PRONETA commissioning view for assigning identity to a PROFINET line head.
      caption: Line-head commissioning.
    ART-006:
      alt: Simulated TIA Portal hardware configuration download to a PROFINET network.
      caption: Authorized hardware configuration download.
    ART-007:
      alt: Simulated online view with six available PROFINET lines and a stable process trend.
      caption: Recovery verified across the line.
