        purpose: completion
  completion:
    title: Debrief técnico
    summary: La inestabilidad estaba causada por una terminación desactivada en el extremo final del segmento PROFIBUS. Se compararon topología y extremos, se activó la terminación autorizada en condición segura y se verificó la estabilidad del bus y del proceso.
    process:
      - Confirmar el alcance en el buffer.
      - Localizar el segmento y sus dos extremos.
      - Inspeccionar conectores y terminaciones.
      - Activar la terminación autorizada.
      - Verificar estabilidad, intercambio cíclico, I/O y función.
    lesson: En PROFIBUS, la terminación pertenece a la capa física y debe existir en los dos extremos del segmento. Un bus que vuelve momentáneamente no está recuperado hasta superar una prueba repetida sin nuevos errores.
    avoided_errors:
      - Cambiar direcciones o parámetros del maestro.
      - Sustituir todo el segmento sin localizar la frontera.
      - Activar una tercera terminación intermedia.
      - Cerrar cuando solo vuelven los LEDs.
    industrial_value:
      - Diagnóstico físico trazable.
      - Menos sustituciones de cableado y equipos.
      - Recuperación repetible en segmentos DP con varias estaciones.
    media_ids:
      - ART-007
private:
  fault_model:
    root_cause: La terminación del extremo final de un segmento PROFIBUS DP está desactivada aunque el diseño exige terminación activa en ambos extremos; la reflexión y degradación de la señal provocan errores de bus e inestabilidad del intercambio cíclico.
    recovery_conditions:
      - Segmento y extremos físicos identificados.
      - Terminación activa en ambos extremos, sin terminación intermedia.
      - Corrección aplicada desde una condición segura mediante procedimiento autorizado.
      - Calidad de bus, intercambio cíclico, I/O y función verificadas con una prueba repetida.
  diagnostic_model:
    hypotheses:
      - id: HYP-TERMINATION
        statement: Una terminación de extremo está ausente o desactivada.
        initial_status: likely
      - id: HYP-CABLE
        statement: El cable o un conector del segmento tiene una discontinuidad o mal contacto.
        initial_status: possible
      - id: HYP-STATION
        statement: Una estación concreta tiene un fallo local.
        initial_status: possible
      - id: HYP-ADDRESS
        statement: Una dirección de estación o parámetro lógico es incorrecto.
        initial_status: possible
    confirmed_root_cause: HYP-TERMINATION
    critical_path:
      - DEC-01-COMPARE-STATUS
      - DEC-02-COMPARE-NEIGHBORS
      - DEC-03-INSPECT-ENDPOINTS
      - DEC-04-ENABLE-TERMINATION
      - DEC-05-VERIFY-STABLE-BUS
  decision_logic:
    - decision_id: DEC-01-COMPARE-STATUS
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: true
      rationale: La acción delimita la capa correcta y conserva evidencia.
      classification: strong
      consequence: Se obtiene la siguiente evidencia verificable.
      evidence_revealed:
        - EVID-02-BUS-DIAGNOSTIC
      next_stage: STAGE-02-LOCALIZE-SEGMENT
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-01-RESTART-PLC
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: false
      rationale: La acción cambia una variable o elimina evidencia antes de confirmar la capa física.
      classification: weak
      consequence: Se introduce una variable sin demostrar la causa.
      evidence_revealed: []
      next_stage: STAGE-02-LOCALIZE-SEGMENT
      score_effect: -5
      safety_effect: 0
      retry_feedback: El maestro sigue en RUN. Delimita la perturbación antes de reiniciar.
    - decision_id: DEC-01-CHANGE-ADDRESS
