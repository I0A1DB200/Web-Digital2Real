capability_references:
  - capability_id: ICF-02
    competency_ids:
      - COMP-IIO-SIGNAL-TRACEABILITY
      - COMP-IIO-STATE-INTERPRETATION
      - COMP-IIO-CONTROLLED-RECOVERY
public:
  slug: modbus-rtu-communication-timeout
  title: Timeout de comunicación Modbus RTU
  summary: Diagnostica un timeout Modbus RTU separando parámetros serie, cableado, dirección y dispositivo antes de alinear la paridad autorizada y verificar respuestas válidas.
  estimated_duration: 20
  scenario:
    initial_context: Un PLC no obtiene respuestas válidas de un dispositivo Modbus RTU y el valor de proceso deja de actualizarse.
    operational_state: El PLC permanece en RUN y el gateway tiene alimentación. La petición sale por RS-485, pero el cliente termina la espera sin una respuesta válida.
    initiating_event: El diagnóstico online registra timeouts de respuesta y un acceso a I/O sin dato válido. La causa aún debe separarse entre cableado, dirección, baud rate, formato serie y dispositivo.
    learner_role: Técnico de automatización responsable de correlacionar petición, parámetros del cliente, configuración del servidor y respuestas Modbus RTU antes de intervenir.
    safety_context:
      safe_state: Realiza cambios de parámetros desde una condición segura y con el procedimiento de mantenimiento o puesta en marcha autorizado.
      intervention_constraints:
        - No aumentar el timeout para ocultar una incompatibilidad.
        - No cambiar la dirección ni invertir A/B como primera reacción.
        - No sustituir el gateway o el dispositivo sin conservar la evidencia.
        - Verificar respuestas válidas, contadores, latencia y dato de proceso después de la corrección.
  learning_objectives:
    - id: OBJ-MODBUS-SCOPE
      description: Distinguir un timeout de comunicación de un fallo de alimentación, cableado, dirección o dispositivo.
      capability_id: ICF-02
      competency_id: COMP-IIO-STATE-INTERPRETATION
    - id: OBJ-MODBUS-PARAMETERS
      description: Comparar baud rate, bits, paridad, parada, dirección y timeout entre cliente y servidor.
      capability_id: ICF-02
      competency_id: COMP-IIO-SIGNAL-TRACEABILITY
    - id: OBJ-MODBUS-RECOVERY
      description: Alinear la paridad autorizada y verificar respuestas Modbus RTU repetidas con dato de proceso estable.
      capability_id: ICF-02
      competency_id: COMP-IIO-CONTROLLED-RECOVERY
  stages:
    - id: STAGE-01-CONFIRM-SCOPE
      phase: incident
      title: Confirmar el alcance
      situation: El PLC permanece en RUN, pero una petición Modbus RTU termina en timeout. ¿Qué acción delimita primero la frontera sin cambiar parámetros ni hardware?
      evidence_ids:
        - EVID-01-INCIDENT
      decision_ids:
        - DEC-01-COMPARE-DIAGNOSTICS
        - DEC-01-RESTART-PLC
        - DEC-01-INCREASE-TIMEOUT
        - DEC-01-REPLACE-GATEWAY
    - id: STAGE-02-VERIFY-BASELINE
      phase: investigation
      title: Verificar la base serie
      situation: La instalación tiene alimentación y el dispositivo está identificado. ¿Qué comparación establece los parámetros que deben coincidir antes de intervenir?
      evidence_ids:
        - EVID-02-TIMEOUT-DIAGNOSTIC
      decision_ids:
        - DEC-02-CHANGE-ADDRESS
        - DEC-02-COMPARE-BASELINE
        - DEC-02-SWAP-PAIR
        - DEC-02-REPLACE-DEVICE
    - id: STAGE-03-COMPARE-PARAMETERS
      phase: investigation
      title: Comparar los parámetros
      situation: El cliente transmite una petición, pero no recibe una respuesta válida. ¿Qué comparación confirma la incompatibilidad que explica el timeout?
      evidence_ids:
        - EVID-03-EXPECTED-PARAMETERS
      decision_ids:
        - DEC-03-CHECK-WIRING
        - DEC-03-CHANGE-BAUD
        - DEC-03-COMPARE-PARITY
        - DEC-03-DISABLE-CHECKING
    - id: STAGE-04-ALIGN-SERIAL
      phase: investigation
      title: Alinear la comunicación
      situation: La paridad del servidor es Odd y el proyecto exige Even. ¿Qué intervención corrige la compatibilidad desde una condición autorizada?
      evidence_ids:
        - EVID-04-PARITY-MISMATCH
      decision_ids:
        - DEC-04-SET-EVEN
        - DEC-04-CHANGE-ADDRESS
        - DEC-04-SET-NONE
        - DEC-04-INCREASE-TIMEOUT
    - id: STAGE-05-VERIFY-RESPONSES
      phase: solution
      title: Verificar las respuestas
      situation: La paridad se ha alineado. ¿Qué prueba demuestra que la comunicación Modbus RTU y el dato de proceso han recuperado estabilidad?
      evidence_ids: []
      decision_ids:
        - DEC-05-CHECK-LED
        - DEC-05-REPEAT-FC03
        - DEC-05-CLEAR-COUNTERS
  evidence:
    - id: EVID-01-INCIDENT
      type: initial_observation
      source: HMI y operador
      content: El PLC mantiene su programa en RUN, pero el valor del dispositivo Modbus RTU deja de actualizarse y el cliente informa de un timeout de respuesta.
      reliability: high
      revealed_by: []
    - id: EVID-02-TIMEOUT-DIAGNOSTIC
      type: diagnostic
      source: Buffer de diagnóstico y MB_CLIENT
      content: El buffer registra un acceso a I/O sin respuesta válida y el bloque cliente muestra una petición Modbus RTU agotada. El evento localiza el síntoma, pero no demuestra todavía si la causa es cableado, dirección, baud rate o paridad.
      reliability: confirmed
      revealed_by:
        - DEC-01-COMPARE-DIAGNOSTICS
      media_ids:
        - ART-002
    - id: EVID-03-EXPECTED-PARAMETERS
      type: documentation
      source: Proyecto PLC y documentación del dispositivo
      content: La configuración esperada es 19200 baud, 8 bits de datos, paridad Even, 1 bit de parada, dirección 17 y timeout de respuesta de 1000 ms.
      reliability: confirmed
      revealed_by:
        - DEC-02-COMPARE-BASELINE
      media_ids:
        - ART-003
    - id: EVID-04-PARITY-MISMATCH
      type: inspection
      source: Comparación online cliente-servidor
      content: El cliente usa paridad Even y el servidor está configurado con paridad Odd; baud rate, bits de datos, bit de parada, dirección y timeout coinciden.
      reliability: confirmed
      revealed_by:
        - DEC-03-COMPARE-PARITY
      media_ids:
        - ART-004
        - ART-005
    - id: EVID-05-PARITY-APPLIED
      type: documentation
      source: Mantenimiento autorizado
      content: 'La paridad del servidor se alinea con el proyecto: Even. La dirección 17, el baud rate, el formato 8N1 efectivo y el timeout se mantienen sin cambios.'
      reliability: confirmed
      revealed_by:
        - DEC-04-SET-EVEN
    - id: EVID-06-RECOVERY
      type: functional_test
      source: Diagnóstico online y prueba de proceso
      content: Las peticiones FC03 reciben respuestas válidas repetidas, la latencia permanece estable, los contadores de timeout y error quedan a cero y el valor de proceso se actualiza de forma coherente.
      reliability: confirmed
      revealed_by:
        - DEC-05-REPEAT-FC03
      media_ids:
        - ART-006
  decisions:
    - id: DEC-01-COMPARE-DIAGNOSTICS
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Comparar el diagnóstico del cliente, la petición emitida y el estado operativo del PLC.
    - id: DEC-01-RESTART-PLC
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Reiniciar el PLC para comprobar si el timeout desaparece.
    - id: DEC-01-INCREASE-TIMEOUT
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Aumentar el timeout hasta que cualquier respuesta tardía sea aceptada.
    - id: DEC-01-REPLACE-GATEWAY
      stage_id: STAGE-01-CONFIRM-SCOPE
      action: Sustituir el gateway serie porque el primer timeout apunta a hardware.
    - id: DEC-02-COMPARE-BASELINE
      stage_id: STAGE-02-VERIFY-BASELINE
      action: Comparar proyecto, documentación del dispositivo y parámetros online antes de cambiar la instalación.
    - id: DEC-02-CHANGE-ADDRESS
      stage_id: STAGE-02-VERIFY-BASELINE
      action: Cambiar la dirección del servidor para probar otra identidad.
    - id: DEC-02-SWAP-PAIR
      stage_id: STAGE-02-VERIFY-BASELINE
      action: Invertir A y B antes de confirmar los parámetros serie y conservar la conexión actual.
    - id: DEC-02-REPLACE-DEVICE
      stage_id: STAGE-02-VERIFY-BASELINE
      action: Sustituir el dispositivo de campo sin comprobar su configuración.
    - id: DEC-03-CHECK-WIRING
      stage_id: STAGE-03-COMPARE-PARAMETERS
      action: Cambiar el cableado antes de comparar la configuración cliente-servidor.
    - id: DEC-03-CHANGE-BAUD
      stage_id: STAGE-03-COMPARE-PARAMETERS
      action: Cambiar el baud rate del cliente hasta que aparezca alguna respuesta.
    - id: DEC-03-COMPARE-PARITY
      stage_id: STAGE-03-COMPARE-PARAMETERS
      action: Comparar paridad, bits, dirección, baud rate, parada y timeout entre cliente y servidor.
    - id: DEC-03-DISABLE-CHECKING
      stage_id: STAGE-03-COMPARE-PARAMETERS
      action: Desactivar la comprobación de errores para aceptar cualquier trama recibida.
    - id: DEC-04-SET-EVEN
      stage_id: STAGE-04-ALIGN-SERIAL
      action: Alinear la paridad del servidor a Even mediante el procedimiento autorizado.
    - id: DEC-04-CHANGE-ADDRESS
      stage_id: STAGE-04-ALIGN-SERIAL
      action: Cambiar la dirección del servidor a 1 aunque el proyecto espera 17.
    - id: DEC-04-SET-NONE
      stage_id: STAGE-04-ALIGN-SERIAL
      action: Configurar paridad None para evitar la discrepancia sin seguir el diseño.
    - id: DEC-04-INCREASE-TIMEOUT
      stage_id: STAGE-04-ALIGN-SERIAL
      action: Aumentar el timeout y dejar la paridad incompatible.
    - id: DEC-05-CHECK-LED
      stage_id: STAGE-05-VERIFY-RESPONSES
      action: Cerrar el diagnóstico cuando el LED de comunicación parpadee.
    - id: DEC-05-REPEAT-FC03
      stage_id: STAGE-05-VERIFY-RESPONSES
      action: Repetir una petición FC03 conocida y verificar respuestas válidas, latencia, contadores y dato de proceso.
    - id: DEC-05-CLEAR-COUNTERS
      stage_id: STAGE-05-VERIFY-RESPONSES
      action: Borrar contadores y cerrar sin observar respuestas repetidas ni el valor de proceso.
  visual:
    educational_purpose: Revelar progresivamente la instalación S7-1500, el buffer de diagnóstico, la topología RS-485, las configuraciones serie de cliente y servidor y una traza de comunicación observable.
    representation: available
    cover_asset_id: ART-001
    assets:
      - id: ART-001
        type: image
        src: assets/EXP-MODBUS-RTU-025/01-installation-context.png
        alt: Fotografía de una instalación con PLC Siemens S7-1500, módulos de E/S y cableado industrial conectado.
        caption: La fotografía aporta el contexto físico de la instalación, pero no demuestra por sí sola el mapeo Modbus RTU.
        purpose: catalog_cover
      - id: ART-002
        type: image
