        alt: Captura de TIA Portal con el árbol de diagnóstico y un buffer de eventos de la CPU en línea.
        caption: El buffer aporta una frontera de diagnóstico; el evento visible debe correlacionarse con la petición Modbus del caso.
        purpose: evidence
      - id: ART-003
        type: image
        src: assets/EXP-MODBUS-RTU-025/03-rs485-topology.png
        alt: Esquema RS-485 con maestro, esclavos, pareja A/B, común C, red de polarización y terminaciones.
        caption: El esquema identifica la topología y los elementos de terminación que deben contrastarse en campo.
        purpose: evidence
      - id: ART-004
        type: image
        src: assets/EXP-MODBUS-RTU-025/04-client-serial-settings.png
        alt: Ventana de configuración Modbus RTU del cliente con 19200 baud, 8 bits, paridad Even y 1 bit de parada.
        caption: Configuración serie visible del cliente; debe correlacionarse con la configuración del servidor.
        purpose: evidence
      - id: ART-005
        type: image
        src: assets/EXP-MODBUS-RTU-025/05-server-serial-settings.png
        alt: Panel de configuración Modbus RTU del servidor con 9600 baud, 8 bits, paridad Odd y 1 bit de parada.
        caption: Configuración serie visible del servidor; sus valores deben compararse con el proyecto y el cliente.
        purpose: evidence
      - id: ART-006
        type: image
        src: assets/EXP-MODBUS-RTU-025/06-recovery-verification.png
        alt: Traza de IO Ninja con peticiones y respuestas Modbus RTU repetidas y los parámetros serie visibles.
        caption: La traza muestra intercambios observables; la configuración visible debe correlacionarse antes de usarla como recuperación del caso.
        purpose: evidence
  completion:
    title: Debrief técnico
    summary: 'El timeout estaba causado por una discrepancia de paridad: el cliente esperaba Even y el servidor estaba en Odd. Se conservaron las evidencias, se compararon los parámetros, se alineó la paridad desde una condición autorizada y se verificaron respuestas Modbus RTU válidas y dato de proceso estable.'
    process:
      - Confirmar el timeout con el diagnóstico y la petición emitida.
      - Comparar documentación y parámetros del cliente y servidor.
      - Separar paridad de baud rate, dirección, cableado y dispositivo.
      - Alinear la paridad autorizada sin cambiar otros parámetros.
      - Repetir peticiones conocidas y verificar respuesta, latencia, contadores y proceso.
    lesson: En Modbus RTU, una petición transmitida no demuestra que exista comunicación válida. La paridad forma parte del formato de trama; una discrepancia puede impedir que el servidor o el cliente acepten la respuesta y terminar en timeout.
    avoided_errors:
      - Aumentar el timeout para ocultar la incompatibilidad.
      - Cambiar dirección o invertir A/B sin evidencia.
      - Sustituir hardware antes de comparar parámetros.
      - Cerrar al ver actividad LED sin validar tramas y proceso.
    industrial_value:
      - Diagnóstico serial trazable.
      - Menos sustituciones de gateways y dispositivos.
      - Recuperación repetible de enlaces RS-485 con equipos heterogéneos.
    media_ids:
      - ART-006
private:
  fault_model:
    root_cause: El cliente Modbus RTU espera paridad Even y el servidor está configurado con paridad Odd. La incompatibilidad de trama impide obtener una respuesta válida y el bloque cliente termina en timeout.
    recovery_conditions:
      - Paridad cliente y servidor alineada a Even según el diseño autorizado.
      - Baud rate, bits, parada, dirección y timeout conservan los valores verificados.
      - Respuestas válidas repetidas para una petición FC03 conocida.
      - Latencia, contadores de error y dato de proceso verificados en una prueba repetida.
  diagnostic_model:
    hypotheses:
      - id: HYP-PARITY
        statement: La paridad del cliente y del servidor es incompatible.
        initial_status: likely
      - id: HYP-BAUD
        statement: El baud rate o el formato de bits no coincide.
        initial_status: possible
      - id: HYP-ADDRESS
        statement: La dirección del servidor no coincide con la petición.
        initial_status: possible
      - id: HYP-WIRING
        statement: La pareja diferencial A/B o el blindaje tienen un problema físico.
        initial_status: possible
      - id: HYP-DEVICE
        statement: El gateway o el dispositivo de campo tiene un fallo local.
        initial_status: possible
    confirmed_root_cause: HYP-PARITY
    critical_path:
      - DEC-01-COMPARE-DIAGNOSTICS
      - DEC-02-COMPARE-BASELINE
      - DEC-03-COMPARE-PARITY
      - DEC-04-SET-EVEN
      - DEC-05-REPEAT-FC03
  decision_logic:
    - decision_id: DEC-01-COMPARE-DIAGNOSTICS
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: true
      rationale: La comparación o intervención conserva evidencia y actúa sobre la capa correcta.
      classification: strong
      consequence: Se obtiene la siguiente evidencia verificable.
      evidence_revealed:
        - EVID-02-TIMEOUT-DIAGNOSTIC
      next_stage: STAGE-02-VERIFY-BASELINE
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-01-RESTART-PLC
      stage_id: STAGE-01-CONFIRM-SCOPE
      is_correct: false
      rationale: La acción cambia una variable, elimina evidencia o sustituye hardware antes de demostrar la incompatibilidad.
      classification: weak
      consequence: Se introduce una variable sin demostrar la causa.
      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-BASELINE
      score_effect: -5
      safety_effect: 0
      retry_feedback: El PLC sigue en RUN. Conserva el timeout y delimita el diagnóstico antes de reiniciar.
