      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-MAP
      score_effect: -10
      safety_effect: -5
      retry_feedback: Un valor imposible no demuestra un offset incorrecto. Conserva la petición y confirma el estado de la respuesta.
    - decision_id: DEC-01-REPLACE-SENSOR
