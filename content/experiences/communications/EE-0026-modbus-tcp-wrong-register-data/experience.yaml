        src: assets/EXP-MODBUS-TCP-026/02-wrong-pressure.png
        alt: Captura de TIA Portal con MB_CLIENT conectado, registros 0x41C8 y 0x0000 y Pressure igual a 2.36E-41.
        caption: El transporte está activo, pero la magnitud REAL32 mostrada no coincide con la referencia de 25.0 bar.
        purpose: evidence
      - id: ART-003
        type: image
        src: assets/EXP-MODBUS-TCP-026/03-wireshark-fc03.png
        alt: Captura de Wireshark con una respuesta Modbus TCP FC03, byte count 4 y datos 41 C8 00 00.
        caption: La respuesta FC03 contiene cuatro bytes y no muestra una excepción Modbus.
        purpose: evidence
      - id: ART-004
        type: image
        src: assets/EXP-MODBUS-TCP-026/04-modscan-registers.png
        alt: Captura de ModScan64 con los registros 40001 igual a 0x41C8 y 40002 igual a 0x0000.
        caption: Los dos registros consecutivos recibidos conservan la palabra alta en 40001 y la baja en 40002.
        purpose: evidence
      - id: ART-005
        type: image
        src: assets/EXP-MODBUS-TCP-026/05-recovery-value.png
        alt: Captura de TIA Portal con los registros 0x41C8 y 0x0000 y Pressure igual a 25.0.
        caption: Tras corregir WORD_SWAP, el valor reconstruido coincide con la referencia conocida.
        purpose: evidence
  completion:
    title: Debrief técnico
    summary: El transporte Modbus TCP era válido; el valor era incorrecto porque el PLC intercambiaba las palabras alta y baja al reconstruir el REAL32. Se conservó el mapa, se desactivó WORD_SWAP y cinco lecturas consecutivas coincidieron con la referencia de 25.0 bar.
    process:
      - Confirmar respuesta normal y valor imposible.
      - Comparar el mapa de registros y el tipo REAL32.
      - Separar palabra alta, palabra baja, byte order y escala.
      - Corregir WORD_SWAP según la documentación.
      - Repetir lecturas y comparar con la referencia conocida.
    lesson: Una respuesta Modbus TCP sin excepción demuestra transporte y función, no que el PLC haya interpretado correctamente los registros. Un valor de 32 bits exige conservar el orden de palabras definido por el dispositivo.
    avoided_errors:
      - Cambiar la escala para que el número parezca correcto.
      - Desplazar el offset sin comprobar el mapa.
      - Leer una sola palabra de un REAL32.
      - Dar por válida la magnitud solo porque TCP está conectado.
    industrial_value:
      - Diagnóstico trazable de registros Modbus TCP.
      - Menos correcciones de escala y sustituciones innecesarias.
      - Conversión reproducible de valores de 32 bits entre equipos heterogéneos.
    media_ids:
      - ART-005
private:
  fault_model:
    root_cause: El bloque PLC reconstruye en orden bajo-alto un REAL32 que el dispositivo entrega en orden alto-bajo. La respuesta Modbus TCP es válida, pero 0x41C8 0x0000 termina como 0x000041C8 en lugar de 0x41C80000 = 25.0.
    recovery_conditions:
      - 40001 y 40002 se conservan como palabra alta y palabra baja según el mapa.
      - WORD_SWAP queda desactivado y la escala permanece en 1.0.
      - Cinco lecturas FC03 consecutivas reconstruyen 25.0 bar dentro de la tolerancia acordada.
      - Las respuestas siguen siendo normales y sin excepciones Modbus.
  diagnostic_model:
    hypotheses:
      - id: HYP-TRANSPORT
        statement: La conexión TCP o la respuesta FC03 no son válidas.
        initial_status: possible
      - id: HYP-MAP
        statement: El offset o el registro inicial no coincide con la documentación.
        initial_status: possible
      - id: HYP-SCALING
        statement: La escala o la unidad aplicada en el PLC son incorrectas.
        initial_status: possible
      - id: HYP-WORD-ORDER
        statement: Las palabras alta y baja están intercambiadas al reconstruir el REAL32.
        initial_status: likely
      - id: HYP-SENSOR
        statement: La medición del sensor es incorrecta aunque los registros sean válidos.
        initial_status: possible
    confirmed_root_cause: HYP-WORD-ORDER
    critical_path:
      - DEC-01-COMPARE-STATUS
      - DEC-02-COMPARE-MAP
      - DEC-03-DECODE-WORDS
      - DEC-04-SET-HIGH-FIRST
      - DEC-05-CHECK-REFERENCE
  decision_logic:
    - decision_id: DEC-01-COMPARE-STATUS
      stage_id: STAGE-01-CONFIRM-VALUE
      is_correct: true
      rationale: La comparación o intervención conserva la evidencia y actúa sobre la capa correcta.
      classification: strong
      consequence: Se obtiene la siguiente evidencia verificable.
      evidence_revealed:
        - EVID-02-VALID-RESPONSE
      next_stage: STAGE-02-VERIFY-MAP
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-01-CHANGE-SCALE
      stage_id: STAGE-01-CONFIRM-VALUE
      is_correct: false
      rationale: La acción cambia una variable o acepta el dato antes de separar comunicación, mapa y conversión.
      classification: unsafe
      consequence: Se introduce una variable sin demostrar el orden de palabra.
      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-MAP
      score_effect: -5
      safety_effect: 0
      retry_feedback: No ajustes la escala para ocultar un problema de interpretación. Primero confirma que la respuesta y el byte count son válidos.
    - decision_id: DEC-01-CHANGE-REGISTER
      stage_id: STAGE-01-CONFIRM-VALUE
      is_correct: false
