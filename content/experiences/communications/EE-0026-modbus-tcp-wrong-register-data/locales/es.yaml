locale: es
translations:
  title: Dato incorrecto en registros Modbus TCP
  summary: Diagnostica un valor Modbus TCP incorrecto separando transporte, mapa de registros, orden de palabra y conversión REAL32 antes de verificar una referencia conocida.
  scenario:
    initial_context: Un PLC recibe respuestas Modbus TCP normales, pero la HMI muestra una magnitud imposible para el proceso.
    operational_state: El PLC permanece en RUN y la conexión TCP está establecida. La petición FC03 devuelve dos registros consecutivos, pero el valor REAL32 mostrado no coincide con la referencia del proceso.
    initiating_event: La HMI muestra 2.35e-41 bar mientras el operador dispone de una referencia de aproximadamente 25.0 bar. No se debe cambiar la escala ni el dispositivo hasta separar comunicación, mapa y reconstrucción.
    learner_role: Técnico de automatización responsable de demostrar si el dato está mal recibido, mal direccionado o mal interpretado antes de modificar el bloque PLC.
    safety_context:
      safe_state: Realiza cambios en el bloque de conversión desde una condición segura y siguiendo el procedimiento de mantenimiento o puesta en marcha autorizado.
      intervention_constraints:
        - No cambiar la escala para ocultar una conversión incorrecta.
        - No desplazar el offset ni sustituir el sensor antes de verificar el mapa.
        - No aceptar una conexión TCP como prueba de que el valor tiene significado.
        - Verificar lecturas repetidas contra una referencia conocida después de corregir el orden de palabra.
  learning_objectives:
    OBJ-MODBUS-TCP-SCOPE:
      description: Distinguir una respuesta Modbus TCP válida de una interpretación incorrecta del dato.
    OBJ-MODBUS-TCP-MAP:
      description: Comparar offset, registros consecutivos, tipo REAL32 y orden de palabra con el mapa del dispositivo.
    OBJ-MODBUS-TCP-RECOVERY:
      description: Corregir el orden de palabra y verificar el valor reconstruido contra una referencia conocida.
  stages:
    STAGE-01-CONFIRM-VALUE:
      title: Confirmar el valor
      situation: El PLC está en RUN y la conexión Modbus TCP responde, pero la HMI muestra un valor de proceso imposible. ¿Qué comprobación delimita primero el problema sin tocar la escala ni el mapa?
    STAGE-02-VERIFY-MAP:
      title: Verificar el mapa
      situation: La respuesta llega sin excepción. La documentación define dos holding registers consecutivos para un REAL32. ¿Qué comparación debe hacerse antes de cambiar el programa?
    STAGE-03-DECODE-WORDS:
      title: Decodificar las palabras
      situation: El mapa confirma que 40001 es la palabra alta y 40002 la palabra baja. La respuesta contiene 0x41C8 y 0x0000. ¿Qué análisis demuestra por qué el PLC no muestra 25.0 bar?
    STAGE-04-CORRECT-WORD-ORDER:
      title: Corregir el orden de palabra
      situation: El bloque de conversión reconstruye 0x000041C8 porque tiene activado el intercambio de palabras. ¿Qué intervención corrige la interpretación sin alterar el offset ni la escala?
    STAGE-05-VERIFY-REFERENCE:
      title: Verificar la referencia
      situation: El PLC ya reconstruye 0x41C80000. ¿Qué prueba demuestra que el dato Modbus TCP y la magnitud de proceso han quedado alineados?
  evidence:
    EVID-01-INCIDENT:
      source: HMI y operador
      content: El PLC permanece en RUN y el estado Modbus TCP es conectado, pero la HMI muestra 2.35e-41 bar cuando la referencia local del proceso es aproximadamente 25.0 bar.
    EVID-02-VALID-RESPONSE:
      source: Cliente Modbus TCP y diagnóstico PLC
      content: La petición FC03 recibe una respuesta normal, con byte count 04 y sin excepción Modbus. La comunicación y el transporte están activos; el problema está después de recibir los registros.
    EVID-03-REGISTER-MAP:
      source: Mapa de registros del dispositivo
      content: Holding registers 40001 y 40002 forman un REAL32 en orden de palabra alto-bajo. 40001 contiene la palabra alta, 40002 la palabra baja y la escala es 1.0 bar por unidad.
    EVID-04-RAW-WORDS:
      source: Respuesta Modbus TCP y tabla de observación PLC
      content: La respuesta devuelve 0x41C8 en 40001 y 0x0000 en 40002. El bloque PLC los coloca como 0x0000 0x41C8 y genera 0x000041C8, una interpretación distinta de 0x41C80000 = 25.0.
    EVID-05-CONVERSION-BLOCK:
      source: Bloque de conversión PLC
      content: El bloque conserva el byte order documentado, pero tiene WORD_SWAP habilitado; la escala y el offset no están modificados.
    EVID-06-RECOVERY:
      source: Lecturas repetidas y referencia calibrada
      content: Cinco lecturas FC03 consecutivas reconstruyen 0x41C80000 y muestran 25.0 bar dentro de la tolerancia acordada, con respuesta normal y sin excepción.
  decisions:
    DEC-01-COMPARE-STATUS:
      action: Comparar estado, función, byte count y valor antes de intervenir.
    DEC-01-CHANGE-SCALE:
      action: Cambiar la escala hasta que la HMI parezca mostrar 25.0 bar.
    DEC-01-CHANGE-REGISTER:
      action: Cambiar el registro inicial porque el valor mostrado es imposible.
    DEC-01-REPLACE-SENSOR:
      action: Sustituir el sensor porque la magnitud no coincide con la referencia.
    DEC-02-CHANGE-ENDIAN:
      action: Cambiar el endianness del bloque sin leer el mapa del dispositivo.
    DEC-02-COMPARE-MAP:
      action: Comparar mapa, REAL32 y orden de palabra.
    DEC-02-ADJUST-OFFSET:
      action: Desplazar el offset un registro para buscar otro valor.
    DEC-02-REPLACE-PLC:
      action: Reemplazar la CPU porque la respuesta numérica parece incorrecta.
    DEC-03-CHECK-SCALING:
      action: Multiplicar o dividir el valor hasta aproximarlo a 25.0.
    DEC-03-READ-ONE-REG:
      action: Leer solo 40001 y descartar la segunda palabra.
    DEC-03-DECODE-WORDS:
      action: Decodificar ambas palabras en el orden documentado.
    DEC-03-RESTART-DEVICE:
      action: Reiniciar el servidor Modbus TCP para repetir la misma lectura.
    DEC-04-SWAP-BYTES:
      action: Intercambiar bytes dentro de cada registro aunque el mapa no lo indique.
    DEC-04-CHANGE-SCALE:
      action: Cambiar la escala y mantener el intercambio de palabras.
    DEC-04-SET-LOW-FIRST:
      action: Configurar la palabra baja como primera palabra porque así aparece en el bloque actual.
    DEC-04-SET-HIGH-FIRST:
      action: Desactivar WORD_SWAP y conservar 40001 como palabra alta.
    DEC-05-CHECK-REFERENCE:
      action: Repetir FC03 y comparar el valor con la referencia de 25.0 bar.
    DEC-05-CLEAR-RAW:
      action: Borrar la tabla de observación sin verificar el valor reconstruido.
    DEC-05-ACCEPT-VALUE:
      action: Aceptar el valor porque la comunicación TCP aparece conectada.
  retry_feedback:
    DEC-01-CHANGE-SCALE: No ajustes la escala para ocultar un problema de interpretación. Primero confirma que la respuesta y el byte count son válidos.
    DEC-01-CHANGE-REGISTER: Un valor imposible no demuestra un offset incorrecto. Conserva la petición y confirma el estado de la respuesta.
    DEC-01-REPLACE-SENSOR: La comunicación está activa y el valor aún no prueba un fallo del sensor. Separa transporte e interpretación.
    DEC-02-CHANGE-ENDIAN: El endianness debe salir del mapa del fabricante, no de una prueba al azar.
    DEC-02-ADJUST-OFFSET: Cambiar el offset introduce otra variable. Confirma primero los dos registros definidos para el REAL32.
    DEC-02-REPLACE-PLC: La respuesta normal no justifica cambiar la CPU. Inspecciona el mapa y la conversión.
    DEC-03-CHECK-SCALING: La escala no corrige una palabra alta y baja invertidas. Decodifica primero el par de registros.
    DEC-03-READ-ONE-REG: Un REAL32 necesita las dos palabras. Leer solo una elimina parte del dato.
    DEC-03-RESTART-DEVICE: Reiniciar no cambia cómo el PLC reconstruye los registros. Conserva la evidencia de la respuesta.
    DEC-04-SWAP-BYTES: El problema descrito es el orden de palabras, no el orden de bytes dentro de cada registro.
    DEC-04-CHANGE-SCALE: La escala documentada es 1.0. Cambiarla ocultaría el error de reconstrucción.
    DEC-04-SET-LOW-FIRST: La documentación define 40001 como palabra alta. Mantener LOW_FIRST conserva la causa.
    DEC-05-CLEAR-RAW: Borrar la observación no demuestra que la magnitud sea correcta ni que se repita.
    DEC-05-ACCEPT-VALUE: Una conexión TCP activa no valida el significado del dato. Repite la lectura y compara con la referencia.
  visual:
    educational_purpose: Revelar progresivamente la respuesta Modbus TCP, el mapa de registros, las dos palabras de 16 bits, la conversión REAL32 y la verificación contra una referencia conocida.
  completion:
    title: Debrief técnico
    summary: El transporte Modbus TCP era válido; el valor era incorrecto porque el PLC intercambiaba las palabras alta y baja al reconstruir el REAL32. Se conservó el mapa, se desactivó WORD_SWAP y cinco lecturas consecutivas coincidieron con la referencia de 25.0 bar.
    process:
      - Confirmar respuesta normal y valor imposible.
      - Comparar el mapa de registros y el tipo REAL32.
      - Separar palabra alta, palabra baja, byte order y escala.
      - Corregir WORD_SWAP según la documentación.
      - Repetir lecturas y comparar con la referencia conocida.
    lesson: Una respuesta Modbus TCP sin excepción demuestra transporte y función, no que el PLC haya interpretado correctamente los registros. Un valor de 32 bits exige conservar el orden de palabras definido por el dispositivo.
    avoided_errors:
      - Cambiar la escala para que el número parezca correcto.
      - Desplazar el offset sin comprobar el mapa.
      - Leer una sola palabra de un REAL32.
      - Dar por válida la magnitud solo porque TCP está conectado.
    industrial_value:
      - Diagnóstico trazable de registros Modbus TCP.
      - Menos correcciones de escala y sustituciones innecesarias.
      - Conversión reproducible de valores de 32 bits entre equipos heterogéneos.
  assets:
    ART-001:
      alt: Fotografía de una instalación industrial con un PLC Siemens S7-1500 y cableado de comunicación conectado.
      caption: La instalación aporta el contexto físico del caso antes de analizar la respuesta Modbus TCP.
    ART-002:
      alt: Captura de TIA Portal con MB_CLIENT conectado, registros 0x41C8 y 0x0000 y Pressure igual a 2.36E-41.
      caption: El transporte está activo, pero la magnitud REAL32 mostrada no coincide con la referencia de 25.0 bar.
    ART-003:
      alt: Captura de Wireshark con una respuesta Modbus TCP FC03, byte count 4 y datos 41 C8 00 00.
      caption: La respuesta FC03 contiene cuatro bytes y no muestra una excepción Modbus.
    ART-004:
      alt: Captura de ModScan64 con los registros 40001 igual a 0x41C8 y 40002 igual a 0x0000.
      caption: Los dos registros consecutivos recibidos conservan la palabra alta en 40001 y la baja en 40002.
    ART-005:
      alt: Captura de TIA Portal con los registros 0x41C8 y 0x0000 y Pressure igual a 25.0.
      caption: Tras corregir WORD_SWAP, el valor reconstruido coincide con la referencia conocida.
