        alt: Vista estilo TwinCAT de la asignación PDO activa en el esclavo EtherCAT.
        caption: 'Asignación configurada: la comparación con el proyecto permite localizar la incompatibilidad de proceso.'
        purpose: evidence
      - id: ART-005
        type: image
        src: assets/EXP-ETHERCAT-SLAVE-027/05-master-diagnostic.png
        alt: Vista estilo TwinCAT del diagnóstico del maestro EtherCAT durante la transición del esclavo.
        caption: 'Diagnóstico del maestro: conserva el contexto del evento mientras el enlace físico permanece disponible.'
        purpose: evidence
      - id: ART-006
        type: image
        src: assets/EXP-ETHERCAT-SLAVE-027/06-recovery.png
        alt: Vista estilo TwinCAT de un esclavo EtherCAT recuperado en OP con intercambio cíclico.
        caption: 'Recuperación: la aceptación exige OP y datos cíclicos válidos repetidos.'
        purpose: evidence
  completion:
    title: Debrief técnico
    summary: El esclavo EtherCAT estaba detectado y el enlace físico era válido, pero no alcanzaba OP porque su PDO mapping no coincidía con la configuración esperada. Se restauró la asignación RxPDO/TxPDO compatible y se verificó el intercambio cíclico.
    process:
      - Confirmar el estado AL y la ausencia de datos cíclicos válidos.
      - Separar enlace físico, diagnóstico del maestro y configuración de proceso.
      - Comparar índices, orden y longitud del RxPDO/TxPDO.
      - Restaurar la asignación compatible desde una condición autorizada.
      - Verificar OP y datos cíclicos repetidos.
    lesson: Un esclavo visible en EtherCAT no implica que esté operativo. La transición hasta OP depende de que el estado, el diagnóstico y el PDO mapping sean compatibles con el proyecto del maestro.
    avoided_errors:
      - Forzar OP para ocultar el error de configuración.
      - Sustituir el cable o el esclavo sin leer el diagnóstico.
      - Ignorar la longitud de los PDO.
      - Cerrar el caso en SAFEOP sin validar datos cíclicos.
    industrial_value:
      - Diagnóstico trazable de estados EtherCAT.
      - Menos sustituciones innecesarias de esclavos y cableado.
      - Configuración reproducible de datos cíclicos entre maestro y dispositivos.
    media_ids: ["ART-006"]
private:
  fault_model:
    root_cause: El PDO mapping activo del esclavo EtherCAT no coincide con el mapping esperado por el maestro. El enlace y la detección son válidos, pero la incompatibilidad de índices o longitud provoca el rechazo de la transición PREOP → SAFEOP y deja el esclavo en PREOP + Error.
    recovery_conditions:
      - RxPDO y TxPDO conservan los índices, orden y longitudes compatibles con el proyecto.
      - El maestro y el esclavo completan la transición hasta OP.
      - Los datos cíclicos se actualizan de forma válida en lecturas repetidas.
      - No reaparece el diagnóstico de incompatibilidad PDO/Sync Manager.
  diagnostic_model:
    hypotheses:
      - id: HYP-PHYSICAL
        statement: El enlace EtherCAT o la alimentación del esclavo tienen un fallo físico.
        initial_status: possible
      - id: HYP-PDO
        statement: El PDO mapping esperado y configurado no coincide.
        initial_status: likely
      - id: HYP-SLAVE-CONFIG
        statement: La identidad o configuración del esclavo no coincide con el proyecto.
        initial_status: possible
      - id: HYP-SYNC
        statement: La sincronización o el ciclo impiden completar la transición de estado.
        initial_status: possible
    confirmed_root_cause: HYP-PDO
    critical_path:
      - DEC-01-CHECK-AL-STATE
      - DEC-02-READ-MASTER-DIAGNOSTIC
      - DEC-03-COMPARE-PDO
      - DEC-04-RESTORE-PDO
      - DEC-05-VERIFY-OP
  decision_logic:
    - decision_id: DEC-01-CHECK-AL-STATE
      stage_id: STAGE-01-CONFIRM-STATE
      is_correct: true
      rationale: La comprobación conserva la evidencia y actúa sobre la capa EtherCAT correcta.
      classification: strong
      consequence: Se obtiene la siguiente evidencia verificable.
      evidence_revealed:
        - EVID-02-AL-DIAGNOSTIC
      next_stage: STAGE-02-VERIFY-DIAGNOSTICS
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-01-RESTART-SLAVE
      stage_id: STAGE-01-CONFIRM-STATE
      is_correct: false
      rationale: La acción cambia una variable o acepta un estado antes de separar enlace, diagnóstico y configuración PDO.
      classification: weak
      consequence: Se introduce una variable sin demostrar la causa del estado no operativo.
      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-DIAGNOSTICS
      score_effect: -5
      safety_effect: 0
      retry_feedback: Reiniciar elimina una condición observable. Conserva primero el estado AL y el diagnóstico del maestro.
    - decision_id: DEC-01-REPLACE-CABLE
      stage_id: STAGE-01-CONFIRM-STATE
      is_correct: false
      rationale: La acción cambia una variable o acepta un estado antes de separar enlace, diagnóstico y configuración PDO.
      classification: weak
      consequence: Se introduce una variable sin demostrar la causa del estado no operativo.
      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-DIAGNOSTICS
      score_effect: -10
      safety_effect: -5
      retry_feedback: El enlace está detectado. No sustituyas el cable sin comprobar la transición de estado y el diagnóstico.
    - decision_id: DEC-01-FORCE-OP
      stage_id: STAGE-01-CONFIRM-STATE
      is_correct: false
      rationale: La acción cambia una variable o acepta un estado antes de separar enlace, diagnóstico y configuración PDO.
      classification: unsafe
      consequence: Se introduce una variable sin demostrar la causa del estado no operativo.
      evidence_revealed: []
      next_stage: STAGE-02-VERIFY-DIAGNOSTICS
      score_effect: -5
      safety_effect: -5
      retry_feedback: Forzar OP oculta la causa y puede dejar datos cíclicos no validados.
    - decision_id: DEC-02-REPLACE-SLAVE
      stage_id: STAGE-02-VERIFY-DIAGNOSTICS
