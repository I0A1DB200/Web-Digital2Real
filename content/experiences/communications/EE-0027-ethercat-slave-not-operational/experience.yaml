    - decision_id: DEC-04-CHANGE-CYCLE
      stage_id: STAGE-04-RESTORE-CONFIGURATION
      is_correct: false
      rationale: La acción cambia una variable o acepta un estado antes de separar enlace, diagnóstico y configuración PDO.
      classification: weak
      consequence: Se introduce una variable sin demostrar la causa del estado no operativo.
      evidence_revealed: []
