locale: es
translations:
  title: Dispositivo BACnet no descubierto
  summary: Diagnostica una alarma de descubrimiento BACnet/IP entre subredes separando disponibilidad del controlador, direccionamiento y distribución de broadcast antes de restaurar el mecanismo compatible.
  scenario:
    initial_context: El BMS no descubre un controlador BACnet/IP situado en otra subred IP.
    operational_state: El controlador tiene alimentación y enlace IP local, y el BMS y el controlador están en subredes enrutadas distintas; sin embargo, el descubrimiento BACnet por broadcast no se distribuye entre ellas y el controlador remoto no aparece en la lista local.
    initiating_event: Un escaneo Who-Is del BMS no recibe un I-Am del controlador remoto. Antes de cambiar la IP, la instancia del dispositivo, el cable o el controlador hay que comparar IP, máscara, enrutamiento, tráfico Who-Is/I-Am y la configuración BBMD o Foreign Device cuando corresponda.
    learner_role: Técnico de automatización responsable de distinguir disponibilidad del controlador, direccionamiento y descubrimiento BACnet entre subredes.
    safety_context:
      safe_state: Realiza cambios de red desde una condición segura y bajo el procedimiento autorizado de mantenimiento o puesta en marcha.
      intervention_constraints:
        - No cambiar la IP o la instancia del dispositivo por el mero hecho de que no aparezca en el descubrimiento.
        - No desactivar globalmente el firewall ni las protecciones de red para hacer visible un dispositivo.
        - No afirmar que el controlador está fuera de servicio sin comprobar alimentación, enlace, direccionamiento y tráfico.
        - Aplicar solo el mecanismo BACnet entre subredes compatible con la arquitectura y verificar después una propiedad conocida.
  learning_objectives:
    OBJ-BACNET-DISCOVERY:
      description: Distinguir un controlador apagado o mal direccionado de un problema de descubrimiento BACnet entre subredes.
    OBJ-BACNET-EVIDENCE:
      description: Comparar IP, máscara, enrutamiento, solicitudes Who-Is, respuestas I-Am y configuración BBMD o Foreign Device.
    OBJ-BACNET-RECOVERY:
      description: Restaurar un mecanismo de descubrimiento BACnet compatible y verificar el dispositivo y una propiedad conocida.
  stages:
    STAGE-01-CONFIRM-DISCOVERY:
      title: Confirmar el descubrimiento
      situation: El BMS no lista el controlador remoto. ¿Qué comprobación delimita primero el incidente sin declarar que el controlador está fuera de servicio?
    STAGE-02-CHECK-ADDRESSING:
      title: Comprobar el direccionamiento
      situation: El diagnóstico inicial no demuestra que el controlador esté apagado. ¿Qué lectura debe hacerse antes de modificar su identidad?
    STAGE-03-CORRELATE-DISCOVERY:
      title: Correlacionar el descubrimiento
      situation: Las direcciones locales son válidas, pero el BMS y el controlador están en subredes distintas. ¿Qué comparación identifica el límite real del descubrimiento?
    STAGE-04-RESTORE-DISCOVERY:
      title: Restaurar el descubrimiento
      situation: El controlador tiene enlace local, el BMS emite Who-Is y no aparece un I-Am remoto porque el broadcast BACnet no se distribuye. ¿Qué intervención corrige la causa?
    STAGE-05-VERIFY-PROPERTY:
      title: Verificar dispositivo y propiedad
      situation: El mecanismo de descubrimiento se ha restaurado bajo el procedimiento autorizado. ¿Qué prueba confirma la recuperación?
  evidence:
    EVID-01-INCIDENT:
      source: Diagnóstico de descubrimiento del BMS y operador
      content: El escaneo del BMS no lista el controlador BACnet/IP de otra subred; el BMS sigue operativo y se observa actividad BACnet local, pero este resultado no basta para declarar el controlador fuera de servicio.
      media_ids: []
    EVID-02-IP-ADDRESSING:
      source: Configuración de red del BMS y del controlador
      content: El BMS y el controlador tienen una dirección IP y una máscara válidas para sus respectivas subredes, sin indicio de identidad duplicada; los valores deben inspeccionarse antes de reemplazarlos por el síntoma de no descubrimiento.
      media_ids: []
    EVID-03-SUBNET-ROUTING:
      source: Topología IP y configuración de enrutamiento
      content: El BMS y el controlador están en subredes IP distintas con una ruta entre ellas; el enrutamiento IP por sí solo no distribuye automáticamente el broadcast de descubrimiento BACnet.
      media_ids: []
    EVID-04-WHOIS-TRAFFIC:
      source: Captura de tráfico BACnet/IP
      content: El BMS emite solicitudes Who-Is dentro de su ámbito de descubrimiento, pero en la captura no aparece un I-Am del controlador remoto; esta ausencia no demuestra que el controlador esté apagado.
      media_ids: []
    EVID-05-BBMD-CONFIG:
      source: Configuración de descubrimiento BACnet/IP
      content: No hay una distribución BBMD compatible ni un registro Foreign Device configurado para el descubrimiento entre subredes; el mecanismo exacto depende de la arquitectura aprobada.
      media_ids: []
    EVID-06-RECOVERY:
      source: Descubrimiento del BMS y lectura de una propiedad conocida
      content: Después de restaurar el mecanismo compatible, el BMS descubre el controlador remoto y lee correctamente una propiedad conocida; la lectura y su calidad se repiten según el procedimiento.
      media_ids: []
  decisions:
    DEC-01-RESTART-BMS:
      action: Reiniciar el BMS para repetir el escaneo sin conservar el contexto del incidente.
    DEC-01-READ-DISCOVERY:
      action: Leer el diagnóstico y la actividad BACnet local antes de intervenir.
    DEC-01-CHANGE-INSTANCE:
      action: Cambiar la instancia del dispositivo porque no aparece en la lista.
    DEC-01-REPLACE-CONTROLLER:
      action: Sustituir el controlador sin comprobar su enlace y su direccionamiento.
    DEC-02-CHANGE-IP:
      action: Cambiar la IP del controlador antes de leer la configuración de ambas subredes.
    DEC-02-REPLACE-CABLE:
      action: Sustituir el cable porque el descubrimiento remoto no muestra el controlador.
    DEC-02-READ-IP-SUBNET:
      action: Leer y comparar la IP, la máscara y la subred local del BMS y del controlador.
    DEC-02-DISABLE-FIREWALL:
      action: Desactivar globalmente el firewall para que el escaneo pueda alcanzar el controlador.
    DEC-03-COMPARE-DISCOVERY:
      action: Comparar subredes, tráfico Who-Is/I-Am y configuración de descubrimiento.
    DEC-03-ADD-STATIC-ROUTE:
      action: Añadir una ruta estática sin comprobar el mecanismo BACnet de distribución de broadcast.
    DEC-03-CHANGE-INSTANCE:
      action: Cambiar la instancia BACnet antes de explicar la ausencia de I-Am remoto.
    DEC-03-STOP-CONTROLLER:
      action: Detener el controlador para simplificar la captura y perder la evidencia de su enlace local.
    DEC-04-CHANGE-CONTROLLER-IP:
      action: Cambiar el controlador a la subred del BMS sin validar la arquitectura de red autorizada.
    DEC-04-BYPASS-SECURITY:
      action: Bypassear las protecciones de red para forzar la visibilidad del dispositivo.
    DEC-04-POLL-REPEATEDLY:
      action: Repetir el escaneo sin cambiar la distribución BACnet entre subredes.
    DEC-04-RESTORE-BACNET-DISCOVERY:
      action: Restaurar el BBMD o Foreign Device autorizado entre subredes.
    DEC-05-CLEAR-ALARM:
      action: Borrar la alarma y cerrar el caso sin comprobar el dispositivo remoto ni sus datos.
    DEC-05-VERIFY-DISCOVERY:
      action: Confirmar el descubrimiento del controlador y leer una propiedad conocida con calidad válida en lecturas repetidas.
    DEC-05-ACCEPT-CACHED-DEVICE:
      action: Aceptar una entrada en caché como recuperación aunque el descubrimiento actual siga sin respuesta.
  retry_feedback:
    DEC-01-RESTART-BMS: Conserva el diagnóstico y la actividad local antes de repetir el escaneo.
    DEC-01-CHANGE-INSTANCE: Conserva la identidad y comprueba primero la ruta de descubrimiento.
    DEC-01-REPLACE-CONTROLLER: Comprueba alimentación, enlace y direccionamiento antes de sustituir el controlador.
    DEC-02-CHANGE-IP: Lee y documenta ambas direcciones y máscaras antes de modificarlas.
    DEC-02-REPLACE-CABLE: Conserva el cableado y lee primero IP, máscara y subred.
    DEC-02-DISABLE-FIREWALL: No desactives el firewall; compara el direccionamiento y el mecanismo BACnet autorizado.
    DEC-03-ADD-STATIC-ROUTE: Compara Who-Is/I-Am y BBMD o Foreign Device antes de cambiar rutas.
    DEC-03-CHANGE-INSTANCE: Conserva la instancia y verifica la distribución de descubrimiento entre subredes.
    DEC-03-STOP-CONTROLLER: Mantén el controlador disponible y correlaciona el tráfico observado.
    DEC-04-CHANGE-CONTROLLER-IP: Mantén el direccionamiento aprobado y restaura la distribución BACnet prevista.
    DEC-04-BYPASS-SECURITY: Aplica una configuración BACnet autorizada; no desactives protecciones globales.
    DEC-04-POLL-REPEATEDLY: Restaura primero el mecanismo entre subredes y después repite el descubrimiento.
    DEC-05-CLEAR-ALARM: Verifica el descubrimiento actual y una propiedad conocida antes de cerrar la alarma.
    DEC-05-ACCEPT-CACHED-DEVICE: Comprueba el descubrimiento actual y lee una propiedad con calidad válida.
  visual:
    educational_purpose: Revelar progresivamente el incidente del BMS, el direccionamiento, el límite de subred, la ausencia de I-Am, la configuración de descubrimiento y la recuperación verificable.
  assets:
    ART-001:
      alt: Exploración BACnet/IP del BMS donde el controlador remoto no aparece y se conserva actividad local.
      caption: 'Incidente: el BMS muestra dispositivos locales, pero no descubre el controlador remoto de instancia 3001.'
    ART-002:
      alt: Configuración BACnet/IP del controlador con dirección IP, máscara, gateway e instancia del dispositivo.
      caption: 'Direccionamiento: la vista separa la subred del controlador de la subred del BMS.'
    ART-003:
      alt: Diagrama didáctico con dos subredes IP, router L3, dos BBMD y un controlador BACnet/IP.
      caption: 'Topología: existe una ruta IP entre subredes, pero el descubrimiento BACnet necesita distribución compatible.'
    ART-004:
      alt: Captura BACnet/IP con solicitudes Who-Is del BMS y respuestas I-Am locales sin respuesta del controlador remoto.
      caption: 'Tráfico: el Who-Is está presente y la ausencia del I-Am remoto delimita el ámbito observado.'
    ART-005:
      alt: Configuración BBMD con el servicio habilitado y la tabla de distribución sin la entrada remota.
      caption: 'BBMD: la distribución está habilitada, pero la tabla no contiene el BBMD de la otra subred.'
    ART-006:
      alt: Captura de recuperación con I-Am del dispositivo 3001 y lectura ReadProperty de Object_Name.
      caption: 'Recuperación: aparece el I-Am remoto y una lectura ReadProperty/ComplexACK confirma la propiedad conocida.'
  completion:
    title: Debrief técnico
    summary: El controlador BACnet/IP estaba disponible en su subred, pero el descubrimiento por broadcast no cruzaba la frontera IP porque no había un mecanismo BBMD o Foreign Device compatible configurado. Tras restaurarlo, el BMS descubrió el controlador y leyó una propiedad conocida.
    process:
      - Conservar el diagnóstico de descubrimiento y comprobar la actividad local antes de declarar el controlador fuera de servicio.
      - Leer y comparar IP, máscara y subred del BMS y del controlador.
      - Correlacionar la ruta IP con Who-Is, I-Am y la configuración BBMD o Foreign Device.
      - Restaurar el mecanismo BACnet entre subredes aprobado para la arquitectura.
      - Verificar el descubrimiento actual y una lectura de propiedad conocida con calidad válida.
    lesson: Una ruta IP entre subredes no distribuye por sí sola el broadcast de descubrimiento BACnet. La disponibilidad del controlador y la validez de sus direcciones deben separarse de la configuración BBMD o Foreign Device antes de cambiar su identidad.
    avoided_errors:
      - Declarar el controlador apagado solo porque no aparece en una lista remota.
      - Cambiar IP o instancia sin comparar las subredes y el tráfico observado.
      - Confundir enrutamiento IP con distribución automática de broadcast BACnet.
      - Desactivar protecciones de red para ocultar una configuración incompleta.
      - Cerrar el caso sin descubrir de nuevo el controlador y leer una propiedad.
    industrial_value:
      - Diagnóstico trazable de descubrimiento BACnet/IP.
      - Menos sustituciones innecesarias de controladores y cableado.
      - Recuperación reproducible de la visibilidad entre subredes.
    media_ids: []
