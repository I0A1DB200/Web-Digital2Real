classification:
  platform: OPC UA client / information model
  domain: OPC UA sessions, subscriptions and monitored items
  industry: Manufacturing
  machine_type: Automated diagnostic cell
  difficulty: advanced
capability_references:
  - capability_id: ICF-02
    competency_ids:
      - COMP-IIO-SIGNAL-TRACEABILITY
      - COMP-IIO-STATE-INTERPRETATION
      - COMP-IIO-CONTROLLED-RECOVERY
public:
  slug: opcua-data-not-updating
  title: Datos OPC UA sin actualizar
  summary: Diagnostica un cliente OPC UA conectado cuyo valor monitorizado no cambia separando sesión, suscripción, monitored item, configuración de muestreo/publicación, calidad y timestamps antes de corregir la monitorización.
  estimated_duration: 30
  scenario:
    initial_context: Un cliente OPC UA mantiene la conexión con el servidor, pero una variable de proceso monitorizada no se actualiza como espera el operador.
    operational_state: La sesión OPC UA aparece conectada y el cliente conserva el nodo monitorizado, pero las notificaciones de cambio no llegan con el comportamiento esperado; la causa puede estar en la suscripción o en el monitored item aunque el servidor siga accesible.
    initiating_event: La pantalla del cliente conserva un valor antiguo mientras la operación espera datos actuales. Antes de reiniciar la sesión, cambiar el endpoint o forzar la variable hay que comprobar el estado de sesión, suscripción, monitored item, muestreo/publicación, calidad y timestamps.
    learner_role: Técnico de automatización responsable de separar conectividad OPC UA, comportamiento de suscripción y calidad de datos antes de intervenir en el servidor o en la variable.
    safety_context:
      safe_state: Realiza cambios de configuración desde una condición segura y bajo el procedimiento autorizado de mantenimiento o puesta en marcha.
      intervention_constraints:
        - No reiniciar repetidamente la sesión para ocultar una configuración de monitorización incorrecta.
        - No escribir ni forzar el valor de proceso para demostrar una notificación.
        - No aceptar un valor con calidad o timestamp no válidos como dato actual.
        - Corregir solo la configuración verificada y confirmar cambios reales con calidad y timestamps coherentes.
  learning_objectives:
    - id: OBJ-OPCUA-BOUNDARY
      description: Diferenciar una sesión OPC UA conectada de una suscripción que no entrega cambios de datos.
      capability_id: ICF-02
      competency_id: COMP-IIO-STATE-INTERPRETATION
    - id: OBJ-OPCUA-TRACEABILITY
      description: Correlacionar suscripción, monitored item, muestreo, publicación, calidad y timestamps con el valor de origen.
      capability_id: ICF-02
      competency_id: COMP-IIO-SIGNAL-TRACEABILITY
    - id: OBJ-OPCUA-RECOVERY
      description: Corregir la configuración de monitorización y verificar cambios reales con calidad y timestamps coherentes.
      capability_id: ICF-02
      competency_id: COMP-IIO-CONTROLLED-RECOVERY
  stages:
    - id: STAGE-01-CONFIRM-SESSION
      phase: incident
      title: Confirmar la sesión
      situation: El cliente conserva un valor antiguo. ¿Qué comprobación delimita primero la conectividad sin reiniciar ni escribir en el proceso?
      evidence_ids:
        - EVID-01-SESSION-STATUS
      decision_ids:
        - DEC-01-RESTART-CLIENT
        - DEC-01-READ-SESSION
        - DEC-01-RECREATE-NODE
        - DEC-01-RESTART-SERVER
    - id: STAGE-02-CHECK-SUBSCRIPTION
      phase: investigation
      title: Comprobar la suscripción
      situation: La sesión está establecida, pero el valor sigue sin actualizarse. ¿Qué lectura separa la suscripción del estado general de conexión?
      evidence_ids:
        - EVID-02-SUBSCRIPTION-STATUS
      decision_ids:
        - DEC-02-CHANGE-ENDPOINT
        - DEC-02-CLEAR-SUBSCRIPTION
        - DEC-02-READ-SUBSCRIPTION
        - DEC-02-CHANGE-SECURITY
    - id: STAGE-03-CHECK-MONITORED-ITEM
      phase: investigation
      title: Revisar el monitored item
      situation: La suscripción existe, pero la notificación esperada no llega. ¿Qué comparación comprueba el objeto monitorizado y sus parámetros de muestreo/publicación?
      evidence_ids:
        - EVID-03-MONITORED-ITEM
        - EVID-04-SAMPLING-PUBLISHING
      decision_ids:
        - DEC-03-COMPARE-MONITORING
        - DEC-03-INCREASE-POLLING
        - DEC-03-RECREATE-NODE
        - DEC-03-FORCE-SOURCE
    - id: STAGE-04-CORRELATE-QUALITY
      phase: investigation
      title: Correlacionar calidad y tiempo
      situation: El objeto está creado y los parámetros son visibles. ¿Qué correlación distingue un valor válido actual de un valor antiguo o de mala calidad?
      evidence_ids:
        - EVID-05-DATA-QUALITY
        - EVID-06-SOURCE-TIMESTAMPS
      decision_ids:
        - DEC-04-IGNORE-QUALITY
        - DEC-04-ALTER-SOURCE
        - DEC-04-ACCEPT-STALE
        - DEC-04-CORRELATE-VALUE
    - id: STAGE-05-RESTORE-AND-VERIFY
      phase: solution
      title: Restaurar y verificar
      situation: La causa está localizada en la configuración de monitorización. ¿Qué acción corrige el problema y demuestra que el cliente recibe datos actuales?
      evidence_ids: []
      decision_ids:
        - DEC-05-CLEAR-ALARM
        - DEC-05-CORRECT-AND-VERIFY
        - DEC-05-ACCEPT-CACHED-VALUE
  evidence:
    - id: EVID-01-SESSION-STATUS
      type: initial_observation
      source: Estado de sesión del cliente OPC UA
      content: La sesión OPC UA aparece establecida y el endpoint sigue accesible, pero el cliente conserva un valor monitorizado antiguo; el estado de sesión por sí solo no demuestra que la suscripción entregue cambios.
      reliability: high
      revealed_by: []
      media_ids: []
    - id: EVID-02-SUBSCRIPTION-STATUS
      type: inspection
      source: Panel de suscripciones del cliente OPC UA
      content: La suscripción existe, pero su estado y sus contadores deben comprobarse por separado de la sesión para saber si puede publicar notificaciones al cliente.
      reliability: confirmed
      revealed_by:
        - DEC-02-READ-SUBSCRIPTION
      media_ids: []
    - id: EVID-03-MONITORED-ITEM
      type: inspection
      source: Configuración del monitored item
      content: El monitored item asociado al nodo debe compararse con el nodo esperado, su atributo de valor y su estado de monitorización; una sesión conectada no corrige una selección o configuración incorrecta.
      reliability: confirmed
      revealed_by:
        - DEC-03-COMPARE-MONITORING
      media_ids: []
    - id: EVID-04-SAMPLING-PUBLISHING
      type: inspection
      source: Parámetros de suscripción y monitored item
      content: Los intervalos de muestreo y publicación y la política de notificación deben revisarse juntos; una configuración que no solicita o publica cambios puede dejar el valor visible sin actualizar.
      reliability: confirmed
      revealed_by:
        - DEC-03-COMPARE-MONITORING
      media_ids: []
    - id: EVID-05-DATA-QUALITY
      type: diagnostic
      source: DataValue del cliente OPC UA
      content: La calidad del DataValue debe leerse junto al valor; una calidad incierta o mala no puede presentarse como un valor de proceso actual aunque el cliente conserve una sesión válida.
      reliability: confirmed
      revealed_by:
        - DEC-04-CORRELATE-VALUE
      media_ids: []
    - id: EVID-06-SOURCE-TIMESTAMPS
      type: diagnostic
      source: SourceTimestamp y ServerTimestamp del DataValue
      content: Los timestamps de origen y servidor permiten distinguir un valor antiguo de un cambio actual; deben ser coherentes con la observación y no sustituirse por la hora local de la pantalla.
      reliability: confirmed
      revealed_by:
        - DEC-04-CORRELATE-VALUE
      media_ids: []
    - id: EVID-07-SERVER-SOURCE-VALUE
      type: functional_test
      source: Valor de origen del servidor y notificaciones del cliente
      content: Tras corregir la configuración de monitorización, el valor de origen cambia y el cliente recibe notificaciones con el valor actual, calidad adecuada y timestamps coherentes en lecturas repetidas.
      reliability: confirmed
      revealed_by:
        - DEC-05-CORRECT-AND-VERIFY
      media_ids: []
  decisions:
    - id: DEC-01-RESTART-CLIENT
      stage_id: STAGE-01-CONFIRM-SESSION
      action: Reiniciar el cliente para repetir la conexión sin conservar el estado del incidente.
    - id: DEC-01-READ-SESSION
      stage_id: STAGE-01-CONFIRM-SESSION
      action: Leer el estado de sesión y la accesibilidad del endpoint antes de intervenir.
    - id: DEC-01-RECREATE-NODE
      stage_id: STAGE-01-CONFIRM-SESSION
      action: Recrear el nodo monitorizado porque el valor visible no cambia.
    - id: DEC-01-RESTART-SERVER
      stage_id: STAGE-01-CONFIRM-SESSION
      action: Reiniciar el servidor OPC UA sin comprobar la sesión del cliente.
    - id: DEC-02-CHANGE-ENDPOINT
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      action: Cambiar el endpoint aunque la sesión actual esté establecida.
    - id: DEC-02-CLEAR-SUBSCRIPTION
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      action: Borrar la suscripción para que desaparezca el valor antiguo.
    - id: DEC-02-READ-SUBSCRIPTION
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      action: Leer el estado de la suscripción y su capacidad de publicar notificaciones.
    - id: DEC-02-CHANGE-SECURITY
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      action: Cambiar la política de seguridad para compensar una suscripción sin cambios.
    - id: DEC-03-COMPARE-MONITORING
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      action: Comparar nodo, monitored item y parámetros de muestreo y publicación.
    - id: DEC-03-INCREASE-POLLING
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      action: Aumentar el sondeo de la pantalla sin revisar la suscripción OPC UA.
    - id: DEC-03-RECREATE-NODE
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      action: Recrear el nodo sin comparar el monitored item existente.
    - id: DEC-03-FORCE-SOURCE
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      action: Forzar el valor de origen para provocar una notificación.
    - id: DEC-04-IGNORE-QUALITY
      stage_id: STAGE-04-CORRELATE-QUALITY
      action: Ignorar la calidad y aceptar cualquier valor numérico como actual.
    - id: DEC-04-ALTER-SOURCE
      stage_id: STAGE-04-CORRELATE-QUALITY
      action: Alterar la variable de origen para que la pantalla parezca dinámica.
    - id: DEC-04-ACCEPT-STALE
      stage_id: STAGE-04-CORRELATE-QUALITY
      action: Aceptar el valor antiguo mientras tenga un número legible.
    - id: DEC-04-CORRELATE-VALUE
      stage_id: STAGE-04-CORRELATE-QUALITY
      action: Correlacionar valor, calidad y timestamps de origen y servidor.
    - id: DEC-05-CLEAR-ALARM
      stage_id: STAGE-05-RESTORE-AND-VERIFY
      action: Borrar la alarma y cerrar el caso sin observar cambios actuales.
    - id: DEC-05-CORRECT-AND-VERIFY
      stage_id: STAGE-05-RESTORE-AND-VERIFY
      action: Corregir la monitorización autorizada y verificar cambios, calidad y timestamps coherentes.
    - id: DEC-05-ACCEPT-CACHED-VALUE
      stage_id: STAGE-05-RESTORE-AND-VERIFY
      action: Aceptar el valor en caché como recuperación aunque no llegue una notificación nueva.
  visual:
    educational_purpose: Revelar progresivamente la sesión conectada, la suscripción, el monitored item, los parámetros de muestreo/publicación, la calidad, los timestamps y la recuperación de datos.
    representation: planned
    assets: []
  completion:
    title: Debrief técnico
    summary: La sesión OPC UA estaba conectada, pero la configuración del monitored item o de la suscripción impedía recibir las notificaciones de cambio esperadas. Tras corregir la monitorización autorizada, el cliente recibió cambios reales con calidad adecuada y timestamps coherentes.
    process:
      - Conservar el síntoma y comprobar el estado de sesión sin reiniciar ni escribir en el proceso.
      - Leer el estado de la suscripción por separado de la sesión.
      - Comparar nodo, monitored item, muestreo y publicación.
      - Correlacionar valor, calidad y timestamps de origen y servidor.
      - Corregir la configuración verificada y comprobar cambios actuales en lecturas repetidas.
    lesson: Una sesión OPC UA conectada no garantiza que un monitored item publique cambios. La configuración de suscripción debe correlacionarse con calidad, timestamps y valor de origen antes de intervenir.
    avoided_errors:
      - Confundir sesión establecida con notificaciones de datos funcionando.
      - Reiniciar cliente o servidor sin conservar el diagnóstico.
      - Cambiar el endpoint o la seguridad sin evidencia de fallo de sesión.
      - Ignorar calidad y timestamps porque el valor numérico parece legible.
      - Cerrar el caso sin demostrar cambios reales en el cliente.
    industrial_value:
      - Diagnóstico trazable de sesiones y suscripciones OPC UA.
      - Menos reinicios y cambios de servidor innecesarios.
      - Recuperación reproducible de datos monitorizados.
    media_ids: []
private:
  fault_model:
    root_cause: La configuración del monitored item o de la suscripción OPC UA impide las notificaciones de cambio esperadas aunque la sesión del cliente permanezca conectada.
    recovery_conditions:
      - La sesión y la suscripción permanecen establecidas bajo la configuración autorizada.
      - El monitored item apunta al nodo y atributo de valor previstos.
      - Los parámetros de muestreo y publicación permiten observar cambios según el procedimiento.
      - El cliente recibe valores actuales con calidad adecuada y timestamps de origen coherentes.
  diagnostic_model:
    hypotheses:
      - id: HYP-SOURCE-STABLE
        statement: La variable de origen no cambia durante la observación.
        initial_status: possible
      - id: HYP-QUALITY-BAD
        statement: El servidor entrega un DataValue con calidad inválida o incierta.
        initial_status: possible
      - id: HYP-SUBSCRIPTION-CONFIG
        statement: La suscripción o el monitored item no están configurados para publicar los cambios esperados.
        initial_status: likely
      - id: HYP-SESSION-DISCONNECTED
        statement: La sesión OPC UA está desconectada aunque la pantalla conserve una apariencia conectada.
        initial_status: possible
    confirmed_root_cause: HYP-SUBSCRIPTION-CONFIG
    critical_path:
      - DEC-01-READ-SESSION
      - DEC-02-READ-SUBSCRIPTION
      - DEC-03-COMPARE-MONITORING
      - DEC-04-CORRELATE-VALUE
      - DEC-05-CORRECT-AND-VERIFY
  decision_logic:
    - decision_id: DEC-01-READ-SESSION
      stage_id: STAGE-01-CONFIRM-SESSION
      is_correct: true
      rationale: Conserva el síntoma y separa la conexión de la entrega de datos antes de modificar cliente, servidor o variable.
      classification: strong
      consequence: Se confirma la frontera de sesión y se pasa a revisar la suscripción.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-SUBSCRIPTION
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-01-RESTART-CLIENT
      stage_id: STAGE-01-CONFIRM-SESSION
      is_correct: false
      rationale: Reiniciar puede ocultar el estado original y no distingue sesión conectada de monitorización inactiva.
      classification: weak
      consequence: Se pierde contexto sin obtener una evidencia nueva.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-SUBSCRIPTION
      score_effect: -5
      safety_effect: 0
      retry_feedback: Conserva el estado de sesión y el valor antiguo antes de reiniciar.
    - decision_id: DEC-01-RECREATE-NODE
      stage_id: STAGE-01-CONFIRM-SESSION
      is_correct: false
      rationale: Recrear un nodo no demuestra si la sesión o la suscripción están entregando notificaciones.
      classification: weak
      consequence: Se modifica la selección antes de comprobar el límite de sesión.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-SUBSCRIPTION
      score_effect: -5
      safety_effect: -2
      retry_feedback: Lee primero la sesión y conserva el monitored item existente.
    - decision_id: DEC-01-RESTART-SERVER
      stage_id: STAGE-01-CONFIRM-SESSION
      is_correct: false
      rationale: Reiniciar el servidor interrumpe más componentes sin demostrar que la sesión sea la causa.
      classification: unsafe
      consequence: Se altera el servicio sin delimitar la monitorización.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-SUBSCRIPTION
      score_effect: -10
      safety_effect: -5
      retry_feedback: No reinicies el servidor; comprueba primero el estado de la sesión del cliente.
    - decision_id: DEC-02-READ-SUBSCRIPTION
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      is_correct: true
      rationale: La suscripción tiene estado y capacidad de publicación propios, separados de la sesión OPC UA.
      classification: strong
      consequence: Se obtiene la evidencia de suscripción y se pasa al monitored item.
      evidence_revealed: ["EVID-02-SUBSCRIPTION-STATUS"]
      next_stage: STAGE-03-CHECK-MONITORED-ITEM
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-02-CHANGE-ENDPOINT
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      is_correct: false
      rationale: Una sesión establecida no justifica cambiar el endpoint antes de comprobar la suscripción.
      classification: weak
      consequence: Se cambia el acceso sin explicar la falta de notificaciones.
      evidence_revealed: []
      next_stage: STAGE-03-CHECK-MONITORED-ITEM
      score_effect: -5
      safety_effect: -2
      retry_feedback: Conserva el endpoint y lee el estado de la suscripción.
    - decision_id: DEC-02-CLEAR-SUBSCRIPTION
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      is_correct: false
      rationale: Borrar la suscripción elimina el contexto que permite diagnosticar sus publicaciones.
      classification: weak
      consequence: Desaparece el objeto de diagnóstico sin recuperar datos.
      evidence_revealed: []
      next_stage: STAGE-03-CHECK-MONITORED-ITEM
      score_effect: -5
      safety_effect: -3
      retry_feedback: Conserva la suscripción y revisa su estado antes de modificarla.
    - decision_id: DEC-02-CHANGE-SECURITY
      stage_id: STAGE-02-CHECK-SUBSCRIPTION
      is_correct: false
      rationale: La conexión ya está establecida y la política de seguridad no explica por sí sola un monitored item sin cambios.
      classification: weak
      consequence: Se altera seguridad sin evidencia de un rechazo de sesión.
      evidence_revealed: []
      next_stage: STAGE-03-CHECK-MONITORED-ITEM
      score_effect: -5
      safety_effect: -3
      retry_feedback: No cambies seguridad; separa sesión, suscripción y monitored item.
    - decision_id: DEC-03-COMPARE-MONITORING
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      is_correct: true
      rationale: Comparar nodo, monitored item, muestreo y publicación identifica una configuración que puede impedir las notificaciones aunque la sesión esté conectada.
      classification: strong
      consequence: Se obtienen las evidencias de objeto y temporización para correlacionar el DataValue.
      evidence_revealed: ["EVID-03-MONITORED-ITEM", "EVID-04-SAMPLING-PUBLISHING"]
      next_stage: STAGE-04-CORRELATE-QUALITY
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-03-INCREASE-POLLING
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      is_correct: false
      rationale: Aumentar el refresco de la pantalla no cambia la suscripción ni demuestra que el servidor publique cambios.
      classification: weak
      consequence: Se confunde presentación con monitorización OPC UA.
      evidence_revealed: []
      next_stage: STAGE-04-CORRELATE-QUALITY
      score_effect: -5
      safety_effect: 0
      retry_feedback: Revisa el monitored item y los parámetros de muestreo/publicación.
    - decision_id: DEC-03-RECREATE-NODE
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      is_correct: false
      rationale: Recrear el nodo puede cambiar la referencia sin comprobar el objeto que ya está monitorizado.
      classification: weak
      consequence: Se pierde trazabilidad del monitored item original.
      evidence_revealed: []
      next_stage: STAGE-04-CORRELATE-QUALITY
      score_effect: -5
      safety_effect: -2
      retry_feedback: Compara el objeto existente antes de recrearlo.
    - decision_id: DEC-03-FORCE-SOURCE
      stage_id: STAGE-03-CHECK-MONITORED-ITEM
      is_correct: false
      rationale: Forzar el proceso introduce una escritura y no corrige una suscripción mal configurada.
      classification: unsafe
      consequence: Se altera el proceso para producir una evidencia artificial.
      evidence_revealed: []
      next_stage: STAGE-04-CORRELATE-QUALITY
      score_effect: -10
      safety_effect: -10
      retry_feedback: No fuerces la variable; conserva el valor de origen y revisa la monitorización.
    - decision_id: DEC-04-CORRELATE-VALUE
      stage_id: STAGE-04-CORRELATE-QUALITY
      is_correct: true
      rationale: Valor, calidad y timestamps separan un cambio actual de un valor conservado o de mala calidad.
      classification: strong
      consequence: Se confirma el límite de datos y se prepara la corrección de monitorización.
      evidence_revealed: ["EVID-05-DATA-QUALITY", "EVID-06-SOURCE-TIMESTAMPS"]
      next_stage: STAGE-05-RESTORE-AND-VERIFY
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-04-IGNORE-QUALITY
      stage_id: STAGE-04-CORRELATE-QUALITY
      is_correct: false
      rationale: Un número sin calidad válida no demuestra que el dato sea utilizable ni actual.
      classification: weak
      consequence: Se acepta una señal posiblemente inválida.
      evidence_revealed: []
      next_stage: STAGE-05-RESTORE-AND-VERIFY
      score_effect: -5
      safety_effect: -3
      retry_feedback: Lee calidad y timestamps junto con el valor.
    - decision_id: DEC-04-ALTER-SOURCE
      stage_id: STAGE-04-CORRELATE-QUALITY
      is_correct: false
      rationale: Alterar la fuente fabrica un cambio y no demuestra que la suscripción funcione con el proceso real.
      classification: unsafe
      consequence: Se modifica el proceso para ocultar el fallo de monitorización.
      evidence_revealed: []
      next_stage: STAGE-05-RESTORE-AND-VERIFY
      score_effect: -10
      safety_effect: -10
      retry_feedback: No alteres la variable; correlaciona su valor de origen con calidad y timestamps.
    - decision_id: DEC-04-ACCEPT-STALE
      stage_id: STAGE-04-CORRELATE-QUALITY
      is_correct: false
      rationale: Que el valor sea legible no prueba que sea actual ni que conserve una calidad válida.
      classification: weak
      consequence: Se confunde una muestra antigua con recuperación.
      evidence_revealed: []
      next_stage: STAGE-05-RESTORE-AND-VERIFY
      score_effect: -5
      safety_effect: -2
      retry_feedback: Compara timestamps y calidad antes de aceptar el valor.
    - decision_id: DEC-05-CORRECT-AND-VERIFY
      stage_id: STAGE-05-RESTORE-AND-VERIFY
      is_correct: true
      rationale: Corregir el objeto o la suscripción verificados y observar cambios reales demuestra recuperación sin modificar el proceso para provocar una notificación.
      classification: strong
      consequence: Se obtiene la evidencia funcional de valor, calidad y timestamps coherentes.
      evidence_revealed: ["EVID-07-SERVER-SOURCE-VALUE"]
      next_stage: COMPLETE
      score_effect: 10
      safety_effect: 2
    - decision_id: DEC-05-CLEAR-ALARM
      stage_id: STAGE-05-RESTORE-AND-VERIFY
      is_correct: false
      rationale: Borrar una alarma no prueba que el cliente reciba cambios actuales.
      classification: weak
      consequence: Se cierra el síntoma sin verificación funcional.
      evidence_revealed: []
      next_stage: COMPLETE
      score_effect: -5
      safety_effect: 0
      retry_feedback: Corrige la monitorización y comprueba cambios, calidad y timestamps antes de cerrar.
    - decision_id: DEC-05-ACCEPT-CACHED-VALUE
