        purpose: "completion"
  completion:
    title: "Debrief técnico"
    summary: "demanda transitoria simultánea superior a la capacidad dinámica especificada de PS1; la fuente entra en limitación. No confundir con un cable defectuoso porque la caída aparece también en los bornes de PS1. En el escenario simulado, tras la solución aprobada se repite el peor arranque: el registro de PS1 permanece dentro de los límites del diseño y no aparecen reinicios. Se conservan las protecciones. No se fija un modelo de fuente sin cálculo ni se induce una sobrecarga en un cuadro real."
    process:
      - "Reinicios del módulo correlacionados con la activación y tendencia de tensión en PS1."
      - "Tensión correcta solo para ese estado; falta observar arranque."
      - "Fuente en limitación o defecto interno; contrastar demanda y especificación."
      - "La suma supera 5 A nominales; revisar capacidad transitoria y simultaneidad."
      - "Tras solución de ingeniería aprobada, registrar tensión en PS1 durante el peor arranque y ausencia de reinicios."
    lesson: "redistribuir/limitar simultaneidad o dimensionar fuente y protección según fabricante; no fijar modelo sin cálculo. Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-015 (NB-EL-07): Fuentes industriales de 24 VDC; article-029 (NB-EL-21): Método de diagnóstico; article-031 (NB-EL-23): Diagnóstico por comparación y bajo carga"
    avoided_errors:
      - "Versión de firmware PLC."
      - "Cambiar módulo remoto."
      - "Fuente definitivamente sana."
      - "Cortocircuito permanente."
      - "Únicamente cable entre fuente y módulo."
      - "Fallo del sensor de velocidad."
      - "Toda fuente de 5 A soporta 10 A indefinidamente."
      - "El PLC consume cero durante arranque."
      - "Reiniciar PLC una vez."
      - "Sustituir la fuente por cualquiera de 24 V."
    industrial_value:
      - "Diagnóstico trazable sin sustituir componentes por descarte."
      - "Recuperación verificada manteniendo protecciones."
    media_ids: ["ART-006"]
