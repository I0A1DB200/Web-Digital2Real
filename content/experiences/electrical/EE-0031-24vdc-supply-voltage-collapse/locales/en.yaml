  completion:
    title: "Technical debrief"
    summary: "simultaneous transient demand exceeds PS1's specified dynamic capability; the supply enters current limiting. Do not confuse this with a defective cable because the voltage also drops at PS1's own terminals. In the simulated scenario, the worst startup is repeated after the approved solution: the PS1 record stays within design limits and there are no restarts. Protection is retained. No supply model is selected without calculation and no overload is induced on a real cabinet."
    process:
      - "Module restarts correlated with activation and the PS1 voltage trend."
      - "Voltage is correct only for that state; startup still needs observation."
      - "Supply current limiting or internal fault; compare demand and specification."
      - "The total exceeds the 5 A rating; review transient capability and simultaneity."
      - "After an approved engineering solution, record voltage at PS1 during the worst startup and confirm no restarts."
    lesson: "redistribute/limit simultaneous demand or size supply and protection according to the manufacturer; do not select a model without calculation. Notebook — reading path in Engineering Notes: article-009 (NB-EL-01): Voltage, current, resistance and a closed circuit; article-012 (NB-EL-04): Multimeters, clamps and interpreting measurements; article-015 (NB-EL-07): Industrial 24 VDC power supplies; article-029 (NB-EL-21): Diagnostic method; article-031 (NB-EL-23): Diagnosis by comparison and under load"
    avoided_errors:
      - "PLC firmware version."
      - "Replace the remote module."
      - "The supply is definitely healthy."
      - "A permanent short circuit."
      - "Only the cable between supply and module."
      - "Speed sensor failure."
      - "Every 5 A supply supports 10 A indefinitely."
      - "The PLC draws zero current during startup."
      - "Restart the PLC once."
      - "Replace the supply with any 24 V unit."
    industrial_value:
      - "Traceable diagnosis without replacing components by elimination."
      - "Verified recovery with protection retained."
