public:
  slug: "contactor-does-not-energize"
  title: "El contactor no se activa"
  summary: "Al pulsar START, -KM1 no cierra. Mando 24 VDC: +24V → -S0 STOP NC → -F2 contacto NC de protección → -S1 START NO → -KM1:A1 → A2:0V, con auxiliar de mantenimiento KM1 NO. Se interpretan registros aportados; no se acciona el circuito real. Preview textual; evidencias visuales y revisión técnica pendientes."
  estimated_duration: 20
  scenario:
    initial_context: "Al pulsar START, -KM1 no cierra. Mando 24 VDC: +24V → -S0 STOP NC → -F2 contacto NC de protección → -S1 START NO → -KM1:A1 → A2:0V, con auxiliar de mantenimiento KM1 NO. Se interpretan registros aportados; no se acciona el circuito real."
    operational_state: "Solo se conocen los datos del incidente; los registros se revelan por etapas. Notebook — itinerario en Engineering Notes: article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-019 (NB-EL-11): Mando frente a potencia; article-020 (NB-EL-12): Contactores, bobinas y auxiliares; article-021 (NB-EL-13): Pulsadores, auto-mantenimiento y enclavamientos; article-027 (NB-EL-19): Lectura de esquemas de mando; article-029 (NB-EL-21): Método de diagnóstico"
    initiating_event: "El contactor no se activa"
    learner_role: "Técnico que interpreta un caso simulado y justifica diagnóstico, intervención y verificación."
    safety_context:
      safe_state: "Caso didáctico simulado. Las lecturas energizadas son registros ya obtenidos por personal autorizado. Antes de inspección invasiva, continuidad, resistencia o aislamiento: desenergización, consignación, ausencia de tensión verificada y control de energía almacenada según procedimiento de la instalación."
      intervention_constraints:
        - "El alumno interpreta registros; no realiza trabajos en tensión ni maniobras sobre una instalación real."
        - "No puentear STOP, E-STOP, relés térmicos, diferenciales ni otras protecciones; no usar PE como retorno."
        - "No medir resistencia en circuitos energizados ni aplicar megóhmetro a electrónica conectada."
        - "Intervención solo por personal competente y autorizado conforme al procedimiento aplicable; no se inventan secuencias LOTO, EPI ni umbrales normativos."
        - "Preview textual: imágenes de evidencia y revisión técnica/editorial pendientes; no es material aprobado para operación real."
  learning_objectives:
    -
      id: "OBJ-TRACE-CIRCUIT"
      description: "Notebook — itinerario en Engineering Notes: article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-019 (NB-EL-11): Mando frente a potencia; article-020 (NB-EL-12): Contactores, bobinas y auxiliares; article-021 (NB-EL-13): Pulsadores, auto-mantenimiento y enclavamientos; article-027 (NB-EL-19): Lectura de esquemas de mando; article-029 (NB-EL-21): Método de diagnóstico"
      capability_id: "ICF-06"
      competency_id: "COMP-EL-CIRCUIT-TRACEABILITY"
    -
      id: "OBJ-INTERPRET-EVIDENCE"
      description: "Discriminar hipótesis con los registros disponibles sin adelantar la causa raíz."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-EVIDENCE-INTERPRETATION"
    -
      id: "OBJ-VERIFY-RECOVERY"
      description: "Distinguir reparación realizada de recuperación verificada con criterios del caso."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-VERIFIED-RECOVERY"
  stages:
    -
      id: "STAGE-01-DIAGNOSIS"
      phase: "incident"
      title: "Delimitar el síntoma"
      situation: "Al pulsar START, -KM1 no cierra. Mando 24 VDC: +24V → -S0 STOP NC → -F2 contacto NC de protección → -S1 START NO → -KM1:A1 → A2:0V, con auxiliar de mantenimiento KM1 NO. Se interpretan registros aportados; no se acciona el circuito real.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-00-RECORD"
      decision_ids:
        - "DEC-01-A"
        - "DEC-01-B"
        - "DEC-01-C"
      media_ids: []
    -
      id: "STAGE-02-DIAGNOSIS"
      phase: "investigation"
      title: "Interpretar el primer registro"
      situation: "El esquema y registro autorizado muestran +24 V en entrada y salida de S0. En el estado documentado, STOP NC está cerrado. La denominación STOP no define un contacto abierto en reposo.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-01-RECORD"
      decision_ids:
        - "DEC-02-A"
        - "DEC-02-B"
        - "DEC-02-C"
      media_ids: []
    -
      id: "STAGE-03-DIAGNOSIS"
      phase: "investigation"
      title: "Contrastar hipótesis"
      situation: "El registro muestra +24 V en salida de F2 y 0 V en salida de S1 mientras START está pulsado. El retorno A2 ya está verificado. La interrupción se localiza entre salida de F2 y salida de S1; no se ha confirmado todavía el defecto interno.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-02-RECORD"
      decision_ids:
        - "DEC-03-A"
        - "DEC-03-B"
        - "DEC-03-C"
      media_ids: []
    -
      id: "STAGE-04-DIAGNOSIS"
      phase: "investigation"
      title: "Confirmar la causa e intervenir con seguridad"
      situation: "La comparación por tramos dirige la comprobación a S1. Hay alimentación aguas abajo de F2, retorno A2 verificado y ausencia de tensión a la salida de S1 con START pulsado. Para confirmar el componente se interpreta un ensayo aislado, con desenergización, consignación y ausencia de tensión verificadas por personal autorizado.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-03-RECORD"
      decision_ids:
        - "DEC-04-A"
        - "DEC-04-B"
        - "DEC-04-C"
      media_ids: []
    -
      id: "STAGE-05-VERIFY-RECOVERY"
      phase: "solution"
      title: "Verificar la recuperación"
      situation: "El ensayo aislado y la documentación confirman apertura mecánica interna: S1 no cierra pese a accionamiento. KM1 no recibe tensión nominal; no se ha probado una bobina defectuosa. Se requiere sustitución equivalente aprobada de S1 y corrección de documentación; recuperación aún pendiente.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-04-RECORD"
      decision_ids:
        - "DEC-05-A"
        - "DEC-05-B"
        - "DEC-05-C"
      media_ids: []
