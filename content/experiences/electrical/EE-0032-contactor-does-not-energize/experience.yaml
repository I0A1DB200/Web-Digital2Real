      reliability: "confirmed"
      revealed_by:
        - "DEC-05-B"
      media_ids: []
  decisions:
    -
      id: "DEC-01-A"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Examinar secuencia de permisos en esquema y valores por tramo."
    -
      id: "DEC-01-B"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Cambiar KM1. Se interpreta la falta de cierre como avería del contactor completo y se prioriza su sustitución frente a comparar permisos, tensión de bobina y retorno."
    -
      id: "DEC-01-C"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Cambiar motor."
    -
      id: "DEC-02-A"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "STOP está abierto porque se llama STOP. Se usa el nombre funcional del pulsador para inferir su estado eléctrico, en lugar de contrastar el contacto NC con las lecturas antes y después de S0."
    -
      id: "DEC-02-B"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "+24 V antes y después de S0 indica continuidad funcional en ese estado."
    -
      id: "DEC-02-C"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "La fuente está a 0 V."
    -
      id: "DEC-03-A"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "F2 ha disparado necesariamente. Se atribuye el bloqueo a la actuación de protección sin contrastar el potencial documentado a su salida ni localizar el siguiente tramo sin alimentación."
    -
      id: "DEC-03-B"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "El retorno es la única causa posible."
    -
      id: "DEC-03-C"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "La interrupción está entre salida de F2 y salida de S1, con START pulsado."
    -
      id: "DEC-04-A"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Confirmar con ensayo aislado y documentación el fallo de cierre de S1."
    -
      id: "DEC-04-B"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Puentear S1 para dejar producción funcionando. Se presenta un camino alternativo permanente como forma de recuperar marcha, sin restaurar el cierre del contacto instalado ni su función documentada."
    -
      id: "DEC-04-C"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Cambiar calibre de F2."
    -
      id: "DEC-05-A"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Basta que la bobina haga ruido. Se toma una indicación acústica aislada como demostración de marcha, paro, mantenimiento y protección, sin registrar la secuencia funcional completa."
    -
      id: "DEC-05-B"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Tras sustitución autorizada de S1, verificar marcha, paro, auto-mantenimiento y protección."
    -
      id: "DEC-05-C"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Desactivar STOP para evitar recurrencia."
