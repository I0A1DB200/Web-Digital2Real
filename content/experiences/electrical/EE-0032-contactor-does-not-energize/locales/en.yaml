    DEC-01-C: "does not explain the control fault. Review: Pressing START does not close -KM1. The 24 VDC control circuit is +24V → -S0 STOP NC → -F2 protective NC contact → -S1 START NO → -KM1:A1 → A2:0V, with an NO KM1 seal-in auxiliary. Supplied records are interpreted; no real circuit is operated. Choose again without carrying out the proposed option."
    DEC-02-A: "NC is closed at rest. Review: The drawing and authorized record show +24 V at S0 input and output. In the documented state, STOP NC is closed. The STOP designation does not mean an open contact at rest. Choose again without carrying out the proposed option."
    DEC-02-C: "The proposal “The supply is at 0 V.” is not supported by this record.  Review: The drawing and authorized record show +24 V at S0 input and output. In the documented state, STOP NC is closed. The STOP designation does not mean an open contact at rest. Choose again without carrying out the proposed option."
    DEC-03-A: "+24 V is present downstream. Review: The record shows +24 V at F2 output and 0 V at S1 output while START is pressed. The A2 return has already been verified. The interruption is between F2 output and S1 output; the internal defect is not yet confirmed. Choose again without carrying out the proposed option."
    DEC-03-B: "it has already been verified. Review: The record shows +24 V at F2 output and 0 V at S1 output while START is pressed. The A2 return has already been verified. The interruption is between F2 output and S1 output; the internal defect is not yet confirmed. Choose again without carrying out the proposed option."
    DEC-04-B: "not an acceptable repair. Review: Path comparison directs the check to S1. Supply is present downstream of F2, A2 return is verified and S1 output lacks voltage with START pressed. Component confirmation uses an isolated test, with de-energization, lockout and absence of voltage verified by authorized personnel. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Change F2's rating.” is not supported by this record.  Review: Path comparison directs the check to S1. Supply is present downstream of F2, A2 return is verified and S1 output lacks voltage with START pressed. Component confirmation uses an isolated test, with de-energization, lockout and absence of voltage verified by authorized personnel. Choose again without carrying out the proposed option."
    DEC-05-A: "The proposal “Coil noise is sufficient.” is not supported by this record.  Review: The isolated test and documentation confirm an internal mechanical opening: S1 does not close despite actuation. KM1 does not receive rated voltage; a defective coil has not been established. Approved equivalent S1 replacement and documentation correction are required; recovery is still pending. Choose again without carrying out the proposed option."
    DEC-05-C: "The proposal “Disable STOP to prevent recurrence.” is not supported by this record.  Review: The isolated test and documentation confirm an internal mechanical opening: S1 does not close despite actuation. KM1 does not receive rated voltage; a defective coil has not been established. Approved equivalent S1 replacement and documentation correction are required; recovery is still pending. Choose again without carrying out the proposed option."
  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "start contact -S1 fails to close despite mechanical actuation. Do not confuse it with a defective coil: the coil does not receive rated voltage. After authorized S1 replacement, the simulated record verifies start, stop, seal-in and protection. Control is restored without bypassing STOP or protection; coil noise is not used as the closure criterion."
    process:
      - "Examine the permission sequence in the schematic and readings along the path."
      - "+24 V before and after S0 indicates functional continuity in that state."
      - "The interruption is between F2 output and S1 output with START pressed."
      - "Confirm S1's failure to close using an isolated test and documentation."
      - "After authorized S1 replacement, verify start, stop, seal-in and protection."
    lesson: "replace S1 with an approved equivalent and correct documentation. Notebook — reading path in Engineering Notes: article-012 (NB-EL-04): Multimeters, clamps and interpreting measurements; article-019 (NB-EL-11): Control versus power; article-020 (NB-EL-12): Contactors, coils and auxiliaries; article-021 (NB-EL-13): Pushbuttons, seal-in and interlocks; article-027 (NB-EL-19): Reading control schematics; article-029 (NB-EL-21): Diagnostic method"
    avoided_errors:
      - "Replace KM1."
      - "Replace the motor."
      - "STOP is open because it is called STOP."
      - "The supply is at 0 V."
      - "F2 must have tripped."
      - "The return is the only possible cause."
      - "Bridge S1 to leave production running."
      - "Change F2's rating."
      - "Coil noise is sufficient."
      - "Disable STOP to prevent recurrence."
    industrial_value:
      - "Traceable diagnosis without replacing components by elimination."
      - "Verified recovery with protection retained."
