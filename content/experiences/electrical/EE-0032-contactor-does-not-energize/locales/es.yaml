    summary: "contacto de marcha -S1 no cierra pese a accionamiento mecánico. No confundir con bobina defectuosa: no recibe tensión nominal. Tras sustitución autorizada de S1, el registro simulado verifica marcha, paro, auto-mantenimiento y protección. El mando se restablece sin puentear STOP ni protección; el ruido de bobina no se usa como criterio de cierre."
    process:
      - "Examinar secuencia de permisos en esquema y valores por tramo."
      - "+24 V antes y después de S0 indica continuidad funcional en ese estado."
      - "La interrupción está entre salida de F2 y salida de S1, con START pulsado."
      - "Confirmar con ensayo aislado y documentación el fallo de cierre de S1."
      - "Tras sustitución autorizada de S1, verificar marcha, paro, auto-mantenimiento y protección."
    lesson: "sustituir S1 por componente equivalente aprobado y corregir documentación. Notebook — itinerario en Engineering Notes: article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-019 (NB-EL-11): Mando frente a potencia; article-020 (NB-EL-12): Contactores, bobinas y auxiliares; article-021 (NB-EL-13): Pulsadores, auto-mantenimiento y enclavamientos; article-027 (NB-EL-19): Lectura de esquemas de mando; article-029 (NB-EL-21): Método de diagnóstico"
    avoided_errors:
      - "Cambiar KM1."
      - "Cambiar motor."
      - "STOP está abierto porque se llama STOP."
      - "La fuente está a 0 V."
      - "F2 ha disparado necesariamente."
      - "El retorno es la única causa posible."
      - "Puentear S1 para dejar producción funcionando."
      - "Cambiar calibre de F2."
      - "Basta que la bobina haga ruido."
      - "Desactivar STOP para evitar recurrencia."
