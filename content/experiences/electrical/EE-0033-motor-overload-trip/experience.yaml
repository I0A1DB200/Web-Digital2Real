  completion:
    title: "Debrief técnico"
    summary: "sobrecarga mecánica por rodillo deteriorado; protección térmica actúa correctamente. Tras reparar el rodillo R1 en el caso simulado, el registro posreparación aporta 3,5 A en L1 frente a 3,8 A nominales y protección operativa según procedimiento. F2 conserva el ajuste documentado de 3,8 A. Se verifica la recuperación bajo carga; borrar la alarma, rearmar reiteradamente o reducir velocidad sin investigar no acredita recuperación."
    process:
