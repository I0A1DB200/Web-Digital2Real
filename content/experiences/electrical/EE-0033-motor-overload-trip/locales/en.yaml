locale: "en"
translations:
  title: "Motor stops due to overload"
  summary: "The conveyor starts; as mechanical load increases, F2 trips and KM1 drops out. Fictional M1 motor rated 1.5 kW / 400 VAC / 50 Hz / 3.8 A; F2 set and documented at 3.8 A. Compare electrical records and load before changing settings or components. All data are teaching simulations. Preview with illustrations; publication blocked pending human technical QA."
  scenario:
    initial_context: "The conveyor starts; as mechanical load increases, F2 trips and KM1 drops out. Fictional M1 motor rated 1.5 kW / 400 VAC / 50 Hz / 3.8 A; F2 set and documented at 3.8 A. Compare electrical records and load before changing settings or components. All data are teaching simulations."
    operational_state: "Only incident facts are known; records are disclosed by stage. Notebook — reading path in Engineering Notes: article-011 (NB-EL-03): Power, energy and industrial loads; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-022 (NB-EL-14): Three-phase motors, nameplates and overload relays; article-029 (NB-EL-21): Diagnostic method; article-033 (NB-EL-25): Verification, recurrence and documentation"
    initiating_event: "Motor stops due to overload"
    learner_role: "Technician interpreting a simulated case and justifying diagnosis, intervention and verification."
    safety_context:
      safe_state: "Simulated teaching case. Energized readings are records already obtained by authorized personnel. Before invasive inspection, continuity, resistance or insulation testing: de-energization, lockout, verified absence of voltage and stored-energy control under the installation procedure."
      intervention_constraints:
        - "The learner interprets records; no live work or operations on a real installation are performed."
        - "Do not bypass STOP, E-STOP, overload relays, RCDs or other protection; do not use PE as a return."
        - "Do not measure resistance on energized circuits or connect an insulation tester to connected electronics."
        - "Interpret an existing continuity test record obtained by authorized personnel: isolated circuit, verified absence of voltage and sufficient isolation to eliminate parallel paths. No energized continuity testing or real operations are performed."
        - "Intervention only by competent, authorized personnel under the applicable procedure; no LOTO sequences, PPE or regulatory thresholds are invented."
        - "Teaching preview: publication blocked pending human QA; not approved material for real operation."
  learning_objectives:
    OBJ-TRACE-CIRCUIT:
      description: "Notebook — reading path in Engineering Notes: article-011 (NB-EL-03): Power, energy and industrial loads; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-022 (NB-EL-14): Three-phase motors, nameplates and overload relays; article-029 (NB-EL-21): Diagnostic method; article-033 (NB-EL-25): Verification, recurrence and documentation"
    OBJ-INTERPRET-EVIDENCE:
      description: "Distinguish hypotheses with available records without revealing root cause prematurely."
    OBJ-VERIFY-RECOVERY:
      description: "Distinguish a performed repair from verified recovery using the case criteria."
  stages:
    STAGE-01-DIAGNOSIS:
      title: "Bound the symptom"
      situation: "The conveyor starts; as mechanical load increases, F2 trips and KM1 drops out. Fictional M1 motor rated 1.5 kW / 400 VAC / 50 Hz / 3.8 A; F2 set and documented at 3.8 A. Compare electrical records and load before changing settings or components. All data are teaching simulations.\n\nWhich interpretation or action is justified by the available evidence?"
    STAGE-02-DIAGNOSIS:
      title: "Interpret the first record"
      situation: "The clamp records 5.6 A AC on KM1 L1 against the M1 rating and F2 setting of 3.8 A. Recorded current exceeds the rating; rotation does not establish normal operation or prove a bolted short circuit. No new numerical L2 or L3 readings are supplied and no trip time is inferred. Interpret an existing continuity test record obtained by authorized personnel: isolated circuit, verified absence of voltage and sufficient isolation to eliminate parallel paths. No energized continuity testing or real operations are performed.\n\nWhich interpretation or action is justified by the available evidence?"
    STAGE-03-DIAGNOSIS:
      title: "Compare hypotheses"
      situation: "The phase-to-phase voltage record remains balanced, with no documented phase loss. The protection record identifies F2 tripped; the isolated test across the NC pair 95–96 reads OL. Opening the permission drops KM1 out. This identifies protective operation, not the overload cause; investigate mechanical load or motor condition.\n\nWhich interpretation or action is justified by the available evidence?"
    STAGE-04-DIAGNOSIS:
      title: "Confirm the cause and intervene safely"
      situation: "With the machine locked out, the authorized mechanical record identifies abnormal resistance in return roller R1; after decoupling and checking under the procedure, it exceeds the historical reference. The wear image guides inspection but alone does not prove seizure. The explanation requires post-repair confirmation.\n\nWhich interpretation or action is justified by the available evidence?"
    STAGE-05-VERIFY-RECOVERY:
      title: "Verify recovery"
      situation: "The deteriorated roller causes mechanical overload. Thermal protection operates correctly; its setting is not increased or bypassed to compensate for load. Mechanical repair must be followed by current and protection verification.\n\nWhich interpretation or action is justified by the available evidence?"
  evidence:
    EVID-00-RECORD:
      source: "Simulated teaching record · context"
      content: "The conveyor starts; as mechanical load increases, F2 trips and KM1 drops out. Fictional M1 motor rated 1.5 kW / 400 VAC / 50 Hz / 3.8 A; F2 set and documented at 3.8 A. Compare electrical records and load before changing settings or components. All data are teaching simulations."
    EVID-01-RECORD:
      source: "Simulated teaching record · D1"
      content: "The clamp records 5.6 A AC on KM1 L1 against the M1 rating and F2 setting of 3.8 A. Recorded current exceeds the rating; rotation does not establish normal operation or prove a bolted short circuit. No new numerical L2 or L3 readings are supplied and no trip time is inferred."
    EVID-02-RECORD:
      source: "Simulated teaching record · D2"
      content: "The phase-to-phase voltage record remains balanced, with no documented phase loss. The protection record identifies F2 tripped; the isolated test across the NC pair 95–96 reads OL. Opening the permission drops KM1 out. This identifies protective operation, not the overload cause; investigate mechanical load or motor condition."
    EVID-03-RECORD:
      source: "Simulated teaching record · D3"
      content: "With the machine locked out, the authorized mechanical record identifies abnormal resistance in return roller R1; after decoupling and checking under the procedure, it exceeds the historical reference. The wear image guides inspection but alone does not prove seizure. The explanation requires post-repair confirmation."
    EVID-04-RECORD:
      source: "Simulated teaching record · D4"
      content: "The deteriorated roller causes mechanical overload. Thermal protection operates correctly; its setting is not increased or bypassed to compensate for load. Mechanical repair must be followed by current and protection verification."
    EVID-05-RECORD:
      source: "Simulated teaching record · D5"
      content: "After R1 roller repair in the simulated case, the post-repair record provides 3.5 A on L1 against the 3.8 A rating and protection operational under the procedure. F2 retains its documented 3.8 A setting. Recovery is verified under load; clearing the alarm, repeatedly resetting or reducing speed without investigation does not establish recovery."
  decisions:
    DEC-01-A:
      action: "Increase the relay setting until it stops tripping. Repeatedly reset without investigating. Tripping is treated as a setting problem instead of investigating why current rises under the new production condition."
    DEC-01-B:
      action: "Correlate currents, nameplate and mechanical load."
    DEC-01-C:
      action: "Replace the PLC."
    DEC-02-A:
      action: "5.6 A versus 3.8 A demonstrates current above the rating."
    DEC-02-B:
      action: "It is normal because the motor rotates. Visible movement is taken as sufficient reason to accept recorded current without comparing the rated value or the load condition."
    DEC-02-C:
      action: "It proves a bolted short circuit."
    DEC-03-A:
      action: "Phase loss is confirmed. Tripping is interpreted as phase loss without comparing the balanced voltage record and protective operation."
    DEC-03-B:
      action: "The supply must be incorrect."
    DEC-03-C:
      action: "Prioritize mechanical overload or motor condition; request mechanical evidence."
    DEC-04-A:
      action: "The roller's abnormal resistance explains increased load, subject to post-repair confirmation."
    DEC-04-B:
      action: "The relay is defective because it trips. The incident is attributed to the device interrupting the circuit rather than relating its operation to the roller's abnormal mechanical resistance."
    DEC-04-C:
      action: "The relay can be bypassed."
    DEC-05-A:
      action: "Only clear the alarm. Removing the interface warning is treated as functional recovery, without comparing post-repair currents or checking operational protection."
    DEC-05-B:
      action: "After repairing the roller, verify currents within limits and protection operational."
    DEC-05-C:
      action: "Reduce speed without investigating."
