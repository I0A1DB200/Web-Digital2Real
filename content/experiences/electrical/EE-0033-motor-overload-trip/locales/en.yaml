    DEC-02-B: "The proposal “It is normal because the motor rotates.” is not supported by this record.  Review: Recorded line currents are 4.5/4.4/4.6 A versus the 3.2 A rating. The trip is delayed. Comparison confirms above-rated current; rotation does not establish normal operation or prove a bolted short circuit. Choose again without carrying out the proposed option."
    DEC-02-C: "The proposal “It proves a bolted short circuit.” is not supported by this record.  Review: Recorded line currents are 4.5/4.4/4.6 A versus the 3.2 A rating. The trip is delayed. Comparison confirms above-rated current; rotation does not establish normal operation or prove a bolted short circuit. Choose again without carrying out the proposed option."
    DEC-03-A: "three similar currents and balanced voltages do not support it. Review: Phase-to-phase voltages are balanced, with no phase loss. All three currents are similar and high. These data do not support phase loss and require investigating mechanical load or motor condition. Choose again without carrying out the proposed option."
    DEC-03-B: "The proposal “The supply must be incorrect.” is not supported by this record.  Review: Phase-to-phase voltages are balanced, with no phase loss. All three currents are similar and high. These data do not support phase loss and require investigating mechanical load or motor condition. Choose again without carrying out the proposed option."
    DEC-04-B: "The proposal “The relay is defective because it trips.” is not supported by this record.  Review: The authorized mechanical record identifies abnormal resistance in a return roller; after decoupling and checking under the procedure, it exceeds the historical reference. Abnormal mechanical load is an explanation requiring post-repair confirmation. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “The relay can be bypassed.” is not supported by this record.  Review: The authorized mechanical record identifies abnormal resistance in a return roller; after decoupling and checking under the procedure, it exceeds the historical reference. Abnormal mechanical load is an explanation requiring post-repair confirmation. Choose again without carrying out the proposed option."
    DEC-05-A: "The proposal “Only clear the alarm.” is not supported by this record.  Review: The deteriorated roller causes mechanical overload. Thermal protection operates correctly; its setting is not increased or bypassed to compensate for load. Mechanical repair must be followed by current and protection verification. Choose again without carrying out the proposed option."
    DEC-05-C: "may hide the problem. Review: The deteriorated roller causes mechanical overload. Thermal protection operates correctly; its setting is not increased or bypassed to compensate for load. Mechanical repair must be followed by current and protection verification. Choose again without carrying out the proposed option."
  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "mechanical overload caused by a deteriorated roller; thermal protection operates correctly. After roller repair in the simulated case, currents are verified within applicable limits and protection operational under the procedure. The correct documented setting is confirmed; clearing an alarm or reducing speed without investigation does not establish recovery."
    process:
      - "Correlate currents, nameplate and mechanical load."
      - "4.5 A versus 3.2 A demonstrates current above the rating."
      - "Prioritize mechanical overload or motor condition; request mechanical evidence."
      - "The roller's abnormal resistance explains increased load, subject to post-repair confirmation."
      - "After repairing the roller, verify currents within limits and protection operational."
    lesson: "mechanical repair and confirmation of the correct setting, without increasing protection to compensate for load. Notebook — reading path in Engineering Notes: article-011 (NB-EL-03): Power, energy and industrial loads; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-022 (NB-EL-14): Three-phase motors, nameplates and overload relays; article-029 (NB-EL-21): Diagnostic method; article-033 (NB-EL-25): Verification, recurrence and documentation"
    avoided_errors:
      - "Increase the relay setting until it stops tripping."
      - "Replace the PLC."
      - "It is normal because the motor rotates."
      - "It proves a bolted short circuit."
      - "Phase loss is confirmed."
      - "The supply must be incorrect."
      - "The relay is defective because it trips."
      - "The relay can be bypassed."
      - "Only clear the alarm."
      - "Reduce speed without investigating."
    industrial_value:
      - "Traceable diagnosis without replacing components by elimination."
      - "Verified recovery with protection retained."
