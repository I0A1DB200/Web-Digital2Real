  visual:
    educational_purpose: "Six simulated-case illustrations; electrical and mechanical records disclosed by decision. Human technical review pending."
  assets:
    ART-001:
      alt: "Illustrated cabinet with Q1, PS1, F1, KM1, F2, S1, S0 and a teaching M1 plate rated 1.5 kW, 400 V and 3.8 A."
      caption: "Equipment locations."
    ART-002:
      alt: "Q1–KM1–F2–M1 power schematic and 24 VDC control with F2 and S0 in series and KM1 auxiliary in parallel with S1."
      caption: "Power and control for the simulated case."
    ART-003:
      alt: "Illustrated AC clamp around one KM1 L1 conductor with a simulated 5.6 A reading."
      caption: "L1 — 5.6 A AC."
    ART-004:
      alt: "Illustrated F2 relay with teaching setting 3.8 A and auxiliary terminals marked 95, 96, 97 and 98."
      caption: "F2 — teaching setting 3.8 A."
    ART-005:
      alt: "Simulated F2:95–96 continuity record reading OL; test declared isolated and de-energized."
      caption: "F2:95–96 — OL, isolated test record."
    ART-006:
      alt: "R1 roller with visible wear and dirt near its support and bearing; the image alone does not establish rotational resistance."
      caption: "R1 — mechanical inspection with the machine locked out."
  completion:
    title: "Technical debrief"
    summary: "mechanical overload caused by a deteriorated roller; thermal protection operates correctly. After R1 roller repair in the simulated case, the post-repair record provides 3.5 A on L1 against the 3.8 A rating and protection operational under the procedure. F2 retains its documented 3.8 A setting. Recovery is verified under load; clearing the alarm, repeatedly resetting or reducing speed without investigation does not establish recovery."
    process:
      - "Correlate currents, nameplate and mechanical load."
      - "5.6 A versus 3.8 A demonstrates current above the rating."
      - "Prioritize mechanical overload or motor condition; request mechanical evidence."
      - "The roller's abnormal resistance explains increased load, subject to post-repair confirmation."
      - "After repairing the roller, verify currents within limits and protection operational."
    lesson: "mechanical repair and confirmation of the correct setting, without increasing protection to compensate for load. Notebook — reading path in Engineering Notes: article-011 (NB-EL-03): Power, energy and industrial loads; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-022 (NB-EL-14): Three-phase motors, nameplates and overload relays; article-029 (NB-EL-21): Diagnostic method; article-033 (NB-EL-25): Verification, recurrence and documentation"
    avoided_errors:
      - "Increase the relay setting until it stops tripping."
      - "Replace the PLC."
      - "It is normal because the motor rotates."
      - "It proves a bolted short circuit."
      - "Phase loss is confirmed."
      - "The supply must be incorrect."
      - "The relay is defective because it trips."
      - "The relay can be bypassed."
      - "Only clear the alarm."
      - "Reduce speed without investigating."
    industrial_value:
      - "Traceable diagnosis without replacing components by elimination."
      - "Verified recovery with protection retained."
