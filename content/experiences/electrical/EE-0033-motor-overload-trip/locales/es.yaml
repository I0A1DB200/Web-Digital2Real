      - "Cambiar PLC."
      - "Es normal porque el motor gira."
      - "Demuestra cortocircuito franco."
      - "La pérdida de fase está confirmada."
      - "La alimentación es necesariamente incorrecta."
      - "El relé está mal por disparar."
      - "Se puede anular el relé."
      - "Solo borrar alarma."
      - "Reducir velocidad sin investigar."
    industrial_value:
