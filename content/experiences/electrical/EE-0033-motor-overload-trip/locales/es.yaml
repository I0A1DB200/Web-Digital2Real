      caption: "F2 — ajuste didáctico 3,8 A."
    ART-005:
      alt: "Registro simulado de continuidad entre F2:95 y F2:96 con lectura OL; ensayo declarado aislado y sin tensión."
      caption: "F2:95–96 — OL, registro de ensayo aislado."
    ART-006:
      alt: "Rodillo R1 con desgaste y suciedad visibles junto al soporte y rodamiento; no demuestra por sí solo resistencia al giro."
      caption: "R1 — inspección mecánica con máquina consignada."
