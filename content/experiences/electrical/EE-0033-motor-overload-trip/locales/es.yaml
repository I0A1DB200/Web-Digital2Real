      alt: "Cuadro ilustrado con Q1, PS1, F1, KM1, F2, S1, S0 y placa didáctica M1 de 1,5 kW, 400 V y 3,8 A."
      caption: "Localización de equipos."
    ART-002:
      alt: "Esquema de fuerza Q1–KM1–F2–M1 y mando 24 VDC con F2 y S0 en serie y auxiliar KM1 en paralelo con S1."
      caption: "Fuerza y mando del caso simulado."
    ART-003:
      alt: "Pinza AC ilustrada alrededor de un conductor L1 de KM1 con lectura simulada de 5,6 A."
      caption: "L1 — 5,6 A AC."
    ART-004:
