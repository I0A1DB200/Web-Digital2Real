    DEC-02-B: "La propuesta «Es normal porque el motor gira.» no está sustentada por este registro.  Revisa: La pinza registra 5,6 A AC en L1 de KM1 frente a 3,8 A nominales de M1 y ajuste F2 de 3,8 A. La corriente registrada supera la nominal; el hecho de girar no establece operación normal ni prueba cortocircuito franco. No se aportan nuevas lecturas numéricas de L2 o L3 ni se deduce un tiempo de disparo. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-02-C: "La propuesta «Demuestra cortocircuito franco.» no está sustentada por este registro.  Revisa: La pinza registra 5,6 A AC en L1 de KM1 frente a 3,8 A nominales de M1 y ajuste F2 de 3,8 A. La corriente registrada supera la nominal; el hecho de girar no establece operación normal ni prueba cortocircuito franco. No se aportan nuevas lecturas numéricas de L2 o L3 ni se deduce un tiempo de disparo. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-A: "el registro de tensiones equilibradas no confirma pérdida de fase. Revisa: El registro de tensiones entre fases permanece equilibrado, sin pérdida de fase documentada. El registro de protección identifica F2 disparado; el ensayo aislado entre el par NC 95–96 muestra OL. La apertura del permiso hace caer KM1. Esto identifica la actuación de protección, no la causa de la sobrecarga; debe investigarse la carga mecánica o la condición del motor. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-B: "La propuesta «La alimentación es necesariamente incorrecta.» no está sustentada por este registro.  Revisa: El registro de tensiones entre fases permanece equilibrado, sin pérdida de fase documentada. El registro de protección identifica F2 disparado; el ensayo aislado entre el par NC 95–96 muestra OL. La apertura del permiso hace caer KM1. Esto identifica la actuación de protección, no la causa de la sobrecarga; debe investigarse la carga mecánica o la condición del motor. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-B: "La propuesta «El relé está mal por disparar.» no está sustentada por este registro.  Revisa: Con la máquina consignada, el registro mecánico autorizado identifica resistencia anómala en el rodillo de retorno R1; tras desacoplar y comprobar según procedimiento, supera la referencia histórica. La imagen de desgaste orienta la inspección, pero no prueba por sí sola agarrotamiento. La explicación debe contrastarse tras reparación. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-C: "La propuesta «Se puede anular el relé.» no está sustentada por este registro.  Revisa: Con la máquina consignada, el registro mecánico autorizado identifica resistencia anómala en el rodillo de retorno R1; tras desacoplar y comprobar según procedimiento, supera la referencia histórica. La imagen de desgaste orienta la inspección, pero no prueba por sí sola agarrotamiento. La explicación debe contrastarse tras reparación. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-05-A: "La propuesta «Solo borrar alarma.» no está sustentada por este registro.  Revisa: El rodillo deteriorado causa sobrecarga mecánica. La protección térmica actúa correctamente; no se aumenta su ajuste ni se anula para compensar carga. La reparación mecánica debe ir seguida de verificación de corrientes y protección. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-05-C: "puede ocultar problema. Revisa: El rodillo deteriorado causa sobrecarga mecánica. La protección térmica actúa correctamente; no se aumenta su ajuste ni se anula para compensar carga. La reparación mecánica debe ir seguida de verificación de corrientes y protección. Vuelve a elegir sin ejecutar la opción propuesta."
  visual:
    educational_purpose: "Seis ilustraciones del caso simulado; registros eléctricos y mecánicos revelados por decisión. Revisión técnica humana pendiente."
