      - "Tras reparar rodillo, verificar corrientes dentro de límites y protección operativa."
    lesson: "reparación mecánica y confirmación de ajuste correcto, sin aumentar protección para compensar carga. Notebook — itinerario en Engineering Notes: article-011 (NB-EL-03): Potencia, energía y cargas industriales; article-016 (NB-EL-08): Fusibles, magnetotérmicos y protección de sobreintensidad; article-022 (NB-EL-14): Motores trifásicos, placa y relé de sobrecarga; article-029 (NB-EL-21): Método de diagnóstico; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
