locale: "es"
translations:
  title: "El motor se detiene por sobrecarga"
  summary: "La cinta arranca; al aumentar la carga mecánica, F2 dispara y KM1 cae. Motor M1 ficticio de 1,5 kW / 400 VAC / 50 Hz / 3,8 A; F2 ajustado y documentado a 3,8 A. Se comparan registros eléctricos y carga antes de cambiar ajustes o componentes. Todos los datos son didácticos simulados. Preview con ilustraciones; publicación bloqueada por QA técnico humano."
  scenario:
    initial_context: "La cinta arranca; al aumentar la carga mecánica, F2 dispara y KM1 cae. Motor M1 ficticio de 1,5 kW / 400 VAC / 50 Hz / 3,8 A; F2 ajustado y documentado a 3,8 A. Se comparan registros eléctricos y carga antes de cambiar ajustes o componentes. Todos los datos son didácticos simulados."
    operational_state: "Solo se conocen los datos del incidente; los registros se revelan por etapas. Notebook — itinerario en Engineering Notes: article-011 (NB-EL-03): Potencia, energía y cargas industriales; article-016 (NB-EL-08): Fusibles, magnetotérmicos y protección de sobreintensidad; article-022 (NB-EL-14): Motores trifásicos, placa y relé de sobrecarga; article-029 (NB-EL-21): Método de diagnóstico; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
    initiating_event: "El motor se detiene por sobrecarga"
    learner_role: "Técnico que interpreta un caso simulado y justifica diagnóstico, intervención y verificación."
    safety_context:
      safe_state: "Caso didáctico simulado. Las lecturas energizadas son registros ya obtenidos por personal autorizado. Antes de inspección invasiva, continuidad, resistencia o aislamiento: desenergización, consignación, ausencia de tensión verificada y control de energía almacenada según procedimiento de la instalación."
      intervention_constraints:
        - "El alumno interpreta registros; no realiza trabajos en tensión ni maniobras sobre una instalación real."
        - "No puentear STOP, E-STOP, relés térmicos, diferenciales ni otras protecciones; no usar PE como retorno."
        - "No medir resistencia en circuitos energizados ni aplicar megóhmetro a electrónica conectada."
        - "Se interpreta un registro de ensayo de continuidad ya obtenido por personal autorizado: circuito aislado, ausencia de tensión verificada y aislamiento suficiente para eliminar caminos paralelos. No se mide continuidad en tensión ni se realizan maniobras reales."
        - "Intervención solo por personal competente y autorizado conforme al procedimiento aplicable; no se inventan secuencias LOTO, EPI ni umbrales normativos."
        - "Preview didáctico: publicación bloqueada por QA humano; no es material aprobado para operación real."
  learning_objectives:
    OBJ-TRACE-CIRCUIT:
      description: "Notebook — itinerario en Engineering Notes: article-011 (NB-EL-03): Potencia, energía y cargas industriales; article-016 (NB-EL-08): Fusibles, magnetotérmicos y protección de sobreintensidad; article-022 (NB-EL-14): Motores trifásicos, placa y relé de sobrecarga; article-029 (NB-EL-21): Método de diagnóstico; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
    OBJ-INTERPRET-EVIDENCE:
      description: "Discriminar hipótesis con los registros disponibles sin adelantar la causa raíz."
    OBJ-VERIFY-RECOVERY:
      description: "Distinguir reparación realizada de recuperación verificada con criterios del caso."
  stages:
    STAGE-01-DIAGNOSIS:
      title: "Delimitar el síntoma"
      situation: "La cinta arranca; al aumentar la carga mecánica, F2 dispara y KM1 cae. Motor M1 ficticio de 1,5 kW / 400 VAC / 50 Hz / 3,8 A; F2 ajustado y documentado a 3,8 A. Se comparan registros eléctricos y carga antes de cambiar ajustes o componentes. Todos los datos son didácticos simulados.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-02-DIAGNOSIS:
      title: "Interpretar el primer registro"
      situation: "La pinza registra 5,6 A AC en L1 de KM1 frente a 3,8 A nominales de M1 y ajuste F2 de 3,8 A. La corriente registrada supera la nominal; el hecho de girar no establece operación normal ni prueba cortocircuito franco. No se aportan nuevas lecturas numéricas de L2 o L3 ni se deduce un tiempo de disparo. Se interpreta un registro de ensayo de continuidad ya obtenido por personal autorizado: circuito aislado, ausencia de tensión verificada y aislamiento suficiente para eliminar caminos paralelos. No se mide continuidad en tensión ni se realizan maniobras reales.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-03-DIAGNOSIS:
      title: "Contrastar hipótesis"
      situation: "El registro de tensiones entre fases permanece equilibrado, sin pérdida de fase documentada. El registro de protección identifica F2 disparado; el ensayo aislado entre el par NC 95–96 muestra OL. La apertura del permiso hace caer KM1. Esto identifica la actuación de protección, no la causa de la sobrecarga; debe investigarse la carga mecánica o la condición del motor.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-04-DIAGNOSIS:
      title: "Confirmar la causa e intervenir con seguridad"
      situation: "Con la máquina consignada, el registro mecánico autorizado identifica resistencia anómala en el rodillo de retorno R1; tras desacoplar y comprobar según procedimiento, supera la referencia histórica. La imagen de desgaste orienta la inspección, pero no prueba por sí sola agarrotamiento. La explicación debe contrastarse tras reparación.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-05-VERIFY-RECOVERY:
      title: "Verificar la recuperación"
      situation: "El rodillo deteriorado causa sobrecarga mecánica. La protección térmica actúa correctamente; no se aumenta su ajuste ni se anula para compensar carga. La reparación mecánica debe ir seguida de verificación de corrientes y protección.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
  evidence:
    EVID-00-RECORD:
      source: "Registro didáctico simulado · contexto"
      content: "La cinta arranca; al aumentar la carga mecánica, F2 dispara y KM1 cae. Motor M1 ficticio de 1,5 kW / 400 VAC / 50 Hz / 3,8 A; F2 ajustado y documentado a 3,8 A. Se comparan registros eléctricos y carga antes de cambiar ajustes o componentes. Todos los datos son didácticos simulados."
    EVID-01-RECORD:
      source: "Registro didáctico simulado · D1"
      content: "La pinza registra 5,6 A AC en L1 de KM1 frente a 3,8 A nominales de M1 y ajuste F2 de 3,8 A. La corriente registrada supera la nominal; el hecho de girar no establece operación normal ni prueba cortocircuito franco. No se aportan nuevas lecturas numéricas de L2 o L3 ni se deduce un tiempo de disparo."
    EVID-02-RECORD:
      source: "Registro didáctico simulado · D2"
      content: "El registro de tensiones entre fases permanece equilibrado, sin pérdida de fase documentada. El registro de protección identifica F2 disparado; el ensayo aislado entre el par NC 95–96 muestra OL. La apertura del permiso hace caer KM1. Esto identifica la actuación de protección, no la causa de la sobrecarga; debe investigarse la carga mecánica o la condición del motor."
    EVID-03-RECORD:
      source: "Registro didáctico simulado · D3"
      content: "Con la máquina consignada, el registro mecánico autorizado identifica resistencia anómala en el rodillo de retorno R1; tras desacoplar y comprobar según procedimiento, supera la referencia histórica. La imagen de desgaste orienta la inspección, pero no prueba por sí sola agarrotamiento. La explicación debe contrastarse tras reparación."
    EVID-04-RECORD:
      source: "Registro didáctico simulado · D4"
      content: "El rodillo deteriorado causa sobrecarga mecánica. La protección térmica actúa correctamente; no se aumenta su ajuste ni se anula para compensar carga. La reparación mecánica debe ir seguida de verificación de corrientes y protección."
    EVID-05-RECORD:
      source: "Registro didáctico simulado · D5"
      content: "Tras reparar el rodillo R1 en el caso simulado, el registro posreparación aporta 3,5 A en L1 frente a 3,8 A nominales y protección operativa según procedimiento. F2 conserva el ajuste documentado de 3,8 A. Se verifica la recuperación bajo carga; borrar la alarma, rearmar reiteradamente o reducir velocidad sin investigar no acredita recuperación."
  decisions:
    DEC-01-A:
      action: "Subir ajuste del relé hasta que no dispare. Rearmar reiteradamente sin investigar. Se trata el disparo como problema de ajuste y se evita investigar por qué aumenta la corriente bajo la nueva condición de producción."
    DEC-01-B:
      action: "Correlacionar corrientes, placa y carga mecánica."
    DEC-01-C:
      action: "Cambiar PLC."
    DEC-02-A:
      action: "5,6 A frente a 3,8 A demuestra corriente superior a nominal."
    DEC-02-B:
      action: "Es normal porque el motor gira. Se toma el movimiento visible como criterio suficiente para aceptar la corriente registrada, sin comparar el valor nominal ni la condición de carga."
    DEC-02-C:
      action: "Demuestra cortocircuito franco."
    DEC-03-A:
      action: "La pérdida de fase está confirmada. Se interpreta el disparo como pérdida de fase sin contrastarlo con el registro de tensiones equilibradas y la actuación de protección."
    DEC-03-B:
      action: "La alimentación es necesariamente incorrecta."
    DEC-03-C:
      action: "Priorizar sobrecarga mecánica o condición de motor; solicitar evidencia mecánica."
    DEC-04-A:
      action: "El rodillo con resistencia anómala explica el incremento de carga, sujeto a confirmación tras reparación."
    DEC-04-B:
      action: "El relé está mal por disparar. Se atribuye el incidente al dispositivo que interrumpe el circuito, en lugar de relacionar su actuación con la resistencia mecánica anómala del rodillo."
    DEC-04-C:
      action: "Se puede anular el relé."
    DEC-05-A:
      action: "Solo borrar alarma. Se considera que eliminar el aviso de interfaz equivale a recuperar la función, sin comparar corrientes tras la reparación ni comprobar protección operativa."
    DEC-05-B:
      action: "Tras reparar rodillo, verificar corrientes dentro de límites y protección operativa."
    DEC-05-C:
      action: "Reducir velocidad sin investigar."
  retry_feedback:
