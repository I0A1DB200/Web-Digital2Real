  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "KM2's L3 pole does not conduct, causing phase loss in the power circuit. Warning: with connected motors and induced/backfed voltages, actual readings may differ; this case uses an idealized isolated model and relies on pole inspection and comparison under an authorized procedure, not the voltage pattern alone. The simulated record after authorized KM2 replacement establishes three-phase, starting and protection checks under the procedure. The damage cause is reviewed, including wear, terminals and coordination; recovery rests on that verification, not the initial idealized pattern."
    process:
      - "Review three-phase distribution before and after protection and contactor."
      - "The upstream three-phase supply is approximately balanced."
      - "The anomaly is downstream of KM2 or in the measurement/load; investigate each pole."
      - "The isolated test confirms KM2's L3 pole is open."
      - "Authorized KM2 replacement, review of the damage cause and three-phase/start/protection checks."
    lesson: "use a contactor compliant with the design; investigate wear/terminals and coordination. Notebook — reading path in Engineering Notes: article-014 (NB-EL-06): Single-phase and three-phase supplies; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-022 (NB-EL-14): Three-phase motors, nameplates and overload relays; article-026 (NB-EL-18): Terminals, potentials and numbering; article-029 (NB-EL-21): Diagnostic method"
    avoided_errors:
      - "Change rotation direction."
      - "Disable the overload relay."
      - "L1 must be absent."
      - "There are 230 V between every pair of phases."
      - "The incoming transformer is proven defective."
      - "The before/after difference does not matter."
      - "Replace fuses without inspection."
      - "The PLC has reversed two phases."
      - "Reset and produce."
      - "Replace the motor directly."
    industrial_value:
      - "Traceable diagnosis without replacing components by elimination."
      - "Verified recovery with protection retained."
