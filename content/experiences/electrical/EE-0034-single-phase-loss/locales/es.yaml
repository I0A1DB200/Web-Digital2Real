    DEC-05-A: "La propuesta «Rearmar y producir.» no está sustentada por este registro.  Revisa: El polo L3 de KM2 no conduce y provoca pérdida de fase en potencia. Se requiere sustitución autorizada conforme al diseño y revisión de desgaste, terminales y coordinación. El diagnóstico no autoriza rearmar y producir sin verificar. Vuelve a elegir sin ejecutar la opción propuesta."
