    DEC-02-C: "La propuesta «Hay 230 V entre cada par de fases.» no está sustentada por este registro.  Revisa: En condición de prueba controlada con contactor cerrado, aguas arriba de KM2 se registran 400/401/399 V entre fases. La alimentación es aproximadamente equilibrada en el registro; no se deducen valores fase-neutro. Vuelve a elegir sin ejecutar la opción propuesta."
