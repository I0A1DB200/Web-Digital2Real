    DEC-03-C: "La propuesta «No importa la diferencia antes/después.» no está sustentada por este registro.  Revisa: Aguas abajo se registran L1-L2 400 V, L2-L3 0 V y L1-L3 400 V. Este patrón idealizado requiere contrastar medida, carga y cada polo; la comparación localiza la investigación, no demuestra por sí sola un defecto físico. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-A: "La propuesta «Cambiar fusibles sin revisar.» no está sustentada por este registro.  Revisa: El acta de inspección aislada identifica un polo de KM2 abierto por fallo de contacto en L3, contrastado con continuidad y estado mecánico según fabricante. El ensayo aislado confirma la falta de conducción, no una inferencia basada solo en tensiones. Vuelve a elegir sin ejecutar la opción propuesta."
