      - "La válvula está bloqueada mecánicamente."
      - "Rearmar repetidamente hasta estabilizar."
      - "Sustituir por fusible de mayor calibre."
      - "Solo borrar evento."
      - "Dejar Y2 desconectada sin documentar."
    industrial_value:
      - "Diagnóstico trazable sin sustituir componentes por descarte."
      - "Recuperación verificada manteniendo protecciones."
    media_ids: []
