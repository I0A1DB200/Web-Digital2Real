      - "Reparar cableado según especificación, inspeccionar ruta y verificar disparo selectivo/función."
    lesson: "sustituir tramo y corregir protección mecánica de cable. Notebook — itinerario en Engineering Notes: article-015 (NB-EL-07): Fuentes industriales de 24 VDC; article-016 (NB-EL-08): Fusibles, magnetotérmicos y protección de sobreintensidad; article-017 (NB-EL-09): Diferenciales, aislamiento y PE; article-018 (NB-EL-10): Selectividad, separación y distribución; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-029 (NB-EL-21): Método de diagnóstico; article-032 (NB-EL-24): Aislamiento y fugas"
    avoided_errors:
      - "Cambiar fuente principal."
      - "Aumentar límite de F24.2."
      - "Todos los 24 V del cuadro han fallado."
      - "El PLC está en STOP."
