  completion:
    title: "Debrief técnico"
    summary: "cortocircuito en cable de Y2, aguas abajo de protección F24.2; la protección cumple su función. Tras sustituir el tramo y corregir la protección mecánica del cable en el escenario simulado, se verifican ramal, función y actuación selectiva según procedimiento. Se conserva la coordinación prevista y se documenta la reparación; desconectar Y2 sin registrar no cierra el caso."
    process:
