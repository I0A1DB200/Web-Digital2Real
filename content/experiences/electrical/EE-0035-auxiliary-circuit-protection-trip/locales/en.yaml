    DEC-03-A: "The proposal “F24.2 must be defective.” is not supported by this record.  Review: The F24.2 record shows very high fault current and disconnection when Y2 is commanded. A mechanically blocked load does not by itself explain this short-circuit record; investigate insulation or a shorted load with the installation isolated and prepared. Choose again without carrying out the proposed option."
    DEC-03-B: "does not explain short-circuit current. Review: The F24.2 record shows very high fault current and disconnection when Y2 is commanded. A mechanically blocked load does not by itself explain this short-circuit record; investigate insulation or a shorted load with the installation isolated and prepared. Choose again without carrying out the proposed option."
    DEC-04-B: "The proposal “Reset repeatedly until stable.” is not supported by this record.  Review: Isolated inspection confirms damaged insulation on Y2's cable, with +24 V and 0 V conductors touching inside a cable duct. The separated and checked Y2 coil has no anomaly. F24.2 is not bypassed. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Replace with a higher-rated fuse.” is not supported by this record.  Review: Isolated inspection confirms damaged insulation on Y2's cable, with +24 V and 0 V conductors touching inside a cable duct. The separated and checked Y2 coil has no anomaly. F24.2 is not bypassed. Choose again without carrying out the proposed option."
    DEC-05-A: "The proposal “Only clear the event.” is not supported by this record.  Review: The short circuit is in the cable downstream of F24.2; protection fulfils its function. Repair requires replacing the section and correcting its mechanical protection. Repeated resets or a higher rating do not correct the defect. Choose again without carrying out the proposed option."
    DEC-05-C: "The proposal “Leave Y2 disconnected without documenting it.” is not supported by this record.  Review: The short circuit is in the cable downstream of F24.2; protection fulfils its function. Repair requires replacing the section and correcting its mechanical protection. Repeated resets or a higher rating do not correct the defect. Choose again without carrying out the proposed option."
  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "short circuit in Y2's cable downstream of F24.2; protection fulfils its function. After replacing the section and correcting mechanical cable protection in the simulated scenario, branch, function and selective operation are verified under the procedure. Intended coordination is retained and the repair documented; disconnecting Y2 without a record does not close the case."
    process:
      - "Identify exactly which protection and branch disconnect."
      - "The defect is associated with Y2's branch or its load."
      - "Seek an insulation fault or shorted load using an isolated procedure."
      - "The cable with +24 V and 0 V in contact confirms the cause; F24.2 must not be bypassed."
      - "Repair wiring to specification, inspect its route and verify selective tripping/function."
    lesson: "replace the section and correct mechanical cable protection. Notebook — reading path in Engineering Notes: article-015 (NB-EL-07): Industrial 24 VDC power supplies; article-016 (NB-EL-08): Fuses, circuit breakers and overcurrent protection; article-017 (NB-EL-09): RCDs, insulation and PE; article-018 (NB-EL-10): Selectivity, segregation and distribution; article-026 (NB-EL-18): Terminals, potentials and numbering; article-029 (NB-EL-21): Diagnostic method; article-032 (NB-EL-24): Insulation and leakage"
    avoided_errors:
