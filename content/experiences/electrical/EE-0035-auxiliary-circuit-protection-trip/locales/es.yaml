    DEC-02-C: "La propuesta «El PLC está en STOP.» no está sustentada por este registro.  Revisa: F24.2 identifica el ramal de Y2. Los demás ramales permanecen activos y PS1 mantiene 24,1 V. La evidencia delimita el fallo a la rama o carga; no demuestra un fallo general de los 24 V ni PLC en STOP. Vuelve a elegir sin ejecutar la opción propuesta."
