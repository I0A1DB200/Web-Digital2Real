    DEC-03-B: "no explica corriente de cortocircuito. Revisa: El registro externo simulado del ramal F24.2 muestra corriente de fallo muy elevada y desconexión al ordenar Y2. Una carga mecánica bloqueada no explica por sí sola este registro de cortocircuito; corresponde investigar aislamiento o carga en corto con instalación aislada y preparada. Vuelve a elegir sin ejecutar la opción propuesta."
