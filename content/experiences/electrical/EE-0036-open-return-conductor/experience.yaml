    lesson: "reparación y trazabilidad del retorno, no modificación de lógica. Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-028 (NB-EL-20): Trazabilidad y control de revisiones; article-029 (NB-EL-21): Método de diagnóstico"
