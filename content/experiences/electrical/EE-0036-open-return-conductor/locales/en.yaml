      - "After authorized conductor repair, verify A1-A2 voltage under command and Y3 actuation."
    lesson: "repair and trace the return, without changing logic. Notebook — reading path in Engineering Notes: article-009 (NB-EL-01): Voltage, current, resistance and a closed circuit; article-012 (NB-EL-04): Multimeters, clamps and interpreting measurements; article-026 (NB-EL-18): Terminals, potentials and numbering; article-028 (NB-EL-20): Traceability and revision control; article-029 (NB-EL-21): Diagnostic method"
