  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "interrupted 0 V return between X2:8 and the 0 V bar. The PLC commands, but there is no closed circuit. After authorized return repair in the simulated case, effective A1-A2 voltage under command and correct Y3 actuation are verified. Conductor traceability is retained without changing logic or using PE; Q0.3=TRUE alone does not verify recovery."
