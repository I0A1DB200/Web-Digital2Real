    DEC-04-A: "The proposal “Replace the PLC output.” is not supported by this record.  Review: With the installation isolated and absence of voltage verified, the test records an open circuit between X2:8 and the 0 V bar. The report locates the interrupted return. In this case, 24 V at A2 results from the open return and coupling through the coil. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Bridge to PE as a return.” is not supported by this record.  Review: With the installation isolated and absence of voltage verified, the test records an open circuit between X2:8 and the 0 V bar. The report locates the interrupted return. In this case, 24 V at A2 results from the open return and coupling through the coil. Choose again without carrying out the proposed option."
