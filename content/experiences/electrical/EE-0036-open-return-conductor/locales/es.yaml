locale: "es"
translations:
  title: "Un conductor interrumpido impide activar la válvula"
  summary: "Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga. Preview textual; evidencias visuales y revisión técnica pendientes."
  scenario:
    initial_context: "Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga."
    operational_state: "Solo se conocen los datos del incidente; los registros se revelan por etapas. Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-028 (NB-EL-20): Trazabilidad y control de revisiones; article-029 (NB-EL-21): Método de diagnóstico"
    initiating_event: "Un conductor interrumpido impide activar la válvula"
    learner_role: "Técnico que interpreta un caso simulado y justifica diagnóstico, intervención y verificación."
    safety_context:
      safe_state: "Caso didáctico simulado. Las lecturas energizadas son registros ya obtenidos por personal autorizado. Antes de inspección invasiva, continuidad, resistencia o aislamiento: desenergización, consignación, ausencia de tensión verificada y control de energía almacenada según procedimiento de la instalación."
      intervention_constraints:
        - "El alumno interpreta registros; no realiza trabajos en tensión ni maniobras sobre una instalación real."
        - "No puentear STOP, E-STOP, relés térmicos, diferenciales ni otras protecciones; no usar PE como retorno."
        - "No medir resistencia en circuitos energizados ni aplicar megóhmetro a electrónica conectada."
        - "Intervención solo por personal competente y autorizado conforme al procedimiento aplicable; no se inventan secuencias LOTO, EPI ni umbrales normativos."
        - "Preview textual: imágenes de evidencia y revisión técnica/editorial pendientes; no es material aprobado para operación real."
  learning_objectives:
    OBJ-TRACE-CIRCUIT:
      description: "Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-028 (NB-EL-20): Trazabilidad y control de revisiones; article-029 (NB-EL-21): Método de diagnóstico"
    OBJ-INTERPRET-EVIDENCE:
      description: "Discriminar hipótesis con los registros disponibles sin adelantar la causa raíz."
    OBJ-VERIFY-RECOVERY:
      description: "Distinguir reparación realizada de recuperación verificada con criterios del caso."
  stages:
    STAGE-01-DIAGNOSIS:
      title: "Delimitar el síntoma"
      situation: "Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-02-DIAGNOSIS:
      title: "Interpretar el primer registro"
      situation: "Watch confirma Q0.3=TRUE. Este estado lógico no prueba continuidad del camino eléctrico ni tensión entre A1 y A2. Se compara la carga con su retorno usando registros autorizados.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-03-DIAGNOSIS:
      title: "Contrastar hipótesis"
      situation: "Bajo orden: salida Q0.3=24 V, A1=24 V y A2=24 V, todos respecto a 0 V del cuadro; A1-A2=0 V. La bobina no recibe diferencia de potencial de 24 V. La referencia y el retorno deben investigarse antes de culpar al programa.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-04-DIAGNOSIS:
      title: "Confirmar la causa e intervenir con seguridad"
      situation: "Con instalación aislada y ausencia de tensión verificada, el ensayo registra circuito abierto entre X2:8 y barra 0 V. El acta localiza el retorno interrumpido. Los 24 V en A2 se explican en este caso por retorno abierto y acoplamiento a través de la bobina.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
    STAGE-05-VERIFY-RECOVERY:
      title: "Verificar la recuperación"
      situation: "La causa está en el retorno 0 V entre X2:8 y barra 0 V: no hay circuito cerrado. Se repara y documenta el conductor bajo procedimiento autorizado; PE no puede utilizarse como retorno funcional.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
  evidence:
    EVID-00-RECORD:
      source: "Registro didáctico simulado · contexto"
      content: "Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga."
    EVID-01-RECORD:
      source: "Registro didáctico simulado · D1"
      content: "Watch confirma Q0.3=TRUE. Este estado lógico no prueba continuidad del camino eléctrico ni tensión entre A1 y A2. Se compara la carga con su retorno usando registros autorizados."
    EVID-02-RECORD:
      source: "Registro didáctico simulado · D2"
      content: "Bajo orden: salida Q0.3=24 V, A1=24 V y A2=24 V, todos respecto a 0 V del cuadro; A1-A2=0 V. La bobina no recibe diferencia de potencial de 24 V. La referencia y el retorno deben investigarse antes de culpar al programa."
    EVID-03-RECORD:
      source: "Registro didáctico simulado · D3"
      content: "Con instalación aislada y ausencia de tensión verificada, el ensayo registra circuito abierto entre X2:8 y barra 0 V. El acta localiza el retorno interrumpido. Los 24 V en A2 se explican en este caso por retorno abierto y acoplamiento a través de la bobina."
    EVID-04-RECORD:
      source: "Registro didáctico simulado · D4"
      content: "La causa está en el retorno 0 V entre X2:8 y barra 0 V: no hay circuito cerrado. Se repara y documenta el conductor bajo procedimiento autorizado; PE no puede utilizarse como retorno funcional."
    EVID-05-RECORD:
      source: "Registro didáctico simulado · D5"
      content: "Tras reparación autorizada del retorno en el caso simulado, se verifica tensión efectiva A1-A2 bajo orden y actuación correcta de Y3. Se conserva trazabilidad del conductor sin modificar lógica ni utilizar PE; Q0.3=TRUE por sí solo no verifica recuperación."
  decisions:
    DEC-01-A:
      action: "Comprobar tensión efectiva entre bornes de Y3 y retorno."
    DEC-01-B:
      action: "Cambiar programa PLC. Se propone corregir el software a partir de la falta de movimiento sin comparar la tensión efectiva entre A1 y A2 ni la continuidad del camino de retorno."
    DEC-01-C:
      action: "Sustituir Y3 sin medida."
    DEC-02-A:
      action: "Q0.3=TRUE confirma alimentación completa de Y3. Se equipara el estado lógico de Watch con tensión aplicada a la bobina y continuidad de ambos conductores, sin revisar la frontera física de salida y carga."
    DEC-02-B:
      action: "Q0.3=TRUE solo confirma estado lógico; hace falta comprobar camino eléctrico."
    DEC-02-C:
      action: "El sensor de posición es causa obligada."
    DEC-03-A:
      action: "A1=24 V y A2=24 V respecto a 0 V de cuadro, con 0 V entre A1-A2, apunta a retorno abierto u otro fallo de referencia."
    DEC-03-B:
      action: "La bobina recibe 24 V. Se interpreta cada lectura respecto a 0 V del cuadro como tensión aplicada, sin restar los potenciales de A1 y A2 ni considerar que la diferencia registrada es cero."
    DEC-03-C:
      action: "La fuente entrega 48 V."
    DEC-04-A:
      action: "Cambiar salida PLC. Se atribuye el fallo al módulo de salida aunque el acta de continuidad aislada localiza una interrupción entre X2:8 y la barra de retorno de 0 V."
    DEC-04-B:
      action: "El ensayo aislado abierto entre X2:8 y barra 0 V localiza el retorno interrumpido."
    DEC-04-C:
      action: "Puentear a PE como retorno."
    DEC-05-A:
      action: "Tras reparación autorizada del conductor, verificar tensión A1-A2 bajo orden y actuación Y3."
    DEC-05-B:
      action: "Usar PE de retorno permanente. Se plantea un retorno funcional por tierra como sustituto de la reparación del conductor documentado, sin restituir la arquitectura prevista de alimentación."
    DEC-05-C:
      action: "Cerrar incidencia por Q0.3=TRUE."
  retry_feedback:
    DEC-01-B: "La propuesta «Cambiar programa PLC.» no está sustentada por este registro.  Revisa: Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-01-C: "La propuesta «Sustituir Y3 sin medida.» no está sustentada por este registro.  Revisa: Q0.3 aparece activa, pero -Y3 no conmuta. Cableado: Q0.3 → X2:7 → Y3:A1; Y3:A2 → X2:8 → 0V. El alumno interpreta registros proporcionados, no mide en tensión. Hay que distinguir estado lógico de tensión efectiva en la carga. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-02-A: "La propuesta «Q0.3=TRUE confirma alimentación completa de Y3.» no está sustentada por este registro.  Revisa: Watch confirma Q0.3=TRUE. Este estado lógico no prueba continuidad del camino eléctrico ni tensión entre A1 y A2. Se compara la carga con su retorno usando registros autorizados. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-02-C: "La propuesta «El sensor de posición es causa obligada.» no está sustentada por este registro.  Revisa: Watch confirma Q0.3=TRUE. Este estado lógico no prueba continuidad del camino eléctrico ni tensión entre A1 y A2. Se compara la carga con su retorno usando registros autorizados. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-B: "La propuesta «La bobina recibe 24 V.» no está sustentada por este registro.  Revisa: Bajo orden: salida Q0.3=24 V, A1=24 V y A2=24 V, todos respecto a 0 V del cuadro; A1-A2=0 V. La bobina no recibe diferencia de potencial de 24 V. La referencia y el retorno deben investigarse antes de culpar al programa. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-C: "La propuesta «La fuente entrega 48 V.» no está sustentada por este registro.  Revisa: Bajo orden: salida Q0.3=24 V, A1=24 V y A2=24 V, todos respecto a 0 V del cuadro; A1-A2=0 V. La bobina no recibe diferencia de potencial de 24 V. La referencia y el retorno deben investigarse antes de culpar al programa. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-A: "La propuesta «Cambiar salida PLC.» no está sustentada por este registro.  Revisa: Con instalación aislada y ausencia de tensión verificada, el ensayo registra circuito abierto entre X2:8 y barra 0 V. El acta localiza el retorno interrumpido. Los 24 V en A2 se explican en este caso por retorno abierto y acoplamiento a través de la bobina. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-C: "La propuesta «Puentear a PE como retorno.» no está sustentada por este registro.  Revisa: Con instalación aislada y ausencia de tensión verificada, el ensayo registra circuito abierto entre X2:8 y barra 0 V. El acta localiza el retorno interrumpido. Los 24 V en A2 se explican en este caso por retorno abierto y acoplamiento a través de la bobina. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-05-B: "La propuesta «Usar PE de retorno permanente.» no está sustentada por este registro.  Revisa: La causa está en el retorno 0 V entre X2:8 y barra 0 V: no hay circuito cerrado. Se repara y documenta el conductor bajo procedimiento autorizado; PE no puede utilizarse como retorno funcional. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-05-C: "La propuesta «Cerrar incidencia por Q0.3=TRUE.» no está sustentada por este registro.  Revisa: La causa está en el retorno 0 V entre X2:8 y barra 0 V: no hay circuito cerrado. Se repara y documenta el conductor bajo procedimiento autorizado; PE no puede utilizarse como retorno funcional. Vuelve a elegir sin ejecutar la opción propuesta."
  visual:
    educational_purpose: "Evidencia textual progresiva; imágenes pendientes de suministro y aprobación. La portada ENV es solo contexto, nunca prueba eléctrica."
