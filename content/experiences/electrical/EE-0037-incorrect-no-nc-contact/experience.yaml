      type: "functional_test"
      source: "Registro didáctico simulado · D5"
      content: "Tras corrección autorizada en el escenario simulado, se comprueban STOP y START en reposo y accionamiento y el auto-mantenimiento. La secuencia de mando queda validada y documentada; un único arranque no sustituye la verificación completa."
      reliability: "confirmed"
      revealed_by:
        - "DEC-05-A"
      media_ids: []
  decisions:
    -
      id: "DEC-01-A"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Revisar correspondencia entre estado físico, plano y terminales."
    -
      id: "DEC-01-B"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Invertir bits en PLC inmediatamente. Se propone adaptar la interpretación software al comportamiento observado antes de comparar la designación de terminales y el estado de referencia del componente."
    -
      id: "DEC-01-C"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Cambiar motor."
    -
      id: "DEC-02-A"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "13-14 es NO en el componente documentado."
    -
      id: "DEC-02-B"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "Todos los contactos 13-14 son NC. Se generaliza el estado NC a esa numeración y se ignora la documentación del componente que distingue 13-14 de 21-22 para esta instalación."
    -
      id: "DEC-02-C"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "NO/NC depende del color del cable."
    -
      id: "DEC-03-A"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "Que el permiso aparezca al pulsar S3 concuerda con uso accidental de NO."
    -
      id: "DEC-03-B"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "Es prueba de pérdida de fase. Se atribuye el permiso de mando a una anomalía trifásica sin explicar la correspondencia documentada entre pulsación de S3 y cierre del par NO."
    -
      id: "DEC-03-C"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "El contactor está soldado."
    -
      id: "DEC-04-A"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Dejar el comportamiento y cambiar el texto HMI. Se propone adaptar la presentación al comportamiento invertido sin restituir el contacto NC en serie exigido por el plano de mando aprobado."
    -
      id: "DEC-04-B"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Verificar aislado que se usaron 13-14 en lugar de 21-22 y restituir plano."
    -
      id: "DEC-04-C"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Puentear S3."
    -
      id: "DEC-05-A"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Tras corrección autorizada, comprobar STOP y START en reposo/accionamiento y auto-mantenimiento."
    -
      id: "DEC-05-B"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Solo arrancar una vez. Se considera suficiente un arranque puntual sin comprobar la función de paro, el estado en reposo y accionamiento ni el auto-mantenimiento previsto en el mando."
    -
      id: "DEC-05-C"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Eliminar el contacto de paro."
