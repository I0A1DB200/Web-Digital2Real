    DEC-03-B: "The proposal “It proves phase loss.” is not supported by this record.  Review: The state record shows 13-14 open at rest and closed when pressed. Permission appearing when S3 is actuated is consistent with NO used where NC is expected; the installed connection still needs confirmation. Choose again without carrying out the proposed option."
    DEC-03-C: "The proposal “The contactor is welded.” is not supported by this record.  Review: The state record shows 13-14 open at rest and closed when pressed. Permission appearing when S3 is actuated is consistent with NO used where NC is expected; the installed connection still needs confirmation. Choose again without carrying out the proposed option."
    DEC-04-A: "The proposal “Leave the behaviour and change the HMI text.” is not supported by this record.  Review: Isolated verification finds NO pair 13-14 accidentally wired instead of NC 21-22. The assembly does not match the approved drawing and gives an inverted permission; it is not evidence of phase loss or a welded contactor. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Bypass S3.” is not supported by this record.  Review: Isolated verification finds NO pair 13-14 accidentally wired instead of NC 21-22. The assembly does not match the approved drawing and gives an inverted permission; it is not evidence of phase loss or a welded contactor. Choose again without carrying out the proposed option."
    DEC-05-B: "The proposal “Start only once.” is not supported by this record.  Review: An NO connection in a function requiring NC is confirmed. Wiring is restored to the drawing under an authorized procedure and the maintenance deviation recorded. Correction does not consist of inverting bits, changing HMI text or bypassing S3. Choose again without carrying out the proposed option."
    DEC-05-C: "The proposal “Remove the stop contact.” is not supported by this record.  Review: An NO connection in a function requiring NC is confirmed. Wiring is restored to the drawing under an authorized procedure and the maintenance deviation recorded. Correction does not consist of inverting bits, changing HMI text or bypassing S3. Choose again without carrying out the proposed option."
  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "connection to an NO contact in a function requiring NC according to the design. Important: do not confuse a process STOP with a safety emergency-stop function; this scenario does not modify a safety circuit. After authorized correction in the simulated scenario, STOP and START are checked at rest and when actuated, together with seal-in. The control sequence is validated and documented; one start does not replace full verification."
