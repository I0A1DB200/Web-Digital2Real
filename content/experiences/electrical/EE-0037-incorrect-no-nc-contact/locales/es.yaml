      - "Revisar correspondencia entre estado físico, plano y terminales."
      - "13-14 es NO en el componente documentado."
      - "Que el permiso aparezca al pulsar S3 concuerda con uso accidental de NO."
      - "Verificar aislado que se usaron 13-14 en lugar de 21-22 y restituir plano."
      - "Tras corrección autorizada, comprobar STOP y START en reposo/accionamiento y auto-mantenimiento."
    lesson: "restaurar cableado según plano, registrar desviación de mantenimiento. Notebook — itinerario en Engineering Notes: article-020 (NB-EL-12): Contactores, bobinas y auxiliares; article-021 (NB-EL-13): Pulsadores, auto-mantenimiento y enclavamientos; article-024 (NB-EL-16): Símbolos y convenciones; article-025 (NB-EL-17): Designación y referencias cruzadas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-027 (NB-EL-19): Lectura de esquemas de mando; article-028 (NB-EL-20): Trazabilidad y control de revisiones"
    avoided_errors:
      - "Invertir bits en PLC inmediatamente."
      - "Cambiar motor."
      - "Todos los contactos 13-14 son NC."
      - "NO/NC depende del color del cable."
      - "Es prueba de pérdida de fase."
      - "El contactor está soldado."
      - "Dejar el comportamiento y cambiar el texto HMI."
      - "Puentear S3."
      - "Solo arrancar una vez."
      - "Eliminar el contacto de paro."
    industrial_value:
      - "Diagnóstico trazable sin sustituir componentes por descarte."
      - "Recuperación verificada manteniendo protecciones."
