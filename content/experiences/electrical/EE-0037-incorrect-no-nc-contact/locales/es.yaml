    DEC-02-C: "La propuesta «NO/NC depende del color del cable.» no está sustentada por este registro.  Revisa: La documentación del componente identifica 13-14 como NO y 21-22 como NC. Se comparan designación, plano y estado físico; no se infiere NO/NC por color de hilo ni se universaliza una designación sin documentación. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-B: "La propuesta «Es prueba de pérdida de fase.» no está sustentada por este registro.  Revisa: El registro de estados muestra 13-14 abierto en reposo y cerrado al pulsar. La aparición de permiso al accionar S3 concuerda con uso de NO donde se espera NC; todavía debe confirmarse la conexión instalada. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-03-C: "La propuesta «El contactor está soldado.» no está sustentada por este registro.  Revisa: El registro de estados muestra 13-14 abierto en reposo y cerrado al pulsar. La aparición de permiso al accionar S3 concuerda con uso de NO donde se espera NC; todavía debe confirmarse la conexión instalada. Vuelve a elegir sin ejecutar la opción propuesta."
    DEC-04-A: "La propuesta «Dejar el comportamiento y cambiar el texto HMI.» no está sustentada por este registro.  Revisa: La verificación aislada encuentra el par NO 13-14 cableado accidentalmente en lugar de NC 21-22. El montaje no corresponde al plano aprobado y produce permiso inverso; no es una prueba de pérdida de fase ni contactor soldado. Vuelve a elegir sin ejecutar la opción propuesta."
