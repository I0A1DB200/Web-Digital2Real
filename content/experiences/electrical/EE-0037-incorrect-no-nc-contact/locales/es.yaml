    DEC-05-C: "La propuesta «Eliminar el contacto de paro.» no está sustentada por este registro.  Revisa: Se confirma conexión a NO en una función que requiere NC. Se restituye el cableado según plano bajo procedimiento autorizado y se registra la desviación de mantenimiento. La corrección no consiste en invertir bits, cambiar texto HMI o puentear S3. Vuelve a elegir sin ejecutar la opción propuesta."
  visual:
    educational_purpose: "Evidencia textual progresiva; imágenes pendientes de suministro y aprobación. La portada ENV es solo contexto, nunca prueba eléctrica."
  assets: {}
  completion:
    title: "Debrief técnico"
    summary: "conexión a contacto NO en una función que requiere NC según diseño. Importante: no confundir STOP de proceso con función de parada de emergencia de seguridad; el escenario no modifica un circuito de seguridad. Tras corrección autorizada en el escenario simulado, se comprueban STOP y START en reposo y accionamiento y el auto-mantenimiento. La secuencia de mando queda validada y documentada; un único arranque no sustituye la verificación completa."
