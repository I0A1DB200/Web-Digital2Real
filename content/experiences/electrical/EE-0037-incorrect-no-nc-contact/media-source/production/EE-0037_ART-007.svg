<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="white"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#18374a} .wire{fill:none;stroke:#24638b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><text x="85" y="85" font-size="38" text-anchor="start">START / STOP / KM3</text><text x="85" y="133" font-size="26" text-anchor="start">Verificación funcional simulada / Simulated functional verification</text><text x="95" y="230" font-size="26" text-anchor="start">Paso / Step</text><text x="710" y="230" font-size="26" text-anchor="start">START</text><text x="995" y="230" font-size="26" text-anchor="start">S3 STOP</text><text x="1335" y="230" font-size="26" text-anchor="start">KM3</text><polyline class="wire" points="85,358 1500,358"/><text x="95" y="320" font-size="25" text-anchor="start">1 · Reposo / Released</text><text x="750" y="320" font-size="32" text-anchor="start">0</text><text x="1040" y="320" font-size="32" text-anchor="start">0</text><text x="1360" y="320" font-size="32" text-anchor="start">0</text><polyline class="wire" points="85,463 1500,463"/><text x="95" y="425" font-size="25" text-anchor="start">2 · Pulsar START / Press START</text><text x="750" y="425" font-size="32" text-anchor="start">1</text><text x="1040" y="425" font-size="32" text-anchor="start">0</text><text x="1360" y="425" font-size="32" text-anchor="start">1</text><polyline class="wire" points="85,568 1500,568"/><text x="95" y="530" font-size="25" text-anchor="start">3 · Soltar START / Release START</text><text x="750" y="530" font-size="32" text-anchor="start">0</text><text x="1040" y="530" font-size="32" text-anchor="start">0</text><text x="1360" y="530" font-size="32" text-anchor="start">1</text><polyline class="wire" points="85,673 1500,673"/><text x="95" y="635" font-size="25" text-anchor="start">4 · Pulsar STOP / Press STOP</text><text x="750" y="635" font-size="32" text-anchor="start">0</text><text x="1040" y="635" font-size="32" text-anchor="start">1</text><text x="1360" y="635" font-size="32" text-anchor="start">0</text><polyline class="wire" points="85,778 1500,778"/><text x="95" y="740" font-size="25" text-anchor="start">5 · Soltar STOP / Release STOP</text><text x="750" y="740" font-size="32" text-anchor="start">0</text><text x="1040" y="740" font-size="32" text-anchor="start">0</text><text x="1360" y="740" font-size="32" text-anchor="start">0</text><text x="85" y="875" font-size="22" text-anchor="start">0 = no pulsado / released; 1 = pulsado / pressed · KM3: 0 OFF, 1 ON</text><text x="85" y="925" font-size="24" text-anchor="start">STOP prevalece; soltar STOP no rearranca / STOP overrides; releasing STOP does not restart</text></svg>