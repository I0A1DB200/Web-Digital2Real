    -
      id: "EVID-05-RECORD"
      type: "functional_test"
      source: "Registro didáctico simulado · D5"
      content: "La prueba autorizada del caso simulado confirma sentido previsto, carga, resguardos, enclavamientos y documentación. No se opera sin protecciones ni se acepta giro inverso solo porque el motor funcione."
      reliability: "confirmed"
      revealed_by:
        - "DEC-05-B"
      media_ids: []
  decisions:
    -
      id: "DEC-01-A"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Confirmar tipo de accionamiento y documentación de conexiones."
    -
      id: "DEC-01-B"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Cambiar sentido de giro del PLC sin verificar circuito. Se propone corregir la orden de software antes de confirmar si M4 usa arranque directo o variador y de comparar las conexiones con el plano aprobado."
    -
      id: "DEC-01-C"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Desactivar protección térmica."
    -
      id: "DEC-02-A"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "En arranque directo trifásico, intercambiar dos fases puede invertir sentido de giro."
    -
      id: "DEC-02-B"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "El neutro determina siempre el giro. Se atribuye la orientación del campo giratorio al conductor neutro sin contrastar la secuencia de fases aplicada a U1, V1 y W1 en este arranque directo."
    -
      id: "DEC-02-C"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "El giro solo depende del PLC."
    -
      id: "DEC-03-A"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "El motor debe estar averiado internamente. Se concluye fallo del motor por el sentido observado sin explicar la diferencia entre el conexionado aprobado y la permuta L1/L2 registrada tras sustitución."
    -
      id: "DEC-03-B"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "El esquema y la conexión real muestran permuta L1/L2."
    -
      id: "DEC-03-C"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "La frecuencia es necesariamente 60 Hz."
    -
      id: "DEC-04-A"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Reconfigurar los terminales según plano y procedimiento autorizado tras aislamiento."
    -
      id: "DEC-04-B"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Cambiar fases con el motor energizado. La propuesta plantea intervenir directamente sobre las fases sin aplicar aislamiento previo ni controlar el riesgo mecánico del transportador según procedimiento."
    -
      id: "DEC-04-C"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Invertir tierra PE."
    -
      id: "DEC-05-A"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Basta comprobar giro en vacío sin protecciones. Se propone aceptar una observación parcial sin verificar carga, resguardos, enclavamientos y documentación en las condiciones de prueba autorizadas del equipo."
    -
      id: "DEC-05-B"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Verificar sentido, carga, resguardos, enclavamientos y documentación en prueba autorizada."
    -
      id: "DEC-05-C"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Mantener giro inverso porque el motor funciona."
