public:
  slug: "incorrect-motor-rotation"
  title: "El motor gira en sentido contrario"
  summary: "Tras sustituir -M4 en un transportador, el motor trifásico gira en sentido contrario al previsto. Se requiere confirmar accionamiento y documentación. Cualquier corrección real exige consignación, personal competente y verificación de riesgos mecánicos; no se propone maniobra en tensión. Preview textual; evidencias visuales y revisión técnica pendientes."
  estimated_duration: 20
  scenario:
    initial_context: "Tras sustituir -M4 en un transportador, el motor trifásico gira en sentido contrario al previsto. Se requiere confirmar accionamiento y documentación. Cualquier corrección real exige consignación, personal competente y verificación de riesgos mecánicos; no se propone maniobra en tensión."
    operational_state: "Solo se conocen los datos del incidente; los registros se revelan por etapas. Notebook — itinerario en Engineering Notes: article-014 (NB-EL-06): Alimentación monofásica y trifásica; article-022 (NB-EL-14): Motores trifásicos, placa y relé de sobrecarga; article-024 (NB-EL-16): Símbolos y convenciones; article-025 (NB-EL-17): Designación y referencias cruzadas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
    initiating_event: "El motor gira en sentido contrario"
    learner_role: "Técnico que interpreta un caso simulado y justifica diagnóstico, intervención y verificación."
    safety_context:
      safe_state: "Caso didáctico simulado. Las lecturas energizadas son registros ya obtenidos por personal autorizado. Antes de inspección invasiva, continuidad, resistencia o aislamiento: desenergización, consignación, ausencia de tensión verificada y control de energía almacenada según procedimiento de la instalación."
      intervention_constraints:
        - "El alumno interpreta registros; no realiza trabajos en tensión ni maniobras sobre una instalación real."
        - "No puentear STOP, E-STOP, relés térmicos, diferenciales ni otras protecciones; no usar PE como retorno."
        - "No medir resistencia en circuitos energizados ni aplicar megóhmetro a electrónica conectada."
        - "Intervención solo por personal competente y autorizado conforme al procedimiento aplicable; no se inventan secuencias LOTO, EPI ni umbrales normativos."
        - "Preview textual: imágenes de evidencia y revisión técnica/editorial pendientes; no es material aprobado para operación real."
  learning_objectives:
    -
      id: "OBJ-TRACE-CIRCUIT"
      description: "Notebook — itinerario en Engineering Notes: article-014 (NB-EL-06): Alimentación monofásica y trifásica; article-022 (NB-EL-14): Motores trifásicos, placa y relé de sobrecarga; article-024 (NB-EL-16): Símbolos y convenciones; article-025 (NB-EL-17): Designación y referencias cruzadas; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
      capability_id: "ICF-06"
      competency_id: "COMP-EL-CIRCUIT-TRACEABILITY"
    -
      id: "OBJ-INTERPRET-EVIDENCE"
      description: "Discriminar hipótesis con los registros disponibles sin adelantar la causa raíz."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-EVIDENCE-INTERPRETATION"
    -
      id: "OBJ-VERIFY-RECOVERY"
      description: "Distinguir reparación realizada de recuperación verificada con criterios del caso."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-VERIFIED-RECOVERY"
  stages:
    -
      id: "STAGE-01-DIAGNOSIS"
      phase: "incident"
      title: "Delimitar el síntoma"
      situation: "Tras sustituir -M4 en un transportador, el motor trifásico gira en sentido contrario al previsto. Se requiere confirmar accionamiento y documentación. Cualquier corrección real exige consignación, personal competente y verificación de riesgos mecánicos; no se propone maniobra en tensión.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-00-RECORD"
      decision_ids:
        - "DEC-01-A"
        - "DEC-01-B"
        - "DEC-01-C"
      media_ids: []
    -
      id: "STAGE-02-DIAGNOSIS"
      phase: "investigation"
      title: "Interpretar el primer registro"
      situation: "M4 tiene arranque directo sin variador. El plano de bornes aprobado indica L1→U1, L2→V1, L3→W1. En este sistema, una permuta de dos fases puede invertir el giro; no se atribuye automáticamente a PLC o neutro.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-01-RECORD"
      decision_ids:
        - "DEC-02-A"
        - "DEC-02-B"
        - "DEC-02-C"
      media_ids: []
    -
      id: "STAGE-03-DIAGNOSIS"
      phase: "investigation"
      title: "Contrastar hipótesis"
      situation: "La inspección aislada registra L1→V1, L2→U1, L3→W1 frente al plano L1→U1, L2→V1, L3→W1. Se observa permuta L1/L2 respecto al montaje validado, no evidencia de cambio de frecuencia o fallo interno obligatorio del motor.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-02-RECORD"
      decision_ids:
        - "DEC-03-A"
        - "DEC-03-B"
        - "DEC-03-C"
      media_ids: []
    -
      id: "STAGE-04-DIAGNOSIS"
      phase: "investigation"
      title: "Confirmar la causa e intervenir con seguridad"
      situation: "La comparación de plano y conexión real confirma dos fases intercambiadas durante la sustitución. La secuencia aplicada está invertida respecto a diseño. La reconfiguración se planifica solo tras aislamiento conforme al procedimiento autorizado; PE no es una fase intercambiable.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-03-RECORD"
      decision_ids:
        - "DEC-04-A"
        - "DEC-04-B"
        - "DEC-04-C"
      media_ids: []
    -
      id: "STAGE-05-VERIFY-RECOVERY"
      phase: "solution"
      title: "Verificar la recuperación"
      situation: "Los terminales se han restituido según plano en la intervención autorizada del escenario. Esta corrección por sí sola no establece recuperación: queda verificar sentido, carga, resguardos, enclavamientos y documentación en prueba autorizada.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-04-RECORD"
      decision_ids:
        - "DEC-05-A"
        - "DEC-05-B"
        - "DEC-05-C"
      media_ids: []
