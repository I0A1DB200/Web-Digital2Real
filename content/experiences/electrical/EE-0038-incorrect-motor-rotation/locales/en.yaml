    DEC-01-C: "The proposal “Disable thermal protection.” is not supported by this record.  Review: After -M4 is replaced on a conveyor, the three-phase motor rotates opposite to the intended direction. Drive type and documentation must be confirmed. Any actual correction requires lockout, competent personnel and mechanical-risk verification; no energized operation is proposed. Choose again without carrying out the proposed option."
    DEC-02-B: "The proposal “Neutral always determines rotation.” is not supported by this record.  Review: M4 has direct-on-line starting without a drive. The approved terminal drawing specifies L1→U1, L2→V1, L3→W1. Interchanging two phases can reverse rotation in this system; it is not automatically attributed to PLC or neutral. Choose again without carrying out the proposed option."
    DEC-02-C: "The proposal “Rotation depends only on the PLC.” is not supported by this record.  Review: M4 has direct-on-line starting without a drive. The approved terminal drawing specifies L1→U1, L2→V1, L3→W1. Interchanging two phases can reverse rotation in this system; it is not automatically attributed to PLC or neutral. Choose again without carrying out the proposed option."
    DEC-03-A: "The proposal “The motor must have an internal fault.” is not supported by this record.  Review: Isolated inspection records L1→V1, L2→U1, L3→W1 versus drawing L1→U1, L2→V1, L3→W1. L1/L2 are interchanged relative to the validated installation; there is no evidence of a frequency change or a necessary internal motor fault. Choose again without carrying out the proposed option."
    DEC-03-C: "The proposal “Frequency must be 60 Hz.” is not supported by this record.  Review: Isolated inspection records L1→V1, L2→U1, L3→W1 versus drawing L1→U1, L2→V1, L3→W1. L1/L2 are interchanged relative to the validated installation; there is no evidence of a frequency change or a necessary internal motor fault. Choose again without carrying out the proposed option."
    DEC-04-B: "The proposal “Change phases with the motor energized.” is not supported by this record.  Review: Drawing-to-installation comparison confirms two phases interchanged during replacement. The applied sequence is reversed relative to design. Reconfiguration is planned only after isolation under the authorized procedure; PE is not an interchangeable phase. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Reverse protective earth PE.” is not supported by this record.  Review: Drawing-to-installation comparison confirms two phases interchanged during replacement. The applied sequence is reversed relative to design. Reconfiguration is planned only after isolation under the authorized procedure; PE is not an interchangeable phase. Choose again without carrying out the proposed option."
    DEC-05-A: "The proposal “Checking no-load rotation without protection is sufficient.” is not supported by this record.  Review: Terminals have been restored to the drawing in the scenario's authorized intervention. This correction alone does not establish recovery: direction, load, guards, interlocks and documentation still require an authorized test. Choose again without carrying out the proposed option."
    DEC-05-C: "The proposal “Keep reverse rotation because the motor operates.” is not supported by this record.  Review: Terminals have been restored to the drawing in the scenario's authorized intervention. This correction alone does not establish recovery: direction, load, guards, interlocks and documentation still require an authorized test. Choose again without carrying out the proposed option."
  visual:
    educational_purpose: "Progressive textual evidence; images await supply and approval. The ENV cover is context only, never electrical proof."
  assets: {}
  completion:
    title: "Technical debrief"
    summary: "two phases were interchanged at the motor terminals during replacement. Actual correction requires lockout, competent personnel and verification of mechanical risks; no energized operation is proposed. The simulated case's authorized test confirms intended direction, load, guards, interlocks and documentation. Operation without protection is not allowed, and reverse rotation is not accepted merely because the motor runs."
    process:
      - "Confirm drive type and connection documentation."
      - "With three-phase direct-on-line starting, interchanging two phases can reverse rotation."
