public:
  slug: "excessive-voltage-drop-at-terminal"
  title: "Caída de tensión por conexión defectuosa"
  summary: "El actuador 24 VDC -Y4 funciona en vacío pero falla al accionar. Se comparan fuente PS2, distribución X4 y carga Y4 en el mismo estado; las lecturas aportadas no autorizan medidas en vivo. Preview textual; evidencias visuales y revisión técnica pendientes."
  estimated_duration: 20
  scenario:
    initial_context: "El actuador 24 VDC -Y4 funciona en vacío pero falla al accionar. Se comparan fuente PS2, distribución X4 y carga Y4 en el mismo estado; las lecturas aportadas no autorizan medidas en vivo."
    operational_state: "Solo se conocen los datos del incidente; los registros se revelan por etapas. Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-015 (NB-EL-07): Fuentes industriales de 24 VDC; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-031 (NB-EL-23): Diagnóstico por comparación y bajo carga"
    initiating_event: "Caída de tensión por conexión defectuosa"
    learner_role: "Técnico que interpreta un caso simulado y justifica diagnóstico, intervención y verificación."
    safety_context:
      safe_state: "Caso didáctico simulado. Las lecturas energizadas son registros ya obtenidos por personal autorizado. Antes de inspección invasiva, continuidad, resistencia o aislamiento: desenergización, consignación, ausencia de tensión verificada y control de energía almacenada según procedimiento de la instalación."
      intervention_constraints:
        - "El alumno interpreta registros; no realiza trabajos en tensión ni maniobras sobre una instalación real."
        - "No puentear STOP, E-STOP, relés térmicos, diferenciales ni otras protecciones; no usar PE como retorno."
        - "No medir resistencia en circuitos energizados ni aplicar megóhmetro a electrónica conectada."
        - "Intervención solo por personal competente y autorizado conforme al procedimiento aplicable; no se inventan secuencias LOTO, EPI ni umbrales normativos."
        - "Preview textual: imágenes de evidencia y revisión técnica/editorial pendientes; no es material aprobado para operación real."
  learning_objectives:
    -
      id: "OBJ-TRACE-CIRCUIT"
      description: "Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-015 (NB-EL-07): Fuentes industriales de 24 VDC; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-031 (NB-EL-23): Diagnóstico por comparación y bajo carga"
      capability_id: "ICF-06"
      competency_id: "COMP-EL-CIRCUIT-TRACEABILITY"
    -
      id: "OBJ-INTERPRET-EVIDENCE"
      description: "Discriminar hipótesis con los registros disponibles sin adelantar la causa raíz."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-EVIDENCE-INTERPRETATION"
    -
      id: "OBJ-VERIFY-RECOVERY"
      description: "Distinguir reparación realizada de recuperación verificada con criterios del caso."
      capability_id: "ICF-06"
      competency_id: "COMP-EL-VERIFIED-RECOVERY"
  stages:
    -
      id: "STAGE-01-DIAGNOSIS"
      phase: "incident"
      title: "Delimitar el síntoma"
      situation: "El actuador 24 VDC -Y4 funciona en vacío pero falla al accionar. Se comparan fuente PS2, distribución X4 y carga Y4 en el mismo estado; las lecturas aportadas no autorizan medidas en vivo.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-00-RECORD"
      decision_ids:
        - "DEC-01-A"
        - "DEC-01-B"
        - "DEC-01-C"
      media_ids: []
    -
      id: "STAGE-02-DIAGNOSIS"
      phase: "investigation"
      title: "Interpretar el primer registro"
      situation: "Durante orden PS2 mantiene 24,1 V. En Y4 se registran 23,9 V sin carga y 16,9 V bajo carga de 1,4 A. Una fuente estable y caída en la carga dirigen el diagnóstico a distribución, no a caída en origen.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-01-RECORD"
      decision_ids:
        - "DEC-02-A"
        - "DEC-02-B"
        - "DEC-02-C"
      media_ids: []
    -
      id: "STAGE-03-DIAGNOSIS"
      phase: "investigation"
      title: "Contrastar hipótesis"
      situation: "El registro autorizado localiza una caída de 6,8 V a través de X4:12 bajo carga. Es anómala para una conexión prevista de baja resistencia y no prueba error de programa. A 1,4 A equivale aproximadamente a 4,9 Ω en ese estado; no se supone resistencia constante con temperatura.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-02-RECORD"
      decision_ids:
        - "DEC-03-A"
        - "DEC-03-B"
        - "DEC-03-C"
      media_ids: []
    -
      id: "STAGE-04-DIAGNOSIS"
      phase: "investigation"
      title: "Confirmar la causa e intervenir con seguridad"
      situation: "La inspección con circuito aislado identifica apriete fuera de especificación y daño térmico en X4:12. La caída localizada y el acta confirman resistencia de contacto elevada. Se debe reparar según especificación sin retirar fusible ni subir fuente a 31 V.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-03-RECORD"
      decision_ids:
        - "DEC-04-A"
        - "DEC-04-B"
        - "DEC-04-C"
      media_ids: []
    -
      id: "STAGE-05-VERIFY-RECOVERY"
      phase: "solution"
      title: "Verificar la recuperación"
      situation: "La conexión deteriorada requiere reparación y revisión de la causa de deterioro. Una lectura en vacío o una sustitución de Y4 sin prueba no verifica la recuperación. Se conserva protección y se prepara comparación bajo carga.\n\n¿Qué interpretación o acción está justificada con la evidencia disponible?"
      evidence_ids:
        - "EVID-04-RECORD"
      decision_ids:
        - "DEC-05-A"
        - "DEC-05-B"
        - "DEC-05-C"
      media_ids: []
  evidence:
    -
      id: "EVID-00-RECORD"
      type: "initial_observation"
      source: "Registro didáctico simulado · contexto"
      content: "El actuador 24 VDC -Y4 funciona en vacío pero falla al accionar. Se comparan fuente PS2, distribución X4 y carga Y4 en el mismo estado; las lecturas aportadas no autorizan medidas en vivo."
      reliability: "high"
      revealed_by: []
      media_ids: []
    -
      id: "EVID-01-RECORD"
      type: "diagnostic"
      source: "Registro didáctico simulado · D1"
      content: "Durante orden PS2 mantiene 24,1 V. En Y4 se registran 23,9 V sin carga y 16,9 V bajo carga de 1,4 A. Una fuente estable y caída en la carga dirigen el diagnóstico a distribución, no a caída en origen."
      reliability: "confirmed"
      revealed_by:
        - "DEC-01-A"
      media_ids: []
    -
      id: "EVID-02-RECORD"
      type: "diagnostic"
      source: "Registro didáctico simulado · D2"
      content: "El registro autorizado localiza una caída de 6,8 V a través de X4:12 bajo carga. Es anómala para una conexión prevista de baja resistencia y no prueba error de programa. A 1,4 A equivale aproximadamente a 4,9 Ω en ese estado; no se supone resistencia constante con temperatura."
      reliability: "confirmed"
      revealed_by:
        - "DEC-02-A"
      media_ids: []
    -
      id: "EVID-03-RECORD"
      type: "diagnostic"
      source: "Registro didáctico simulado · D3"
      content: "La inspección con circuito aislado identifica apriete fuera de especificación y daño térmico en X4:12. La caída localizada y el acta confirman resistencia de contacto elevada. Se debe reparar según especificación sin retirar fusible ni subir fuente a 31 V."
      reliability: "confirmed"
      revealed_by:
        - "DEC-03-A"
      media_ids: []
    -
      id: "EVID-04-RECORD"
      type: "diagnostic"
      source: "Registro didáctico simulado · D4"
      content: "La conexión deteriorada requiere reparación y revisión de la causa de deterioro. Una lectura en vacío o una sustitución de Y4 sin prueba no verifica la recuperación. Se conserva protección y se prepara comparación bajo carga."
      reliability: "confirmed"
      revealed_by:
        - "DEC-04-B"
      media_ids: []
    -
      id: "EVID-05-RECORD"
      type: "functional_test"
      source: "Registro didáctico simulado · D5"
      content: "Tras reparar la conexión y revisar su causa en el caso simulado, se verifica caída de tensión bajo carga, registro de tensión estable, calentamiento y estado del borne según especificación. No se inventa una tolerancia numérica ni se cierra con solo 24 V en vacío."
      reliability: "confirmed"
      revealed_by:
        - "DEC-05-A"
      media_ids: []
  decisions:
    -
      id: "DEC-01-A"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Comparar tensión de fuente y carga en el mismo estado de funcionamiento."
    -
      id: "DEC-01-B"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Medir solo en vacío. Se propone usar la lectura de reposo como criterio principal sin contrastar PS2 y Y4 durante la misma orden ni investigar el cambio que aparece al circular corriente."
    -
      id: "DEC-01-C"
      stage_id: "STAGE-01-DIAGNOSIS"
      action: "Cambiar PLC."
    -
      id: "DEC-02-A"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "PS2=24,1 V y Y4=16,9 V bajo carga indican caída en distribución."
    -
      id: "DEC-02-B"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "La fuente cae a 16,9 V. Se atribuye a la propia fuente la lectura del extremo de carga, sin distinguir los puntos de registro ni mantener la comparación en el mismo estado de funcionamiento."
    -
      id: "DEC-02-C"
      stage_id: "STAGE-02-DIAGNOSIS"
      action: "Y4 recibe 24,1 V."
    -
      id: "DEC-03-A"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "6,8 V a través de X4:12 bajo carga es anómalo para una conexión prevista de baja resistencia."
    -
      id: "DEC-03-B"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "Es la caída normal de cualquier borne. Se considera esa caída una propiedad normal de cualquier terminal sin contrastar la función de una conexión de baja resistencia y el calentamiento del punto localizado."
    -
      id: "DEC-03-C"
      stage_id: "STAGE-03-DIAGNOSIS"
      action: "Prueba error de programa."
    -
      id: "DEC-04-A"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Eliminar fusible para reducir resistencia. Se propone reducir impedancia retirando protección en lugar de corregir el apriete fuera de especificación y el daño térmico que documenta la inspección aislada."
    -
      id: "DEC-04-B"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Inspección aislada confirma deterioro de terminal; reparar según especificación."
    -
      id: "DEC-04-C"
      stage_id: "STAGE-04-DIAGNOSIS"
      action: "Subir salida de fuente a 31 V para compensar."
    -
      id: "DEC-05-A"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Verificar caída de tensión bajo carga tras reparar y revisar calentamiento y estado del borne."
    -
      id: "DEC-05-B"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Cerrar caso al ver 24 V en vacío. Se toma la tensión sin carga como demostración de recuperación, sin registrar la caída bajo carga ni revisar calentamiento y estado de la conexión reparada."
    -
      id: "DEC-05-C"
      stage_id: "STAGE-05-VERIFY-RECOVERY"
      action: "Sustituir Y4 sin prueba."
