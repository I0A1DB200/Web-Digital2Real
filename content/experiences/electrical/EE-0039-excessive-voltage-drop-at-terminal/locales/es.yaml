    process:
      - "Comparar tensión de fuente y carga en el mismo estado de funcionamiento."
      - "PS2=24,1 V y Y4=16,9 V bajo carga indican caída en distribución."
      - "6,8 V a través de X4:12 bajo carga es anómalo para una conexión prevista de baja resistencia."
      - "Inspección aislada confirma deterioro de terminal; reparar según especificación."
      - "Verificar caída de tensión bajo carga tras reparar y revisar calentamiento y estado del borne."
    lesson: "reparar conexión y revisar causa de deterioro. Notebook — itinerario en Engineering Notes: article-009 (NB-EL-01): Tensión, corriente, resistencia y circuito cerrado; article-012 (NB-EL-04): Multímetro, pinza y lectura de medidas; article-015 (NB-EL-07): Fuentes industriales de 24 VDC; article-026 (NB-EL-18): Borneros, potenciales y numeración; article-031 (NB-EL-23): Diagnóstico por comparación y bajo carga"
    avoided_errors:
