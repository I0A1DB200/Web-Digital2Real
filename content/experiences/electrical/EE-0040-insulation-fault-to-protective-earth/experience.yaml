  completion:
    title: "Debrief técnico"
    summary: "degradación de aislamiento en EH1 favorecida por humedad, con fuga a partes conectadas a PE. El diferencial actúa; no se anula para mantener producción. Tras reparación autorizada y secado o recambio apropiado en el caso simulado, se repiten verificaciones eléctricas y de función de protección conforme al protocolo específico. RCD y PE siguen operativos; no se aceptan rearmes indefinidos. La selección final de tensión y criterio de aislamiento sigue pendiente de revisión de equipo y norma para producción."
