      - "Interpretar ensayo de aislamiento ya realizado en circuito aislado y preparado, conforme a especificación."
      - "Tras reparación autorizada y secado/recambio apropiado, repetir verificaciones eléctricas y función de protección."
    lesson: "localizar y corregir componente/conexión afectado, controlar entrada de humedad, verificar con protocolo autorizado. Notebook — itinerario en Engineering Notes: article-017 (NB-EL-09): Diferenciales, aislamiento y PE; article-030 (NB-EL-22): Consignación y comprobación de ausencia de tensión; article-032 (NB-EL-24): Aislamiento y fugas; article-033 (NB-EL-25): Verificación, recurrencia y documentación"
