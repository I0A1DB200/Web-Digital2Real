    DEC-04-A: "The proposal “Measure insulation with EH1 energized.” is not supported by this record.  Review: The test report, produced by authorized personnel after lockout, electronics disconnection and preparation, records abnormally low resistance between EH1's circuit and its PE-connected enclosure against the limits applicable to the assembly. No universal test voltage or threshold is published; manufacturer, equipment and standard must establish them before publication. Choose again without carrying out the proposed option."
    DEC-04-C: "The proposal “Disconnect PE to prevent leakage.” is not supported by this record.  Review: The test report, produced by authorized personnel after lockout, electronics disconnection and preparation, records abnormally low resistance between EH1's circuit and its PE-connected enclosure against the limits applicable to the assembly. No universal test voltage or threshold is published; manufacturer, equipment and standard must establish them before publication. Choose again without carrying out the proposed option."
    DEC-05-B: "The proposal “Reset the RCD indefinitely.” is not supported by this record.  Review: Moisture-assisted insulation degradation in EH1 with leakage to PE-connected parts is confirmed. The affected component or connection is located and corrected, with appropriate drying or replacement and moisture-ingress control. Repair requires verification under an authorized protocol. Choose again without carrying out the proposed option."
