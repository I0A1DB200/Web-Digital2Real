  completion:
    title: "Technical debrief"
    summary: "moisture-assisted insulation degradation in EH1, with leakage to PE-connected parts. The RCD operates; it must not be bypassed to maintain production. After authorized repair and appropriate drying or replacement in the simulated case, electrical and protection-function checks are repeated under the specific protocol. RCD and PE remain operational; indefinite resetting is not accepted. Final insulation-test voltage and criterion selection remain pending equipment and standards review for production."
