  completion:
    title: "Debrief técnico"
    summary: "El transmisor y el lazo representaban correctamente 6.0 bar con 13.6 mA. La escala PLC 0–5 bar convertía el 60% en 3.0 bar aunque el rango authored era 0–10 bar."
    process: ["Comparar proceso e indicación local.","Medir e interpretar la corriente.","Inspeccionar la conversión a unidades.","Corregir la escala localizada.","Verificar varios puntos hasta HMI."]
    lesson: "Un valor HMI incorrecto no identifica por sí solo el elemento defectuoso. La primera discrepancia verificable estaba en la conversión a unidades de ingeniería."
    avoided_errors: ["Sustituir sin medir.","Inventar un rango bruto PLC.","Compensar en HMI.","Confundir corrección con recuperación."]
    industrial_value: ["Diagnóstico por fronteras.","Menos sustituciones innecesarias.","Verificación trazable."]
    media_ids: ["ART-005"]
