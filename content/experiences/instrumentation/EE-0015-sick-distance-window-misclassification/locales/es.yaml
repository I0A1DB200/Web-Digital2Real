locale: "es"
translations:
  title: "Rechazos por ventana de distancia incorrecta"
  summary: "Localiza por qué cajas válidas son rechazadas siguiendo la cadena desde la distancia medida hasta Q1, PLC, expulsor y HMI."
  scenario:
    initial_context: "Una cinta de embalaje rechaza cajas válidas después de una interrupción nocturna. La HMI muestra Nº Reject = 20."
    operational_state: "El sensor de distancia mide 214 mm y la estación mantiene la expulsión; la primera condición anómala todavía no está localizada."
    initiating_event: "Producción informa de rechazos de cajas que cumplen los criterios de aceptación. La interrupción nocturna es contexto temporal, no una causa demostrada."
    learner_role: "Técnico de automatización responsable de separar medición, clasificación, entrada PLC, actuación neumática y recuperación verificable."
    safety_context:
      safe_state: "Realiza lecturas e intervenciones conforme al procedimiento autorizado de la instalación, manteniendo la cinta y el expulsor en un estado controlado."
      intervention_constraints: ["No aceptar todas las cajas ni puentear la inspección.", "No forzar Q1 ni la entrada del PLC.", "No sustituir sensor, CPU o cilindro sin evidencia.", "Guardar y leer de vuelta parámetros con el procedimiento SICK compatible antes de verificar la producción."]
  learning_objectives:
    OBJ-TRACE-DISTANCE-CLASSIFICATION:
      description: "Seguir la cadena desde la geometría física y la distancia medida hasta la ventana de conmutación y la clasificación."
    OBJ-INTERPRET-Q1-PLC:
      description: "Distinguir una medición plausible de la salida Q1 y correlacionarla con la entrada del S7-1200 sin atribuir fallos no demostrados."
    OBJ-VERIFY-RECOVERY:
      description: "Restaurar la ventana aprobada y verificar lectura, Q1, PLC, clasificación, expulsor, persistencia y contador HMI mediante una prueba representativa."
  stages:
    STAGE-01-INCIDENT:
      title: "Rechazos anómalos"
      situation: "La HMI muestra Nº Reject = 20 y cajas válidas están siendo rechazadas. ¿Qué primera comprobación aísla mejor el problema?"
    STAGE-02-REJECTION:
      title: "La expulsión sí actúa"
      situation: "El empujador neumático funciona y desvía la caja por una rampa metálica corta a un único contenedor gris. ¿Qué establece esta observación?"
    STAGE-03-SWITCHING-WINDOW:
      title: "Contrastar la ventana de conmutación"
      situation: "SOPAS ET muestra una distancia de 214 mm, ventana 280–320 mm y Q1 OFF. ¿Dónde aparece la primera condición anómala demostrada?"
    STAGE-04-PLC-CORRELATION:
      title: "Correlacionar Q1 con el PLC"
      situation: "TIA Portal muestra Sensor_Q1 = FALSE en la entrada del S7-1200, CPU en RUN y la lógica de rechazo activa. ¿Cómo interpretas esta evidencia?"
    STAGE-05-CORRECTION:
      title: "Restaurar la configuración aprobada"
      situation: "La medición de 214 mm es coherente, pero queda fuera de la ventana aplicada. ¿Qué corrección prepara una verificación controlada?"
    STAGE-06-VERIFICATION:
      title: "Verificar la recuperación"
      situation: "Tras restaurar 180–250 mm, ART-006 muestra 214 mm dentro de la ventana y Q1 ON. ¿Qué prueba demuestra recuperación de la estación?"
  evidence:
    EVID-01-INCIDENT:
      source: "HMI de la estación"
      content: "La HMI muestra Nº Reject = 20 y se observan rechazos de cajas válidas. La interrupción nocturna solo sitúa el momento del incidente; no demuestra pérdida de parámetros."
    EVID-02-REJECTION:
      source: "Observación del expulsor"
      content: "El empujador neumático ejecuta la desviación por una rampa metálica corta hasta un único contenedor gris. La actuación funciona; todavía no identifica la orden de rechazo."
    EVID-03-SOPAS:
      source: "SICK SOPAS ET / DT50-2"
      content: "La lectura es 214 mm, la ventana configurada es 280–320 mm y Q1 está OFF. La medida es plausible; 214 mm queda fuera de la ventana configurada para esta aplicación."
    EVID-04-PLC:
      source: "TIA Portal / Siemens S7-1200"
      content: "Sensor_Q1 en %I0.0 aparece FALSE mientras la CPU está en RUN; esa entrada es coherente con Q1 OFF. La evidencia no demuestra un fallo de CPU ni de cableado."
    EVID-05-CRITERIA:
      source: "SOPAS ET / configuración de aplicación"
      content: "Se restaura la ventana aprobada 180–250 mm; 214 mm queda dentro y Q1 pasa a ON. Los parámetros se guardan y se leen de vuelta con el procedimiento SICK compatible."
    EVID-06-RECOVERY:
      source: "Prueba representativa de estación"
      content: "La recuperación se acredita con lectura estable, correlación Q1–entrada PLC, cajas aceptadas y rechazadas representativas, acción correcta del expulsor y parámetros guardados que persisten en un reinicio aprobado. Después se reinicia manualmente el contador y una nueva corrida verificada muestra Nº Reject = 0."
  decisions:
    DEC-01-REPLACE-DIVERTER:
      action: "Sustituir el cilindro expulsor porque hay cajas rechazadas."
    DEC-01-TRACE-ACCEPTANCE:
      action: "Comparar el producto rechazado con los criterios de aceptación y seguir la cadena de medición y clasificación antes de sustituir equipos."
    DEC-01-RESET-COUNTER:
      action: "Restablecer el contador HMI para que desaparezca el síntoma."
    DEC-01-REPLACE-PLC:
      action: "Sustituir la entrada del PLC aunque no exista evidencia eléctrica."
    DEC-02-REPLACE-CYLINDER:
      action: "Concluir que el cilindro es defectuoso porque está rechazando producto."
    DEC-02-ASSUME-LASER:
      action: "Concluir que el láser mide mal porque el producto acaba en el contenedor."
    DEC-02-TRACE-REJECTION:
      action: "Reconocer que el desviador funciona e investigar la orden de rechazo aguas arriba."
    DEC-02-PLC-LOST:
      action: "Concluir que el PLC perdió el programa porque el expulsor actúa."
    DEC-03-DIVERTER:
      action: "Volver a desmontar el desviador para buscar la causa."
    DEC-03-CPU:
      action: "Cambiar la CPU del PLC antes de contrastar los parámetros del sensor."
    DEC-03-MEASUREMENT:
      action: "Descartar la medida de 214 mm sin evidencia y sustituir el sensor."
    DEC-03-SWITCHING-WINDOW:
      action: "Contrastar la ventana de conmutación con los criterios de la aplicación: 214 mm está fuera de 280–320 mm, por lo que Q1 OFF es coherente."
    DEC-04-CPU-FAULT:
      action: "Diagnosticar una CPU defectuosa porque la entrada es FALSE."
    DEC-04-CORRELATE-Q1:
      action: "Correlacionar Sensor_Q1 FALSE con Q1 OFF e investigar y confirmar la configuración aguas arriba."
    DEC-04-FORCE-INPUT:
      action: "Forzar Sensor_Q1 a TRUE para aceptar las cajas."
    DEC-04-DISCONNECT:
      action: "Desconectar el cilindro expulsor para evitar rechazos."
    DEC-05-ACCEPT-ALL:
      action: "Aceptar todas las cajas modificando la lógica PLC."
    DEC-05-SPEED:
      action: "Aumentar la velocidad de la cinta para reducir el número de rechazos."
    DEC-05-RESTORE-WINDOW:
      action: "Restaurar la ventana aprobada 180–250 mm, verificar la función de Q1 y guardar y leer de vuelta los parámetros con el procedimiento SICK compatible."
    DEC-05-DISCONNECT-Q1:
      action: "Desconectar Q1 para que el PLC deje de recibir la señal."
    DEC-06-SETTINGS-ONCE:
      action: "Cerrar la incidencia porque los nuevos parámetros se ven una sola vez."
    DEC-06-RESET-COUNTER:
      action: "Restablecer el contador a cero y usarlo como única prueba de recuperación."
    DEC-06-MANUAL-CYLINDER:
      action: "Extender manualmente el cilindro sin comprobar medición ni clasificación."
    DEC-06-VERIFY-RUN:
      action: "Confirmar lectura estable, correlación Q1–PLC, cajas aceptadas y rechazadas representativas, acción del expulsor y parámetros guardados tras un reinicio aprobado; después verificar la corrida nueva con Nº Reject = 0."
  retry_feedback:
    DEC-01-REPLACE-DIVERTER: "Que haya rechazos no demuestra un fallo del actuador; compara primero producto, criterio y cadena de clasificación."
    DEC-01-RESET-COUNTER: "Resetear Nº Reject borra un síntoma y no explica por qué se clasifican mal las cajas."
    DEC-01-REPLACE-PLC: "No hay evidencia de fallo de entrada o CPU; sigue la cadena de aceptación antes de reemplazar hardware."
    DEC-02-REPLACE-CYLINDER: "El empujador se mueve; su funcionamiento no demuestra que la orden de rechazo sea correcta."
    DEC-02-ASSUME-LASER: "La expulsión no prueba que la medida sea errónea; separa medición, clasificación y actuación."
    DEC-02-PLC-LOST: "Un expulsor que actúa no demuestra pérdida del programa PLC; inspecciona la condición que genera la orden."
    DEC-03-DIVERTER: "La acción del desviador ya funciona; la evidencia nueva está en la configuración upstream."
    DEC-03-CPU: "Nada en la lectura 214 mm, la ventana o Q1 OFF demuestra un fallo de CPU."
    DEC-03-MEASUREMENT: "214 mm es una lectura plausible; no la descartes sin evidencia cuando la comparación con la ventana explica Q1 OFF."
    DEC-04-CPU-FAULT: "CPU en RUN y entrada FALSE no prueban fallo; correlaciona la entrada con Q1 OFF."
    DEC-04-FORCE-INPUT: "Forzar TRUE oculta el estado de campo y puede aceptar cajas sin una clasificación válida."
    DEC-04-DISCONNECT: "Desconectar el expulsor elimina una función de calidad y no corrige la ventana del sensor."
    DEC-05-ACCEPT-ALL: "Aceptar todas las cajas elimina el control de calidad en lugar de corregir la clasificación."
    DEC-05-SPEED: "La velocidad no corrige una ventana de distancia inapropiada ni valida Q1."
    DEC-05-DISCONNECT-Q1: "Q1 es la señal de inspección; desconectarla elimina la trazabilidad de la clasificación."
    DEC-06-SETTINGS-ONCE: "Ver parámetros una vez no demuestra muestras aceptadas, rechazadas, actuación ni persistencia tras reinicio."
    DEC-06-RESET-COUNTER: "Nº Reject = 0 solo es significativo después de un reset manual y una corrida representativa verificada."
    DEC-06-MANUAL-CYLINDER: "Mover el cilindro manualmente no valida medición, Q1, clasificación ni lógica PLC."
  visual:
    educational_purpose: "Distinguir una medida plausible de la salida de conmutación y verificar la cadena completa de clasificación y rechazo."
  assets:
    ART-001:
      alt: "HMI de la estación con Nº Reject = 20 y cajas en la cinta."
      caption: "Incidente inicial: el contador y los rechazos requieren localizar la primera frontera anómala."
    ART-002:
      alt: "Empujador neumático desviando una caja por una rampa metálica a un contenedor gris."
      caption: "El desviador ejecuta la acción física; aún hay que investigar la orden."
    ART-004:
      alt: "SOPAS ET con 214 mm, ventana 280–320 mm y Q1 OFF."
      caption: "La primera condición anómala demostrada está en la ventana aplicada."
    ART-005:
      alt: "TIA Portal con Sensor_Q1 FALSE, CPU S7-1200 en RUN y lógica de rechazo activa."
      caption: "La entrada PLC refleja Q1 OFF; no prueba un fallo de CPU."
    ART-006:
      alt: "SOPAS ET con 214 mm dentro de 180–250 mm y Q1 ON."
      caption: "La ventana aprobada queda restaurada y la salida cambia de estado."
    ART-007:
      alt: "Estación recuperada con HMI Nº Reject = 0 tras una corrida verificada."
      caption: "Resultado de una corrida representativa después de resetear el contador."
  completion:
    title: "Debrief técnico"
    summary: "La distancia de 214 mm era plausible y la expulsión funcionaba, pero la ventana 280–320 mm clasificaba la caja fuera del criterio. La configuración 180–250 mm hizo coherentes Q1, PLC, clasificación y verificación física."
    process: ["Comparar el producto con los criterios de aceptación.", "Separar acción del desviador y orden aguas arriba.", "Leer distancia, ventana y Q1 en SOPAS ET.", "Correlacionar Q1 con Sensor_Q1 en el S7-1200.", "Restaurar, guardar y leer de vuelta la ventana aprobada.", "Verificar muestras representativas, reinicio aprobado y corrida nueva."]
    lesson: "Una medición plausible no implica una clasificación correcta; el primer estado anómalo puede ser la ventana de conmutación."
    avoided_errors: ["Atribuir el fallo al cilindro o al PLC sin evidencia.", "Confundir distancia sensor–caja con altura de caja.", "Forzar Q1 o aceptar todas las cajas.", "Usar Nº Reject = 0 como única prueba de recuperación."]
    industrial_value: ["Diagnóstico por cadena de señal.", "Menos sustituciones injustificadas.", "Recuperación funcional y persistente verificable."]
