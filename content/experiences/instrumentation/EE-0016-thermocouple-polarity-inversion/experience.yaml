  completion:
    title: "Debrief técnico"
    summary: "El proceso térmico y la referencia independiente aumentaban, pero la polaridad cruzada del termopar invertía la tendencia en la cadena de entrada. La reconexión correcta y la rampa controlada hicieron coherentes módulo, PLC y HMI."
    process: ["Comparar proceso y HMI con una referencia independiente.", "Revisar tipo de entrada y diagnóstico del canal.", "Inspeccionar extensión y polaridad bajo aislamiento autorizado.", "Separar polaridad cruzada de fallo de sonda o PLC.", "Restaurar la conexión prevista y asegurar terminales.", "Verificar la cadena completa mediante una rampa térmica controlada."]
    lesson: "Una entrada sin diagnóstico de circuito abierto puede seguir representando mal la magnitud; la tendencia y la polaridad también son evidencia."
    avoided_errors: ["Sustituir la sonda antes de comprobar la cadena.", "Cambiar la escala PLC o HMI para ocultar una conexión cruzada.", "Confundir ausencia de alarma con recuperación.", "Cerrar después de un único valor sin comprobar tendencia y referencia."]
    industrial_value: ["Menos sustituciones injustificadas.", "Mejor separación entre proceso, señal y representación.", "Verificación térmica reproducible y trazable."]
    media_ids: ["ART-007"]

private:
  fault_model:
    root_cause: "Polaridad del termopar tipo K invertida en la extensión entre el cabezal de campo y la entrada de temperatura; la inversión explica la tendencia HMI opuesta mientras el proceso aumenta."
    recovery_conditions: ["Canal configurado para Type K y sin diagnóstico de circuito abierto.", "Polaridad de la extensión restaurada y terminales asegurados según el procedimiento autorizado.", "Referencia independiente, módulo, PLC y HMI siguen la misma tendencia en tres puntos de una rampa térmica.", "No se utilizan forzados ni cambios de escala para declarar recuperación."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-PROCESS-COOLING"
        statement: "El proceso realmente está enfriándose y la referencia independiente confirmará una tendencia descendente."
        initial_status: "possible"
      - id: "HYP-INPUT-CONFIGURATION"
        statement: "El módulo no está configurado para el tipo de termopar o presenta un diagnóstico de entrada."
        initial_status: "possible"
      - id: "HYP-PLC-HMI"
        statement: "La entrada es coherente pero el PLC o la HMI transforman la tendencia."
        initial_status: "possible"
      - id: "HYP-POLARITY"
        statement: "La extensión del termopar tiene la polaridad cruzada."
        initial_status: "possible"
    confirmed_root_cause: "HYP-POLARITY"
    critical_path: ["DEC-01-CHECK-REFERENCE", "DEC-02-CHECK-INPUT", "DEC-03-INSPECT-POLARITY", "DEC-04-CONFIRM-POLARITY", "DEC-05-RESTORE-WIRING", "DEC-06-VERIFY-RAMP"]
  decision_logic:
    - decision_id: "DEC-01-REPLACE-PROBE"
