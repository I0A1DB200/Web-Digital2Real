      classification: "strong"
      consequence: "Revela la discrepancia entre proceso y representación."
      evidence_revealed: ["EVID-02-REFERENCE"]
      next_stage: "STAGE-02-INDEPENDENT-REFERENCE"
      score_effect: 0
      safety_effect: 0
