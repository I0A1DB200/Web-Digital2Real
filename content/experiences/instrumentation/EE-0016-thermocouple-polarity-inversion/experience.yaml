public:
  slug: "thermocouple-polarity-inversion"
  title: "Temperatura invertida en el termopar"
  summary: "Localiza por qué la temperatura de la HMI cae mientras el proceso se calienta, siguiendo el termopar, la entrada, la polaridad y la verificación de tendencia."
  estimated_duration: 18
  scenario:
    initial_context: "El recipiente de proceso está calentando de forma estable, pero la HMI muestra una temperatura que cae mientras el proceso continúa caliente."
    operational_state: "La primera frontera anómala todavía puede estar en el proceso, la sonda, la extensión, el módulo de temperatura o la representación PLC/HMI."
    initiating_event: "La regulación térmica se detiene porque la lectura no sigue el comportamiento observado del proceso."
    learner_role: "Técnico de automatización responsable de separar magnitud física, termopar, cable de compensación, entrada de temperatura, PLC y HMI."
    safety_context:
      safe_state: "Realiza lecturas e intervenciones conforme al procedimiento autorizado, manteniendo el proceso térmico en un estado seguro y evitando contacto con superficies calientes."
      intervention_constraints:
        - "No forzar el valor de temperatura ni puentear alarmas de regulación."
        - "No cambiar la escala PLC o HMI para ocultar una lectura incorrecta."
        - "No sustituir sonda ni módulo antes de localizar la primera discrepancia."
        - "Aislar el circuito conforme al procedimiento antes de abrir terminales o corregir la extensión."
  learning_objectives:
    - id: "OBJ-TRACE-THERMAL-CHAIN"
      description: "Seguir la cadena desde la magnitud térmica y el termopar hasta la entrada de temperatura, el PLC y la HMI."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-INTERPRET-TC-POLARITY"
      description: "Distinguir una tendencia física de una representación invertida e interpretar tipo de entrada, polaridad y cable de compensación sin inventar colores universales."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-VERIFY-THERMAL-RECOVERY"
      description: "Restaurar la polaridad prevista y verificar con una rampa controlada la referencia independiente, el módulo, el PLC y la HMI."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-THERMAL-INCIDENT"
      phase: "incident"
      title: "Incidente de temperatura"
      situation: "El recipiente continúa caliente, pero la HMI muestra una tendencia descendente y la regulación se detiene. ¿Qué primera comprobación delimita mejor el problema?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-REPLACE-PROBE", "DEC-01-CHECK-REFERENCE", "DEC-01-RAISE-SETPOINT", "DEC-01-CLEAR-ALARM"]
      media_ids: ["ART-002"]
    - id: "STAGE-02-INDEPENDENT-REFERENCE"
      phase: "investigation"
      title: "Separar proceso y representación"
      situation: "La referencia independiente sube mientras la HMI cae. ¿Qué frontera debe revisarse antes de intervenir en el calentamiento?"
      evidence_ids: ["EVID-02-REFERENCE"]
      decision_ids: ["DEC-02-FORCE-HMI", "DEC-02-REPLACE-MODULE", "DEC-02-CHECK-INPUT", "DEC-02-LOWER-HEAT"]
      media_ids: ["ART-003"]
    - id: "STAGE-03-INPUT-AND-WIRING"
      phase: "investigation"
      title: "Inspeccionar la entrada y la extensión"
      situation: "El canal está configurado para Type K y no presenta diagnóstico de circuito abierto; la sonda está instalada en el recipiente. ¿Qué inspección aporta la siguiente evidencia?"
      evidence_ids: ["EVID-03-INPUT"]
      decision_ids: ["DEC-03-INSPECT-POLARITY", "DEC-03-CHANGE-PLC", "DEC-03-ADJUST-HMI", "DEC-03-REPLACE-PROBE"]
      media_ids: ["ART-004"]
    - id: "STAGE-04-POLARITY-DIAGNOSIS"
      phase: "investigation"
      title: "Interpretar la polaridad"
      situation: "La inspección muestra que los conductores del termopar están cruzados en la extensión. ¿Qué conclusión está mejor sustentada antes de corregir?"
      evidence_ids: ["EVID-04-POLARITY"]
      decision_ids: ["DEC-04-FAULT-SENSOR", "DEC-04-RESCALE-PLC", "DEC-04-FORCE-VALUE", "DEC-04-CONFIRM-POLARITY"]
      media_ids: ["ART-005"]
    - id: "STAGE-05-SAFE-CORRECTION"
      phase: "solution"
      title: "Restaurar la conexión prevista"
      situation: "La polaridad invertida explica la tendencia opuesta, pero la recuperación aún no está verificada. ¿Qué intervención prepara una prueba independiente?"
      evidence_ids: []
      decision_ids: ["DEC-05-RECALIBRATE-PLC", "DEC-05-RESTORE-WIRING", "DEC-05-REPLACE-MODULE", "DEC-05-INVERT-HMI"]
      media_ids: []
    - id: "STAGE-06-VERIFY-THERMAL-CHAIN"
      phase: "solution"
      title: "Verificar la recuperación térmica"
      situation: "La extensión se ha corregido conforme al procedimiento y la HMI vuelve a seguir la referencia. ¿Qué prueba permite cerrar la intervención?"
      evidence_ids: ["EVID-06-INTERVENTION"]
      decision_ids: ["DEC-06-CLOSE-ONCE", "DEC-06-CHECK-ALARM", "DEC-06-VERIFY-RAMP", "DEC-06-CLEAR-HISTORY"]
      media_ids: ["ART-006"]
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Proceso térmico y HMI"
      content: "El recipiente continúa caliente, mientras la HMI muestra una tendencia descendente y la regulación se detiene. El síntoma no identifica por sí solo la frontera defectuosa."
      reliability: "high"
      revealed_by: []
      media_ids: ["ART-002"]
    - id: "EVID-02-REFERENCE"
      type: "measurement"
      source: "Referencia independiente de proceso"
      content: "Una referencia independiente confirma que la temperatura del proceso aumenta mientras la tendencia HMI disminuye. La discrepancia está después de la magnitud observada o en la cadena de medida, no necesariamente en el calentador."
      reliability: "confirmed"
      revealed_by: ["DEC-01-CHECK-REFERENCE"]
      media_ids: ["ART-003"]
    - id: "EVID-03-INPUT"
      type: "diagnostic"
      source: "Módulo de entrada de temperatura"
      content: "El canal está configurado para termopar tipo K y no indica circuito abierto. La configuración del tipo de entrada no demuestra todavía que la polaridad de la extensión sea correcta."
      reliability: "confirmed"
      revealed_by: ["DEC-02-CHECK-INPUT"]
      media_ids: ["ART-004"]
    - id: "EVID-04-POLARITY"
      type: "inspection"
      source: "Terminales de la extensión del termopar"
      content: "La inspección segura muestra que los conductores positivo y negativo están cruzados en la extensión. El termopar y el módulo no se declaran defectuosos solo por el síntoma inicial."
      reliability: "confirmed"
      revealed_by: ["DEC-03-INSPECT-POLARITY"]
      media_ids: ["ART-005"]
    - id: "EVID-05-DIAGNOSIS"
      type: "diagnostic"
      source: "Síntesis de la cadena de medida"
      content: "El proceso y la referencia independiente aumentan, el módulo acepta Type K y la extensión invierte la polaridad. La primera causa física demostrada es la conexión cruzada, no una escala HMI ni un fallo de PLC."
      reliability: "confirmed"
      revealed_by: ["DEC-04-CONFIRM-POLARITY"]
      media_ids: []
    - id: "EVID-06-INTERVENTION"
      type: "inspection"
      source: "Terminales corregidos"
      content: "La extensión ha sido reconectada con la polaridad prevista y los terminales han quedado asegurados mediante el procedimiento autorizado. La recuperación funcional todavía debe verificarse."
      reliability: "confirmed"
      revealed_by: ["DEC-05-RESTORE-WIRING"]
      media_ids: ["ART-006"]
    - id: "EVID-07-RECOVERY"
      type: "functional_test"
      source: "Rampa térmica controlada"
      content: "Tres puntos representativos confirman que la referencia independiente, el módulo, el PLC y la HMI siguen la misma tendencia sin alarma de entrada ni inversión de señal. La cadena térmica queda verificada."
      reliability: "confirmed"
      revealed_by: ["DEC-06-VERIFY-RAMP"]
      media_ids: ["ART-007"]
  decisions:
    - id: "DEC-01-REPLACE-PROBE"
      stage_id: "STAGE-01-THERMAL-INCIDENT"
      action: "Sustituir la sonda porque la HMI no sigue la temperatura."
    - id: "DEC-01-CHECK-REFERENCE"
      stage_id: "STAGE-01-THERMAL-INCIDENT"
      action: "Comparar referencia independiente con tendencia HMI."
    - id: "DEC-01-RAISE-SETPOINT"
      stage_id: "STAGE-01-THERMAL-INCIDENT"
      action: "Subir la consigna para que la lectura vuelva a subir."
    - id: "DEC-01-CLEAR-ALARM"
      stage_id: "STAGE-01-THERMAL-INCIDENT"
      action: "Borrar la alarma térmica y continuar el calentamiento."
    - id: "DEC-02-FORCE-HMI"
      stage_id: "STAGE-02-INDEPENDENT-REFERENCE"
      action: "Forzar el valor HMI para mantener la producción."
    - id: "DEC-02-REPLACE-MODULE"
      stage_id: "STAGE-02-INDEPENDENT-REFERENCE"
      action: "Cambiar el módulo sin revisar el tipo de entrada."
    - id: "DEC-02-CHECK-INPUT"
      stage_id: "STAGE-02-INDEPENDENT-REFERENCE"
      action: "Revisar canal, tipo K y diagnóstico."
    - id: "DEC-02-LOWER-HEAT"
      stage_id: "STAGE-02-INDEPENDENT-REFERENCE"
      action: "Reducir el calentamiento para que ambas lecturas se igualen."
    - id: "DEC-03-INSPECT-POLARITY"
      stage_id: "STAGE-03-INPUT-AND-WIRING"
      action: "Aislar y comprobar tipo y polaridad de la extensión."
    - id: "DEC-03-CHANGE-PLC"
      stage_id: "STAGE-03-INPUT-AND-WIRING"
      action: "Cambiar la lógica PLC antes de revisar la conexión del termopar."
    - id: "DEC-03-ADJUST-HMI"
      stage_id: "STAGE-03-INPUT-AND-WIRING"
      action: "Ajustar la escala HMI para compensar la tendencia observada."
    - id: "DEC-03-REPLACE-PROBE"
      stage_id: "STAGE-03-INPUT-AND-WIRING"
      action: "Reemplazar la sonda sin registrar la polaridad de la extensión."
    - id: "DEC-04-FAULT-SENSOR"
      stage_id: "STAGE-04-POLARITY-DIAGNOSIS"
      action: "Declarar fallo del sensor porque su valor no sigue la tendencia."
    - id: "DEC-04-RESCALE-PLC"
      stage_id: "STAGE-04-POLARITY-DIAGNOSIS"
      action: "Cambiar la escala de ingeniería aunque la señal sea de termopar."
    - id: "DEC-04-FORCE-VALUE"
      stage_id: "STAGE-04-POLARITY-DIAGNOSIS"
      action: "Forzar el valor de temperatura para que la secuencia continúe."
    - id: "DEC-04-CONFIRM-POLARITY"
      stage_id: "STAGE-04-POLARITY-DIAGNOSIS"
      action: "Confirmar la polaridad cruzada antes de corregir."
    - id: "DEC-05-RECALIBRATE-PLC"
      stage_id: "STAGE-05-SAFE-CORRECTION"
      action: "Recalibrar el PLC para aceptar una entrada conectada al revés."
    - id: "DEC-05-RESTORE-WIRING"
      stage_id: "STAGE-05-SAFE-CORRECTION"
      action: "Restaurar polaridad y asegurar terminales."
    - id: "DEC-05-REPLACE-MODULE"
      stage_id: "STAGE-05-SAFE-CORRECTION"
      action: "Cambiar el módulo aunque el canal acepte Type K."
    - id: "DEC-05-INVERT-HMI"
      stage_id: "STAGE-05-SAFE-CORRECTION"
      action: "Invertir el signo en HMI para ocultar la conexión cruzada."
    - id: "DEC-06-CLOSE-ONCE"
      stage_id: "STAGE-06-VERIFY-THERMAL-CHAIN"
      action: "Cerrar al ver que la HMI sube una vez."
    - id: "DEC-06-CHECK-ALARM"
      stage_id: "STAGE-06-VERIFY-THERMAL-CHAIN"
      action: "Verificar únicamente que no aparece una alarma de entrada."
    - id: "DEC-06-VERIFY-RAMP"
      stage_id: "STAGE-06-VERIFY-THERMAL-CHAIN"
      action: "Comparar tendencias durante una rampa controlada."
    - id: "DEC-06-CLEAR-HISTORY"
      stage_id: "STAGE-06-VERIFY-THERMAL-CHAIN"
      action: "Borrar el histórico de alarmas para dar por cerrada la incidencia."
