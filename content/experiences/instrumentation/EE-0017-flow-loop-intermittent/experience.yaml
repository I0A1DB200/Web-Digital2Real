        src: assets/EXP-FLOW-LOOP-017/ART-006-authorized-repair.png
        alt: Técnico realizando una reterminación autorizada en una caja de conexiones.
        caption: La reparación restaura continuidad sin compensar el fallo en software.
        purpose: evidence
      - id: ART-007
        type: image
        src: assets/EXP-FLOW-LOOP-017/ART-007-multipoint-verification.png
        alt: Diagrama de verificación de caudal bajo, medio y alto en toda la cadena.
