metadata:
  id: EXP-FLOW-LOOP-017
  editorial_id: EE-0017
  content_version: '1.0'
  class: practice
  access: free
  status: technical_review
  language: es
localization:
  default_locale: es
  supported_locales: ["es", "en"]
  locale_files:
    es: locales/es.yaml
    en: locales/en.yaml
classification:
  platform: Generic flow transmitter / 4–20 mA / analog input
  domain: Intermittent analog-loop integrity diagnosis
  industry: Process instrumentation
  machine_type: Flow measurement skid
  difficulty: foundation
capability_references:
  - capability_id: ICF-02
    competency_ids: ["COMP-IIO-SIGNAL-TRACEABILITY", "COMP-IIO-STATE-INTERPRETATION", "COMP-IIO-CONTROLLED-RECOVERY"]
public:
  slug: flow-loop-intermittent
  title: Señal de caudal intermitente en el lazo 4–20 mA
  summary: Localiza por qué un caudal estable aparece intermitente en PLC y HMI siguiendo proceso, transmisor, corriente de lazo, cableado, entrada analógica y verificación.
  estimated_duration: 18
  scenario:
    initial_context: La línea mantiene un caudal estable según la referencia local, pero el PLC y la HMI presentan caídas intermitentes.
    operational_state: La primera discrepancia puede estar en el proceso, el transmisor, la alimentación del lazo, un terminal, la entrada analógica o la representación de control.
    initiating_event: La supervisión del caudal genera una alarma intermitente y detiene una decisión de control.
    learner_role: Técnico de instrumentación responsable de localizar la primera frontera eléctrica sin cambiar el escalado ni sustituir equipos sin evidencia.
    safety_context:
      safe_state: Mantén el proceso en una condición segura y realiza lecturas e intervenciones únicamente conforme al procedimiento autorizado para el lazo y la instalación.
      intervention_constraints: ["No forzar valores ni puentear alarmas.", "No cambiar el escalado antes de localizar la discrepancia.", "No abrir ni interrumpir el lazo energizado fuera del método aprobado.", "Usar puntos de prueba y aislamiento autorizados; no puentear la entrada para mantener producción."]
  learning_objectives:
    - id: OBJ-TRACE-FLOW-CHAIN
      description: Seguir la cadena desde el proceso de caudal y el transmisor hasta la corriente de lazo, la entrada analógica, el PLC y la HMI.
      capability_id: ICF-02
      competency_id: COMP-IIO-SIGNAL-TRACEABILITY
    - id: OBJ-LOCALIZE-LOOP-BOUNDARY
      description: Distinguir un cambio de proceso, un transmisor estable y una interrupción de lazo mediante mediciones en fronteras autorizadas.
      capability_id: ICF-02
      competency_id: COMP-IIO-STATE-INTERPRETATION
    - id: OBJ-VERIFY-FLOW-RECOVERY
      description: Restaurar la continuidad física y verificar varios puntos de caudal sin compensar el fallo en PLC o HMI.
      capability_id: ICF-02
      competency_id: COMP-IIO-CONTROLLED-RECOVERY
  stages:
    - id: STAGE-01-FLOW-INCIDENT
      phase: incident
      title: Incidente de caudal
      situation: La línea mantiene un caudal estable según la referencia local, pero el PLC y la HMI caen de forma intermitente. ¿Qué primera comprobación conserva el síntoma sin alterar el proceso?
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-RESET-HMI", "DEC-01-CHECK-REFERENCE", "DEC-01-REPLACE-TRANSMITTER", "DEC-01-RAISE-FLOW"]
      media_ids: ["ART-002"]
    - id: STAGE-02-SEPARATE-PROCESS
      phase: investigation
      title: Separar proceso y representación
      situation: La referencia independiente y el indicador local permanecen estables mientras la HMI fluctúa. ¿Qué comparación delimita la siguiente frontera?
      evidence_ids: ["EVID-02-LOCAL-CORRELATION"]
      decision_ids: ["DEC-02-CHECK-LOCAL", "DEC-02-CHANGE-SCALE", "DEC-02-RESTART-PLC", "DEC-02-ACK-ALARM"]
      media_ids: ["ART-003"]
    - id: STAGE-03-MEASURE-BOUNDARIES
      phase: investigation
      title: Medir corriente en las fronteras
      situation: El transmisor muestra un valor estable, pero la entrada analógica registra caídas durante el mismo evento. ¿Qué medición separa la salida del transmisor de la entrada de control?
      evidence_ids: ["EVID-03-LOOP-MEASUREMENT"]
      decision_ids: ["DEC-03-REPLACE-AI", "DEC-03-CHECK-VOLTAGE", "DEC-03-READ-HMI", "DEC-03-MEASURE-LOOP-BOUNDARIES"]
      media_ids: ["ART-004"]
    - id: STAGE-04-TRACE-INTERMITTENCE
      phase: investigation
      title: Localizar el tramo intermitente
      situation: La corriente es coherente en el lado del transmisor y se pierde antes de la entrada analógica. ¿Qué inspección aporta la causa física sin cambiar el escalado?
      evidence_ids: ["EVID-04-TERMINAL-FAULT"]
      decision_ids: ["DEC-04-CHECK-PARAMETER", "DEC-04-CYCLE-SUPPLY", "DEC-04-TRACE-TERMINAL", "DEC-04-FORCE-PV"]
      media_ids: ["ART-005"]
    - id: STAGE-05-RESTORE-LOOP
      phase: solution
      title: Restaurar la conexión
      situation: La inspección identifica un contacto de campo intermitente. ¿Qué intervención corrige el lazo sin compensar el defecto en PLC o HMI?
      evidence_ids: []
      decision_ids: ["DEC-05-REPLACE-TRANSMITTER", "DEC-05-RETERMINATE-LOOP", "DEC-05-RESCALE-PLC", "DEC-05-BYPASS-INPUT"]
      media_ids: []
    - id: STAGE-06-VERIFY-FLOW-CHAIN
      phase: solution
      title: Verificar la estabilidad
      situation: La conexión se ha restaurado y la corriente permanece estable. ¿Qué prueba demuestra que el caudal, el lazo, el PLC y la HMI siguen siendo coherentes?
      evidence_ids: ["EVID-06-INTERVENTION"]
      decision_ids: ["DEC-06-CLOSE-ONE-POINT", "DEC-06-CLEAR-ALARM", "DEC-06-CHANGE-AVERAGING", "DEC-06-VERIFY-MULTIPOINT"]
      media_ids: ["ART-006"]
  evidence:
    - id: EVID-01-INCIDENT
      type: initial_observation
      source: Proceso de caudal y HMI
      content: La referencia local indica un caudal estable, pero el PLC y la HMI presentan caídas intermitentes. El síntoma todavía no identifica si cambia el proceso, el transmisor, el lazo o la entrada.
      reliability: high
      revealed_by: []
      media_ids: ["ART-002"]
    - id: EVID-02-LOCAL-CORRELATION
      type: measurement
      source: Referencia independiente e indicador local
      content: La referencia independiente y el indicador del transmisor permanecen estables durante la caída HMI. La magnitud física y la representación local no siguen el mismo fallo que el PLC.
      reliability: confirmed
      revealed_by: ["DEC-01-CHECK-REFERENCE"]
      media_ids: ["ART-003"]
    - id: EVID-03-LOOP-MEASUREMENT
      type: diagnostic
      source: Puntos de prueba del lazo y entrada analógica
      content: En el punto de prueba del transmisor la corriente se mantiene coherente durante el evento, mientras que en la frontera de entrada analógica aparece la caída. El escalado de ingeniería permanece sin cambios.
      reliability: confirmed
      revealed_by: ["DEC-02-CHECK-LOCAL"]
      media_ids: ["ART-004"]
    - id: EVID-04-TERMINAL-FAULT
      type: inspection
      source: Terminal de campo y continuidad autorizada
      content: Con el circuito aislado según el procedimiento, la inspección identifica un contacto de terminal que no mantiene una conexión estable y produce resistencia intermitente entre ambos puntos del lazo.
      reliability: confirmed
      revealed_by: ["DEC-03-MEASURE-LOOP-BOUNDARIES"]
      media_ids: ["ART-005"]
    - id: EVID-05-DIAGNOSIS
      type: diagnostic
      source: Síntesis de la cadena analógica
      content: El proceso y el transmisor permanecen estables, la salida y la entrada divergen durante el evento y el terminal de campo explica la discontinuidad. No hay evidencia para cambiar transmisor, módulo ni escalado.
      reliability: confirmed
      revealed_by: ["DEC-04-TRACE-TERMINAL"]
      media_ids: []
    - id: EVID-06-INTERVENTION
      type: inspection
      source: Terminal de campo corregido
      content: El terminal ha sido reterminado y asegurado según el procedimiento autorizado. La corriente se mantiene estable en los puntos de prueba y la recuperación funcional todavía debe verificarse con varios puntos de proceso.
      reliability: confirmed
      revealed_by: ["DEC-05-RETERMINATE-LOOP"]
      media_ids: ["ART-006"]
    - id: EVID-07-RECOVERY
      type: functional_test
      source: Prueba representativa de caudal
      content: En puntos bajo, medio y alto de operación, la referencia de proceso, la corriente de lazo, la entrada analógica, el PLC y la HMI permanecen coherentes sin nuevas caídas intermitentes. La cadena queda verificada.
      reliability: confirmed
      revealed_by: ["DEC-06-VERIFY-MULTIPOINT"]
      media_ids: ["ART-007"]
  decisions:
    - id: DEC-01-RESET-HMI
      stage_id: STAGE-01-FLOW-INCIDENT
      action: Reiniciar la pantalla para ver si el valor se estabiliza y desaparece la alarma.
    - id: DEC-01-CHECK-REFERENCE
      stage_id: STAGE-01-FLOW-INCIDENT
      action: Comparar la lectura con una referencia independiente.
    - id: DEC-01-REPLACE-TRANSMITTER
      stage_id: STAGE-01-FLOW-INCIDENT
      action: Sustituir el transmisor antes de comparar el proceso, la salida y la entrada analógica.
    - id: DEC-01-RAISE-FLOW
      stage_id: STAGE-01-FLOW-INCIDENT
      action: Cambiar el caudal del proceso para intentar reproducir o eliminar la fluctuación.
    - id: DEC-02-CHECK-LOCAL
      stage_id: STAGE-02-SEPARATE-PROCESS
      action: Comparar referencia, indicador local y HMI durante el evento.
    - id: DEC-02-CHANGE-SCALE
      stage_id: STAGE-02-SEPARATE-PROCESS
      action: Cambiar el rango de ingeniería y observar si la fluctuación parece desaparecer de la pantalla.
    - id: DEC-02-RESTART-PLC
      stage_id: STAGE-02-SEPARATE-PROCESS
      action: Reiniciar el PLC para comprobar si desaparece la alarma.
    - id: DEC-02-ACK-ALARM
      stage_id: STAGE-02-SEPARATE-PROCESS
      action: Reconocer la alarma y continuar observando la pantalla.
    - id: DEC-03-REPLACE-AI
      stage_id: STAGE-03-MEASURE-BOUNDARIES
      action: Cambiar el módulo analógico porque la HMI cae, antes de comparar la corriente en ambos lados.
    - id: DEC-03-CHECK-VOLTAGE
      stage_id: STAGE-03-MEASURE-BOUNDARIES
      action: Medir solo la alimentación del transmisor y cerrar la frontera sin comprobar la corriente que llega a la entrada.
    - id: DEC-03-READ-HMI
      stage_id: STAGE-03-MEASURE-BOUNDARIES
      action: Leer de nuevo la HMI para confirmar el valor bajo y registrar el mismo síntoma.
    - id: DEC-03-MEASURE-LOOP-BOUNDARIES
      stage_id: STAGE-03-MEASURE-BOUNDARIES
      action: Medir la corriente en ambos lados del lazo.
    - id: DEC-04-CHECK-PARAMETER
      stage_id: STAGE-04-TRACE-INTERMITTENCE
      action: Editar los parámetros del transmisor antes de revisar la conexión y la continuidad del cableado.
    - id: DEC-04-CYCLE-SUPPLY
      stage_id: STAGE-04-TRACE-INTERMITTENCE
      action: Ciclar la alimentación para intentar reproducir el síntoma sin conservar la condición intermitente.
    - id: DEC-04-TRACE-TERMINAL
      stage_id: STAGE-04-TRACE-INTERMITTENCE
      action: Aislar el lazo y comprobar continuidad en los terminales.
    - id: DEC-04-FORCE-PV
      stage_id: STAGE-04-TRACE-INTERMITTENCE
      action: Forzar el valor de proceso para mantener la supervisión mientras la conexión de campo sigue sin verificarse.
    - id: DEC-05-REPLACE-TRANSMITTER
      stage_id: STAGE-05-RESTORE-LOOP
      action: Cambiar el transmisor aunque su indicación local y su salida medida permanezcan estables.
    - id: DEC-05-RETERMINATE-LOOP
      stage_id: STAGE-05-RESTORE-LOOP
      action: Reterminar el terminal y asegurar el contacto bajo el procedimiento autorizado.
    - id: DEC-05-RESCALE-PLC
      stage_id: STAGE-05-RESTORE-LOOP
      action: Modificar el escalado PLC para compensar las caídas en lugar de restaurar el camino físico.
    - id: DEC-05-BYPASS-INPUT
      stage_id: STAGE-05-RESTORE-LOOP
      action: Puentear la entrada analógica y mantener la producción mientras el lazo sigue sin resolverse.
    - id: DEC-06-CLOSE-ONE-POINT
      stage_id: STAGE-06-VERIFY-FLOW-CHAIN
      action: Cerrar después de un valor estable sin comprobar que el comportamiento se repite en varios puntos.
    - id: DEC-06-CLEAR-ALARM
      stage_id: STAGE-06-VERIFY-FLOW-CHAIN
      action: Borrar la alarma y documentar la recuperación sin confirmar la corriente en cada frontera.
    - id: DEC-06-CHANGE-AVERAGING
      stage_id: STAGE-06-VERIFY-FLOW-CHAIN
      action: Aumentar el filtrado para que la HMI parezca estable aunque la conexión de campo siga cayendo.
    - id: DEC-06-VERIFY-MULTIPOINT
      stage_id: STAGE-06-VERIFY-FLOW-CHAIN
      action: Verificar puntos bajo, medio y alto siguiendo toda la cadena.
  visual:
    educational_purpose: Distinguir una variación física de caudal de una interrupción intermitente en el lazo 4–20 mA y verificar la cadena completa.
    representation: available
    cover_asset_id: ART-001
    assets:
      - id: ART-001
        type: image
        src: assets/EXP-FLOW-LOOP-017/ART-001-flow-skid.png
