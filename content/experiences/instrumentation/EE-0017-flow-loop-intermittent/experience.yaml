        purpose: completion
  completion:
    title: Debrief técnico
    summary: El proceso y el transmisor permanecían estables, pero un contacto de campo intermitente separaba la salida del transmisor de la entrada analógica. La reterminación restauró la continuidad y la verificación multipunto hizo coherentes corriente, entrada, PLC y HMI.
    process: ["Conservar el síntoma y comparar con una referencia independiente.", "Separar proceso, indicador local y HMI.", "Medir la corriente en las dos fronteras del lazo.", "Inspeccionar terminales y continuidad bajo el procedimiento autorizado.", "Restaurar la conexión sin modificar el escalado validado.", "Verificar puntos bajo, medio y alto en toda la cadena."]
    lesson: Una lectura local estable no demuestra que la corriente llegue de forma continua a la entrada; la primera discrepancia debe localizarse entre fronteras antes de cambiar parámetros.
    avoided_errors: ["Cambiar el transmisor por un síntoma de HMI.", "Modificar el escalado para ocultar una caída de señal.", "Abrir o puentear el lazo fuera del procedimiento.", "Cerrar después de un único valor estable.", "Confundir filtrado con recuperación de una conexión intermitente."]
    industrial_value: ["Menos sustituciones y cambios de escala injustificados.", "Mejor trazabilidad de fallos intermitentes de instrumentación.", "Verificación repetible desde proceso hasta HMI."]
    media_ids: ["ART-007"]
private:
  fault_model:
    root_cause: Un contacto de terminal de campo introduce una resistencia intermitente en el lazo 4–20 mA; el proceso, el transmisor y el escalado de la entrada permanecen correctos.
    recovery_conditions: ["La referencia de proceso y el indicador local permanecen estables durante el síntoma.", "La corriente se compara en el transmisor y en la entrada mediante puntos de prueba autorizados.", "El terminal se retermina y asegura con aislamiento y procedimiento aprobado.", "Puntos bajo, medio y alto confirman coherencia entre proceso, lazo, entrada analógica, PLC y HMI sin nuevas caídas."]
  diagnostic_model:
    hypotheses:
      - id: HYP-PROCESS-CHANGE
        statement: El caudal real cambia y la referencia independiente confirmará la variación.
        initial_status: possible
      - id: HYP-TRANSMITTER-OUTPUT
        statement: El transmisor o su configuración producen una salida inestable.
        initial_status: possible
      - id: HYP-LOOP-INTEGRITY
        statement: Una conexión o terminal intermitente interrumpe la corriente entre el transmisor y la entrada.
        initial_status: possible
      - id: HYP-ANALOG-INPUT
        statement: La entrada analógica interpreta de forma inestable una corriente que llega correctamente.
        initial_status: possible
      - id: HYP-SCALING-REPRESENTATION
        statement: El escalado o la representación cambian un valor estable después de la entrada.
        initial_status: possible
    confirmed_root_cause: HYP-LOOP-INTEGRITY
    critical_path: ["DEC-01-CHECK-REFERENCE", "DEC-02-CHECK-LOCAL", "DEC-03-MEASURE-LOOP-BOUNDARIES", "DEC-04-TRACE-TERMINAL", "DEC-05-RETERMINATE-LOOP", "DEC-06-VERIFY-MULTIPOINT"]
  decision_logic:
    - decision_id: DEC-01-RESET-HMI
      is_correct: false
      rationale: Reiniciar la pantalla puede ocultar la intermitencia y elimina una observación útil.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SEPARATE-PROCESS
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reiniciar la pantalla puede ocultar la intermitencia y elimina una observación útil.
    - decision_id: DEC-01-CHECK-REFERENCE
      is_correct: true
      rationale: La referencia independiente permite separar un cambio real de caudal de una discrepancia de instrumentación.
      classification: strong
      consequence: Revela la comparación local.
      evidence_revealed: ["EVID-02-LOCAL-CORRELATION"]
      next_stage: STAGE-02-SEPARATE-PROCESS
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-01-REPLACE-TRANSMITTER
      is_correct: false
      rationale: El síntoma no demuestra que el transmisor esté averiado; todavía no se ha comparado su salida.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SEPARATE-PROCESS
      score_effect: 0
      safety_effect: 0
      retry_feedback: El síntoma no demuestra que el transmisor esté averiado; todavía no se ha comparado su salida.
    - decision_id: DEC-01-RAISE-FLOW
      is_correct: false
      rationale: Cambiar el proceso modifica la condición de prueba y no localiza la caída de señal.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SEPARATE-PROCESS
      score_effect: 0
      safety_effect: -1
      retry_feedback: Cambiar el proceso modifica la condición de prueba y no localiza la caída de señal.
    - decision_id: DEC-02-CHECK-LOCAL
      is_correct: true
      rationale: Comparar proceso, indicador local y HMI identifica si la discrepancia aparece antes o después del transmisor.
      classification: strong
      consequence: Revela la separación entre proceso y representación.
      evidence_revealed: ["EVID-03-LOOP-MEASUREMENT"]
      next_stage: STAGE-03-MEASURE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-02-CHANGE-SCALE
      is_correct: false
      rationale: La fluctuación no se corrige cambiando una escala que aún no se ha demostrado incorrecta.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-BOUNDARIES
      score_effect: 0
      safety_effect: -1
      retry_feedback: La fluctuación no se corrige cambiando una escala que aún no se ha demostrado incorrecta.
    - decision_id: DEC-02-RESTART-PLC
      is_correct: false
      rationale: Un reinicio puede repetir el síntoma y destruye la continuidad de la observación.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
      retry_feedback: Un reinicio puede repetir el síntoma y destruye la continuidad de la observación.
    - decision_id: DEC-02-ACK-ALARM
      is_correct: false
      rationale: Reconocer una alarma cambia su presentación, pero no separa proceso, transmisor y lazo.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reconocer una alarma cambia su presentación, pero no separa proceso, transmisor y lazo.
    - decision_id: DEC-03-REPLACE-AI
      is_correct: false
      rationale: Una entrada que registra el síntoma todavía no está demostrada como averiada.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-INTERMITTENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: Una entrada que registra el síntoma todavía no está demostrada como averiada.
    - decision_id: DEC-03-CHECK-VOLTAGE
      is_correct: false
      rationale: La alimentación puede ser correcta mientras una conexión de señal interrumpe la corriente.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-INTERMITTENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: La alimentación puede ser correcta mientras una conexión de señal interrumpe la corriente.
    - decision_id: DEC-03-READ-HMI
      is_correct: false
      rationale: Otra lectura HMI repite el efecto y no compara las fronteras eléctricas.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-INTERMITTENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: Otra lectura HMI repite el efecto y no compara las fronteras eléctricas.
    - decision_id: DEC-03-MEASURE-LOOP-BOUNDARIES
      is_correct: true
      rationale: Medir ambos lados del lazo muestra dónde la salida estable se convierte en una entrada intermitente.
      classification: strong
      consequence: Revela la divergencia entre transmisor y entrada.
      evidence_revealed: ["EVID-04-TERMINAL-FAULT"]
      next_stage: STAGE-04-TRACE-INTERMITTENCE
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-04-CHECK-PARAMETER
      is_correct: false
      rationale: Los parámetros no explican una pérdida física entre dos puntos que dejan de coincidir.
      classification: weak
      consequence: Reintenta sin avanzar.
