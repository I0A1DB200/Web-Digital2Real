        purpose: completion
  completion:
    title: Debrief técnico
    summary: El nivel y el transmisor permanecían estables, pero una referencia común o pantalla incompatible acoplaba perturbación de una carga cercana a la entrada 0–10 V. La corrección según la arquitectura y la prueba multipunto restauraron la coherencia.
    process: ["Conservar la oscilación y comparar con una referencia independiente.", "Separar nivel, indicador local y HMI.", "Medir tensión y referencia en las dos fronteras.", "Relacionar la perturbación con cargas próximas e inspeccionar 0 V y pantalla.", "Restaurar la referencia conforme al método documentado.", "Verificar puntos bajo, medio y alto con conmutaciones representativas."]
    lesson: Una señal 0–10 V no se interpreta sin su referencia; la salida puede parecer estable respecto a su propio 0 V y oscilar respecto a la referencia de entrada.
    avoided_errors: ["Cambiar el transmisor por un síntoma HMI.", "Modificar el escalado para ocultar ruido.", "Aplicar una regla universal de pantalla o tierra sin revisar la arquitectura.", "Cerrar después de un único valor estable.", "Confundir filtrado con corrección de la referencia."]
    industrial_value: ["Menos falsas alarmas y cambios de escala injustificados.", "Mejor trazabilidad de referencias analógicas y ruido de campo.", "Verificación repetible bajo cargas próximas."]
    media_ids: ["ART-007"]
private:
  fault_model:
    root_cause: Una referencia común o terminación de pantalla incompatible con la arquitectura permite que una perturbación de una carga próxima aparezca en la entrada 0–10 V; el nivel, el transmisor y el escalado permanecen correctos.
    recovery_conditions: ["La referencia independiente y el indicador local permanecen estables durante la oscilación.", "La tensión se compara en transmisor e input respecto a sus referencias.", "La referencia común y la pantalla se corrigen conforme al método documentado para esa instalación.", "Puntos bajo, medio y alto permanecen coherentes mientras conmutan cargas próximas."]
  diagnostic_model:
    hypotheses:
      - id: HYP-PROCESS-CHANGE
        statement: El nivel real cambia y la referencia independiente confirmará la variación.
        initial_status: possible
      - id: HYP-TRANSMITTER-OUTPUT
        statement: El transmisor o su configuración generan una salida inestable.
        initial_status: possible
      - id: HYP-VOLTAGE-REFERENCE
        statement: La relación de 0 V o pantalla introduce perturbación entre salida e input.
        initial_status: possible
      - id: HYP-ANALOG-INPUT
        statement: La entrada analógica interpreta de forma inestable una señal que llega correctamente.
        initial_status: possible
      - id: HYP-SCALING-REPRESENTATION
        statement: El escalado o la HMI transforman un valor de entrada estable.
        initial_status: possible
    confirmed_root_cause: HYP-VOLTAGE-REFERENCE
    critical_path: ["DEC-01-CHECK-REFERENCE", "DEC-02-CHECK-LOCAL", "DEC-03-MEASURE-VOLTAGE-BOUNDARIES", "DEC-04-TRACE-REFERENCE", "DEC-05-RESTORE-REFERENCE", "DEC-06-VERIFY-MULTIPOINT"]
  decision_logic:
    - decision_id: DEC-01-RESTART-HMI
      is_correct: false
      rationale: Reiniciar la pantalla puede ocultar la oscilación y elimina una observación útil.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-INDEPENDENT-REFERENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reiniciar la pantalla puede ocultar la oscilación y elimina una observación útil.
    - decision_id: DEC-01-CHECK-REFERENCE
      is_correct: true
      rationale: La referencia independiente separa un cambio real de nivel de una discrepancia de instrumentación.
      classification: strong
      consequence: Establece la siguiente frontera.
      evidence_revealed: ["EVID-02-REFERENCE"]
      next_stage: STAGE-02-CHECK-INDEPENDENT-REFERENCE
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-01-REPLACE-TRANSMITTER
      is_correct: false
      rationale: El síntoma no demuestra que el transmisor esté averiado; primero hay que comparar la magnitud.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-INDEPENDENT-REFERENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: El síntoma no demuestra que el transmisor esté averiado; primero hay que comparar la magnitud.
    - decision_id: DEC-01-RAISE-LEVEL
      is_correct: false
      rationale: Cambiar el proceso modifica la condición de prueba y no localiza la oscilación.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-CHECK-INDEPENDENT-REFERENCE
      score_effect: 0
      safety_effect: -1
      retry_feedback: Cambiar el proceso modifica la condición de prueba y no localiza la oscilación.
    - decision_id: DEC-02-CHECK-LOCAL
      is_correct: true
      rationale: Comparar el indicador local con la referencia y la HMI identifica si la discrepancia aparece después del transmisor.
      classification: strong
      consequence: Establece la siguiente frontera.
      evidence_revealed: ["EVID-03-LOCAL-CORRELATION"]
      next_stage: STAGE-03-MEASURE-VOLTAGE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-02-CHANGE-SCALE
      is_correct: false
      rationale: La oscilación no se corrige cambiando una escala que todavía no se ha demostrado incorrecta.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-VOLTAGE-BOUNDARIES
      score_effect: 0
      safety_effect: -1
      retry_feedback: La oscilación no se corrige cambiando una escala que todavía no se ha demostrado incorrecta.
    - decision_id: DEC-02-RESTART-PLC
      is_correct: false
      rationale: Un reinicio puede repetir el síntoma y destruye la continuidad de la observación.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-VOLTAGE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
      retry_feedback: Un reinicio puede repetir el síntoma y destruye la continuidad de la observación.
    - decision_id: DEC-02-ACK-ALARM
      is_correct: false
      rationale: Reconocer una alarma cambia su presentación, pero no separa proceso e instrumentación.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-MEASURE-VOLTAGE-BOUNDARIES
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reconocer una alarma cambia su presentación, pero no separa proceso e instrumentación.
    - decision_id: DEC-03-REPLACE-AI
      is_correct: false
      rationale: La entrada que registra el síntoma todavía no está demostrada como averiada.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-REFERENCE-NOISE
      score_effect: 0
      safety_effect: 0
      retry_feedback: La entrada que registra el síntoma todavía no está demostrada como averiada.
    - decision_id: DEC-03-CHECK-SUPPLY
      is_correct: false
      rationale: La alimentación puede ser correcta mientras la referencia de la señal introduce ruido.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-REFERENCE-NOISE
      score_effect: 0
      safety_effect: 0
      retry_feedback: La alimentación puede ser correcta mientras la referencia de la señal introduce ruido.
    - decision_id: DEC-03-READ-HMI
      is_correct: false
      rationale: Otra lectura HMI repite el efecto y no compara tensión ni referencias eléctricas.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-TRACE-REFERENCE-NOISE
      score_effect: 0
      safety_effect: 0
      retry_feedback: Otra lectura HMI repite el efecto y no compara tensión ni referencias eléctricas.
    - decision_id: DEC-03-MEASURE-VOLTAGE-BOUNDARIES
      is_correct: true
      rationale: Medir tensión y referencia en ambos lados muestra dónde una salida estable se vuelve una entrada oscilante.
      classification: strong
      consequence: Establece la siguiente frontera.
      evidence_revealed: ["EVID-04-VOLTAGE-MEASUREMENT"]
      next_stage: STAGE-04-TRACE-REFERENCE-NOISE
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-04-CHECK-PARAMETER
      is_correct: false
      rationale: Los parámetros no explican una diferencia de referencia entre salida e input.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-05-RESTORE-REFERENCE
      score_effect: 0
      safety_effect: 0
      retry_feedback: Los parámetros no explican una diferencia de referencia entre salida e input.
