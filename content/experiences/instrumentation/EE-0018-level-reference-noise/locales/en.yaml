locale: en
translations:
  title: Unstable level from a common reference in 0–10 V
  summary: Locate why stable level oscillates in PLC and HMI by tracing process, transmitter, 0–10 V signal, common reference, analog input and verification.
  scenario:
    initial_context: A tank level remains stable according to an independent reference, but the HMI oscillates and raises false alarms.
    operational_state: The first discrepancy may be in the process, transmitter, 0–10 V signal, common reference, analog input or PLC/HMI representation.
    initiating_event: Level supervision raises an intermittent alarm when a nearby load switches.
    learner_role: An instrumentation technician must separate physical level, transmitter, voltage, reference, input and HMI without changing scaling without evidence.
    safety_context:
      safe_state: Keep the process safe and take readings or intervene only under the authorized tank and installation procedure.
      intervention_constraints: ["Do not force values or bypass alarms.", "Do not change scaling before locating the discrepancy.", "Do not open terminals or change screen or reference outside the approved method.", "Verify the actual 0 V and screen architecture before disconnecting or reterminating."]
  learning_objectives:
    OBJ-TRACE-LEVEL-CHAIN:
      description: Trace the chain from physical level and transmitter to 0–10 V, reference, input, PLC and HMI.
    OBJ-LOCALIZE-VOLTAGE-REFERENCE:
      description: Distinguish physical level change, stable output and reference disturbance using measurements at authorized boundaries.
    OBJ-VERIFY-LEVEL-RECOVERY:
      description: Restore the reference according to the installed architecture and verify multiple levels with nearby loads.
  stages:
    STAGE-01-LEVEL-INCIDENT:
      title: Level incident
      situation: The tank level appears stable, but the HMI oscillates and raises false alarms. Which first check preserves the symptom without changing the process?
    STAGE-02-CHECK-INDEPENDENT-REFERENCE:
      title: Separate level and representation
      situation: The independent reference remains stable while the HMI fluctuates. Which comparison bounds the next boundary?
    STAGE-03-MEASURE-VOLTAGE-BOUNDARIES:
      title: Measure 0–10 V boundaries
      situation: The transmitter local indicator is stable, but the analog input oscillates. Which measurement separates output and reference from the control input?
    STAGE-04-TRACE-REFERENCE-NOISE:
      title: Locate reference and noise
      situation: Voltage is stable relative to transmitter 0 V, but the input value changes relative to its reference when a nearby load switches. Which inspection provides the next evidence?
    STAGE-05-RESTORE-REFERENCE:
      title: Restore the reference
      situation: Inspection confirms a common reference or screen termination incompatible with the installation. Which intervention corrects the path without hiding noise in PLC or HMI?
    STAGE-06-VERIFY-LEVEL-CHAIN:
      title: Verify level
      situation: The reference is corrected and the signal is stable. Which test demonstrates that level, 0–10 V, input, PLC and HMI remain coherent?
  evidence:
    EVID-01-INCIDENT:
      source: Tank level and HMI
      content: The independent tank reference remains stable, but the HMI oscillates and raises false level alarms. The symptom does not yet identify whether process, transmitter, reference or input changes.
    EVID-02-REFERENCE:
      source: Independent level reference
      content: An independent reference confirms that level remains stable while the HMI trend fluctuates. The discrepancy is after the observed physical condition or in the measurement chain, not necessarily in the tank.
    EVID-03-LOCAL-CORRELATION:
      source: Local level indicator and transmitter
      content: The transmitter local indicator remains stable during the HMI oscillation. The local measurement and process do not share the analog-input behavior.
    EVID-04-VOLTAGE-MEASUREMENT:
      source: 0–10 V test points and common references
      content: The 0–10 V output is stable relative to transmitter 0 V, but the analog input oscillates relative to its own reference during the same event. Scaling is unchanged.
    EVID-05-REFERENCE-FAULT:
      source: Common reference, screen and nearby load
      content: A nearby load introduces disturbance into the common path or screen termination according to the observed installation. The reference relationship does not follow the documented method for that architecture.
    EVID-06-INTERVENTION:
      source: Corrected reference connection
      content: Common reference and screen have been corrected under the procedure and the signal remains stable in an initial observation. Recovery still needs multiple levels and representative switching.
    EVID-07-RECOVERY:
      source: Multipoint test and nearby loads
      content: At low, mid and high points, level reference, 0–10 V output, analog input, PLC and HMI remain coherent while nearby loads switch. Oscillation does not return.
  decisions:
    DEC-01-RESTART-HMI:
      action: Restart the screen to see whether the oscillation disappears.
    DEC-01-CHECK-REFERENCE:
      action: Compare the trend with an independent reference.
    DEC-01-REPLACE-TRANSMITTER:
      action: Replace the transmitter before confirming level and signal.
    DEC-01-RAISE-LEVEL:
      action: Change tank level to make the HMI respond.
    DEC-02-CHECK-LOCAL:
      action: Compare independent reference, local indicator and HMI.
    DEC-02-CHANGE-SCALE:
      action: Change the engineering range to smooth the oscillation.
    DEC-02-RESTART-PLC:
      action: Restart the PLC to see whether the alarm disappears.
    DEC-02-ACK-ALARM:
      action: Acknowledge the alarm and keep watching the screen.
    DEC-03-REPLACE-AI:
      action: Replace the analog module because the HMI value oscillates.
    DEC-03-CHECK-SUPPLY:
      action: Measure only transmitter supply and close the boundary.
    DEC-03-READ-HMI:
      action: Read the HMI again to record the same symptom.
    DEC-03-MEASURE-VOLTAGE-BOUNDARIES:
      action: Measure 0–10 V and reference at both boundaries.
    DEC-04-CHECK-PARAMETER:
      action: Edit transmitter parameters before reviewing the reference.
    DEC-04-TRACE-REFERENCE:
      action: Check 0 V, screen and nearby loads under procedure.
    DEC-04-RESTART-LOAD:
      action: Cycle the nearby load to reproduce the noise.
    DEC-04-FORCE-PV:
      action: Force the level value to keep supervision running.
    DEC-05-REPLACE-TRANSMITTER:
      action: Replace the transmitter even though its local indication and output are stable.
    DEC-05-RESCALE-PLC:
      action: Change PLC scaling to compensate for the oscillation.
    DEC-05-RESTORE-REFERENCE:
      action: Restore 0 V and screen according to the installation method.
    DEC-05-BYPASS-SHIELD:
      action: Disconnect the screen without checking the reference scheme.
    DEC-06-VERIFY-MULTIPOINT:
      action: Compare low, mid and high levels with nearby switching.
    DEC-06-CLOSE-ONE-POINT:
      action: Close after one stable value without repeating the test.
    DEC-06-CLEAR-ALARM:
      action: Clear the alarm and document recovery without reviewing the chain.
    DEC-06-INCREASE-FILTER:
      action: Increase filtering to hide the oscillation during production.
  retry_feedback:
    DEC-01-RESTART-HMI: Reiniciar la pantalla puede ocultar la oscilación y elimina una observación útil.
    DEC-01-REPLACE-TRANSMITTER: El síntoma no demuestra que el transmisor esté averiado; primero hay que comparar la magnitud.
    DEC-01-RAISE-LEVEL: Cambiar el proceso modifica la condición de prueba y no localiza la oscilación.
    DEC-02-CHANGE-SCALE: La oscilación no se corrige cambiando una escala que todavía no se ha demostrado incorrecta.
    DEC-02-RESTART-PLC: Un reinicio puede repetir el síntoma y destruye la continuidad de la observación.
    DEC-02-ACK-ALARM: Reconocer una alarma cambia su presentación, pero no separa proceso e instrumentación.
    DEC-03-REPLACE-AI: La entrada que registra el síntoma todavía no está demostrada como averiada.
    DEC-03-CHECK-SUPPLY: La alimentación puede ser correcta mientras la referencia de la señal introduce ruido.
    DEC-03-READ-HMI: Otra lectura HMI repite el efecto y no compara tensión ni referencias eléctricas.
    DEC-04-CHECK-PARAMETER: Los parámetros no explican una diferencia de referencia entre salida e input.
    DEC-04-RESTART-LOAD: Ciclar la carga puede repetir el ruido sin conservar ni localizar la condición de referencia.
    DEC-04-FORCE-PV: Forzar el nivel sustituye la señal real por una suposición y rompe la trazabilidad.
    DEC-05-REPLACE-TRANSMITTER: La indicación local y la salida estable no justifican sustituir el transmisor.
    DEC-05-RESCALE-PLC: Modificar el escalado ocultaría la referencia defectuosa y dejaría el ruido físico sin resolver.
    DEC-05-BYPASS-SHIELD: Desconectar la pantalla sin conocer la arquitectura puede crear otra ruta de ruido.
    DEC-06-CLOSE-ONE-POINT: Un único valor estable no demuestra que la referencia permanezca limpia en operación.
    DEC-06-CLEAR-ALARM: Borrar la alarma no comprueba tensión, referencia ni propagación de la medida.
    DEC-06-INCREASE-FILTER: Filtrar más puede ocultar ruido y no verifica la instalación eléctrica.
  visual:
    educational_purpose: Distinguish stable physical level from an oscillating 0–10 V signal caused by common reference and verify the complete chain.
  assets:
