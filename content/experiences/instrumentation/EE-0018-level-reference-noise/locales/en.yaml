      caption: 'Initial incident: process appears stable while representation fluctuates.'
    ART-003:
      alt: Diagram comparing level, transmitter, 0–10 V signal and PLC/HMI input.
      caption: Boundary comparison separates stable level from oscillating signal.
    ART-004:
      alt: Technician measuring 0–10 V at approved test points.
      caption: Measure voltage and its reference at both sides before changing parameters.
    ART-005:
      alt: Diagram of common reference, screen and nearby load introducing noise.
      caption: Inspection locates the path coupling disturbance into the input.
    ART-006:
      alt: Technician correcting a reference termination in a junction box.
      caption: Repair follows the installation method without imposing a universal screen rule.
    ART-007:
      alt: Diagram verifying low, mid and high level with nearby loads.
      caption: Recovery is established with multiple points and no new oscillation.
  completion:
    title: Technical debrief
    summary: Level and transmitter remained stable, but an incompatible common reference or screen termination coupled nearby-load disturbance into the 0–10 V input. Architecture-specific correction and multipoint testing restored coherence.
    process: ["Preserve the oscillation and compare it with an independent reference.", "Separate level, local indicator and HMI.", "Measure voltage and reference at both boundaries.", "Relate disturbance to nearby loads and inspect 0 V and screen.", "Restore the reference according to the documented method.", "Verify low, mid and high points with representative switching."]
    lesson: A 0–10 V signal cannot be interpreted without its reference; output can appear stable relative to transmitter 0 V and oscillate relative to the input reference.
    avoided_errors: ["Changing the transmitter because of an HMI symptom.", "Changing scaling to hide noise.", "Applying a universal screen or grounding rule without reviewing the architecture.", "Closing after one stable value.", "Confusing filtering with reference correction."]
    industrial_value: ["Fewer false alarms and unjustified scaling changes.", "Better traceability for analog references and field noise.", "Repeatable verification under nearby loads."]
