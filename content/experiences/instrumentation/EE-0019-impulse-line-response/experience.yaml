  completion:
    title: "Debrief técnico"
    summary: "El proceso y la electrónica permanecían operativos, pero una restricción parcial en la línea de impulso amortiguaba y retrasaba la presión que llegaba al transmisor. La intervención autorizada restauró el camino y la verificación multipunto confirmó la respuesta de toda la cadena."
    process: ["Conservar el síntoma y comparar con una referencia independiente.","Separar proceso, indicación local y representación de control.","Realizar una prueba dinámica en la frontera del manifold.","Inspeccionar válvulas y líneas de impulso con el proceso en condición autorizada.","Aislar y acondicionar la línea sin cambiar el escalado validado.","Verificar cambios bajo, medio y alto desde proceso hasta HMI."]
    lesson: "Una indicación local estable no demuestra que el camino de presión responda a tiempo; la primera discrepancia dinámica debe localizarse antes de sustituir el instrumento o filtrar la señal."
    avoided_errors: ["Cambiar el transmisor por un síntoma de respuesta lenta.","Modificar el escalado o el amortiguamiento para ocultar el retraso.","Abrir una línea presurizada fuera del procedimiento.","Cerrar después de un único valor estable.","Confundir filtrado con recuperación de la transmisión física."]
    industrial_value: ["Menos sustituciones y cambios de parámetros injustificados.","Mejor trazabilidad de fallos dinámicos de instrumentación.","Verificación repetible desde proceso hasta HMI."]
    media_ids: ["ART-007"]
private:
  fault_model:
    root_cause: "Una restricción parcial en una línea de impulso o en su conexión inmediata amortigua y retrasa la transmisión de presión diferencial; el proceso, el transmisor y el escalado permanecen correctos."
    recovery_conditions: ["La referencia independiente y la indicación local siguen el cambio de proceso.","La respuesta dinámica se compara en la frontera del manifold y la entrada sin cambiar el escalado.","La línea se aísla, despresuriza y acondiciona conforme al procedimiento de la instalación.","Cambios bajo, medio y alto confirman coherencia entre proceso, transmisor, entrada, PLC y HMI sin retraso visible."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-PROCESS-CHANGE"
        statement: "La presión real cambia y la referencia independiente confirmará una variación distinta."
        initial_status: "possible"
      - id: "HYP-TRANSMITTER-OUTPUT"
        statement: "El transmisor o su configuración generan una respuesta lenta."
        initial_status: "possible"
      - id: "HYP-IMPULSE-PATH"
        statement: "Una restricción parcial limita la transmisión dinámica a través del manifold o la línea de impulso."
        initial_status: "possible"
      - id: "HYP-ANALOG-INPUT"
        statement: "La entrada o la representación introducen el retraso después de recibir la señal correcta."
        initial_status: "possible"
      - id: "HYP-SCALING-FILTER"
        statement: "El escalado o el filtrado cambian una respuesta correcta después de la entrada."
        initial_status: "possible"
    confirmed_root_cause: "HYP-IMPULSE-PATH"
    critical_path: ["DEC-01-CHECK-REFERENCE","DEC-02-CHECK-DYNAMIC","DEC-04-INSPECT-IMPULSE","DEC-05-ISOLATE-FLUSH","DEC-06-VERIFY-RESPONSE"]
  decision_logic:
    - decision_id: "DEC-01-RESET-HMI"
      is_correct: false
      rationale: "Reiniciar la pantalla puede ocultar el retraso y elimina una observación útil."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-SEPARATE-PROCESS"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Reiniciar la pantalla puede ocultar el retraso y elimina una observación útil."
    - decision_id: "DEC-01-CHECK-REFERENCE"
      is_correct: true
      rationale: "La referencia independiente separa un cambio real de proceso de un retraso de instrumentación."
      classification: "strong"
      consequence: "Revela la siguiente frontera del diagnóstico."
      evidence_revealed: ["EVID-02-REFERENCE-CORRELATION"]
      next_stage: "STAGE-02-SEPARATE-PROCESS"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-01-REPLACE-TRANSMITTER"
      is_correct: false
      rationale: "El síntoma no demuestra que el transmisor esté averiado; todavía no se ha comparado la cadena."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-SEPARATE-PROCESS"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "El síntoma no demuestra que el transmisor esté averiado; todavía no se ha comparado la cadena."
    - decision_id: "DEC-01-CHANGE-PROCESS"
      is_correct: false
      rationale: "Cambiar el proceso modifica la condición de prueba y no localiza la causa."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-SEPARATE-PROCESS"
      score_effect: 0
      safety_effect: -1
      retry_feedback: "Cambiar el proceso modifica la condición de prueba y no localiza la causa."
    - decision_id: "DEC-02-CHECK-DYNAMIC"
      is_correct: true
      rationale: "La comparación dinámica muestra si el retraso aparece antes o después de la indicación local."
      classification: "strong"
      consequence: "Revela la siguiente frontera del diagnóstico."
      evidence_revealed: ["EVID-03-DYNAMIC-TEST"]
      next_stage: "STAGE-03-CHECK-MEASUREMENT"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-02-CHANGE-SCALE"
      is_correct: false
      rationale: "El escalado no explica un retraso físico que aún no se ha localizado."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-CHECK-MEASUREMENT"
      score_effect: 0
      safety_effect: -1
      retry_feedback: "El escalado no explica un retraso físico que aún no se ha localizado."
    - decision_id: "DEC-02-RESTART-PLC"
      is_correct: false
      rationale: "Un reinicio puede repetir el efecto y rompe la continuidad de la observación."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-CHECK-MEASUREMENT"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Un reinicio puede repetir el efecto y rompe la continuidad de la observación."
    - decision_id: "DEC-02-ACK-ALARM"
      is_correct: false
      rationale: "Reconocer la alarma cambia su presentación, pero no separa las fronteras de medida."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-CHECK-MEASUREMENT"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Reconocer la alarma cambia su presentación, pero no separa las fronteras de medida."
    - decision_id: "DEC-03-REPLACE-TRANSMITTER"
      is_correct: false
      rationale: "Una respuesta local coherente no justifica sustituir el instrumento."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-04-TRACE-IMPULSE"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Una respuesta local coherente no justifica sustituir el instrumento."
    - decision_id: "DEC-03-MEASURE-STATIC"
      is_correct: false
      rationale: "Un valor estático no revela un problema que solo aparece durante un cambio."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-04-TRACE-IMPULSE"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Un valor estático no revela un problema que solo aparece durante un cambio."
