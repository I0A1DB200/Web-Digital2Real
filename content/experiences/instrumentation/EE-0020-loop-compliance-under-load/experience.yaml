classification:
  platform: "Generic two-wire 4–20 mA transmitter / 24 VDC loop / analog input"
  domain: "Loop power and load diagnosis"
  industry: "Process instrumentation"
  machine_type: "Two-wire field transmitter installation"
  difficulty: "foundation"
capability_references:
  - capability_id: "ICF-02"
    competency_ids: ["COMP-IIO-SIGNAL-TRACEABILITY","COMP-IIO-STATE-INTERPRETATION","COMP-IIO-CONTROLLED-RECOVERY"]
public:
  slug: "loop-compliance-under-load"
  title: "Caída del lazo 4–20 mA bajo carga"
  summary: "Localiza por qué un lazo 4–20 mA pierde margen cuando trabaja con su carga siguiendo fuente, cableado, transmisor, entrada analógica, PLC y HMI."
  estimated_duration: 20
  scenario:
    initial_context: "La referencia de proceso y la indicación local son estables, pero al conectar la carga normal la corriente y la HMI caen."
    operational_state: "La primera discrepancia puede estar en la fuente de 24 VDC, el cableado, los bornes, la carga, el transmisor, la entrada analógica o la representación."
    initiating_event: "Al conectar una carga o una entrada adicional, el lazo pierde corriente y el valor de control se separa de la referencia."
    learner_role: "Técnico de instrumentación responsable de localizar el límite eléctrico sin cambiar el escalado ni sustituir equipos sin evidencia."
    safety_context:
      safe_state: "Mantén el circuito en una condición segura y realiza mediciones e intervenciones únicamente conforme al procedimiento autorizado para la fuente, el lazo y la entrada."
      intervention_constraints: ["No puentear, cortocircuitar ni abrir un circuito energizado fuera del procedimiento aprobado.","Medir corriente en serie solo en puntos de prueba y con el método autorizado.","No cambiar la configuración del transmisor ni el escalado para ocultar la caída.","Desenergizar y verificar polaridad antes de modificar cableado, carga o bornes."]
  learning_objectives:
    - id: "OBJ-TRACE-LOOP-POWER"
      description: "Seguir la cadena eléctrica desde la fuente de 24 VDC y la carga hasta el transmisor, la entrada, el PLC y la HMI."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-LOCALIZE-LOOP-MARGIN"
      description: "Distinguir un proceso estable de una pérdida de margen causada por alimentación, recorrido o carga mediante mediciones en fronteras."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-VERIFY-LOOP-RECOVERY"
      description: "Restaurar el recorrido eléctrico y verificar corriente, tensión y representación en varios puntos sin compensar la causa en software."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-LOOP-INCIDENT"
      phase: "incident"
      title: "Incidente bajo carga"
      situation: "La referencia de proceso y la indicación local son estables, pero al conectar la carga normal la corriente y la HMI caen. ¿Qué primera comprobación conserva el síntoma?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-RESET-HMI","DEC-01-PRESERVE-REFERENCE","DEC-01-CHANGE-SCALE","DEC-01-REPLACE-TRANSMITTER"]
      media_ids: ["ART-002"]
    - id: "STAGE-02-CHECK-REFERENCE"
      phase: "investigation"
      title: "Medir la frontera del lazo"
      situation: "El proceso no ha cambiado y el transmisor sigue indicando localmente. ¿Qué medida separa la señal de la condición eléctrica del lazo?"
      evidence_ids: ["EVID-02-REFERENCE-CORRELATION"]
      decision_ids: ["DEC-02-READ-HMI","DEC-02-MEASURE-BOUNDARIES","DEC-02-RESTART-PLC","DEC-02-ADD-SUPPLY"]
      media_ids: ["ART-003"]
    - id: "STAGE-03-MEASURE-BOUNDARIES"
      phase: "investigation"
      title: "Comparar tensión disponible"
      situation: "La corriente cae únicamente con la carga conectada. ¿Qué comparación localiza si la pérdida aparece en la fuente, el cableado, la carga o el transmisor?"
      evidence_ids: ["EVID-03-VOLTAGE-BOUNDARY"]
      decision_ids: ["DEC-03-MEASURE-SOURCE","DEC-03-REMOVE-BURDEN","DEC-03-REPLACE-TRANSMITTER","DEC-03-COMPARE-VOLTAGES"]
      media_ids: ["ART-004"]
    - id: "STAGE-04-TRACE-LOAD"
      phase: "investigation"
      title: "Inspeccionar la carga"
      situation: "La tensión disponible en el transmisor cae bajo carga y el software de diagnóstico no acusa un fallo interno. ¿Qué inspección permite encontrar la resistencia o carga añadida?"
      evidence_ids: ["EVID-04-LOAD-DIAGNOSIS"]
      decision_ids: ["DEC-04-EDIT-SCALING","DEC-04-CYCLE-POWER","DEC-04-INSPECT-LOAD","DEC-04-FORCE-INPUT"]
      media_ids: ["ART-005"]
    - id: "STAGE-05-RESTORE-LOOP"
      phase: "solution"
      title: "Restaurar el margen"
      situation: "La inspección confirma una carga o conexión que reduce el margen del lazo. ¿Qué intervención corrige la causa sin ocultarla en el PLC?"
      evidence_ids: ["EVID-05-DIAGNOSIS"]
      decision_ids: ["DEC-05-REPLACE-TRANSMITTER","DEC-05-RESTORE-LOOP","DEC-05-BYPASS-BURDEN","DEC-05-SET-OVERRANGE"]
      media_ids: []
    - id: "STAGE-06-VERIFY-MULTIPOINT"
      phase: "solution"
      title: "Verificar bajo carga"
      situation: "El lazo vuelve a entregar corriente y el valor local es coherente. ¿Qué prueba demuestra que la cadena conserva margen en condiciones representativas?"
      evidence_ids: ["EVID-06-INTERVENTION"]
      decision_ids: ["DEC-06-CHECK-ONE-POINT","DEC-06-CLEAR-ALARM","DEC-06-INCREASE-FILTER","DEC-06-VERIFY-MULTIPOINT"]
      media_ids: ["ART-006"]
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Referencia de proceso y tendencia HMI"
      content: "La referencia de proceso y la indicación local permanecen estables; al conectar la carga normal del lazo, la corriente y la HMI caen. El síntoma todavía no separa fuente, carga, transmisor o entrada."
      reliability: "high"
      revealed_by: []
      media_ids: ["ART-002"]
    - id: "EVID-02-REFERENCE-CORRELATION"
      type: "measurement"
      source: "Referencia independiente e indicación local"
      content: "La referencia independiente y la indicación local siguen siendo coherentes. El cambio aparece en la cadena eléctrica cuando la carga queda conectada."
      reliability: "confirmed"
      revealed_by: ["DEC-01-PRESERVE-REFERENCE"]
      media_ids: ["ART-003"]
    - id: "EVID-03-VOLTAGE-BOUNDARY"
      type: "diagnostic"
      source: "Medición de corriente y tensión"
      content: "La corriente del lazo y la tensión en bornes del transmisor se comparan con la carga conectada. La fuente mantiene su presencia, pero el margen en el dispositivo se reduce bajo carga."
      reliability: "confirmed"
      revealed_by: ["DEC-02-MEASURE-BOUNDARIES"]
      media_ids: ["ART-004"]
    - id: "EVID-04-LOAD-DIAGNOSIS"
      type: "inspection"
      source: "Cableado, carga y software de diagnóstico"
      content: "La inspección encuentra una resistencia o carga añadida en el recorrido del lazo. El software externo muestra el dispositivo conectado y sin una avería interna que explique por sí sola la caída."
      reliability: "confirmed"
      revealed_by: ["DEC-03-COMPARE-VOLTAGES"]
      media_ids: ["ART-005"]
    - id: "EVID-05-DIAGNOSIS"
      type: "diagnostic"
      source: "Síntesis del presupuesto de tensión"
      content: "El proceso, el transmisor y el escalado permanecen operativos; el margen insuficiente aparece en la alimentación y la carga total del lazo. No hay base para compensar el síntoma en el PLC."
      reliability: "confirmed"
      revealed_by: ["DEC-04-INSPECT-LOAD"]
      media_ids: []
    - id: "EVID-06-INTERVENTION"
      type: "inspection"
      source: "Recorrido eléctrico restaurado"
      content: "La carga y las conexiones han sido corregidas conforme al procedimiento de la instalación. La corriente vuelve a seguir la referencia, pero la recuperación aún debe probarse en varios puntos."
      reliability: "confirmed"
      revealed_by: ["DEC-05-RESTORE-LOOP"]
      media_ids: ["ART-006"]
    - id: "EVID-07-RECOVERY"
      type: "functional_test"
      source: "Prueba multipunto bajo carga"
      content: "En puntos bajo, medio y alto, la referencia, la corriente, el transmisor, la entrada, el PLC y la HMI siguen la misma transición con margen eléctrico conservado. La recuperación queda verificada."
      reliability: "confirmed"
      revealed_by: ["DEC-06-VERIFY-MULTIPOINT"]
      media_ids: ["ART-007"]
  decisions:
    - id: "DEC-01-RESET-HMI"
      stage_id: "STAGE-01-LOOP-INCIDENT"
      action: "Reiniciar la HMI para que el valor parezca actualizado."
    - id: "DEC-01-PRESERVE-REFERENCE"
      stage_id: "STAGE-01-LOOP-INCIDENT"
      action: "Comparar referencia e indicación local antes de intervenir."
    - id: "DEC-01-CHANGE-SCALE"
      stage_id: "STAGE-01-LOOP-INCIDENT"
      action: "Cambiar el escalado para compensar la caída de la variable."
    - id: "DEC-01-REPLACE-TRANSMITTER"
      stage_id: "STAGE-01-LOOP-INCIDENT"
      action: "Sustituir el transmisor antes de medir el lazo bajo carga."
    - id: "DEC-02-READ-HMI"
      stage_id: "STAGE-02-CHECK-REFERENCE"
      action: "Leer otra vez la HMI sin medir la corriente ni la tensión del lazo."
    - id: "DEC-02-MEASURE-BOUNDARIES"
      stage_id: "STAGE-02-CHECK-REFERENCE"
      action: "Medir corriente y tensión en el transmisor con la carga conectada."
    - id: "DEC-02-RESTART-PLC"
      stage_id: "STAGE-02-CHECK-REFERENCE"
      action: "Reiniciar el PLC para comprobar si desaparece la caída."
    - id: "DEC-02-ADD-SUPPLY"
      stage_id: "STAGE-02-CHECK-REFERENCE"
      action: "Añadir una fuente temporal sin documentar la carga ni la polaridad."
    - id: "DEC-03-MEASURE-SOURCE"
      stage_id: "STAGE-03-MEASURE-BOUNDARIES"
      action: "Medir solo la fuente y dar por correcta toda la cadena."
    - id: "DEC-03-REMOVE-BURDEN"
      stage_id: "STAGE-03-MEASURE-BOUNDARIES"
      action: "Desconectar la carga y declarar correcto el transmisor porque vuelve la corriente."
    - id: "DEC-03-REPLACE-TRANSMITTER"
      stage_id: "STAGE-03-MEASURE-BOUNDARIES"
      action: "Cambiar el transmisor porque la corriente cae con la carga."
    - id: "DEC-03-COMPARE-VOLTAGES"
      stage_id: "STAGE-03-MEASURE-BOUNDARIES"
      action: "Comparar tensión de fuente, recorrido y transmisor bajo carga."
    - id: "DEC-04-EDIT-SCALING"
      stage_id: "STAGE-04-TRACE-LOAD"
      action: "Editar el escalado para que el valor de HMI se acerque al esperado."
    - id: "DEC-04-CYCLE-POWER"
      stage_id: "STAGE-04-TRACE-LOAD"
      action: "Ciclar la alimentación para intentar recuperar el margen."
    - id: "DEC-04-INSPECT-LOAD"
      stage_id: "STAGE-04-TRACE-LOAD"
      action: "Inspeccionar bornes, cableado y carga bajo el procedimiento."
    - id: "DEC-04-FORCE-INPUT"
      stage_id: "STAGE-04-TRACE-LOAD"
      action: "Forzar la entrada analógica mientras la carga sigue sin verificarse."
    - id: "DEC-05-REPLACE-TRANSMITTER"
      stage_id: "STAGE-05-RESTORE-LOOP"
      action: "Sustituir el transmisor aunque la indicación local sea coherente."
    - id: "DEC-05-RESTORE-LOOP"
      stage_id: "STAGE-05-RESTORE-LOOP"
      action: "Restaurar alimentación, cableado y carga según procedimiento."
    - id: "DEC-05-BYPASS-BURDEN"
      stage_id: "STAGE-05-RESTORE-LOOP"
      action: "Puentear la carga para mantener un valor mientras la causa sigue presente."
    - id: "DEC-05-SET-OVERRANGE"
      stage_id: "STAGE-05-RESTORE-LOOP"
      action: "Configurar un rango distinto para ocultar la caída de corriente."
    - id: "DEC-06-CHECK-ONE-POINT"
      stage_id: "STAGE-06-VERIFY-MULTIPOINT"
      action: "Cerrar después de observar un único punto estable."
    - id: "DEC-06-CLEAR-ALARM"
      stage_id: "STAGE-06-VERIFY-MULTIPOINT"
      action: "Borrar la alarma y documentar la reparación sin repetir la carga."
    - id: "DEC-06-INCREASE-FILTER"
      stage_id: "STAGE-06-VERIFY-MULTIPOINT"
      action: "Aumentar el filtrado para esconder cualquier caída residual."
    - id: "DEC-06-VERIFY-MULTIPOINT"
      stage_id: "STAGE-06-VERIFY-MULTIPOINT"
      action: "Repetir puntos bajo, medio y alto y verificar la cadena."
