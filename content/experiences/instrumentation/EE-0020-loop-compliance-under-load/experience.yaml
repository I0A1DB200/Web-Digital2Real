  completion:
    title: "Debrief técnico"
    summary: "El proceso y el transmisor permanecían operativos, pero la fuente, el recorrido y la carga dejaban un margen insuficiente para sostener el lazo. La corrección autorizada restauró la condición eléctrica y la verificación multipunto confirmó la respuesta completa."
    process: ["Conservar el síntoma y comparar con la referencia de proceso.","Medir corriente y tensión en las fronteras del lazo bajo carga.","Comparar fuente, caídas del recorrido y tensión disponible en el transmisor.","Inspeccionar carga, cableado, bornes y polaridad con el circuito en condición autorizada.","Restaurar la alimentación y la carga sin cambiar el escalado validado.","Verificar puntos bajo, medio y alto desde el lazo hasta la HMI."]
    lesson: "Una fuente presente no demuestra que exista margen suficiente en el transmisor; la primera discrepancia eléctrica debe localizarse antes de sustituir el instrumento o editar la escala."
    avoided_errors: ["Cambiar el transmisor por una caída que aparece solo bajo carga.","Modificar el escalado o el filtrado para ocultar el síntoma.","Puentear la carga sin localizarla.","Añadir una fuente temporal sin revisar polaridad ni procedimiento.","Cerrar después de un único valor estable."]
    industrial_value: ["Menos sustituciones y cambios de parámetros injustificados.","Mejor trazabilidad de fallos de alimentación y carga.","Verificación repetible del margen del lazo desde campo hasta HMI."]
    media_ids: ["ART-007"]
private:
  fault_model:
    root_cause: "Una carga total o resistencia añadida reduce el margen de tensión disponible en un lazo 4–20 mA de dos hilos; el proceso, el transmisor y el escalado permanecen correctos."
    recovery_conditions: ["La referencia de proceso y la indicación local siguen siendo coherentes.","La corriente y las tensiones de fuente, recorrido, carga y transmisor se comparan bajo carga.","La carga y las conexiones se corrigen conforme al procedimiento de la instalación.","Puntos bajo, medio y alto confirman coherencia entre corriente, transmisor, entrada, PLC y HMI con margen conservado."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-PROCESS-CHANGE"
        statement: "El proceso cambia y la referencia independiente confirmará una variación real."
        initial_status: "possible"
      - id: "HYP-TRANSMITTER-OUTPUT"
        statement: "El transmisor o su configuración generan una salida incorrecta bajo carga."
        initial_status: "possible"
      - id: "HYP-LOOP-SOURCE"
        statement: "La fuente o la polaridad no entregan la condición eléctrica requerida."
        initial_status: "possible"
      - id: "HYP-LOOP-LOAD"
        statement: "La carga total o una resistencia añadida consume el margen del lazo."
        initial_status: "possible"
      - id: "HYP-INPUT-SCALING"
        statement: "La entrada o el escalado representan una señal correcta de forma incorrecta."
        initial_status: "possible"
    confirmed_root_cause: "HYP-LOOP-LOAD"
    critical_path: ["DEC-01-PRESERVE-REFERENCE","DEC-02-MEASURE-BOUNDARIES","DEC-03-COMPARE-VOLTAGES","DEC-04-INSPECT-LOAD","DEC-05-RESTORE-LOOP","DEC-06-VERIFY-MULTIPOINT"]
  decision_logic:
    - decision_id: "DEC-01-RESET-HMI"
      is_correct: false
      rationale: "Reiniciar la pantalla cambia la presentación y no separa el síntoma eléctrico."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-CHECK-REFERENCE"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Reiniciar la pantalla cambia la presentación y no separa el síntoma eléctrico."
    - decision_id: "DEC-01-PRESERVE-REFERENCE"
      is_correct: true
      rationale: "La referencia y la indicación local permiten demostrar que el proceso no es la primera discrepancia."
      classification: "strong"
      consequence: "Revela la siguiente frontera del diagnóstico."
      evidence_revealed: ["EVID-02-REFERENCE-CORRELATION"]
      next_stage: "STAGE-02-CHECK-REFERENCE"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-01-CHANGE-SCALE"
      is_correct: false
      rationale: "El escalado no crea margen eléctrico y ocultaría una caída del lazo."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-CHECK-REFERENCE"
      score_effect: 0
      safety_effect: -1
      retry_feedback: "El escalado no crea margen eléctrico y ocultaría una caída del lazo."
    - decision_id: "DEC-01-REPLACE-TRANSMITTER"
      is_correct: false
      rationale: "La caída aparece bajo carga y todavía no demuestra una avería interna."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-CHECK-REFERENCE"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "La caída aparece bajo carga y todavía no demuestra una avería interna."
    - decision_id: "DEC-02-READ-HMI"
      is_correct: false
      rationale: "Otra lectura de HMI repite el efecto y no identifica la frontera de tensión."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-MEASURE-BOUNDARIES"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Otra lectura de HMI repite el efecto y no identifica la frontera de tensión."
    - decision_id: "DEC-02-MEASURE-BOUNDARIES"
      is_correct: true
      rationale: "La corriente y la tensión en bornes muestran si el dispositivo conserva margen con la carga conectada."
      classification: "strong"
      consequence: "Revela la siguiente frontera del diagnóstico."
      evidence_revealed: ["EVID-03-VOLTAGE-BOUNDARY"]
      next_stage: "STAGE-03-MEASURE-BOUNDARIES"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-02-RESTART-PLC"
      is_correct: false
      rationale: "Un reinicio no modifica el presupuesto eléctrico del lazo y rompe la continuidad de la observación."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-MEASURE-BOUNDARIES"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Un reinicio no modifica el presupuesto eléctrico del lazo y rompe la continuidad de la observación."
    - decision_id: "DEC-02-ADD-SUPPLY"
      is_correct: false
      rationale: "Añadir una fuente sin revisar polaridad y carga introduce una condición insegura y no localiza la causa."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-MEASURE-BOUNDARIES"
      score_effect: 0
      safety_effect: -1
      retry_feedback: "Añadir una fuente sin revisar polaridad y carga introduce una condición insegura y no localiza la causa."
    - decision_id: "DEC-03-MEASURE-SOURCE"
      is_correct: false
      rationale: "Una fuente presente puede perder margen en el recorrido o la carga."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-04-TRACE-LOAD"
      score_effect: 0
      safety_effect: 0
      retry_feedback: "Una fuente presente puede perder margen en el recorrido o la carga."
    - decision_id: "DEC-03-REMOVE-BURDEN"
      is_correct: false
