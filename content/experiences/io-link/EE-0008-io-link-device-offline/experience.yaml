  completion:
    title: "Lección industrial"
    summary: "La pérdida de alimentación y comunicación fue provocada por un conector M12 parcialmente desenroscado. Asegurarlo y verificar toda la cadena restableció el dispositivo y la estación."
    process:
      - "Interpretar la alarma."
      - "Observar el estado del sensor."
      - "Revisar el puerto del maestro."
      - "Consultar el diagnóstico online."
      - "Medir alimentación."
      - "Inspeccionar cable y conector."
      - "Reparar."
      - "Confirmar la recuperación completa."
    lesson: "Un dispositivo no alcanzable no debe sustituirse automáticamente. Cuando el maestro funciona y el fallo está localizado en un puerto, deben comprobarse primero alimentación, cableado y conectores."
    avoided_errors:
      - "Reiniciar el PLC sin evidencia."
      - "Borrar alarmas como única actuación."
      - "Sustituir el sensor sin medir."
      - "Modificar software ante un fallo físico."
      - "Cerrar la avería sin verificar producción."
    industrial_value:
      - "Reducción del MTTR."
      - "Menor sustitución innecesaria de componentes."
      - "Diagnóstico reproducible."
      - "Mejor documentación de la causa."
    media_ids:
      - "MEDIA-OUTRO-RECOVERY"

private:
  fault_model:
    root_cause: "Un conector M12 parcialmente desenroscado interrumpe la alimentación y la comunicación del sensor IO-Link sin dañar el sensor ni el maestro."
    recovery_conditions:
      - "Estación asegurada y acceso autorizado."
      - "Conector M12 correctamente asentado y asegurado."
      - "Alimentación del sensor restablecida."
      - "Puerto 3 y dispositivo en estado operativo."
      - "Señal del sensor recibida por el control."
      - "Funcionamiento normal de estación verificado."
  diagnostic_model:
    hypotheses:
      - id: "HYP-POWER-CONNECTION"
        statement: "Falta alimentación por cable o conexión defectuosa en el dispositivo."
        initial_status: "likely"
      - id: "HYP-SENSOR-FAULT"
        statement: "El sensor presenta un fallo interno."
        initial_status: "possible"
      - id: "HYP-MASTER-FAULT"
        statement: "El maestro IO-Link presenta un fallo general."
        initial_status: "unlikely"
      - id: "HYP-NETWORK-FAULT"
        statement: "La comunicación industrial general está interrumpida."
        initial_status: "unlikely"
      - id: "HYP-SOFTWARE-CHANGE"
        statement: "Un cambio de programa provoca el incidente."
        initial_status: "unlikely"
    confirmed_root_cause: "HYP-POWER-CONNECTION"
    critical_path:
      - "DEC-D1-A-INSPECT-DEVICE"
      - "DEC-D2-A-LED-OFF"
      - "DEC-D3-A-LOCALIZE-PORT"
      - "DEC-D4-A-POWER-CONNECTION"
      - "DEC-D5-A-CHECK-M12"
      - "DEC-D6-A-SECURE-CONNECTOR"
      - "DEC-D7-A-FULL-VERIFICATION"
  decision_logic:
    - decision_id: "DEC-D1-A-INSPECT-DEVICE"
      rationale: "Inspeccionar el dispositivo conserva evidencia y localiza el fallo."
      classification: "strong"
      consequence: "Se observa el sensor sin reiniciar el sistema."
      evidence_revealed: ["EVID-03-SENSOR-LED"]
      next_stage: "STAGE-03-SENSOR"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-D1-B-RESTART-PLC"
      rationale: "El PLC está en RUN y no existe evidencia de fallo general."
      classification: "weak"
      consequence: "El reinicio no corrige la pérdida física y elimina contexto diagnóstico."
      evidence_revealed: []
      next_stage: "STAGE-03-SENSOR"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-D1-C-CLEAR-ALARM"
      rationale: "Reconocer la alarma no investiga su causa."
      classification: "weak"
      consequence: "El síntoma reaparece porque el dispositivo sigue fuera de línea."
      evidence_revealed: []
      next_stage: "STAGE-03-SENSOR"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-D1-D-REPLACE-SENSOR"
      rationale: "Sustituir sin comprobar alimentación ni conexión introduce coste injustificado."
      classification: "weak"
      consequence: "La sustitución no resuelve la conexión defectuosa."
      evidence_revealed: []
      next_stage: "STAGE-03-SENSOR"
      score_effect: -7
      safety_effect: 0
    - decision_id: "DEC-D2-A-LED-OFF"
      rationale: "El LED apagado es evidencia directa compatible con falta de alimentación o conexión."
      classification: "strong"
      consequence: "La investigación avanza hacia alimentación, conexión o fallo interno."
      evidence_revealed: ["EVID-04-MASTER-PORT"]
      next_stage: "STAGE-04-MASTER"
      score_effect: 10
      safety_effect: 0
    - decision_id: "DEC-D2-B-DIRTY-BRACKET"
      rationale: "La suciedad del soporte no explica la ausencia de LED."
      classification: "weak"
      consequence: "Se prioriza una observación secundaria."
      evidence_revealed: []
      next_stage: "STAGE-04-MASTER"
      score_effect: -3
      safety_effect: 0
    - decision_id: "DEC-D2-C-GUIDE-PROXIMITY"
      rationale: "La ubicación cerca de la guía no explica la pérdida de comunicación."
      classification: "weak"
      consequence: "La hipótesis no se apoya en el estado eléctrico observado."
      evidence_revealed: []
      next_stage: "STAGE-04-MASTER"
      score_effect: -3
      safety_effect: 0
    - decision_id: "DEC-D2-D-CABLE-COLOR"
      rationale: "El color del cable carece de valor diagnóstico."
      classification: "weak"
      consequence: "No se obtiene información útil sobre el fallo."
      evidence_revealed: []
      next_stage: "STAGE-04-MASTER"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-D3-A-LOCALIZE-PORT"
      rationale: "Un único puerto en fallo con maestro y otros puertos operativos localiza el alcance."
