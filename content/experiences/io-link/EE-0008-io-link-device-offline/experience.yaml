        caption: "Estación 3 detenida durante producción."
        purpose: "catalog_cover"
      - id: "MEDIA-INTRO-INCIDENT"
        type: "video"
        src: "assets/EXP-IOLINK-DEVICE-008/intro-incident.mp4"
