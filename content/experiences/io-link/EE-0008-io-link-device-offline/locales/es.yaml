locale: "es"
translations:
  title: "Dispositivo IO-Link fuera de línea"
  summary: "Diagnostica por evidencias por qué un sensor IO-Link ha quedado fuera de línea y recupera la estación sin reinicios ni sustituciones injustificadas."
  scenario:
    initial_context: "A las 08:17, la estación 3 de una línea automatizada de transporte y clasificación se detiene durante producción normal. Hay cajas acumuladas y el operario informa: «La cinta se ha parado y las cajas ya no avanzan. Parece que el sensor no detecta»."
    operational_state: "La estación 3 está detenida; el resto de estaciones funciona, no hay parada de emergencia, el PLC está en RUN y la HMI informa de pérdida de comunicación con un dispositivo IO-Link."
    initiating_event: "El sensor de presencia deja de confirmar el paso de producto durante producción normal, sin intervención previa registrada."
    learner_role: "Técnico de automatización responsable de localizar el fallo mediante observación, hipótesis, evidencia, descarte, reparación y verificación."
    safety_context:
      safe_state: "La estación debe permanecer detenida y asegurada antes de inspeccionar, medir o manipular el dispositivo y su conexión."
      intervention_constraints:
        - "No puentear funciones de seguridad ni forzar señales."
        - "Asegurar la zona antes de acceder al sensor o al conector."
        - "Preservar alarmas y estados diagnósticos antes de reiniciar equipos."
        - "Realizar mediciones eléctricas con el procedimiento y equipo autorizados."
        - "Confirmar la recuperación completa antes de devolver la estación a producción."
  learning_objectives:
    COMP-STATE-INTERPRETATION:
      description: "Interpretar conjuntamente el estado del PLC, la HMI, el sensor y el puerto del maestro."
    COMP-EVIDENCE-TROUBLESHOOTING:
      description: "Priorizar observaciones y mediciones que diferencien un fallo de dispositivo, alimentación o comunicación."
    COMP-CONTROLLED-RECOVERY:
      description: "Reparar la conexión y verificar de forma controlada dispositivo, señal y funcionamiento de estación."
  stages:
    STAGE-01-INCIDENT:
      title: "Parada en la estación 3"
      situation: "Son las 08:17. La línea se ha detenido en la estación 3, hay cajas acumuladas y el sensor de presencia no confirma el paso de producto. El resto de estaciones sigue operativo."
    STAGE-02-HMI-ALARM:
      title: "Primera información disponible"
      situation: "La HMI muestra: Station 3 — Sensor communication lost — IO-Link Port 3."
    STAGE-03-SENSOR:
      title: "Inspección del sensor"
      situation: "El sensor está correctamente montado y no presenta daños visibles. Su LED de estado permanece apagado."
    STAGE-04-MASTER:
      title: "Estado del maestro IO-Link"
      situation: "El maestro está operativo. Power y RUN están activos; el puerto 3 presenta señal roja intermitente y los demás puertos permanecen operativos."
    STAGE-05-DIAGNOSTICS:
      title: "Diagnóstico online"
      situation: "El diagnóstico online muestra: IO-Link Master — Port 3 — Device not reachable. La topología confirma el recorrido PLC → IO-Link Master → Port 3 → Presence Sensor."
    STAGE-06-ELECTRICAL:
      title: "Verificación eléctrica"
      situation: "La medición autorizada de tensión en el conector del sensor muestra 0.0 VDC."
    STAGE-07-ROOT-CAUSE:
      title: "Causa localizada"
      situation: "La inspección física muestra que el conector M12 está parcialmente desenroscado. No está completamente desconectado, pero ha perdido contacto eléctrico."
    STAGE-08-RECOVERY:
      title: "Verificación de la recuperación"
      situation: "Tras asegurar el conector, el sensor recupera alimentación, el LED se enciende, el puerto 3 vuelve a estado operativo, desaparece la alarma y la estación vuelve a detectar cajas."
  evidence:
    EVID-01-OPERATOR-REPORT:
      source: "Operador de línea"
      content: "La cinta se ha parado, las cajas ya no avanzan y parece que el sensor no detecta."
    EVID-02-HMI-ALARM:
      source: "HMI de estación"
      content: "Station 3 — Sensor communication lost — IO-Link Port 3."
    EVID-03-SENSOR-LED:
      source: "Inspección del sensor"
      content: "El sensor no tiene daños visibles y su LED de estado está apagado."
    EVID-04-MASTER-PORT:
      source: "Maestro IO-Link"
      content: "Power y RUN activos; puertos 1, 2 y 4 operativos; puerto 3 rojo intermitente."
    EVID-05-ONLINE-DIAGNOSTIC:
      source: "Diagnóstico online"
      content: "IO-Link Master — Port 3 — Device not reachable."
    EVID-06-TOPOLOGY:
      source: "Topología de estación"
      content: "PLC → IO-Link Master → Port 3 → Presence Sensor."
    EVID-07-ZERO-VOLTAGE:
      source: "Medición en conector del sensor"
      content: "La medición autorizada muestra 0.0 VDC."
    EVID-08-LOOSE-M12:
      source: "Conector M12"
      content: "El conector está parcialmente desenroscado y ha perdido contacto eléctrico."
    EVID-09-RECOVERY:
      source: "Prueba funcional controlada"
      content: "Sensor alimentado, LED activo, puerto 3 operativo, alarma despejada y detección de cajas restablecida."
  decisions:
    DEC-D1-A-INSPECT-DEVICE:
      action: "Revisar el estado del dispositivo afectado."
    DEC-D1-B-RESTART-PLC:
      action: "Reiniciar el PLC."
    DEC-D1-C-CLEAR-ALARM:
      action: "Borrar la alarma y arrancar de nuevo."
    DEC-D1-D-REPLACE-SENSOR:
      action: "Sustituir directamente el sensor."
    DEC-D2-A-LED-OFF:
      action: "Priorizar como evidencia que el LED del sensor está apagado."
    DEC-D2-B-DIRTY-BRACKET:
      action: "Priorizar la suciedad observada en el soporte."
    DEC-D2-C-GUIDE-PROXIMITY:
      action: "Priorizar la proximidad del sensor a la guía."
    DEC-D2-D-CABLE-COLOR:
      action: "Priorizar que el cable es de color negro."
    DEC-D3-A-LOCALIZE-PORT:
      action: "Localizar el problema en el dispositivo o conexión del puerto 3."
    DEC-D3-B-PLC-FAULT:
      action: "Concluir que el PLC está averiado."
    DEC-D3-C-NETWORK-DOWN:
      action: "Concluir que toda la red IO-Link está caída."
    DEC-D3-D-PROFINET-FAULT:
      action: "Concluir que existe un fallo general de Profinet."
    DEC-D4-A-POWER-CONNECTION:
      action: "Priorizar falta de alimentación o problema de conexión en el dispositivo."
    DEC-D4-B-PLC-PROGRAM:
      action: "Priorizar un error de programación del PLC."
    DEC-D4-C-CONTROLLER-FAULT:
      action: "Priorizar una avería completa del controlador."
    DEC-D4-D-DRIVE-FAULT:
      action: "Priorizar un fallo del variador de la cinta."
    DEC-D5-A-CHECK-M12:
      action: "Revisar el cable y el conector M12 del sensor."
    DEC-D5-B-PLC-IP:
      action: "Revisar la dirección IP del PLC."
    DEC-D5-C-DRIVE-PROGRAM:
      action: "Revisar el programa del variador."
    DEC-D5-D-HMI-CONFIG:
      action: "Revisar la configuración de la HMI."
    DEC-D6-A-SECURE-CONNECTOR:
      action: "Asegurar el conector, verificar el asiento y comprobar de nuevo el estado."
    DEC-D6-B-REPLACE-PLC:
      action: "Sustituir el PLC."
    DEC-D6-C-FACTORY-RESET:
      action: "Restaurar el maestro IO-Link a valores de fábrica."
    DEC-D6-D-IGNORE-ALARM:
      action: "Modificar la lógica para ignorar la alarma."
    DEC-D7-A-FULL-VERIFICATION:
      action: "Confirmar dispositivo operativo, señal en control y estación funcionando en condiciones normales."
    DEC-D7-B-ALARM-ACK:
      action: "Considerar suficiente que la alarma haya sido reconocida en la HMI."
    DEC-D7-C-PLC-RUN:
      action: "Considerar suficiente que el PLC permanezca en RUN."
    DEC-D7-D-OPERATOR-GUESS:
      action: "Aceptar que probablemente funciona según la impresión del operario."
  visual:
    educational_purpose: "Representar la progresión desde el síntoma de estación hasta la localización eléctrica y la recuperación verificada del dispositivo IO-Link."
  assets:
    MEDIA-COVER:
      alt: "Estación industrial de clasificación con cinta, sensor, armario eléctrico y baliza amarilla."
      caption: "Estación 3 detenida durante producción."
    MEDIA-INTRO-INCIDENT:
      alt: "Caja que alcanza el sensor sin ser detectada antes de detenerse la cinta."
      caption: "Inicio del incidente en la estación 3."
    MEDIA-SENSOR-LED:
      alt: "Sensor de presencia con el LED apagado mientras una caja permanece delante."
      caption: "Inspección visual del sensor."
    MEDIA-MASTER-PORT:
      alt: "Maestro IO-Link con el puerto 3 en rojo intermitente y el resto de puertos operativos."
      caption: "Estado localizado del puerto 3."
    MEDIA-ONLINE-DIAGNOSTICS:
      alt: "Diagnóstico online genérico que muestra Port 3 Device not reachable."
      caption: "Diagnóstico online del maestro."
    MEDIA-TOPOLOGY:
      alt: "Topología desde PLC hacia maestro IO-Link, puerto 3 y sensor de presencia."
      caption: "Topología funcional de la estación."
    MEDIA-VOLTAGE-CHECK:
      alt: "Multímetro conectado al conector del sensor mostrando cero voltios continuos."
      caption: "Medición de alimentación en el sensor."
    MEDIA-LOOSE-M12:
      alt: "Conector M12 parcialmente desenroscado con una separación visible."
      caption: "Conexión física defectuosa localizada."
    MEDIA-OUTRO-RECOVERY:
      alt: "Sensor alimentado, puerto 3 operativo y caja avanzando con la baliza verde."
      caption: "Recuperación funcional verificada."
  completion:
    title: "Lección industrial"
    summary: "La pérdida de alimentación y comunicación fue provocada por un conector M12 parcialmente desenroscado. Asegurarlo y verificar toda la cadena restableció el dispositivo y la estación."
    process:
      - "Interpretar la alarma."
      - "Observar el estado del sensor."
      - "Revisar el puerto del maestro."
      - "Consultar el diagnóstico online."
      - "Medir alimentación."
      - "Inspeccionar cable y conector."
      - "Reparar."
      - "Confirmar la recuperación completa."
    lesson: "Un dispositivo no alcanzable no debe sustituirse automáticamente. Cuando el maestro funciona y el fallo está localizado en un puerto, deben comprobarse primero alimentación, cableado y conectores."
    avoided_errors:
      - "Reiniciar el PLC sin evidencia."
      - "Borrar alarmas como única actuación."
      - "Sustituir el sensor sin medir."
      - "Modificar software ante un fallo físico."
      - "Cerrar la avería sin verificar producción."
    industrial_value:
      - "Reducción del MTTR."
      - "Menor sustitución innecesaria de componentes."
      - "Diagnóstico reproducible."
      - "Mejor documentación de la causa."
