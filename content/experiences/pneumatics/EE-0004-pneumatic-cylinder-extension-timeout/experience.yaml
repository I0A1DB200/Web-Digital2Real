        purpose: "evidence"
      - id: "ART-005"
        type: "image"
        src: "assets/EXP-PNEUMATIC-CYLINDER-004/05.png"
        alt: "Cilindro con vástago visible, flecha de extensión y referencia gráfica."
        caption: "La observación descrita confirma extensión lenta e incompleta; la imagen no mide tiempo ni velocidad."
        purpose: "evidence"
      - id: "ART-006"
        type: "image"
        src: "assets/EXP-PNEUMATIC-CYLINDER-004/06.png"
        alt: "Primer plano de un regulador de caudal ajustable y sus conexiones."
        caption: "Componente de la inspección descrita; la imagen no cuantifica el ajuste ni demuestra el circuito completo."
        purpose: "evidence"
      - id: "ART-007"
        type: "image"
        src: "assets/EXP-PNEUMATIC-CYLINDER-004/07.png"
