        purpose: "completion"
  completion:
    title: "Debrief técnico"
    summary: "La presión general estaba disponible, pero una restricción excesiva del escape limitaba el caudal y ralentizaba la extensión hasta provocar el timeout."
    process: ["Interpretar mando y feedback.", "Observar la indicación local de Y1.", "Comprobar presión general.", "Observar movimiento parcial.", "Localizar la restricción de escape.", "Restaurar la regulación prevista y verificar ciclos repetidos."]
    lesson: "Mando presente no demuestra movimiento correcto y presión disponible no demuestra caudal suficiente."
    avoided_errors: ["Sustituir PLC, válvula, cilindro o sensor sin evidencia.", "Forzar ExtendedLS.", "Ocultar la anomalía aumentando el timeout.", "Abrir totalmente o eliminar la regulación."]
    industrial_value: ["Diagnóstico por fronteras.", "Menos sustituciones injustificadas.", "Movimiento neumático controlado y recuperación verificable."]
    media_ids: ["ART-007"]

private:
  fault_model:
    root_cause: "Restricción excesiva del escape durante la extensión en el regulador unidireccional de caudal del cilindro."
    recovery_conditions: ["Ajuste previsto del regulador restaurado mediante práctica segura.", "Velocidad y carrera completas recuperadas.", "ExtendedLS TRUE dentro de la ventana esperada.", "Ciclos representativos repetidos sin timeout."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-CONTROL"
        statement: "La petición o salida PLC no alcanza Y1."
        initial_status: "possible"
      - id: "HYP-SUPPLY"
        statement: "No existe presión neumática general suficiente."
        initial_status: "possible"
      - id: "HYP-SENSOR"
        statement: "ExtendedLS no detecta una extensión físicamente completada."
        initial_status: "possible"
      - id: "HYP-EXHAUST-RESTRICTION"
        statement: "El escape durante la extensión está excesivamente restringido."
        initial_status: "likely"
    confirmed_root_cause: "HYP-EXHAUST-RESTRICTION"
    critical_path: ["DEC-01-TRACE-ACTUATION", "DEC-02-CONTINUE-DOWNSTREAM", "DEC-03-INVESTIGATE-LOCAL-FLOW", "DEC-04-INSPECT-FLOW-LOAD", "DEC-05-RESTORE-SETTING", "DEC-06-REPEAT-CYCLES"]
  decision_logic:
    - decision_id: "DEC-01-TRACE-ACTUATION"
      is_correct: true
      rationale: "El timeout solo establece una discrepancia temporal."
      classification: "strong"
      consequence: "Se comprueba la frontera eléctrica."
      evidence_revealed: ["EVID-03-Y1"]
      next_stage: "STAGE-02-Y1-ACTUATION"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-01-REPLACE-CYLINDER"
      is_correct: false
      retry_feedback: "El timeout no identifica el componente averiado. Primero confirma hasta dónde llega el mando."
      rationale: "No hay evidencia de fallo del cilindro."
      classification: "weak"
      consequence: "Sustitución injustificada."
      evidence_revealed: []
      next_stage: "STAGE-02-Y1-ACTUATION"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-01-INCREASE-TIMEOUT"
      is_correct: false
      retry_feedback: "Aumentar el timeout puede ocultar una degradación física; no explica la ausencia de feedback dentro de la condición prevista."
      rationale: "El tiempo no corrige la causa física."
      classification: "weak"
      consequence: "La anomalía permanece."
      evidence_revealed: []
      next_stage: "STAGE-02-Y1-ACTUATION"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-01-FORCE-FEEDBACK"
      is_correct: false
      retry_feedback: "Forzar ExtendedLS elimina una salvaguarda de secuencia y no demuestra que el actuador haya alcanzado la posición."
      rationale: "El feedback forzado no es evidencia física."
      classification: "unsafe"
      consequence: "Se falsea la posición."
      evidence_revealed: []
      next_stage: "STAGE-02-Y1-ACTUATION"
      score_effect: -10
      safety_effect: -10
    - decision_id: "DEC-02-CONTINUE-DOWNSTREAM"
      is_correct: true
      rationale: "La indicación local de Y1 justifica continuar la investigación aguas abajo."
      classification: "strong"
      consequence: "Se comprueba la energía neumática."
      evidence_revealed: ["EVID-04-SUPPLY"]
      next_stage: "STAGE-03-PNEUMATIC-SUPPLY"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-02-REPLACE-PLC"
      is_correct: false
      retry_feedback: "La indicación local de Y1 responde a la petición; no hay evidencia que justifique sustituir la salida PLC. Continúa la investigación."
      rationale: "La indicación local de Y1 es coherente con la petición; su alcance es limitado."
      classification: "weak"
      consequence: "La causa continúa."
      evidence_revealed: []
      next_stage: "STAGE-03-PNEUMATIC-SUPPLY"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-02-ASSUME-MOVEMENT"
      is_correct: false
      retry_feedback: "El indicador de Y1 confirma una orden eléctrica local, no carrera, velocidad ni posición física del cilindro."
      rationale: "Energizado no equivale a movimiento correcto."
      classification: "weak"
      consequence: "Se omite la cadena neumática."
      evidence_revealed: []
      next_stage: "STAGE-03-PNEUMATIC-SUPPLY"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-03-INVESTIGATE-LOCAL-FLOW"
      is_correct: true
      rationale: "La presión general no demuestra caudal local suficiente."
      classification: "strong"
      consequence: "Se observa la dinámica del cilindro."
      evidence_revealed: ["EVID-05-PARTIAL-EXTENSION"]
      next_stage: "STAGE-04-CYLINDER-BEHAVIOR"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-03-INCREASE-PRESSURE"
      is_correct: false
      retry_feedback: "La lectura nominal de esta máquina ya está disponible. Aumentarla sin localizar el comportamiento local no prueba ni corrige la causa."
      rationale: "Presión y caudal son magnitudes distintas."
      classification: "unsafe"
      consequence: "Se altera una condición sin diagnóstico."
      evidence_revealed: []
      next_stage: "STAGE-04-CYLINDER-BEHAVIOR"
      score_effect: -8
      safety_effect: -5
    - decision_id: "DEC-03-BLAME-COMPRESSOR"
      is_correct: false
      retry_feedback: "No hay alarma general ni pérdida de presión observada. Continúa desde la preparación de aire hacia el actuador."
      rationale: "La hipótesis general no concuerda con la evidencia."
      classification: "weak"
      consequence: "Se investiga fuera del dominio probable."
      evidence_revealed: []
      next_stage: "STAGE-04-CYLINDER-BEHAVIOR"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-04-INSPECT-FLOW-LOAD"
      is_correct: true
      rationale: "El movimiento parcial desplaza la frontera hacia dinámica local y carga."
      classification: "strong"
      consequence: "Se inspecciona el control de escape."
      evidence_revealed: ["EVID-06-FLOW-CONTROL"]
      next_stage: "STAGE-05-FLOW-CONTROL"
      score_effect: 10
      safety_effect: 2
    - decision_id: "DEC-04-REPLACE-LS"
      is_correct: false
      retry_feedback: "ExtendedLS permanece FALSE porque la carrera física no termina. El feedback puede ser una consecuencia, no la causa."
      rationale: "No se ha alcanzado la posición de detección."
      classification: "weak"
      consequence: "El movimiento lento permanece."
      evidence_revealed: []
      next_stage: "STAGE-05-FLOW-CONTROL"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-04-REPLACE-VALVE"
      is_correct: false
      retry_feedback: "La actuación y el inicio de movimiento están confirmados. Inspecciona primero la regulación local y la carga antes de sustituir la válvula."
      rationale: "La válvula no está confirmada como causa."
      classification: "weak"
      consequence: "Sustitución prematura."
      evidence_revealed: []
      next_stage: "STAGE-05-FLOW-CONTROL"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-05-RESTORE-SETTING"
      is_correct: true
      rationale: "Restaura la condición regulada prevista sin eliminar control."
      classification: "strong"
      consequence: "Se restaura el ajuste previsto; la recuperación funcional queda pendiente de verificación."
      evidence_revealed: []
      next_stage: "STAGE-06-VERIFY-RECOVERY"
      score_effect: 10
      safety_effect: 2
    - decision_id: "DEC-05-REMOVE-CONTROL"
      is_correct: false
      retry_feedback: "Eliminar la regulación cambia el comportamiento diseñado y puede producir movimiento no controlado. Restaura el ajuste previsto."
      rationale: "La regulación cumple una función dinámica."
      classification: "unsafe"
