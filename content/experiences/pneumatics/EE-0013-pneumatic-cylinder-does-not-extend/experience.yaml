  completion:
    title: "Debrief técnico"
    summary: "La orden PLC, la actuación de control y el suministro general eran correctos, pero una línea desconectada en el cilindro interrumpía la entrega local de energía neumática."
    process: ["Confirmar mando y lógica.", "Seguir salida y actuación.", "Comprobar suministro neumático.", "Inspeccionar la conexión local con energías controladas.", "Restaurar la conexión.", "Verificar extensión y feedback."]
    lesson: "Una orden PLC correcta no demuestra que el actuador reciba físicamente energía."
    avoided_errors: ["Forzar feedback.", "Sustituir componentes sin evidencia.", "Manipular una línea presurizada.", "Confundir reconexión con recuperación verificada."]
    industrial_value: ["Diagnóstico por fronteras.", "Menos sustituciones injustificadas.", "Recuperación funcional verificable."]
    media_ids: ["ART-007"]

private:
  fault_model:
    root_cause: "Línea neumática desconectada del racor local del cilindro."
    recovery_conditions: ["Conexión local restaurada conforme al procedimiento autorizado.", "Cilindro completa la extensión.", "ExtendedLS cambia a TRUE de forma coherente."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-CONTROL"
        statement: "La orden o la lógica de extensión no son correctas."
        initial_status: "possible"
      - id: "HYP-VALVE"
        statement: "La salida o la actuación de control de la válvula no siguen la orden."
        initial_status: "possible"
      - id: "HYP-SUPPLY"
        statement: "No hay suministro neumático general disponible."
        initial_status: "possible"
      - id: "HYP-LOCAL-CONNECTION"
        statement: "La conexión neumática local del cilindro está interrumpida."
        initial_status: "possible"
    confirmed_root_cause: "HYP-LOCAL-CONNECTION"
    critical_path: ["DEC-01-INSPECT-PLC", "DEC-02-INSPECT-ACTUATION", "DEC-03-CHECK-SUPPLY", "DEC-04-INSPECT-CONNECTION", "DEC-05-RECONNECT", "DEC-06-VERIFY"]
  decision_logic:
    - decision_id: "DEC-01-INSPECT-PLC"
      is_correct: true
      rationale: "Confirma si la orden y la lógica alcanzan la salida antes de intervenir físicamente."
      classification: "strong"
      consequence: "Se adquiere la observación PLC."
      evidence_revealed: ["EVID-02-PLC"]
      next_stage: "STAGE-02-OUTPUT"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-01-REPLACE-CYLINDER"
      is_correct: false
      retry_feedback: "La ausencia de movimiento no identifica todavía el elemento que rompe la cadena."
      rationale: "Sustitución sin localizar la frontera."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-OUTPUT"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-01-FORCE-FEEDBACK"
      is_correct: false
      retry_feedback: "Forzar el feedback oculta la discrepancia y elimina una protección de secuencia."
      rationale: "No demuestra posición física."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-02-OUTPUT"
      score_effect: 0
      safety_effect: -1
    - decision_id: "DEC-02-INSPECT-ACTUATION"
      is_correct: true
      rationale: "Distingue lógica correcta de actuación de control antes de seguir hacia la energía neumática."
      classification: "strong"
      consequence: "Se confirma la frontera de actuación."
      evidence_revealed: ["EVID-03-ACTUATION"]
      next_stage: "STAGE-03-SUPPLY"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-02-ASSUME-MOTION"
      is_correct: false
      retry_feedback: "ExtendCmd TRUE demuestra una orden, no aire en el cilindro ni movimiento."
      rationale: "Confunde mando con resultado físico."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-SUPPLY"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-02-CHANGE-LOGIC"
      is_correct: false
      retry_feedback: "La lógica observada ya es coherente. Sigue la orden hacia la actuación y la energía."
      rationale: "Cambiar lógica destruye evidencia válida."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-03-SUPPLY"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-03-CHECK-SUPPLY"
      is_correct: true
      rationale: "Determina si la energía neumática general está disponible sin inferir la condición local."
      classification: "strong"
      consequence: "Se adquiere la lectura de suministro."
      evidence_revealed: ["EVID-04-SUPPLY"]
      next_stage: "STAGE-04-LOCAL-CONNECTION"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-03-REPLACE-VALVE"
      is_correct: false
      retry_feedback: "La actuación de control es coherente; comprueba primero la energía disponible y la continuidad local."
      rationale: "Sustitución prematura."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-04-LOCAL-CONNECTION"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-03-INCREASE-PRESSURE"
      is_correct: false
      retry_feedback: "Aumentar presión sin localizar la interrupción no es una prueba diagnóstica justificada."
      rationale: "Intervención sin evidencia."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-04-LOCAL-CONNECTION"
      score_effect: 0
      safety_effect: -1
    - decision_id: "DEC-04-INSPECT-CONNECTION"
      is_correct: true
      rationale: "Con suministro disponible, la inspección segura de la conexión local localiza la primera discontinuidad física."
      classification: "strong"
      consequence: "Se observa la línea desconectada."
      evidence_revealed: ["EVID-05-DISCONNECTION"]
      next_stage: "STAGE-05-RESTORE"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-04-REPLACE-CYLINDER"
      is_correct: false
      retry_feedback: "La presión general no demuestra que el cilindro reciba aire. Inspecciona antes la conexión local."
      rationale: "Sustitución sin confirmar continuidad."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-05-RESTORE"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-04-BYPASS-SAFETY"
      is_correct: false
      retry_feedback: "No manipules conexiones presurizadas. Controla las energías antes de la inspección física."
      rationale: "Intervención insegura."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-05-RESTORE"
      score_effect: 0
      safety_effect: -1
    - decision_id: "DEC-05-RECONNECT"
      is_correct: true
      rationale: "Restaura la continuidad física observada sin atribuir todavía recuperación funcional."
      classification: "strong"
      consequence: "La conexión queda restaurada y la verificación pendiente."
      evidence_revealed: ["EVID-06-INTERVENTION"]
      next_stage: "STAGE-06-VERIFY"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-05-HOLD-TUBE"
      is_correct: false
      retry_feedback: "Una conexión improvisada no restablece una condición industrial segura ni verificable."
      rationale: "No restaura la conexión prevista."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-06-VERIFY"
      score_effect: 0
      safety_effect: -1
    - decision_id: "DEC-05-REPLACE-PLC"
      is_correct: false
      retry_feedback: "La causa física ya está observada en la conexión local; sustituir el PLC no la corrige."
      rationale: "Contradice la evidencia adquirida."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "STAGE-06-VERIFY"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-06-VERIFY"
      is_correct: true
      rationale: "La prueba funcional independiente establece movimiento, posición y feedback después de la intervención."
      classification: "strong"
      consequence: "Se establece la recuperación."
      evidence_revealed: ["EVID-07-RECOVERY"]
      next_stage: "COMPLETE"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-06-CLOSE-CONNECTION"
      is_correct: false
      retry_feedback: "Una conexión visible no demuestra extensión ni feedback correcto."
      rationale: "Confunde intervención con verificación."
      classification: "weak"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "COMPLETE"
      score_effect: 0
      safety_effect: 0
    - decision_id: "DEC-06-FORCE-FEEDBACK"
      is_correct: false
      retry_feedback: "El feedback debe resultar de la posición física, no de un forzado."
      rationale: "Elimina la prueba funcional."
      classification: "unsafe"
      consequence: "Reintenta sin avanzar."
      evidence_revealed: []
      next_stage: "COMPLETE"
      score_effect: 0
      safety_effect: -1
