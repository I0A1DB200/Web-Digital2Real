public:
  slug: "pneumatic-cylinder-does-not-extend"
  title: "El cilindro neumático no extiende"
  summary: "Localiza por qué un cilindro permanece retraído aunque exista una orden de extensión, siguiendo la cadena desde PLC hasta la conexión neumática local."
  estimated_duration: 14
  scenario:
    initial_context: "La estación ordena extender el cilindro, pero el vástago permanece completamente retraído y el ciclo no continúa."
    operational_state: "ExtendCmd está activo y ExtendedLS permanece en FALSE. La primera frontera que no cumple todavía no está localizada."
    initiating_event: "Producción informa de que el cilindro no inicia la extensión."
    learner_role: "Técnico de automatización responsable de localizar la pérdida de continuidad entre mando, actuación, energía neumática y movimiento físico."
    safety_context:
      safe_state: "Realiza observaciones desde una posición segura y aplica el procedimiento autorizado de aislamiento de energías y control de movimiento antes de tocar conexiones neumáticas."
      intervention_constraints: ["No forzar salidas ni feedback.", "No desconectar ni reconectar líneas presurizadas.", "No sustituir PLC, válvula o cilindro sin evidencia.", "Verificar la recuperación con movimiento controlado desde una posición segura."]
  learning_objectives:
    - id: "OBJ-TRACE-ENERGY"
      description: "Seguir la cadena desde ExtendCmd y la salida hasta válvula, suministro, conexión local y cilindro."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-COMMAND-VS-ENERGY"
      description: "Distinguir una orden PLC correcta de la presencia real de energía en el actuador."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-VERIFY-MOTION"
      description: "Restaurar la conexión conforme al procedimiento autorizado y verificar movimiento y feedback."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-INCIDENT"
      phase: "incident"
      title: "El movimiento no comienza"
      situation: "La estación solicita extensión, pero el cilindro permanece retraído. ¿Qué comprobación localiza primero la frontera de control?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-REPLACE-CYLINDER", "DEC-01-INSPECT-PLC", "DEC-01-FORCE-FEEDBACK"]
      media_ids: ["ART-002"]
    - id: "STAGE-02-OUTPUT"
      phase: "investigation"
      title: "Seguir la orden hasta la válvula"
      situation: "La observación online muestra ExtendCmd TRUE, la lógica de extensión activa y ExtendedLS FALSE. ¿Qué frontera debe comprobarse ahora?"
      evidence_ids: ["EVID-02-PLC"]
      decision_ids: ["DEC-02-ASSUME-MOTION", "DEC-02-CHANGE-LOGIC", "DEC-02-INSPECT-ACTUATION"]
      media_ids: ["ART-003"]
    - id: "STAGE-03-SUPPLY"
      phase: "investigation"
      title: "Comprobar energía neumática disponible"
      situation: "La salida y la actuación de control de la válvula son coherentes con la orden. Esto todavía no demuestra energía en el cilindro. ¿Qué compruebas?"
      evidence_ids: ["EVID-03-ACTUATION"]
      decision_ids: ["DEC-03-CHECK-SUPPLY", "DEC-03-REPLACE-VALVE", "DEC-03-INCREASE-PRESSURE"]
      media_ids: []
    - id: "STAGE-04-LOCAL-CONNECTION"
      phase: "investigation"
      title: "Inspeccionar la conexión local"
      situation: "La comprobación confirma suministro de aire comprimido disponible. Con el cilindro aún retraído, ¿cuál es el siguiente paso?"
      evidence_ids: ["EVID-04-SUPPLY"]
      decision_ids: ["DEC-04-REPLACE-CYLINDER", "DEC-04-BYPASS-SAFETY", "DEC-04-INSPECT-CONNECTION"]
      media_ids: ["ART-004"]
    - id: "STAGE-05-RESTORE"
      phase: "solution"
      title: "Restaurar la conexión"
      situation: "La inspección segura muestra una línea neumática desconectada del racor local del cilindro. ¿Qué intervención está justificada?"
      evidence_ids: ["EVID-05-DISCONNECTION"]
      decision_ids: ["DEC-05-HOLD-TUBE", "DEC-05-RECONNECT", "DEC-05-REPLACE-PLC"]
      media_ids: ["ART-005"]
    - id: "STAGE-06-VERIFY"
      phase: "solution"
      title: "Verificar la recuperación"
      situation: "La conexión local ha sido restaurada conforme al procedimiento autorizado. La recuperación todavía no está verificada. ¿Qué prueba permite cerrar?"
      evidence_ids: ["EVID-06-INTERVENTION"]
      decision_ids: ["DEC-06-VERIFY", "DEC-06-CLOSE-CONNECTION", "DEC-06-FORCE-FEEDBACK"]
      media_ids: ["ART-006"]
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Estación de transporte"
      content: "Con la petición de extensión presente, el cilindro permanece completamente retraído y la secuencia queda detenida."
      reliability: "high"
      revealed_by: []
    - id: "EVID-02-PLC"
      type: "diagnostic"
      source: "TIA Portal / observación online"
      content: "ExtendCmd y la salida ordenada ExtendOutput están TRUE; ExtendedLS permanece FALSE. La comprobación de la lógica confirma que la orden de extensión es correcta."
      reliability: "confirmed"
      revealed_by: ["DEC-01-INSPECT-PLC"]
      media_ids: ["ART-003"]
    - id: "EVID-03-ACTUATION"
      type: "inspection"
      source: "Salida PLC y actuación de válvula"
      content: "La salida ordenada y la actuación de control de la válvula son coherentes con ExtendCmd. Esto no demuestra que el cilindro reciba aire."
      reliability: "confirmed"
      revealed_by: ["DEC-02-INSPECT-ACTUATION"]
    - id: "EVID-04-SUPPLY"
      type: "measurement"
      source: "Preparación de aire"
      content: "La comprobación del suministro confirma que hay aire comprimido disponible antes de la conexión local. Esto no demuestra continuidad hasta el cilindro."
      reliability: "confirmed"
      revealed_by: ["DEC-03-CHECK-SUPPLY"]
      media_ids: ["ART-004"]
    - id: "EVID-05-DISCONNECTION"
      type: "inspection"
      source: "Conexión local del cilindro"
      content: "Con las energías controladas según el procedimiento autorizado, se observa la línea neumática fuera del racor local del cilindro."
      reliability: "confirmed"
      revealed_by: ["DEC-04-INSPECT-CONNECTION"]
      media_ids: ["ART-005"]
    - id: "EVID-06-INTERVENTION"
      type: "inspection"
      source: "Conexión local del cilindro"
      content: "La línea se ha asentado de nuevo en el racor local conforme al procedimiento autorizado. El movimiento y el feedback todavía no están verificados."
      reliability: "confirmed"
      revealed_by: ["DEC-05-RECONNECT"]
      media_ids: ["ART-006"]
    - id: "EVID-07-RECOVERY"
      type: "functional_test"
      source: "Prueba funcional controlada"
      content: "La prueba funcional controlada confirma que el cilindro extiende y ExtendedLS cambia a TRUE de forma coherente con la posición alcanzada."
      reliability: "confirmed"
      revealed_by: ["DEC-06-VERIFY"]
      media_ids: ["ART-007"]
  decisions:
    - id: "DEC-01-INSPECT-PLC"
      stage_id: "STAGE-01-INCIDENT"
      action: "Observar online ExtendCmd, la lógica de extensión, la salida asociada y ExtendedLS sin forzar variables."
    - id: "DEC-01-REPLACE-CYLINDER"
      stage_id: "STAGE-01-INCIDENT"
      action: "Sustituir el cilindro porque no se mueve; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-01-FORCE-FEEDBACK"
      stage_id: "STAGE-01-INCIDENT"
      action: "Forzar ExtendedLS para que la secuencia continúe sin aplicar el procedimiento de energías ni una verificación independiente."
    - id: "DEC-02-INSPECT-ACTUATION"
      stage_id: "STAGE-02-OUTPUT"
      action: "Comprobar la salida y la actuación de control de la válvula, sin asumir movimiento físico."
    - id: "DEC-02-ASSUME-MOTION"
      stage_id: "STAGE-02-OUTPUT"
      action: "Concluir que el cilindro recibe aire porque ExtendCmd está TRUE; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-02-CHANGE-LOGIC"
      stage_id: "STAGE-02-OUTPUT"
      action: "Modificar la lógica para mantener la orden permanentemente; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-03-CHECK-SUPPLY"
      stage_id: "STAGE-03-SUPPLY"
      action: "Desde una posición segura, comprobar la disponibilidad del suministro de aire conforme al procedimiento de la instalación."
    - id: "DEC-03-REPLACE-VALVE"
      stage_id: "STAGE-03-SUPPLY"
      action: "Sustituir la válvula sin comprobar el suministro neumático; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-03-INCREASE-PRESSURE"
      stage_id: "STAGE-03-SUPPLY"
      action: "Aumentar la presión para intentar iniciar el movimiento sin aplicar el procedimiento de energías ni una verificación independiente."
    - id: "DEC-04-INSPECT-CONNECTION"
      stage_id: "STAGE-04-LOCAL-CONNECTION"
      action: "Aplicar el procedimiento autorizado de aislamiento de energías y control de movimiento antes de inspeccionar tubo, racor y puerto local del cilindro."
    - id: "DEC-04-REPLACE-CYLINDER"
      stage_id: "STAGE-04-LOCAL-CONNECTION"
      action: "Sustituir el cilindro porque la presión general está disponible; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-04-BYPASS-SAFETY"
      stage_id: "STAGE-04-LOCAL-CONNECTION"
      action: "Manipular el tubo con la instalación presurizada para buscar una fuga sin aplicar el procedimiento de energías ni una verificación independiente."
    - id: "DEC-05-RECONNECT"
      stage_id: "STAGE-05-RESTORE"
      action: "Mantener el aislamiento autorizado, comprobar el estado compatible de tubo y racor, y restaurar la conexión local prevista."
    - id: "DEC-05-HOLD-TUBE"
      stage_id: "STAGE-05-RESTORE"
      action: "Sujetar el tubo junto al racor y probar la máquina sin conectarlo sin aplicar el procedimiento de energías ni una verificación independiente."
    - id: "DEC-05-REPLACE-PLC"
      stage_id: "STAGE-05-RESTORE"
      action: "Sustituir el PLC aunque la desconexión física ya está observada; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-06-VERIFY"
      stage_id: "STAGE-06-VERIFY"
      action: "Desde una posición segura, verificar con movimiento controlado que el cilindro extiende y ExtendedLS cambia a TRUE."
    - id: "DEC-06-CLOSE-CONNECTION"
      stage_id: "STAGE-06-VERIFY"
      action: "Cerrar la incidencia porque el tubo está conectado visualmente; la evidencia disponible aún no justifica esa intervención."
    - id: "DEC-06-FORCE-FEEDBACK"
      stage_id: "STAGE-06-VERIFY"
      action: "Forzar ExtendedLS para confirmar el resto de la secuencia sin aplicar el procedimiento de energías ni una verificación independiente."
