public:
  catalog_card:
    image: assets/images/d2r-cobot-palletizing-card.webp
    width: 1672
    height: 941
    alt:
      es: "Célula de paletizado industrial con robot colaborativo, cinta transportadora y palé"
      en: "Industrial palletizing cell with collaborative robot, conveyor and pallet"
  slug: cobot-palletizing
  title: Cobot Programming / Palletizing
  summary: 'Learning case under technical review: interpret the supplied palletizing prototype and distinguish an unavailable input value from a confirmed OFF state. No physical robot or compiled TIA project is represented.'
  estimated_duration: 20
  scenario:
    initial_context: The supplied V3.6 prototype visualizes a nominal palletizing cycle. A learner questions the neutral DI_BoxSensor representation.
    operational_state: Document review only; no physical installation or live input measurement is available.
    initiating_event: DI_BoxSensor has no confirmed value in the supplied V1.9 trace.
    learner_role: Automation engineer reviewing the evidence boundary of a simulated cell.
    safety_context:
      safe_state: Offline educational review of supplied documentation; no real machine intervention.
      intervention_constraints:
        - Do not infer a safe machine state or authorize physical motion from the prototype.
        - Do not modify the frozen nominal V1.9 cycle or interpret a drawn LED as an electrical measurement.
  learning_objectives:
    - id: OBJ-EVIDENCE
      description: Distinguish unavailable signal data from a confirmed OFF state before drawing a diagnostic conclusion.
      capability_id: ICF-01
      competency_id: DIAG-EVIDENCE-01
  stages:
    - id: STAGE-CONTEXT
      phase: incident
      title: Scope the observation
      situation: The sensor is drawn neutral. What can be concluded before reviewing its data provenance?
      evidence_ids:
        - EVID-0
      decision_ids:
        - DEC-0-REVIEW
        - DEC-0-RETRY
      media_ids: []
    - id: STAGE-REVIEW
      phase: investigation
      title: Review the source
      situation: The supplied README states that DI_BoxSensor has no confirmed value in the V1.9 trace. What does that establish?
      evidence_ids:
        - EVID-0
        - EVID-1
      decision_ids:
        - DEC-1-REVIEW
        - DEC-1-RETRY
      media_ids: []
    - id: STAGE-VERIFY
      phase: solution
      title: Verify the conclusion
      situation: The README also says the green LED represents power visually and is not an electrical measurement. Which conclusion is defensible?
      evidence_ids:
        - EVID-0
        - EVID-1
        - EVID-2
      decision_ids:
        - DEC-2-REVIEW
        - DEC-2-RETRY
      media_ids: []
  evidence:
    - id: EVID-0
      type: initial_observation
      source: Supplied V3.6 prototype README
      content: Only the neutral representation is known; no physical signal value has been measured.
      reliability: high
      revealed_by: []
    - id: EVID-1
      type: diagnostic
      source: Supplied V3.6 prototype README
      content: The supplied V3.6 README explicitly states that DI_BoxSensor has no confirmed value in the V1.9 trace.
      reliability: high
      revealed_by:
        - DEC-0-REVIEW
    - id: EVID-2
      type: diagnostic
      source: Supplied V3.6 prototype README
      content: The supplied README describes the green LED as a visual representation of power, not an electrical measurement.
      reliability: high
      revealed_by:
        - DEC-1-REVIEW
  decisions:
    - id: DEC-0-REVIEW
      stage_id: STAGE-CONTEXT
      action: Review the documented data provenance before diagnosing the sensor.
    - id: DEC-0-RETRY
      stage_id: STAGE-CONTEXT
      action: Declare a physical sensor failure from the neutral drawing.
    - id: DEC-1-REVIEW
      stage_id: STAGE-REVIEW
      action: Treat the input value as unavailable, rather than confirmed OFF.
    - id: DEC-1-RETRY
      stage_id: STAGE-REVIEW
      action: Treat the unavailable input as confirmed OFF.
    - id: DEC-2-REVIEW
      stage_id: STAGE-VERIFY
      action: Record the observation as inconclusive for the physical sensor; require validated data before a physical diagnosis.
    - id: DEC-2-RETRY
      stage_id: STAGE-VERIFY
      action: Declare the physical installation healthy because the LED is green.
  visual:
    educational_purpose: Marketing illustration of the learning context only; it proves no physical installation, sensor state or robot kinematics.
    representation: planned
