    fault_summary: No physical sensor fault has been established. The limitation is unavailable prototype data.
    correct_reasoning:
      - N/D is not OFF. A rendered LED is not an electrical measurement.
    recovery:
      - Obtain validated observations before drawing a physical diagnosis; no equipment recovery is claimed.
