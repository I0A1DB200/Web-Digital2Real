  platform: "Turck BI6U-MT12-IOL6X2-H1141 / IO-Link"
  domain: "Inductive proximity sensing"
  industry: "Manufacturing"
  machine_type: "Workpiece positioning station"
  difficulty: "foundation"
capability_references:
  - capability_id: "ICF-02"
    competency_ids: ["COMP-IIO-SIGNAL-TRACEABILITY","COMP-IIO-STATE-INTERPRETATION","COMP-IIO-CONTROLLED-RECOVERY"]
public:
  slug: "inductive-sensor-not-detecting"
  title: "Sensor inductivo sin detección"
  summary: "Investiga una pieza presente sin confirmación de posición siguiendo proceso físico, sensor, IO-Link, PLC y HMI."
  estimated_duration: 18
  scenario:
    initial_context: "Una pieza metálica parece presente en Station 1, pero la HMI indica PartInPosition = 0."
    operational_state: "El sensor dispone de alimentación. La causa de la discrepancia todavía no está identificada."
    initiating_event: "La estación no confirma la posición de una pieza aparentemente presente."
    learner_role: "Técnico de automatización que debe localizar la discrepancia entre proceso físico, sensor, IO-Link, PLC y HMI."
    safety_context:
      safe_state: "Inspecciona y ajusta únicamente conforme al procedimiento seguro de la instalación, con movimientos peligrosos controlados."
      intervention_constraints: ["No forzar señales ni puentear protecciones.","No sustituir ni reconfigurar el sensor sin verificar la aplicación física.","No alterar PLC, HMI ni comunicación para ocultar el síntoma."]
  learning_objectives:
    - id: "OBJ-TRACE-SIGNAL"
      description: "Distinguir alimentación, conmutación, comunicación y representación PLC/HMI."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-SENSING-CONDITIONS"
      description: "Comparar la aplicación física con Sn y la distancia de funcionamiento asegurada sin asumir un umbral exacto."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-VERIFY-RECOVERY"
      description: "Aplicar una corrección sustentada por evidencias y verificar la cadena completa sin sustituciones ni reconfiguraciones injustificadas."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-INCIDENT"
      phase: "incident"
      title: "Incidente en Station 1"
      situation: "La pieza parece presente, pero PartInPosition = 0. ¿Qué comprobación delimita primero el problema?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-REPLACE-SENSOR","DEC-01-CHECK-HEALTH","DEC-01-EDIT-HMI"]
      media_ids: ["ART-002"]
    - id: "STAGE-02-SYSTEM-HEALTH"
      phase: "investigation"
      title: "Salud del sistema"
      situation: "PLC, red e IO-Link están operativos. Antes de inspeccionar, aplica el procedimiento seguro de la instalación con movimientos peligrosos controlados. ¿Dónde buscar ahora la primera discrepancia?"
      evidence_ids: ["EVID-02-SYSTEM-HEALTH"]
      decision_ids: ["DEC-02-RESTART-NETWORK","DEC-02-REMAP-PLC","DEC-02-INSPECT-SENSOR"]
      media_ids: []
    - id: "STAGE-03-PHYSICAL-INSPECTION"
      phase: "investigation"
      title: "Inspección física"
      situation: "El objetivo está presente y el sensor alimentado, pero no conmuta. Mantén el procedimiento seguro y los movimientos peligrosos controlados antes de medir físicamente. ¿Qué investigas antes de ajustar o sustituir?"
      evidence_ids: ["EVID-03-PHYSICAL-INSPECTION"]
      decision_ids: ["DEC-03-MEASURE-GEOMETRY","DEC-03-REPLACE-POWERED","DEC-03-CHANGE-PARAMETERS"]
      media_ids: ["ART-004"]
    - id: "STAGE-04-MEASUREMENT"
      phase: "investigation"
      title: "Medición y referencia"
      situation: "La separación medida es 7.8 mm. ¿Qué conclusión permite la documentación antes de contrastar el estado por IO-Link?"
      evidence_ids: ["EVID-04-MEASUREMENT"]
      decision_ids: ["DEC-04-EXACT-THRESHOLD","DEC-04-COMPARE-SECURED","DEC-04-TUNE-RANGE"]
      media_ids: ["ART-005"]
    - id: "STAGE-05-IO-LINK-EVIDENCE"
      phase: "investigation"
      title: "Evidencia IO-Link"
      situation: "Con comunicación saludable, Active switchpoint = 0. ¿Cómo interpretas este dato?"
      evidence_ids: ["EVID-05-IO-LINK-EVIDENCE"]
      decision_ids: ["DEC-05-CORRELATE-STATE","DEC-05-BLAME-IO-LINK","DEC-05-BLAME-HMI"]
      media_ids: ["ART-006"]
    - id: "STAGE-06-DIAGNOSIS"
      phase: "investigation"
      title: "Diagnóstico antes de corregir"
      situation: "Reúne la evidencia física y digital. ¿Cuál es el diagnóstico mejor sustentado?"
      evidence_ids: ["EVID-06-DIAGNOSIS"]
      decision_ids: ["DEC-06-DEFECTIVE-SENSOR","DEC-06-PLC-FAILURE","DEC-06-INSTALLATION-DISTANCE"]
      media_ids: ["ART-005", "ART-006"]
    - id: "STAGE-07-SAFE-CORRECTION"
      phase: "solution"
      title: "Corrección física segura"
      situation: "El diagnóstico localiza la instalación. Aplica el procedimiento seguro con movimientos peligrosos controlados antes de ajustar; no fuerces señales ni puentes protecciones. ¿Qué intervención prepara la instalación para una verificación independiente?"
      evidence_ids: ["EVID-07-SAFE-CORRECTION"]
      decision_ids: ["DEC-07-FORCE-INPUT","DEC-07-CHANGE-LOGIC","DEC-07-CORRECT-GEOMETRY"]
      media_ids: []
    - id: "STAGE-08-VERIFY-CHAIN"
      phase: "solution"
      title: "Verificación extremo a extremo"
      situation: "Se ha corregido y asegurado el montaje, pero la recuperación aún no está verificada. Bajo el procedimiento seguro de la instalación, comprueba la condición asegurada documentada y la propagación completa sin forzados. ¿Qué permite cerrar la intervención?"
      evidence_ids: ["EVID-08-VERIFY-CHAIN"]
      decision_ids: ["DEC-08-POWER-ONLY","DEC-08-VERIFY-FULL-CHAIN","DEC-08-HMI-ONLY"]
      media_ids: []
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Observación / HMI"
      content: "Pieza metálica presente visualmente en Station 1; HMI PartInPosition = 0. Hay alimentación disponible en el sensor. No se conoce todavía la causa."
      reliability: "high"
      revealed_by: []
      media_ids: []
    - id: "EVID-02-SYSTEM-HEALTH"
      type: "diagnostic"
      source: "Diagnóstico del sistema"
      content: "PLC operativo, red operativa y comunicación IO-Link operativa. La salud de comunicación no demuestra detección del objetivo."
      reliability: "confirmed"
      revealed_by: ["DEC-01-CHECK-HEALTH"]
      media_ids: []
    - id: "EVID-03-PHYSICAL-INSPECTION"
      type: "diagnostic"
      source: "Inspección física"
      content: "Objetivo presente; LED verde Power = ON; LED amarillo Switching/Output = OFF. La presencia visual no garantiza que se cumplan las condiciones de detección."
      reliability: "confirmed"
      revealed_by: ["DEC-02-INSPECT-SENSOR"]
      media_ids: ["ART-004"]
    - id: "EVID-04-MEASUREMENT"
      type: "measurement"
      source: "Medición / documentación Turck"
      content: "Turck BI6U-MT12-IOL6X2-H1141: separación medida 7.8 mm; Sn = 6 mm; distancia de funcionamiento asegurada ≤ 4.86 mm (0.81 × Sn). Sn es una distancia nominal, no un umbral digital exacto."
      reliability: "confirmed"
      revealed_by: ["DEC-03-MEASURE-GEOMETRY"]
      media_ids: ["ART-005"]
    - id: "EVID-05-IO-LINK-EVIDENCE"
      type: "diagnostic"
      source: "Datos de proceso IO-Link"
      content: "Active switchpoint = 0 significa objetivo no detectado. IO-Link comunica el estado actual del sensor; no se ha identificado un fallo de comunicación."
      reliability: "confirmed"
      revealed_by: ["DEC-04-COMPARE-SECURED"]
      media_ids: ["ART-006"]
    - id: "EVID-06-DIAGNOSIS"
      type: "diagnostic"
      source: "Síntesis diagnóstica"
      content: "La comunicación funciona; el sensor está alimentado pero no conmuta; la separación es 7.8 mm frente a ≤ 4.86 mm de funcionamiento asegurado; Active switchpoint = 0 y PartInPosition = 0."
      reliability: "confirmed"
      revealed_by: ["DEC-05-CORRELATE-STATE"]
      media_ids: []
    - id: "EVID-07-SAFE-CORRECTION"
      type: "diagnostic"
      source: "Plan de intervención"
      content: "Diagnóstico confirmado: la geometría sensor-objetivo está fuera de la condición asegurada. Todavía no se ha realizado ni verificado la corrección."
      reliability: "confirmed"
      revealed_by: ["DEC-06-INSTALLATION-DISTANCE"]
      media_ids: []
    - id: "EVID-08-VERIFY-CHAIN"
      type: "inspection"
      source: "Registro de intervención"
      content: "Se ha corregido y asegurado la geometría siguiendo el procedimiento seguro, sin forzar señales ni cambiar PLC, HMI o parámetros IO-Link. Quedan pendientes la aceptación de la condición asegurada y la verificación funcional de objetivo → sensor → IO-Link → PLC → HMI. Todavía no se acredita recuperación."
      reliability: "confirmed"
      revealed_by: ["DEC-07-CORRECT-GEOMETRY"]
      media_ids: []
    - id: "EVID-09-RECOVERY"
      type: "functional_test"
      source: "Aceptación de instalación / prueba funcional de la cadena"
      content: "La comprobación final confirma montaje asegurado y cumplimiento de la condición documentada ≤ 4.86 mm, sin asignar una separación corregida exacta no documentada. Se verifican LED verde Power = ON, LED amarillo Switching/Output = ON, Active switchpoint = 1 y propagación a través del PLC hasta HMI PartInPosition = 1, sin forzados. El rótulo ≤ 6 mm de la imagen no acredita por sí solo ≤ 4.86 mm; la aceptación de la instalación procede de la comprobación descrita, no de asumir un umbral exacto en Sn."
      reliability: "confirmed"
      revealed_by: ["DEC-08-VERIFY-FULL-CHAIN"]
      media_ids: ["ART-007"]
  decisions:
    - id: "DEC-01-REPLACE-SENSOR"
      stage_id: "STAGE-01-INCIDENT"
      action: "Sustituir el sensor porque la pieza está presente."
    - id: "DEC-01-CHECK-HEALTH"
      stage_id: "STAGE-01-INCIDENT"
      action: "Comprobar el estado del PLC, la red y la comunicación IO-Link."
    - id: "DEC-01-EDIT-HMI"
      stage_id: "STAGE-01-INCIDENT"
      action: "Cambiar la representación HMI de PartInPosition."
    - id: "DEC-02-RESTART-NETWORK"
      stage_id: "STAGE-02-SYSTEM-HEALTH"
      action: "Reiniciar la red para recuperar PartInPosition."
    - id: "DEC-02-REMAP-PLC"
      stage_id: "STAGE-02-SYSTEM-HEALTH"
      action: "Reasignar la señal en el PLC."
    - id: "DEC-02-INSPECT-SENSOR"
      stage_id: "STAGE-02-SYSTEM-HEALTH"
      action: "Inspeccionar de forma segura objetivo, alimentación y LED de conmutación del sensor."
    - id: "DEC-03-MEASURE-GEOMETRY"
      stage_id: "STAGE-03-PHYSICAL-INSPECTION"
      action: "Medir la separación sensor-objetivo y compararla con la documentación del dispositivo."
    - id: "DEC-03-REPLACE-POWERED"
      stage_id: "STAGE-03-PHYSICAL-INSPECTION"
      action: "Sustituir el sensor porque tiene alimentación pero no conmuta."
    - id: "DEC-03-CHANGE-PARAMETERS"
      stage_id: "STAGE-03-PHYSICAL-INSPECTION"
      action: "Cambiar los parámetros IO-Link para activar la salida."
    - id: "DEC-04-EXACT-THRESHOLD"
      stage_id: "STAGE-04-MEASUREMENT"
      action: "Considerar 6 mm el punto exacto de conmutación para cualquier condición."
    - id: "DEC-04-COMPARE-SECURED"
      stage_id: "STAGE-04-MEASUREMENT"
      action: "Identificar una instalación fuera de la condición asegurada y contrastar el estado de detección por IO-Link."
    - id: "DEC-04-TUNE-RANGE"
      stage_id: "STAGE-04-MEASUREMENT"
      action: "Aumentar un parámetro de alcance para compensar la separación."
    - id: "DEC-05-CORRELATE-STATE"
      stage_id: "STAGE-05-IO-LINK-EVIDENCE"
      action: "Correlacionar el cero con el LED apagado y la separación medida para formular el diagnóstico."
    - id: "DEC-05-BLAME-IO-LINK"
      stage_id: "STAGE-05-IO-LINK-EVIDENCE"
      action: "Diagnosticar fallo IO-Link porque el dato vale cero."
    - id: "DEC-05-BLAME-HMI"
      stage_id: "STAGE-05-IO-LINK-EVIDENCE"
      action: "Atribuir la ausencia de detección a la HMI."
    - id: "DEC-06-DEFECTIVE-SENSOR"
      stage_id: "STAGE-06-DIAGNOSIS"
      action: "Sensor averiado: la alimentación debería garantizar la detección."
    - id: "DEC-06-PLC-FAILURE"
      stage_id: "STAGE-06-DIAGNOSIS"
      action: "Fallo del PLC al interpretar un sensor que sí detecta."
    - id: "DEC-06-INSTALLATION-DISTANCE"
      stage_id: "STAGE-06-DIAGNOSIS"
      action: "Distancia de instalación sensor-objetivo incorrecta; problema de aplicación física, sin evidencia de sensor defectuoso."
    - id: "DEC-07-FORCE-INPUT"
      stage_id: "STAGE-07-SAFE-CORRECTION"
      action: "Forzar PartInPosition para liberar la estación."
    - id: "DEC-07-CHANGE-LOGIC"
      stage_id: "STAGE-07-SAFE-CORRECTION"
      action: "Modificar PLC o HMI para aceptar el estado actual."
    - id: "DEC-07-CORRECT-GEOMETRY"
      stage_id: "STAGE-07-SAFE-CORRECTION"
      action: "Con movimientos peligrosos controlados y conforme al procedimiento seguro, corregir y asegurar la geometría para cumplir la condición documentada; dejar pendiente la verificación funcional."
    - id: "DEC-08-POWER-ONLY"
      stage_id: "STAGE-08-VERIFY-CHAIN"
      action: "Cerrar al comprobar únicamente el LED verde."
    - id: "DEC-08-VERIFY-FULL-CHAIN"
      stage_id: "STAGE-08-VERIFY-CHAIN"
      action: "Verificar montaje asegurado y separación dentro de la condición documentada ≤ 4.86 mm, ambos LED encendidos y propagación de Active switchpoint = 1 a PLC y HMI PartInPosition = 1, sin forzados."
    - id: "DEC-08-HMI-ONLY"
      stage_id: "STAGE-08-VERIFY-CHAIN"
      action: "Cerrar por PartInPosition = 1 sin contrastar sensor e IO-Link."
