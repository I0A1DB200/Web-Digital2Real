contract_version: "2.0.0"

metadata:
  id: "EXP-GRAPH-SEQUENCE-007"
  editorial_id: "EE-0007"
  content_version: "1.0"
  class: "practice"
  access: "free"
  status: "technical_review"
  language: "es"

localization:
  default_locale: "es"
  supported_locales: ["es", "en"]
  locale_files:
    es: "locales/es.yaml"
    en: "locales/en.yaml"

classification:
  platform: "Siemens S7-1500 / GRAPH"
  domain: "PLC sequence diagnostics"
  industry: "Manufacturing"
  machine_type: "Automated conveyor line"
  difficulty: "foundation"

capability_references:
  - capability_id: "ICF-02"
    competency_ids: ["COMP-IIO-SIGNAL-TRACEABILITY", "COMP-IIO-STATE-INTERPRETATION", "COMP-IIO-CONTROLLED-RECOVERY"]

public:
  slug: "sequence-stuck-waiting-for-condition"
  title: "Secuencia bloqueada esperando una condición"
  summary: "Traza una condición desde el proceso físico hasta la transición GRAPH y detecta una referencia lógica incorrecta aunque la entrada PLC sea válida."
  estimated_duration: 17
  scenario:
    initial_context: "Una caja alcanza correctamente la posición de parada del transportador, pero la secuencia Siemens GRAPH permanece esperando."
    operational_state: "El paso S40 está activo y la transición T40 no se satisface, aunque el sensor y la entrada física parecen indicar presencia."
    initiating_event: "Producción informa de que el transportador queda detenido con la caja en la posición esperada."
    learner_role: "Técnico de automatización responsable de comparar proceso físico, señal PLC y condición lógica realmente evaluada por la secuencia."
    safety_context:
      safe_state: "Observar y monitorizar según el procedimiento autorizado, manteniendo controlados los movimientos del transportador antes de inspeccionar el proceso o modificar lógica."
      intervention_constraints: ["No forzar T40 ni pasos GRAPH.", "No sustituir sensores o módulos sin evidencia.", "No escribir constantes TRUE ni manipular PartAtStop_2 para eludir la condición.", "Verificar la modificación en ciclos representativos antes de cerrar."]
  learning_objectives:
    - id: "OBJ-SEQUENCE-STATE"
      description: "Identificar el paso activo y la transición que bloquea una secuencia GRAPH."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-LOGICAL-SIGNAL-TRACE"
      description: "Trazar condición física, sensor, %I0.5, PartAtStop_Sensor, variable lógica y T40."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-SEQUENCE-RECOVERY"
      description: "Corregir la referencia de T40 y verificar S40, T40, S41 y ciclos repetidos sin forcing."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-LOCATE-BLOCK"
      phase: "incident"
      title: "Localizar el bloqueo"
      situation: "La caja está en posición, pero la secuencia no continúa. ¿Cuál es el mejor primer paso?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-REPLACE-SENSOR", "DEC-01-RESTART-PLC", "DEC-01-INSPECT-ACTIVE-STEP"]
      media_ids: ["ART-001", "ART-002"]
    - id: "STAGE-02-IDENTIFY-TRANSITION"
      phase: "investigation"
      title: "Identificar la transición pendiente"
      situation: "La monitorización muestra S40 activo y T40 no satisfecha. ¿Qué debe inspeccionarse ahora?"
      evidence_ids: ["EVID-02-GRAPH-BLOCK"]
      decision_ids: ["DEC-02-FORCE-T40", "DEC-02-EDIT-S40", "DEC-02-RESET-SEQUENCE", "DEC-02-INSPECT-T40-CONDITION"]
      media_ids: ["ART-003"]
    - id: "STAGE-03-VERIFY-PHYSICAL"
      phase: "investigation"
      title: "Verificar la condición física"
      situation: "T40 evalúa PartAtStop_2, que está FALSE. Antes de concluir que la lógica es incorrecta, ¿qué evidencia debe comprobarse?"
      evidence_ids: ["EVID-03-T40-CONDITION"]
      decision_ids: ["DEC-03-REPLACE-INPUT", "DEC-03-VERIFY-BOX-SENSOR", "DEC-03-SET-PARTATSTOP2"]
      media_ids: ["ART-004"]
    - id: "STAGE-04-VERIFY-PLC-SIGNAL"
      phase: "investigation"
      title: "Verificar la representación PLC"
      situation: "La caja está presente y el sensor detecta. ¿Cuál es el siguiente límite diagnóstico?"
      evidence_ids: ["EVID-04-PHYSICAL-STATE"]
      decision_ids: ["DEC-04-MONITOR-I05-TAG", "DEC-04-REALIGN-SENSOR", "DEC-04-CHANGE-INPUT"]
      media_ids: ["ART-005"]
    - id: "STAGE-05-COMPARE-CONDITIONS"
      phase: "investigation"
      title: "Comparar señal y transición"
      situation: "%I0.5 y PartAtStop_Sensor están TRUE, mientras PartAtStop_2 está FALSE. ¿Qué comparación identifica la primera discrepancia lógica?"
      evidence_ids: ["EVID-05-PLC-SIGNALS"]
      decision_ids: ["DEC-05-REPLACE-SENSOR", "DEC-05-FORCE-PARTATSTOP2", "DEC-05-COMPARE-T40-REFERENCE"]
      media_ids: ["ART-006"]
    - id: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      phase: "investigation"
      title: "Diagnosticar la causa"
      situation: "La señal de campo correcta llega al PLC, pero T40 evalúa PartAtStop_2. ¿Cuál es el diagnóstico?"
      evidence_ids: ["EVID-06-MISMATCH"]
      decision_ids: ["DEC-06-SEQUENCE-ENGINE-FAULT", "DEC-06-WRONG-VARIABLE-REFERENCE", "DEC-06-PROFINET-FAULT"]
      media_ids: []
    - id: "STAGE-07-CORRECT-VERIFY"
      phase: "solution"
      title: "Corregir y verificar"
      situation: "La referencia lógica incorrecta está confirmada. ¿Qué intervención y verificación resuelven técnicamente el incidente?"
      evidence_ids: ["EVID-07-VERIFICATION"]
      decision_ids: ["DEC-07-FORCE-TRANSITION", "DEC-07-SET-TRUE-CONSTANT", "DEC-07-CHANGE-PARTATSTOP2", "DEC-07-CORRECT-T40-VERIFY"]
      media_ids: ["ART-007"]
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Transportador"
      content: "La caja permanece en la posición de parada y la secuencia no avanza."
      reliability: "high"
      revealed_by: []
    - id: "EVID-02-GRAPH-BLOCK"
      type: "diagnostic"
      source: "Siemens GRAPH"
      content: "S40 está activo y T40 permanece no satisfecha."
      reliability: "confirmed"
      revealed_by: ["DEC-01-INSPECT-ACTIVE-STEP"]
    - id: "EVID-03-T40-CONDITION"
      type: "diagnostic"
      source: "TIA Portal / GRAPH"
      content: "T40 referencia PartAtStop_2 y la variable monitorizada está FALSE."
      reliability: "confirmed"
      revealed_by: ["DEC-02-INSPECT-T40-CONDITION"]
    - id: "EVID-04-PHYSICAL-STATE"
      type: "inspection"
      source: "Posición de parada"
      content: "La caja está físicamente colocada y el sensor fotoeléctrico la detecta."
      reliability: "confirmed"
      revealed_by: ["DEC-03-VERIFY-BOX-SENSOR"]
    - id: "EVID-05-PLC-SIGNALS"
      type: "measurement"
      source: "Monitorización PLC"
      content: "%I0.5 está TRUE y PartAtStop_Sensor está TRUE; PartAtStop_2 permanece FALSE."
      reliability: "confirmed"
      revealed_by: ["DEC-04-MONITOR-I05-TAG"]
    - id: "EVID-06-MISMATCH"
      type: "diagnostic"
      source: "Comparación PLC / GRAPH"
      content: "La condición verificada es PartAtStop_Sensor TRUE, pero T40 evalúa PartAtStop_2 FALSE."
      reliability: "confirmed"
      revealed_by: ["DEC-05-COMPARE-T40-REFERENCE"]
    - id: "EVID-07-VERIFICATION"
      type: "functional_test"
      source: "Verificación posterior"
      content: "T40 referencia PartAtStop_Sensor; con la caja presente, T40 se satisface, S40 finaliza, S41 se activa y la secuencia repite correctamente."
      reliability: "confirmed"
      revealed_by: ["DEC-06-WRONG-VARIABLE-REFERENCE"]
  decisions:
    - id: "DEC-01-REPLACE-SENSOR"
      stage_id: "STAGE-01-LOCATE-BLOCK"
      action: "Sustituir el sensor porque la secuencia está esperando."
    - id: "DEC-01-RESTART-PLC"
      stage_id: "STAGE-01-LOCATE-BLOCK"
      action: "Reiniciar el PLC para reinicializar la secuencia."
    - id: "DEC-01-INSPECT-ACTIVE-STEP"
      stage_id: "STAGE-01-LOCATE-BLOCK"
      action: "Monitorizar GRAPH e identificar el paso activo y la transición pendiente."
    - id: "DEC-02-FORCE-T40"
      stage_id: "STAGE-02-IDENTIFY-TRANSITION"
      action: "Forzar T40 para comprobar si la secuencia continúa."
    - id: "DEC-02-EDIT-S40"
      stage_id: "STAGE-02-IDENTIFY-TRANSITION"
      action: "Modificar las acciones de S40 antes de conocer la condición pendiente."
    - id: "DEC-02-RESET-SEQUENCE"
      stage_id: "STAGE-02-IDENTIFY-TRANSITION"
      action: "Rearmar repetidamente la secuencia."
    - id: "DEC-02-INSPECT-T40-CONDITION"
      stage_id: "STAGE-02-IDENTIFY-TRANSITION"
      action: "Inspeccionar la condición lógica que T40 evalúa y su estado online."
    - id: "DEC-03-REPLACE-INPUT"
      stage_id: "STAGE-03-VERIFY-PHYSICAL"
      action: "Sustituir el módulo de entrada porque PartAtStop_2 está FALSE."
    - id: "DEC-03-VERIFY-BOX-SENSOR"
      stage_id: "STAGE-03-VERIFY-PHYSICAL"
      action: "Comprobar la posición real de la caja y la detección local del sensor."
    - id: "DEC-03-SET-PARTATSTOP2"
      stage_id: "STAGE-03-VERIFY-PHYSICAL"
      action: "Escribir TRUE en PartAtStop_2 para liberar la transición."
    - id: "DEC-04-MONITOR-I05-TAG"
      stage_id: "STAGE-04-VERIFY-PLC-SIGNAL"
      action: "Monitorizar %I0.5 y PartAtStop_Sensor y comparar ambos con el estado físico."
    - id: "DEC-04-REALIGN-SENSOR"
      stage_id: "STAGE-04-VERIFY-PLC-SIGNAL"
      action: "Realinear el sensor aunque la detección local está confirmada."
    - id: "DEC-04-CHANGE-INPUT"
      stage_id: "STAGE-04-VERIFY-PLC-SIGNAL"
      action: "Cambiar PartAtStop_Sensor a otra dirección de entrada."
    - id: "DEC-05-REPLACE-SENSOR"
      stage_id: "STAGE-05-COMPARE-CONDITIONS"
      action: "Sustituir el sensor aunque %I0.5 está TRUE."
    - id: "DEC-05-FORCE-PARTATSTOP2"
      stage_id: "STAGE-05-COMPARE-CONDITIONS"
      action: "Forzar PartAtStop_2 para que T40 sea TRUE."
    - id: "DEC-05-COMPARE-T40-REFERENCE"
      stage_id: "STAGE-05-COMPARE-CONDITIONS"
      action: "Comparar la variable usada por T40 con el tag que representa la entrada física verificada."
    - id: "DEC-06-SEQUENCE-ENGINE-FAULT"
      stage_id: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      action: "Concluir que el motor de ejecución GRAPH ha fallado."
    - id: "DEC-06-WRONG-VARIABLE-REFERENCE"
      stage_id: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      action: "Diagnosticar que T40 referencia la variable lógica equivocada."
    - id: "DEC-06-PROFINET-FAULT"
      stage_id: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      action: "Atribuir el bloqueo a una pérdida PROFINET."
    - id: "DEC-07-FORCE-TRANSITION"
      stage_id: "STAGE-07-CORRECT-VERIFY"
      action: "Forzar T40 durante producción para evitar el bloqueo."
    - id: "DEC-07-SET-TRUE-CONSTANT"
      stage_id: "STAGE-07-CORRECT-VERIFY"
      action: "Sustituir la condición por una constante TRUE."
    - id: "DEC-07-CHANGE-PARTATSTOP2"
      stage_id: "STAGE-07-CORRECT-VERIFY"
      action: "Manipular PartAtStop_2 para conservar la referencia existente."
    - id: "DEC-07-CORRECT-T40-VERIFY"
      stage_id: "STAGE-07-CORRECT-VERIFY"
      action: "Cambiar T40 a PartAtStop_Sensor y verificar T40, S40, S41 y ciclos repetidos."
  visual:
    educational_purpose: "Comparar evidencia física, señal PLC y condición lógica hasta localizar la referencia incorrecta de T40."
    representation: "available"
    cover_asset_id: "ART-001"
    assets:
      - id: "ART-001"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/01.png"
        alt: "Portada EE-0007 en la línea automatizada ENV-001."
        caption: "Secuencia bloqueada; la causa todavía es desconocida."
        purpose: "catalog_cover"
      - id: "ART-002"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/02.png"
        alt: "Caja detenida en el transportador mientras la secuencia espera."
        caption: "La caja parece estar en la posición prevista."
        purpose: "evidence"
      - id: "ART-003"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/03.png"
        alt: "Siemens GRAPH con S40 activo y T40 bloqueada evaluando PartAtStop_2 FALSE."
        caption: "S40 espera una condición lógica que permanece falsa."
        purpose: "evidence"
      - id: "ART-004"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/04.png"
        alt: "Caja presente en la parada y sensor fotoeléctrico detectando."
