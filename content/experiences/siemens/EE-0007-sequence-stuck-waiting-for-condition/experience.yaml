      - id: "ART-005"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/05.png"
        alt: "Monitorización PLC con PartAtStop_Sensor y %I0.5 TRUE frente a PartAtStop_2 FALSE."
        caption: "La entrada física llega correctamente al PLC."
        purpose: "evidence"
      - id: "ART-006"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/06.png"
        alt: "Comparación entre PartAtStop_Sensor verificada y PartAtStop_2 usada por T40."
        caption: "La transición referencia una variable diferente del tag físico verificado."
        purpose: "evidence"
      - id: "ART-007"
        type: "image"
        src: "assets/EXP-GRAPH-SEQUENCE-007/07.png"
        alt: "T40 corregida con PartAtStop_Sensor y secuencia avanzada a S41."
