        purpose: "completion"
  completion:
    title: "Debrief técnico"
    summary: "El proceso, el sensor y %I0.5 eran correctos, pero T40 evaluaba PartAtStop_2 en lugar de PartAtStop_Sensor."
    process: ["Localizar S40 y T40.", "Inspeccionar la condición de T40.", "Verificar caja y sensor.", "Confirmar %I0.5 y PartAtStop_Sensor.", "Comparar la referencia lógica.", "Corregir T40.", "Verificar S41 y ciclos repetidos."]
    lesson: "Una señal física TRUE no implica una transición TRUE: la secuencia evalúa únicamente la variable configurada."
    avoided_errors: ["Sustituir hardware sin evidencia.", "Forzar T40 o PartAtStop_2.", "Usar una constante TRUE.", "Confundir señal física con condición lógica."]
    industrial_value: ["Diagnóstico completo de señal y lógica.", "Menos forcing y sustituciones injustificadas.", "Cambios de programa verificables."]
    media_ids: ["ART-007"]

private:
  fault_model:
    root_cause: "La transición GRAPH T40 referencia PartAtStop_2 en lugar del tag físico correcto PartAtStop_Sensor asociado a %I0.5."
    recovery_conditions: ["T40 referencia PartAtStop_Sensor.", "PartAtStop_Sensor TRUE satisface T40 con la caja presente.", "S40 finaliza y S41 se activa.", "Ciclos representativos completados sin forcing."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-FIELD-SIGNAL"
        statement: "La caja, el sensor o la entrada física no representan la condición."
        initial_status: "possible"
      - id: "HYP-GRAPH-REFERENCE"
        statement: "T40 referencia una variable diferente del tag físico verificado."
        initial_status: "likely"
      - id: "HYP-SEQUENCE-ENGINE"
        statement: "GRAPH no ejecuta correctamente la transición."
        initial_status: "possible"
    confirmed_root_cause: "HYP-GRAPH-REFERENCE"
    critical_path: ["DEC-01-INSPECT-ACTIVE-STEP", "DEC-02-INSPECT-T40-CONDITION", "DEC-03-VERIFY-BOX-SENSOR", "DEC-04-MONITOR-I05-TAG", "DEC-05-COMPARE-T40-REFERENCE", "DEC-06-WRONG-VARIABLE-REFERENCE", "DEC-07-CORRECT-T40-VERIFY"]
  decision_logic:
    - decision_id: "DEC-01-INSPECT-ACTIVE-STEP"
      is_correct: true
      rationale: "El estado activo localiza dónde deja de avanzar la secuencia."
      classification: "strong"
      consequence: "Se identifica S40 y T40."
      evidence_revealed: ["EVID-02-GRAPH-BLOCK"]
      next_stage: "STAGE-02-IDENTIFY-TRANSITION"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-01-REPLACE-SENSOR"
      is_correct: false
      retry_feedback: "El síntoma no identifica el sensor como causa. Localiza primero el paso y la transición que mantienen la secuencia esperando."
      rationale: "No existe evidencia de fallo del sensor."
      classification: "weak"
      consequence: "Sustitución prematura."
      evidence_revealed: []
      next_stage: "STAGE-02-IDENTIFY-TRANSITION"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-01-RESTART-PLC"
      is_correct: false
      retry_feedback: "Reiniciar puede borrar contexto y no explica qué condición bloquea la secuencia. Observa primero el estado GRAPH."
      rationale: "El estado online aporta evidencia."
      classification: "weak"
      consequence: "Se pierde el estado diagnóstico."
      evidence_revealed: []
      next_stage: "STAGE-02-IDENTIFY-TRANSITION"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-02-INSPECT-T40-CONDITION"
      is_correct: true
      rationale: "La transición pendiente posee la condición que determina el avance."
      classification: "strong"
      consequence: "Se identifica PartAtStop_2 FALSE."
      evidence_revealed: ["EVID-03-T40-CONDITION"]
      next_stage: "STAGE-03-VERIFY-PHYSICAL"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-02-FORCE-T40"
      is_correct: false
      retry_feedback: "Forzar la transición oculta por qué su condición es falsa y puede provocar una progresión no justificada. Inspecciona la condición configurada."
      rationale: "El forcing evita el diagnóstico."
      classification: "unsafe"
      consequence: "La secuencia avanza sin causa confirmada."
      evidence_revealed: []
      next_stage: "STAGE-03-VERIFY-PHYSICAL"
      score_effect: -10
      safety_effect: -10
    - decision_id: "DEC-02-EDIT-S40"
      is_correct: false
      retry_feedback: "S40 está activo; la evidencia señala que T40 no se satisface. Examina la transición antes de modificar acciones del paso."
      rationale: "La frontera está en la transición."
      classification: "weak"
      consequence: "Se modifica el elemento equivocado."
      evidence_revealed: []
      next_stage: "STAGE-03-VERIFY-PHYSICAL"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-02-RESET-SEQUENCE"
      is_correct: false
      retry_feedback: "Rearmar no cambia la condición evaluada por T40. Consulta la variable y su estado online."
      rationale: "La condición lógica permanece."
      classification: "weak"
      consequence: "El bloqueo reaparece."
      evidence_revealed: []
      next_stage: "STAGE-03-VERIFY-PHYSICAL"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-03-VERIFY-BOX-SENSOR"
      is_correct: true
      rationale: "Antes de atribuir el desacuerdo al programa debe confirmarse la condición real."
      classification: "strong"
      consequence: "Caja y detección local quedan confirmadas."
      evidence_revealed: ["EVID-04-PHYSICAL-STATE"]
      next_stage: "STAGE-04-VERIFY-PLC-SIGNAL"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-03-REPLACE-INPUT"
      is_correct: false
      retry_feedback: "PartAtStop_2 es una variable lógica, no prueba de fallo del módulo de entrada. Verifica primero caja y sensor."
      rationale: "Se confunden capas de señal."
      classification: "weak"
      consequence: "Sustitución sin evidencia."
      evidence_revealed: []
      next_stage: "STAGE-04-VERIFY-PLC-SIGNAL"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-03-SET-PARTATSTOP2"
      is_correct: false
      retry_feedback: "Manipular PartAtStop_2 haría avanzar la secuencia sin confirmar la relación con el proceso. Conserva el estado y verifica el campo."
      rationale: "Se falsea una condición lógica."
      classification: "unsafe"
      consequence: "La causa queda oculta."
      evidence_revealed: []
      next_stage: "STAGE-04-VERIFY-PLC-SIGNAL"
      score_effect: -10
      safety_effect: -8
    - decision_id: "DEC-04-MONITOR-I05-TAG"
      is_correct: true
      rationale: "Comparar dirección y tag demuestra si el estado físico llega correctamente al PLC."
      classification: "strong"
      consequence: "%I0.5 y PartAtStop_Sensor quedan confirmados TRUE."
      evidence_revealed: ["EVID-05-PLC-SIGNALS"]
      next_stage: "STAGE-05-COMPARE-CONDITIONS"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-04-REALIGN-SENSOR"
      is_correct: false
      retry_feedback: "La detección local ya está confirmada. Comprueba ahora que %I0.5 y el tag asociado representan ese estado."
      rationale: "No existe evidencia de desalineación."
      classification: "weak"
      consequence: "Se altera una condición correcta."
      evidence_revealed: []
      next_stage: "STAGE-05-COMPARE-CONDITIONS"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-04-CHANGE-INPUT"
      is_correct: false
      retry_feedback: "Cambiar la dirección antes de monitorizar la existente introduce una nueva variable. Confirma primero %I0.5 y PartAtStop_Sensor."
      rationale: "La asignación actual aún no se ha comprobado."
      classification: "weak"
      consequence: "Se modifica sin evidencia."
      evidence_revealed: []
      next_stage: "STAGE-05-COMPARE-CONDITIONS"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-05-COMPARE-T40-REFERENCE"
      is_correct: true
      rationale: "La comparación distingue el tag físico correcto de la variable realmente evaluada."
      classification: "strong"
      consequence: "Se expone el desacuerdo PartAtStop_Sensor/PartAtStop_2."
      evidence_revealed: ["EVID-06-MISMATCH"]
      next_stage: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-05-REPLACE-SENSOR"
      is_correct: false
      retry_feedback: "%I0.5 y PartAtStop_Sensor están TRUE. Sustituir el sensor contradice la señal ya verificada; compara qué variable usa T40."
      rationale: "La cadena física funciona."
      classification: "weak"
      consequence: "La referencia incorrecta permanece."
      evidence_revealed: []
      next_stage: "STAGE-06-DIAGNOSE-ROOT-CAUSE"
      score_effect: -6
      safety_effect: 0
    - decision_id: "DEC-05-FORCE-PARTATSTOP2"
      is_correct: false
      retry_feedback: "Forzar PartAtStop_2 no explica por qué T40 ignora el tag físico correcto. Compara ambas referencias sin manipularlas."
      rationale: "El forcing oculta el mapeo incorrecto."
