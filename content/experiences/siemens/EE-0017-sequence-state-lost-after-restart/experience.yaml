        alt: Técnico con protección realizando una recuperación autorizada en una célula parada.
        caption: La pieza se retira o reposiciona bajo procedimiento antes de verificar la secuencia.
        purpose: evidence
      - id: ART-007
        type: image
        src: assets/EXP-SEQUENCE-STATE-017/ART-007-verification-cycle.png
        alt: Diagrama de ciclo seco y reinicio controlado que convergen en un estado conocido.
        caption: La verificación prueba la secuencia, la inhibición de arranque y la coherencia entre PLC, HMI y célula.
        purpose: completion
  completion:
    title: Debrief técnico
    summary: La inicialización reinicializaba el contexto de secuencia mientras la pieza permanecía en la célula. La recuperación estableció un estado conocido y la prueba de ciclo seco con reinicio controlado volvió a alinear PLC, HMI, permisos y posición física.
    process: ["Conservar la parada y la evidencia del reinicio.", "Confirmar permisos, inhibición de movimiento y límites de intervención.", "Comparar HMI, PLC, evento de arranque y posición física.", "Confirmar la política de retención o reinicialización del contexto.", "Recuperar la célula en un estado conocido y documentado.", "Verificar ciclo seco, reinicio controlado y coherencia entre fronteras."]
    lesson: Un estado HMI de listo no demuestra que la secuencia ni la posición física estén listas para reanudar; el reinicio requiere una política explícita de retención o recuperación segura.
    avoided_errors: ["Reanudar automático con una posición desconocida.", "Forzar pasos, listo o permisos para superar la detención.", "Borrar evidencia antes de identificar al propietario del estado.", "Cerrar tras un solo ciclo sin repetir el reinicio controlado."]
    industrial_value: ["Menos recuperaciones improvisadas después de reinicios.", "Mejor separación entre seguridad, estado de secuencia y HMI.", "Pruebas de arranque más trazables y repetibles."]
    media_ids: ["ART-007"]
private:
  fault_model:
    root_cause: La ruta de inicialización reinicializa el contexto de secuencia no retenido tras el reinicio y deja la célula sin una transición explícita a estado seguro conocido; la pieza permanece físicamente mientras PLC y HMI vuelven a representar disponibilidad.
    recovery_conditions: ["La célula permanece detenida y la evidencia del reinicio se conserva.", "Los permisos de seguridad y la inhibición de movimiento se confirman antes de intervenir.", "La pieza se retira o reposiciona bajo el procedimiento autorizado y se establece un estado conocido.", "Un ciclo seco y un reinicio controlado posterior mantienen la reanudación inhibida hasta confirmar un estado conocido."]
  diagnostic_model:
    hypotheses:
      - id: HYP-SAFETY-HOLD
        statement: La célula está correctamente inhibida y la discrepancia pertenece al estado de secuencia.
        initial_status: possible
      - id: HYP-PHYSICAL-STATE
        statement: La posición física de la pieza no coincide con el último paso lógico.
        initial_status: possible
      - id: HYP-HMI-REPRESENTATION
        statement: La HMI muestra disponibilidad sin ser propietaria del contexto de secuencia.
        initial_status: possible
      - id: HYP-STARTUP-RETENTION
        statement: La inicialización reinicializa el contexto no retenido después del reinicio.
        initial_status: possible
    confirmed_root_cause: HYP-STARTUP-RETENTION
    critical_path: ["DEC-01-CHECK-SAFE-HOLD", "DEC-02-VERIFY-PERMISSIVES", "DEC-03-TRACE-STATE-OWNER", "DEC-04-CONFIRM-RETENTION", "DEC-05-RECOVER-KNOWN-STATE", "DEC-06-VERIFY-DRY-CYCLE"]
  decision_logic:
    - decision_id: DEC-01-RESET-SEQUENCE
      is_correct: false
      rationale: Reiniciar oculta la condición inicial y destruye evidencia antes de separar seguridad y estado.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SAFE-HOLD
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reiniciar oculta la condición inicial y destruye evidencia antes de separar seguridad y estado.
    - decision_id: DEC-01-CHECK-SAFE-HOLD
      is_correct: true
      rationale: La primera frontera es conservar la evidencia y confirmar que no existe movimiento automático.
      classification: strong
      consequence: Revela la condición de parada segura.
      evidence_revealed: ["EVID-02-SAFE-HOLD"]
      next_stage: STAGE-02-SAFE-HOLD
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-01-RESUME-AUTO
      is_correct: false
      rationale: Reanudar con una pieza en posición desconocida puede convertir una incertidumbre de estado en movimiento no controlado.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SAFE-HOLD
      score_effect: 0
      safety_effect: -1
      retry_feedback: Reanudar con una pieza en posición desconocida puede convertir una incertidumbre de estado en movimiento no controlado.
    - decision_id: DEC-01-CLEAR-FAULT
      is_correct: false
      rationale: Borrar una alarma no identifica la relación entre la posición física y la secuencia.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-02-SAFE-HOLD
      score_effect: 0
      safety_effect: 0
      retry_feedback: Borrar una alarma no identifica la relación entre la posición física y la secuencia.
    - decision_id: DEC-02-FORCE-STEP
      is_correct: false
      rationale: Todavía no se ha confirmado el estado de seguridad ni quién posee el paso activo.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-STATE-OWNER
      score_effect: 0
      safety_effect: -1
      retry_feedback: Todavía no se ha confirmado el estado de seguridad ni quién posee el paso activo.
    - decision_id: DEC-02-OPEN-GUARD
      is_correct: false
      rationale: La observación física requiere autorización y aislamiento; abrir la protección no es la siguiente comprobación lógica.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-STATE-OWNER
      score_effect: 0
      safety_effect: -1
      retry_feedback: La observación física requiere autorización y aislamiento; abrir la protección no es la siguiente comprobación lógica.
    - decision_id: DEC-02-VERIFY-PERMISSIVES
      is_correct: true
      rationale: Los permisos y la inhibición de movimiento deben quedar confirmados antes de inspeccionar o modificar estado.
      classification: strong
      consequence: Revela la frontera de parada segura.
      evidence_revealed: ["EVID-03-STATE-COMPARISON"]
      next_stage: STAGE-03-STATE-OWNER
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-02-ACK-ALARM
      is_correct: false
      rationale: Reconocer una alarma cambia su presentación, pero no confirma el estado que gobierna la secuencia.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-03-STATE-OWNER
      score_effect: 0
      safety_effect: 0
      retry_feedback: Reconocer una alarma cambia su presentación, pero no confirma el estado que gobierna la secuencia.
    - decision_id: DEC-03-TRACE-STATE-OWNER
      is_correct: true
      rationale: La comparación entre representación, estado PLC, evento de arranque y posición física localiza el propietario de la discrepancia.
      classification: strong
      consequence: Revela el trazo de arranque.
      evidence_revealed: ["EVID-04-STARTUP-TRACE"]
      next_stage: STAGE-04-STARTUP-DIAGNOSIS
      score_effect: 0
      safety_effect: 0
    - decision_id: DEC-03-CHANGE-HMI
      is_correct: false
      rationale: La HMI presenta el estado; cambiarla no corrige ni localiza la memoria de secuencia.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-STARTUP-DIAGNOSIS
      score_effect: 0
      safety_effect: 0
      retry_feedback: La HMI presenta el estado; cambiarla no corrige ni localiza la memoria de secuencia.
    - decision_id: DEC-03-RESTART-AGAIN
      is_correct: false
      rationale: Otro reinicio puede repetir la pérdida y elimina una oportunidad de observar el estado actual.
      classification: weak
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-STARTUP-DIAGNOSIS
      score_effect: 0
      safety_effect: 0
      retry_feedback: Otro reinicio puede repetir la pérdida y elimina una oportunidad de observar el estado actual.
    - decision_id: DEC-03-FORCE-READY
      is_correct: false
      rationale: Forzar listo rompe la trazabilidad y puede habilitar una orden con la pieza aún presente.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-04-STARTUP-DIAGNOSIS
      score_effect: 0
      safety_effect: -1
      retry_feedback: Forzar listo rompe la trazabilidad y puede habilitar una orden con la pieza aún presente.
    - decision_id: DEC-04-CHANGE-STEP
      is_correct: false
      rationale: Editar el paso sin confirmar la política de arranque compensa el síntoma y puede crear una transición inválida.
      classification: unsafe
      consequence: Reintenta sin avanzar.
      evidence_revealed: []
      next_stage: STAGE-05-CONTROLLED-RECOVERY
