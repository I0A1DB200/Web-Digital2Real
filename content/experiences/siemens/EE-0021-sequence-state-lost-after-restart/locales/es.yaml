locale: es
translations:
  title: Secuencia perdida tras un reinicio
  summary: Diagnostica por qué una célula protegida aparece disponible después de un reinicio mientras la pieza y el estado de secuencia ya no coinciden.
  scenario:
    initial_context: Tras un reinicio controlado, una célula de montaje queda detenida con una pieza dentro de la zona de transferencia, mientras la HMI muestra una disponibilidad que no explica la situación física.
    operational_state: La primera discrepancia puede pertenecer a la seguridad, la posición física, el estado PLC, la inicialización de arranque o la representación HMI.
    initiating_event: Una interrupción de alimentación o reinicio de control deja la secuencia sin continuidad y detiene la producción.
    learner_role: Técnico de automatización responsable de separar estado físico, permisos, contexto de secuencia, PLC y HMI antes de recuperar la célula.
    safety_context:
      safe_state: Mantén la célula detenida y realiza lecturas e intervenciones conforme al procedimiento autorizado; no entres en la zona protegida ni habilites movimiento sin permiso.
      intervention_constraints: ["No reanudar automático con una pieza en posición desconocida.", "No forzar pasos, estados listo o permisos de seguridad.", "No borrar el estado ni reinicializar el bloque antes de conservar la evidencia.", "Aislar y controlar la célula según el procedimiento antes de retirar o reposicionar la pieza."]
  learning_objectives:
    OBJ-PRESERVE-RESTART-EVIDENCE:
      description: Conservar la evidencia de un reinicio y separar disponibilidad HMI de estado físico y secuencia.
    OBJ-TRACE-STATE-OWNER:
      description: Localizar el propietario del estado comparando permisos, posición, evento de arranque, PLC y HMI.
    OBJ-VERIFY-CONTROLLED-RECOVERY:
      description: Recuperar un estado conocido y verificar con un ciclo seco y un reinicio controlado.
  stages:
    STAGE-01-RESTART-INCIDENT:
      title: Incidente tras reinicio
      situation: Tras un reinicio controlado, la célula aparece disponible pero una pieza permanece dentro de la zona de transferencia y la secuencia no continúa. ¿Qué primera acción conserva la evidencia y mantiene la célula segura?
    STAGE-02-SAFE-HOLD:
      title: Confirmar la retención segura
      situation: La célula permanece detenida y no hay movimiento automático. ¿Qué frontera debe confirmarse antes de leer o modificar el estado de secuencia?
    STAGE-03-STATE-OWNER:
      title: Localizar el propietario del estado
      situation: Las señales de seguridad están disponibles, pero la HMI muestra un estado de listo que no explica la posición de la pieza. ¿Qué comparación aporta la siguiente evidencia?
    STAGE-04-STARTUP-DIAGNOSIS:
      title: Interpretar el arranque
      situation: El PLC conserva el último evento de arranque, pero la variable de paso activo vuelve a su valor inicial. ¿Qué conclusión debe confirmarse antes de corregir?
    STAGE-05-CONTROLLED-RECOVERY:
      title: Recuperar un estado conocido
      situation: La inicialización ha borrado el contexto de secuencia y la pieza sigue en la célula. ¿Qué intervención permite recuperar la máquina a un estado conocido sin inventar un paso ni puentear una protección?
    STAGE-06-VERIFY-RESTART:
      title: Verificar el siguiente reinicio
      situation: La célula ha vuelto a un estado conocido y la pieza se ha retirado conforme al procedimiento. ¿Qué prueba demuestra que el diseño de recuperación funciona?
  evidence:
    EVID-01-INCIDENT:
      source: Célula y HMI
      content: Después de un reinicio controlado, la célula queda sin movimiento y la HMI presenta un estado de disponibilidad mientras una pieza permanece en la zona de transferencia. El síntoma no identifica todavía qué estado se perdió.
    EVID-02-SAFE-HOLD:
      source: Permisivos de la célula
      content: La célula está detenida, el movimiento automático está inhibido y los permisivos de seguridad se observan antes de abrir el diagnóstico de secuencia. La ausencia de movimiento no demuestra que el estado lógico sea correcto.
    EVID-03-STATE-COMPARISON:
      source: HMI, PLC y posición física
      content: La HMI muestra disponibilidad, el PLC no conserva un paso activo coherente con la posición física y la pieza no ha completado la transferencia. La representación de listo no es por sí sola el propietario de la secuencia.
    EVID-04-STARTUP-TRACE:
      source: Evento de arranque y estado de secuencia
      content: El evento de arranque se registra, pero la inicialización devuelve la variable de paso activo al estado inicial en lugar de conservar o bloquear el contexto anterior. La pérdida pertenece a la gestión del estado de secuencia, no a una orden HMI aislada.
    EVID-05-RETENTION-FAULT:
      source: Modelo de arranque del PLC
      content: La ruta de arranque reinicializa el contexto no retenido y deja la célula sin una transición explícita a estado seguro conocido. El comportamiento explica la divergencia entre la pieza física, el PLC y la HMI.
    EVID-06-RECOVERY:
      source: Procedimiento de recuperación
      content: La pieza se retira o reposiciona bajo el procedimiento autorizado, se establece un estado inicial conocido y se deja documentada la condición de no reanudación automática. La corrección aún debe probarse en un ciclo controlado.
    EVID-07-VERIFICATION:
      source: Ciclo seco y reinicio controlado
      content: Un ciclo seco completa la secuencia con la célula vacía y un reinicio controlado posterior permanece inhibido hasta que se confirma un estado conocido. HMI, PLC, permisos y posición física vuelven a coincidir.
  decisions:
    DEC-01-RESET-SEQUENCE:
      action: Reiniciar la secuencia para que vuelva al paso inicial.
    DEC-01-CHECK-SAFE-HOLD:
      action: Confirmar la parada segura y conservar el estado observado.
    DEC-01-RESUME-AUTO:
      action: Reanudar el automático para comprobar si la pieza continúa.
    DEC-01-CLEAR-FAULT:
      action: Borrar la alarma y devolver la célula a listo.
    DEC-02-FORCE-STEP:
      action: Forzar el paso que parece corresponder a la pieza.
    DEC-02-OPEN-GUARD:
      action: Abrir la protección para observar la pieza directamente.
    DEC-02-VERIFY-PERMISSIVES:
      action: Verificar permisos de movimiento, seguridad y reinicio.
    DEC-02-ACK-ALARM:
      action: Reconocer la alarma antes de revisar el estado lógico.
    DEC-03-TRACE-STATE-OWNER:
      action: Comparar HMI, PLC, evento de arranque y posición física.
    DEC-03-CHANGE-HMI:
      action: Cambiar la pantalla para que muestre el paso esperado.
    DEC-03-RESTART-AGAIN:
      action: Repetir el reinicio para ver si el estado se recupera.
    DEC-03-FORCE-READY:
      action: Forzar listo para permitir la siguiente orden.
    DEC-04-CHANGE-STEP:
      action: Editar el paso activo para que coincida con la pieza.
    DEC-04-RESET-DB:
      action: Borrar el bloque de estado y volver a cargar el programa.
    DEC-04-RELOAD-RECIPE:
      action: Cargar de nuevo la receta antes de revisar el arranque.
    DEC-04-CONFIRM-RETENTION:
      action: Confirmar si el arranque conserva o reinicializa el contexto.
    DEC-05-RESUME-MIDSTEP:
      action: Reanudar desde el paso supuesto sin retirar la pieza.
    DEC-05-RECOVER-KNOWN-STATE:
      action: Aislar, retirar la pieza y recuperar un estado conocido.
    DEC-05-FORCE-STEP:
      action: Forzar un paso de recuperación para ahorrar tiempo.
    DEC-05-BYPASS-INTERLOCK:
      action: Puentea el permiso que impide continuar.
    DEC-06-CLOSE-HANDOVER:
      action: Cerrar la incidencia después de un único ciclo.
    DEC-06-CLEAR-HISTORY:
      action: Borrar el histórico para dejar la pantalla limpia.
    DEC-06-VERIFY-DRY-CYCLE:
      action: Ejecutar un ciclo seco y repetir un reinicio controlado.
    DEC-06-ENABLE-AUTO:
      action: Activar automático y observar si el estado se mantiene.
  retry_feedback:
    DEC-01-RESET-SEQUENCE: Reiniciar oculta la condición inicial y destruye evidencia antes de separar seguridad y estado.
    DEC-01-RESUME-AUTO: Reanudar con una pieza en posición desconocida puede convertir una incertidumbre de estado en movimiento no controlado.
    DEC-01-CLEAR-FAULT: Borrar una alarma no identifica la relación entre la posición física y la secuencia.
    DEC-02-FORCE-STEP: Todavía no se ha confirmado el estado de seguridad ni quién posee el paso activo.
    DEC-02-OPEN-GUARD: La observación física requiere autorización y aislamiento; abrir la protección no es la siguiente comprobación lógica.
    DEC-02-ACK-ALARM: Reconocer una alarma cambia su presentación, pero no confirma el estado que gobierna la secuencia.
    DEC-03-CHANGE-HMI: La HMI presenta el estado; cambiarla no corrige ni localiza la memoria de secuencia.
    DEC-03-RESTART-AGAIN: Otro reinicio puede repetir la pérdida y elimina una oportunidad de observar el estado actual.
    DEC-03-FORCE-READY: Forzar listo rompe la trazabilidad y puede habilitar una orden con la pieza aún presente.
    DEC-04-CHANGE-STEP: Editar el paso sin confirmar la política de arranque compensa el síntoma y puede crear una transición inválida.
    DEC-04-RESET-DB: Borrar el bloque elimina información y no demuestra cómo la inicialización produjo la pérdida.
    DEC-04-RELOAD-RECIPE: La receta puede ser correcta mientras el contexto de secuencia se reinicializa; cargarla no prueba retención.
    DEC-05-RESUME-MIDSTEP: Reanudar un paso supuesto no establece una referencia segura ni explica cómo tratar la pieza.
    DEC-05-FORCE-STEP: Forzar un paso sustituye la recuperación documentada por una suposición sobre la posición de la pieza.
    DEC-05-BYPASS-INTERLOCK: Un puente de protección elimina una barrera de seguridad y no demuestra recuperación.
    DEC-06-CLOSE-HANDOVER: Un único ciclo no prueba el comportamiento ante el reinicio que originó la incidencia.
    DEC-06-CLEAR-HISTORY: Limpiar el histórico no prueba que el estado físico, PLC y HMI vuelvan a coincidir.
    DEC-06-ENABLE-AUTO: Activar automático sin una prueba controlada puede repetir la condición de arranque no validada.
  visual:
    educational_purpose: Distinguir disponibilidad representada, estado de secuencia y condición física durante un reinicio controlado.
  assets:
    ART-001:
      alt: Célula de montaje automatizada protegida con transportador, robot, HMI y armario de control.
      caption: 'Portada: una célula secuencial con fronteras físicas, lógica de control y representación HMI.'
    ART-002:
      alt: Pieza detenida dentro de una célula protegida después de un reinicio controlado.
      caption: 'Incidente inicial: la posición física y el estado mostrado deben conservarse antes de intervenir.'
    ART-003:
      alt: Diagrama de una célula detenida con permisos de seguridad y movimiento inhibido.
      caption: La parada segura es una frontera previa al diagnóstico de secuencia.
    ART-004:
      alt: Armario de control PLC y observación de la célula durante un diagnóstico de estado.
      caption: La comparación entre HMI, PLC, evento de arranque y posición física localiza el propietario del estado.
    ART-005:
      alt: Diagrama de arranque que contrasta contexto de secuencia retenido, reinicializado y estado seguro.
      caption: La ruta de inicialización explica la pérdida de contexto sin depender de una marca de fabricante.
    ART-006:
      alt: Técnico con protección realizando una recuperación autorizada en una célula parada.
      caption: La pieza se retira o reposiciona bajo procedimiento antes de verificar la secuencia.
    ART-007:
      alt: Diagrama de ciclo seco y reinicio controlado que convergen en un estado conocido.
      caption: La verificación prueba la secuencia, la inhibición de arranque y la coherencia entre PLC, HMI y célula.
  completion:
    title: Debrief técnico
    summary: La inicialización reinicializaba el contexto de secuencia mientras la pieza permanecía en la célula. La recuperación estableció un estado conocido y la prueba de ciclo seco con reinicio controlado volvió a alinear PLC, HMI, permisos y posición física.
    process: ["Conservar la parada y la evidencia del reinicio.", "Confirmar permisos, inhibición de movimiento y límites de intervención.", "Comparar HMI, PLC, evento de arranque y posición física.", "Confirmar la política de retención o reinicialización del contexto.", "Recuperar la célula en un estado conocido y documentado.", "Verificar ciclo seco, reinicio controlado y coherencia entre fronteras."]
    lesson: Un estado HMI de listo no demuestra que la secuencia ni la posición física estén listas para reanudar; el reinicio requiere una política explícita de retención o recuperación segura.
    avoided_errors: ["Reanudar automático con una posición desconocida.", "Forzar pasos, listo o permisos para superar la detención.", "Borrar evidencia antes de identificar al propietario del estado.", "Cerrar tras un solo ciclo sin repetir el reinicio controlado."]
    industrial_value: ["Menos recuperaciones improvisadas después de reinicios.", "Mejor separación entre seguridad, estado de secuencia y HMI.", "Pruebas de arranque más trazables y repetibles."]
