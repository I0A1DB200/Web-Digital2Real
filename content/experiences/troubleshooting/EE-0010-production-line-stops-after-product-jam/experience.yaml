        purpose: "evidence"
      - id: "ART-003"
        type: "image"
        src: "assets/EXP-MULTISYSTEM-JAM-010/03.png"
        alt: "Diagnóstico TIA Portal con PLC, PROFINET y ET200SP saludables."
