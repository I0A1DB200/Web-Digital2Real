contract_version: "2.0.0"
metadata:
  id: "EXP-MULTISYSTEM-JAM-010"
  editorial_id: "EE-0010"
  content_version: "1.0"
  class: "practice"
  access: "free"
  status: "technical_review"
  language: "es"
localization:
  default_locale: "es"
  supported_locales: ["es", "en"]
  locale_files:
    es: "locales/es.yaml"
    en: "locales/en.yaml"
classification:
  platform: "Siemens S7-1500 / SIMATIC GRAPH / SINAMICS / pneumatic transfer"
  domain: "System-level causal troubleshooting"
  industry: "Manufacturing"
  machine_type: "Automated conveyor line"
  difficulty: "foundation"
capability_references:
  - capability_id: "ICF-02"
    competency_ids: ["COMP-IIO-SIGNAL-TRACEABILITY", "COMP-IIO-STATE-INTERPRETATION", "COMP-IIO-CONTROLLED-RECOVERY"]
public:
  slug: "production-line-stops-after-product-jam"
  title: "La línea de producción se detiene tras un atasco de producto"
  summary: "Distingue síntomas secundarios de una causa física común trazando estados, comandos, secuencia, lógica PLC y proceso."
  estimated_duration: 20
  scenario:
    initial_context: "La zona de transferencia se ha detenido: el transportador está parado, el empujador permanece retraído, la HMI indica producto detectado y la secuencia sigue esperando."
    operational_state: "El PLC está en RUN, SafetyReady es TRUE, PROFINET y la E/S distribuida están saludables, el drive está preparado sin fallo y hay presión neumática disponible."
    initiating_event: "Tras una acumulación de producto, varios subsistemas parecen inactivos simultáneamente."
    learner_role: "Técnico de automatización responsable de identificar la primera condición anormal sin intervenir sobre subsistemas que responden correctamente."
    safety_context:
      safe_state: "Toda inspección física y retirada de material se realiza conforme al procedimiento de intervención segura, con movimientos peligrosos controlados."
      intervention_constraints: ["No forzar B3_TransferSensor ni TransferClear.", "No forzar T40, RunCmd ni PusherExtendCmd.", "No puentear interlocks ni funciones de seguridad.", "No sustituir o reajustar equipos sin evidencia causal."]
  learning_objectives:
    - id: "OBJ-CAUSE-CHAIN"
      description: "Distinguir una causa primaria de múltiples síntomas secundarios recorriendo la cadena causal del sistema."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-STATE-INTERPRETATION"
    - id: "OBJ-PROVE-LOGIC"
      description: "Probar la relación entre condición física, señal, lógica PLC, transición y comandos."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-SIGNAL-TRACEABILITY"
    - id: "OBJ-SAFE-RECOVERY"
      description: "Corregir la condición física y verificar recuperación extremo a extremo sin bypass."
      capability_id: "ICF-02"
      competency_id: "COMP-IIO-CONTROLLED-RECOVERY"
  stages:
    - id: "STAGE-01-CLASSIFY-SCOPE"
      phase: "incident"
      title: "Clasificar el alcance"
      situation: "Varios síntomas aparecen a la vez. ¿Cuál es la mejor primera comprobación?"
      evidence_ids: ["EVID-01-INCIDENT"]
      decision_ids: ["DEC-01-RESET-DRIVE", "DEC-01-VERIFY-INFRASTRUCTURE", "DEC-01-REPLACE-B3"]
      media_ids: ["ART-001", "ART-002"]
    - id: "STAGE-02-CONVEYOR-COMMAND"
      phase: "investigation"
      title: "Seguir el comando del transportador"
      situation: "La infraestructura común está saludable. ¿Qué evidencia distingue falta de comando de fallo del drive?"
      evidence_ids: ["EVID-02-INFRASTRUCTURE"]
      decision_ids: ["DEC-02-PARAMETERIZE-DRIVE", "DEC-02-REPLACE-DRIVE", "DEC-02-COMPARE-RUN-READY-FAULT"]
      media_ids: ["ART-003"]
    - id: "STAGE-03-PUSHER-COMMAND"
      phase: "investigation"
      title: "Seguir el comando del empujador"
      situation: "RunCmd es FALSE mientras el drive está preparado. El empujador sigue retraído. ¿Qué se comprueba ahora?"
      evidence_ids: ["EVID-03-CONVEYOR-COMMAND"]
      decision_ids: ["DEC-03-CHECK-PUSHER-COMMAND", "DEC-03-ADJUST-PRESSURE", "DEC-03-REPLACE-VALVE"]
      media_ids: ["ART-004"]
    - id: "STAGE-04-COMMON-CONTROL"
      phase: "investigation"
      title: "Encontrar el punto de control común"
      situation: "RunCmd y PusherExtendCmd son FALSE. ¿Qué nivel común debe inspeccionarse?"
      evidence_ids: ["EVID-04-PUSHER-COMMAND"]
      decision_ids: ["DEC-04-RESET-PNEUMATICS", "DEC-04-FORCE-COMMANDS", "DEC-04-INSPECT-SEQUENCE"]
      media_ids: ["ART-005"]
    - id: "STAGE-05-BLOCKING-CONDITION"
      phase: "investigation"
      title: "Identificar la condición bloqueante"
      situation: "S40 Wait_TransferClear está activo y T40 depende de TransferClear. ¿Qué valores deben compararse?"
      evidence_ids: ["EVID-05-SEQUENCE"]
      decision_ids: ["DEC-05-REPLACE-SENSOR", "DEC-05-MONITOR-CONDITION-TERMS", "DEC-05-FORCE-T40"]
      media_ids: ["ART-006"]
    - id: "STAGE-06-PROVE-CAUSALITY"
      phase: "investigation"
      title: "Probar la causalidad en PLC"
      situation: "B3_TransferSensor es TRUE, DownstreamFree es TRUE y TransferClear es FALSE. ¿Cómo se demuestra la relación causal?"
      evidence_ids: ["EVID-06-BLOCKING-VALUES"]
      decision_ids: ["DEC-06-TRACE-LAD-LOGIC", "DEC-06-ASSUME-WATCH-CAUSALITY", "DEC-06-EDIT-GRAPH"]
      media_ids: ["ART-007"]
    - id: "STAGE-07-PHYSICAL-RECOVERY"
      phase: "solution"
      title: "Verificar físicamente y recuperar"
      situation: "La lógica demuestra que la detección activa de B3 impide TransferClear. ¿Qué intervención completa el diagnóstico?"
      evidence_ids: ["EVID-07-LOGIC-PROVEN"]
      decision_ids: ["DEC-07-SAFE-REMOVE-VERIFY", "DEC-07-BYPASS-B3", "DEC-07-FORCE-TRANSFER-CLEAR"]
      media_ids: ["ART-008", "ART-009"]
  evidence:
    - id: "EVID-01-INCIDENT"
      type: "initial_observation"
      source: "Máquina / HMI"
      content: "Línea y transportador parados, empujador retraído, producto detectado en transferencia y secuencia esperando."
      reliability: "high"
      revealed_by: []
    - id: "EVID-02-INFRASTRUCTURE"
      type: "diagnostic"
      source: "TIA Portal / sistema"
      content: "PLC RUN, SafetyReady TRUE, PROFINET saludable y ET200SP comunicando."
      reliability: "confirmed"
      revealed_by: ["DEC-01-VERIFY-INFRASTRUCTURE"]
    - id: "EVID-03-CONVEYOR-COMMAND"
      type: "measurement"
      source: "PLC / drive"
      content: "RunCmd FALSE, DriveReady TRUE y DriveFault FALSE: el drive no está rechazando un comando de marcha válido."
      reliability: "confirmed"
      revealed_by: ["DEC-02-COMPARE-RUN-READY-FAULT"]
    - id: "EVID-04-PUSHER-COMMAND"
      type: "measurement"
      source: "PLC / neumática"
      content: "PusherExtendCmd FALSE y disponibilidad neumática normal: no existe orden de extensión que el actuador esté incumpliendo."
      reliability: "confirmed"
      revealed_by: ["DEC-03-CHECK-PUSHER-COMMAND"]
    - id: "EVID-05-SEQUENCE"
      type: "diagnostic"
      source: "SIMATIC GRAPH"
      content: "S40 Wait_TransferClear permanece activo; T40 requiere TransferClear."
      reliability: "confirmed"
      revealed_by: ["DEC-04-INSPECT-SEQUENCE"]
    - id: "EVID-06-BLOCKING-VALUES"
      type: "measurement"
      source: "Tabla de observación PLC"
      content: "TransferClear FALSE, B3_TransferSensor TRUE y DownstreamFree TRUE."
      reliability: "confirmed"
      revealed_by: ["DEC-05-MONITOR-CONDITION-TERMS"]
    - id: "EVID-07-LOGIC-PROVEN"
      type: "diagnostic"
      source: "LAD online"
      content: "TransferClear := NOT B3_TransferSensor AND DownstreamFree; la condición negada de B3 interrumpe la continuidad lógica."
      reliability: "confirmed"
      revealed_by: ["DEC-06-TRACE-LAD-LOGIC"]
  decisions:
    - id: "DEC-01-RESET-DRIVE"
      stage_id: "STAGE-01-CLASSIFY-SCOPE"
      action: "Resetear el drive porque el transportador está parado."
    - id: "DEC-01-VERIFY-INFRASTRUCTURE"
      stage_id: "STAGE-01-CLASSIFY-SCOPE"
      action: "Verificar primero PLC, Safety, PROFINET y E/S distribuida como infraestructura común."
    - id: "DEC-01-REPLACE-B3"
      stage_id: "STAGE-01-CLASSIFY-SCOPE"
      action: "Sustituir B3 porque la HMI muestra producto detectado."
    - id: "DEC-02-PARAMETERIZE-DRIVE"
      stage_id: "STAGE-02-CONVEYOR-COMMAND"
      action: "Cambiar parámetros del drive para recuperar la marcha."
    - id: "DEC-02-REPLACE-DRIVE"
      stage_id: "STAGE-02-CONVEYOR-COMMAND"
      action: "Sustituir el drive porque el motor no gira."
    - id: "DEC-02-COMPARE-RUN-READY-FAULT"
      stage_id: "STAGE-02-CONVEYOR-COMMAND"
      action: "Comparar RunCmd, DriveReady y DriveFault antes de intervenir en el drive."
    - id: "DEC-03-CHECK-PUSHER-COMMAND"
      stage_id: "STAGE-03-PUSHER-COMMAND"
      action: "Comprobar PusherExtendCmd y la disponibilidad neumática."
    - id: "DEC-03-ADJUST-PRESSURE"
      stage_id: "STAGE-03-PUSHER-COMMAND"
      action: "Aumentar la presión porque el cilindro no avanza."
    - id: "DEC-03-REPLACE-VALVE"
      stage_id: "STAGE-03-PUSHER-COMMAND"
      action: "Sustituir la válvula antes de comprobar la orden."
    - id: "DEC-04-RESET-PNEUMATICS"
      stage_id: "STAGE-04-COMMON-CONTROL"
      action: "Rearmar el sistema neumático aunque no recibe orden de extensión."
    - id: "DEC-04-FORCE-COMMANDS"
      stage_id: "STAGE-04-COMMON-CONTROL"
      action: "Forzar RunCmd y PusherExtendCmd para observar movimiento."
    - id: "DEC-04-INSPECT-SEQUENCE"
      stage_id: "STAGE-04-COMMON-CONTROL"
      action: "Inspeccionar el paso activo y la transición pendiente de la secuencia."
    - id: "DEC-05-REPLACE-SENSOR"
      stage_id: "STAGE-05-BLOCKING-CONDITION"
      action: "Concluir que B3 está averiado porque permanece TRUE."
    - id: "DEC-05-MONITOR-CONDITION-TERMS"
      stage_id: "STAGE-05-BLOCKING-CONDITION"
      action: "Monitorizar TransferClear, B3_TransferSensor y DownstreamFree sin forzarlos."
    - id: "DEC-05-FORCE-T40"
      stage_id: "STAGE-05-BLOCKING-CONDITION"
      action: "Forzar T40 para que GRAPH avance."
    - id: "DEC-06-TRACE-LAD-LOGIC"
      stage_id: "STAGE-06-PROVE-CAUSALITY"
      action: "Abrir la lógica online y trazar cómo B3_TransferSensor y DownstreamFree generan TransferClear."
    - id: "DEC-06-ASSUME-WATCH-CAUSALITY"
      stage_id: "STAGE-06-PROVE-CAUSALITY"
      action: "Asumir causalidad porque las tres variables aparecen juntas en la tabla."
    - id: "DEC-06-EDIT-GRAPH"
      stage_id: "STAGE-06-PROVE-CAUSALITY"
      action: "Eliminar TransferClear de T40 para evitar la espera."
    - id: "DEC-07-SAFE-REMOVE-VERIFY"
      stage_id: "STAGE-07-PHYSICAL-RECOVERY"
      action: "Inspeccionar B3 de forma segura, retirar el residuo y verificar B3, TransferClear, T40, S41 y ciclos normales."
    - id: "DEC-07-BYPASS-B3"
      stage_id: "STAGE-07-PHYSICAL-RECOVERY"
      action: "Puentear B3 para impedir nuevas detenciones."
    - id: "DEC-07-FORCE-TRANSFER-CLEAR"
      stage_id: "STAGE-07-PHYSICAL-RECOVERY"
      action: "Forzar TransferClear a TRUE y dejar el residuo en la zona."
  visual:
    educational_purpose: "Recorrer síntomas de actuadores y HMI hacia la primera condición física anormal demostrando la causalidad en PLC."
    representation: "available"
    cover_asset_id: "ART-001"
    assets:
      - id: "ART-001"
        type: "image"
        src: "assets/EXP-MULTISYSTEM-JAM-010/01.png"
