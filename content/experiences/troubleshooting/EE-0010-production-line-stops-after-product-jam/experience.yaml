        type: "image"
        src: "assets/EXP-MULTISYSTEM-JAM-010/09.png"
        alt: "GRAPH online después de la recuperación con S41 Transfer_Release activo."
        caption: "T40 se satisface y la secuencia avanza a S41."
        purpose: "completion"
  completion:
    title: "Debrief técnico"
    summary: "Un residuo físico mantenía B3_TransferSensor TRUE; la lógica anulaba TransferClear, T40 permanecía falsa y la secuencia retenía correctamente los comandos del transportador y el empujador."
    process: ["Descartar un fallo común de infraestructura.", "Distinguir ausencia de comando de fallo de actuador.", "Localizar S40 y T40.", "Identificar la condición bloqueante.", "Probar la causalidad en LAD.", "Inspeccionar y corregir el proceso físico.", "Verificar S41 y ciclos normales."]
    lesson: "Un subsistema puede parecer inactivo porque el control retiene correctamente su comando; la primera condición anormal es más útil que el síntoma más visible."
    avoided_errors: ["Resetear o sustituir el drive.", "Ajustar neumática sin comando.", "Modificar GRAPH.", "Sustituir B3 cuando detecta un objeto real.", "Forzar señales o transiciones."]
    industrial_value: ["Diagnóstico causal extremo a extremo.", "Menos intervenciones injustificadas.", "Verificación repetible de la recuperación."]
    media_ids: ["ART-009"]
private:
  fault_model:
    root_cause: "Un pequeño residuo físico permanece en la zona de B3_TransferSensor; B3 funciona correctamente y mantiene TRUE, haciendo TransferClear FALSE y bloqueando T40 en S40."
    recovery_conditions: ["Retirada segura del residuo.", "B3_TransferSensor FALSE.", "DownstreamFree TRUE.", "TransferClear TRUE.", "T40 satisfecha y S41 activa.", "Comandos y operación normales verificados en ciclos repetidos."]
  diagnostic_model:
    hypotheses:
      - id: "HYP-COMMON-INFRASTRUCTURE"
        statement: "Existe un fallo común de PLC, Safety, red o E/S."
        initial_status: "possible"
      - id: "HYP-ACTUATORS"
        statement: "Drive y neumática fallan de forma independiente."
        initial_status: "possible"
      - id: "HYP-PROCESS-CONDITION"
        statement: "Una condición física válida bloquea la secuencia y sus comandos."
        initial_status: "likely"
    confirmed_root_cause: "HYP-PROCESS-CONDITION"
    critical_path: ["DEC-01-VERIFY-INFRASTRUCTURE", "DEC-02-COMPARE-RUN-READY-FAULT", "DEC-03-CHECK-PUSHER-COMMAND", "DEC-04-INSPECT-SEQUENCE", "DEC-05-MONITOR-CONDITION-TERMS", "DEC-06-TRACE-LAD-LOGIC", "DEC-07-SAFE-REMOVE-VERIFY"]
  decision_logic:
    - decision_id: "DEC-01-VERIFY-INFRASTRUCTURE"
      is_correct: true
      rationale: "Establece si los síntomas comparten una infraestructura fallida."
      classification: "strong"
      consequence: "La infraestructura común queda descartada."
      evidence_revealed: ["EVID-02-INFRASTRUCTURE"]
      next_stage: "STAGE-02-CONVEYOR-COMMAND"
      score_effect: 8
      safety_effect: 1
    - decision_id: "DEC-01-RESET-DRIVE"
      is_correct: false
      retry_feedback: "El transportador parado es un síntoma. Verifica primero la infraestructura común."
      rationale: "Interviene antes de clasificar el alcance."
      classification: "weak"
      consequence: "No se establece la frontera."
      evidence_revealed: []
      next_stage: "STAGE-02-CONVEYOR-COMMAND"
      score_effect: -4
      safety_effect: 0
    - decision_id: "DEC-01-REPLACE-B3"
      is_correct: false
      retry_feedback: "Una indicación TRUE no demuestra sensor defectuoso. Establece primero el estado común del sistema."
      rationale: "Sustitución sin evidencia."
      classification: "weak"
      consequence: "Puede sustituirse un sensor sano."
      evidence_revealed: []
      next_stage: "STAGE-02-CONVEYOR-COMMAND"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-02-COMPARE-RUN-READY-FAULT"
      is_correct: true
      rationale: "Separa ausencia de orden de rechazo o fallo del drive."
      classification: "strong"
      consequence: "Se confirma que RunCmd es FALSE con drive preparado."
      evidence_revealed: ["EVID-03-CONVEYOR-COMMAND"]
      next_stage: "STAGE-03-PUSHER-COMMAND"
      score_effect: 9
      safety_effect: 1
    - decision_id: "DEC-02-PARAMETERIZE-DRIVE"
      is_correct: false
      retry_feedback: "No cambies parámetros sin comparar comando, disponibilidad y fallo."
      rationale: "No existe evidencia de parametrización incorrecta."
      classification: "weak"
      consequence: "Se altera un equipo saludable."
      evidence_revealed: []
      next_stage: "STAGE-03-PUSHER-COMMAND"
      score_effect: -6
      safety_effect: -1
    - decision_id: "DEC-02-REPLACE-DRIVE"
      is_correct: false
      retry_feedback: "Motor parado no equivale a drive averiado. Comprueba si recibe RunCmd."
      rationale: "Confunde síntoma con causa."
      classification: "weak"
      consequence: "Sustitución injustificada."
      evidence_revealed: []
      next_stage: "STAGE-03-PUSHER-COMMAND"
      score_effect: -6
      safety_effect: 0
    - decision_id: "DEC-03-CHECK-PUSHER-COMMAND"
      is_correct: true
      rationale: "Distingue un actuador incapaz de ejecutar de una orden ausente."
      classification: "strong"
      consequence: "Se confirma PusherExtendCmd FALSE."
      evidence_revealed: ["EVID-04-PUSHER-COMMAND"]
      next_stage: "STAGE-04-COMMON-CONTROL"
      score_effect: 9
      safety_effect: 1
    - decision_id: "DEC-03-ADJUST-PRESSURE"
      is_correct: false
      retry_feedback: "La presión no explica un comando FALSE. Comprueba primero PusherExtendCmd."
      rationale: "Interviene en energía sin orden."
      classification: "weak"
      consequence: "Ajuste innecesario."
      evidence_revealed: []
      next_stage: "STAGE-04-COMMON-CONTROL"
      score_effect: -5
      safety_effect: -1
    - decision_id: "DEC-03-REPLACE-VALVE"
      is_correct: false
      retry_feedback: "Una válvula no puede ejecutar una orden que no se genera. Verifica el comando."
      rationale: "Sustitución sin evidencia."
      classification: "weak"
      consequence: "Se cambia hardware sano."
      evidence_revealed: []
      next_stage: "STAGE-04-COMMON-CONTROL"
      score_effect: -6
      safety_effect: 0
    - decision_id: "DEC-04-INSPECT-SEQUENCE"
      is_correct: true
      rationale: "Dos comandos ausentes conducen al estado de control común que los habilita."
      classification: "strong"
      consequence: "S40 y T40 quedan identificados."
      evidence_revealed: ["EVID-05-SEQUENCE"]
      next_stage: "STAGE-05-BLOCKING-CONDITION"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-04-RESET-PNEUMATICS"
      is_correct: false
      retry_feedback: "La neumática está disponible y no recibe orden. Inspecciona la secuencia común."
      rationale: "No explica ambos comandos FALSE."
      classification: "weak"
      consequence: "Se actúa en una capa sana."
      evidence_revealed: []
      next_stage: "STAGE-05-BLOCKING-CONDITION"
      score_effect: -5
      safety_effect: 0
    - decision_id: "DEC-04-FORCE-COMMANDS"
      is_correct: false
      retry_feedback: "Forzar comandos elude la lógica y puede producir movimiento no justificado. Observa la secuencia."
      rationale: "Bypass peligroso."
      classification: "unsafe"
      consequence: "Se oculta el bloqueo real."
      evidence_revealed: []
      next_stage: "STAGE-05-BLOCKING-CONDITION"
      score_effect: -10
      safety_effect: -10
    - decision_id: "DEC-05-MONITOR-CONDITION-TERMS"
      is_correct: true
      rationale: "Identifica qué término mantiene TransferClear FALSE sin asumir fallo de sensor."
      classification: "strong"
      consequence: "B3 TRUE queda localizado como término bloqueante."
      evidence_revealed: ["EVID-06-BLOCKING-VALUES"]
      next_stage: "STAGE-06-PROVE-CAUSALITY"
      score_effect: 10
      safety_effect: 1
    - decision_id: "DEC-05-REPLACE-SENSOR"
      is_correct: false
      retry_feedback: "B3 TRUE puede representar una detección real. Compara todos los términos de TransferClear."
      rationale: "TRUE no prueba defecto."
      classification: "weak"
      consequence: "Se atribuye prematuramente la causa."
      evidence_revealed: []
      next_stage: "STAGE-06-PROVE-CAUSALITY"
      score_effect: -6
      safety_effect: 0
    - decision_id: "DEC-05-FORCE-T40"
      is_correct: false
      retry_feedback: "Forzar T40 evita demostrar por qué TransferClear es FALSE y elude el interlock."
      rationale: "Bypass de secuencia."
      classification: "unsafe"
      consequence: "GRAPH avanza sin condición válida."
      evidence_revealed: []
      next_stage: "STAGE-06-PROVE-CAUSALITY"
      score_effect: -10
      safety_effect: -10
    - decision_id: "DEC-06-TRACE-LAD-LOGIC"
      is_correct: true
      rationale: "La lógica online prueba la dirección causal entre entradas y TransferClear."
