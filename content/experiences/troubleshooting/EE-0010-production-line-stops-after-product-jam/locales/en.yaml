locale: "en"
translations:
  title: "Production Line Stops After Product Jam"
  summary: "Distinguish secondary symptoms from one physical cause by tracing states, commands, sequence, PLC logic, and process."
  scenario:
    initial_context: "The transfer area has stopped: the conveyor is stopped, the pusher remains retracted, the HMI reports product detected, and the sequence is waiting."
    operational_state: "The PLC is in RUN, SafetyReady is TRUE, PROFINET and distributed I/O are healthy, the drive is ready without a fault, and pneumatic pressure is available."
    initiating_event: "After product accumulation, several subsystems appear inactive at the same time."
    learner_role: "Automation technician responsible for identifying the first abnormal condition without intervening in subsystems that are responding correctly."
    safety_context:
      safe_state: "Perform physical inspection and material removal under the safe intervention procedure with hazardous movement controlled."
      intervention_constraints: ["Do not force B3_TransferSensor or TransferClear.", "Do not force T40, RunCmd, or PusherExtendCmd.", "Do not bypass interlocks or safety functions.", "Do not replace or adjust equipment without causal evidence."]
  learning_objectives:
    OBJ-CAUSE-CHAIN:
      description: "Distinguish one primary cause from multiple secondary symptoms by tracing the system causal chain."
    OBJ-PROVE-LOGIC:
      description: "Prove the relationship among physical condition, signal, PLC logic, transition, and commands."
    OBJ-SAFE-RECOVERY:
      description: "Correct the physical condition and verify end-to-end recovery without bypassing."
  stages:
    STAGE-01-CLASSIFY-SCOPE:
      title: "Classify the scope"
      situation: "Several symptoms appear together. What is the best first check?"
    STAGE-02-CONVEYOR-COMMAND:
      title: "Trace the conveyor command"
      situation: "The common infrastructure is healthy. Which evidence distinguishes a missing command from a drive fault?"
    STAGE-03-PUSHER-COMMAND:
      title: "Trace the pusher command"
      situation: "RunCmd is FALSE while the drive is ready. The pusher remains retracted. What should be checked next?"
    STAGE-04-COMMON-CONTROL:
      title: "Find the common control point"
      situation: "RunCmd and PusherExtendCmd are FALSE. Which common level should be inspected?"
    STAGE-05-BLOCKING-CONDITION:
      title: "Identify the blocking condition"
      situation: "S40 Wait_TransferClear is active and T40 depends on TransferClear. Which values should be compared?"
    STAGE-06-PROVE-CAUSALITY:
      title: "Prove causality in the PLC"
      situation: "B3_TransferSensor is TRUE, DownstreamFree is TRUE, and TransferClear is FALSE. How should the causal relationship be demonstrated?"
    STAGE-07-PHYSICAL-RECOVERY:
      title: "Verify physically and recover"
      situation: "The logic proves that active B3 detection prevents TransferClear. Which intervention completes the diagnosis?"
  evidence:
    EVID-01-INCIDENT:
      source: "Machine / HMI"
      content: "Line and conveyor stopped, pusher retracted, product detected at transfer, and sequence waiting."
    EVID-02-INFRASTRUCTURE:
      source: "TIA Portal / system"
      content: "PLC RUN, SafetyReady TRUE, PROFINET healthy, and ET200SP communicating."
    EVID-03-CONVEYOR-COMMAND:
      source: "PLC / drive"
      content: "RunCmd FALSE, DriveReady TRUE, and DriveFault FALSE: the drive is not refusing a valid run command."
    EVID-04-PUSHER-COMMAND:
      source: "PLC / pneumatics"
      content: "PusherExtendCmd FALSE with normal pneumatic availability: there is no extension command that the actuator is failing to execute."
    EVID-05-SEQUENCE:
      source: "SIMATIC GRAPH"
      content: "S40 Wait_TransferClear remains active; T40 requires TransferClear."
    EVID-06-BLOCKING-VALUES:
      source: "PLC watch table"
      content: "TransferClear FALSE, B3_TransferSensor TRUE, and DownstreamFree TRUE."
    EVID-07-LOGIC-PROVEN:
      source: "Online LAD"
      content: "TransferClear := NOT B3_TransferSensor AND DownstreamFree; the negated B3 condition interrupts logical continuity."
  decisions:
    DEC-01-RESET-DRIVE:
      action: "Reset the drive because the conveyor is stopped."
    DEC-01-VERIFY-INFRASTRUCTURE:
      action: "First verify PLC, Safety, PROFINET, and distributed I/O as common infrastructure."
    DEC-01-REPLACE-B3:
      action: "Replace B3 because the HMI reports product detected."
    DEC-02-PARAMETERIZE-DRIVE:
      action: "Change drive parameters to recover motion."
    DEC-02-REPLACE-DRIVE:
      action: "Replace the drive because the motor does not turn."
    DEC-02-COMPARE-RUN-READY-FAULT:
      action: "Compare RunCmd, DriveReady, and DriveFault before intervening in the drive."
    DEC-03-CHECK-PUSHER-COMMAND:
      action: "Check PusherExtendCmd and pneumatic availability."
    DEC-03-ADJUST-PRESSURE:
      action: "Increase pressure because the cylinder does not extend."
    DEC-03-REPLACE-VALVE:
      action: "Replace the valve before checking the command."
    DEC-04-RESET-PNEUMATICS:
      action: "Reset the pneumatic system although it receives no extension command."
    DEC-04-FORCE-COMMANDS:
      action: "Force RunCmd and PusherExtendCmd to observe movement."
    DEC-04-INSPECT-SEQUENCE:
      action: "Inspect the active step and pending sequence transition."
    DEC-05-REPLACE-SENSOR:
      action: "Conclude that B3 has failed because it remains TRUE."
    DEC-05-MONITOR-CONDITION-TERMS:
      action: "Monitor TransferClear, B3_TransferSensor, and DownstreamFree without forcing them."
    DEC-05-FORCE-T40:
      action: "Force T40 so GRAPH advances."
    DEC-06-TRACE-LAD-LOGIC:
      action: "Open the online logic and trace how B3_TransferSensor and DownstreamFree generate TransferClear."
    DEC-06-ASSUME-WATCH-CAUSALITY:
      action: "Assume causality because all three variables appear together in the watch table."
    DEC-06-EDIT-GRAPH:
      action: "Remove TransferClear from T40 to avoid the wait."
    DEC-07-SAFE-REMOVE-VERIFY:
      action: "Inspect B3 safely, remove the residue, and verify B3, TransferClear, T40, S41, and normal cycles."
    DEC-07-BYPASS-B3:
      action: "Bypass B3 to prevent further stops."
    DEC-07-FORCE-TRANSFER-CLEAR:
      action: "Force TransferClear TRUE and leave the residue in the zone."
  retry_feedback:
    DEC-01-RESET-DRIVE: "A stopped conveyor is a symptom. Verify the common infrastructure first."
    DEC-01-REPLACE-B3: "A TRUE indication does not prove a defective sensor. Establish the common system state first."
    DEC-02-PARAMETERIZE-DRIVE: "Do not change parameters before comparing command, readiness, and fault state."
    DEC-02-REPLACE-DRIVE: "A stopped motor does not equal a failed drive. Check whether it receives RunCmd."
    DEC-03-ADJUST-PRESSURE: "Pressure does not explain a FALSE command. Check PusherExtendCmd first."
    DEC-03-REPLACE-VALVE: "A valve cannot execute a command that is not generated. Verify the command."
    DEC-04-RESET-PNEUMATICS: "Pneumatics are available and receive no command. Inspect the common sequence."
    DEC-04-FORCE-COMMANDS: "Forcing commands bypasses logic and may cause unjustified movement. Observe the sequence."
    DEC-05-REPLACE-SENSOR: "B3 TRUE may represent real detection. Compare every TransferClear term."
    DEC-05-FORCE-T40: "Forcing T40 avoids proving why TransferClear is FALSE and bypasses the interlock."
    DEC-06-ASSUME-WATCH-CAUSALITY: "Coincidence in a table does not prove how TransferClear is calculated. Trace the PLC logic."
    DEC-06-EDIT-GRAPH: "T40 is waiting for its designed condition. Prove the logic before modifying GRAPH."
    DEC-07-BYPASS-B3: "B3 is detecting a real object. Remove the residue safely; do not defeat detection."
    DEC-07-FORCE-TRANSFER-CLEAR: "Forcing TransferClear leaves the physical cause present and falsifies the T40 condition."
  visual:
    educational_purpose: "Trace actuator and HMI symptoms back to the first abnormal physical condition by proving causality in the PLC."
  assets:
    ART-001:
      alt: "EE-0010 editorial cover in the automated line."
      caption: "Causal diagnosis of a multisystem stop."
    ART-002:
      alt: "Incident with conveyor stopped, pusher retracted, and product detected."
      caption: "Several symptoms appear simultaneously."
    ART-003:
      alt: "TIA Portal diagnostics with healthy PLC, PROFINET, and ET200SP."
      caption: "The common infrastructure remains operational."
    ART-004:
      alt: "Watch table with conveyor and pusher states and commands."
      caption: "The actuators are not receiving movement commands."
    ART-005:
      alt: "Online GRAPH with S40 Wait_TransferClear active."
      caption: "The sequence is intentionally waiting for T40."
    ART-006:
      alt: "Online values B3_TransferSensor TRUE, DownstreamFree TRUE, and TransferClear FALSE."
      caption: "The blocking condition is localized."
    ART-007:
      alt: "Online LAD for NOT B3_TransferSensor AND DownstreamFree driving TransferClear."
      caption: "The logic demonstrates the causal relationship."
    ART-008:
      alt: "Physical residue inside the B3 detection zone."
      caption: "B3 is correctly detecting a real object."
    ART-009:
      alt: "Online GRAPH after recovery with S41 Transfer_Release active."
      caption: "T40 is satisfied and the sequence advances to S41."
  completion:
    title: "Technical debrief"
    summary: "Physical residue kept B3_TransferSensor TRUE; the logic held TransferClear FALSE, T40 remained unsatisfied, and the sequence correctly withheld conveyor and pusher commands."
    process: ["Exclude a common infrastructure failure.", "Distinguish missing commands from actuator failures.", "Locate S40 and T40.", "Identify the blocking condition.", "Prove causality in LAD.", "Inspect and correct the physical process.", "Verify S41 and normal cycles."]
    lesson: "A subsystem may appear inactive because control is correctly withholding its command; the first abnormal condition is more useful than the loudest symptom."
    avoided_errors: ["Resetting or replacing the drive.", "Adjusting pneumatics without a command.", "Modifying GRAPH.", "Replacing B3 while it detects a real object.", "Forcing signals or transitions."]
    industrial_value: ["End-to-end causal diagnosis.", "Fewer unjustified interventions.", "Repeatable recovery verification."]
